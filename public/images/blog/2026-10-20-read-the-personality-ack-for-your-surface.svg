<?xml version="1.0" encoding="UTF-8"?>
<!-- Hero: three ack columns that do not share a line, and one page bar underneath that meets none of them. No visible text. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Three columns of bars that do not match, and one long bar underneath that meets none of them.">
  <defs>
    <linearGradient id="ackBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070d14"/>
      <stop offset="60%" stop-color="#101820"/>
      <stop offset="100%" stop-color="#16120c"/>
    </linearGradient>
    <radialGradient id="ackTeal" cx="12%" cy="20%" r="32%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ackGold" cx="88%" cy="80%" r="30%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff6b00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ackBg)"/>
  <rect width="1200" height="630" fill="url(#ackTeal)"/>
  <rect width="1200" height="630" fill="url(#ackGold)"/>
  <rect x="56" y="40" width="1088" height="550" rx="14" fill="none" stroke="#162236" stroke-width="2"/>

  <!-- CLI: a short name bar, then a longer quote that stops early. -->
  <rect x="96" y="88" width="300" height="340" rx="10" fill="none" stroke="#162236" stroke-width="2"/>
  <rect x="124" y="140" width="168" height="14" rx="2" fill="#f59e0b"/>
  <rect x="124" y="140" width="28" height="14" fill="#ff6b00"/>
  <rect x="124" y="188" width="220" height="12" rx="2" fill="#00d4ff" opacity="0.85"/>
  <rect x="124" y="220" width="36" height="8" rx="2" fill="#f59e0b" opacity="0.28"/>

  <!-- Messaging: two short lines. The second is not the page bar. -->
  <rect x="450" y="88" width="300" height="340" rx="10" fill="none" stroke="#162236" stroke-width="2"/>
  <rect x="478" y="168" width="196" height="14" rx="2" fill="#00d4ff"/>
  <rect x="478" y="168" width="22" height="14" fill="#0e7490"/>
  <rect x="478" y="214" width="148" height="10" rx="2" fill="#f59e0b" opacity="0.7"/>

  <!-- TUI: one short echo. No second line. -->
  <rect x="804" y="88" width="300" height="340" rx="10" fill="none" stroke="#162236" stroke-width="2"/>
  <rect x="832" y="228" width="112" height="14" rx="2" fill="#00d4ff" opacity="0.45"/>
  <rect x="832" y="268" width="18" height="8" rx="2" fill="#f59e0b" opacity="0.2"/>

  <!-- The page sentence. It runs under the columns and meets none of their bars. -->
  <rect x="96" y="460" width="1008" height="18" rx="2" fill="#f59e0b" opacity="0.22"/>
  <rect x="96" y="460" width="64" height="18" fill="#ff6b00" opacity="0.35"/>
</svg>
