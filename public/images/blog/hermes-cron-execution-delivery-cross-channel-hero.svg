<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Hermes Cron Execution, Delivery, and Cross-Channel Context on Linux hero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6b00"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle grid for linux/terminal feel -->
  <g stroke="#162236" stroke-width="1" opacity="0.35">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- left: cron scheduler gear + clock -->
  <g transform="translate(220, 280)">
    <!-- outer gear -->
    <circle cx="0" cy="0" r="85" fill="none" stroke="#ff6b00" stroke-width="7" opacity="0.85"/>
    <circle cx="0" cy="0" r="65" fill="none" stroke="#f59e0b" stroke-width="3" opacity="0.6"/>
    <!-- gear teeth -->
    <g stroke="#ff6b00" stroke-width="11" stroke-linecap="round">
      <line x1="0" y1="-98" x2="0" y2="-80"/>
      <line x1="0" y1="98" x2="0" y2="80"/>
      <line x1="-98" y1="0" x2="-80" y2="0"/>
      <line x1="98" y1="0" x2="80" y2="0"/>
      <line x1="-70" y1="-70" x2="-55" y2="-55"/>
      <line x1="70" y1="70" x2="55" y2="55"/>
      <line x1="-70" y1="70" x2="-55" y2="55"/>
      <line x1="70" y1="-70" x2="55" y2="-55"/>
    </g>
    <!-- inner hub -->
    <circle cx="0" cy="0" r="32" fill="#0a1628" stroke="#00d4ff" stroke-width="4"/>
    <!-- clock hands -->
    <line x1="0" y1="0" x2="0" y2="-20" stroke="#00d4ff" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="16" y2="11" stroke="#0e7490" stroke-width="3" stroke-linecap="round"/>
    <!-- cron label arc hint -->
    <text x="0" y="115" text-anchor="middle" fill="#f59e0b" font-size="11" font-family="monospace" opacity="0.7">CRON</text>
  </g>

  <!-- center: execution box / terminal -->
  <g transform="translate(480, 220)">
    <rect x="-80" y="-60" width="160" height="120" rx="8" fill="#162236" stroke="#0e7490" stroke-width="2"/>
    <rect x="-70" y="-50" width="140" height="8" rx="2" fill="#ff6b00" opacity="0.8"/>
    <rect x="-70" y="-35" width="100" height="3" rx="1" fill="#0e7490" opacity="0.5"/>
    <rect x="-70" y="-25" width="70" height="3" rx="1" fill="#00d4ff" opacity="0.4"/>
    <text x="0" y="45" text-anchor="middle" fill="#f59e0b" font-size="10" font-family="monospace">EXEC</text>
  </g>

  <!-- right: delivery channels with arrows and bridge -->
  <g transform="translate(780, 180)">
    <!-- channel nodes -->
    <!-- telegram -->
    <rect x="0" y="0" width="55" height="32" rx="4" fill="#1e3a8a" stroke="#ff6b00" stroke-width="2"/>
    <text x="27" y="21" text-anchor="middle" fill="#ff6b00" font-size="9" font-family="monospace">TG</text>
    <!-- web -->
    <rect x="70" y="0" width="55" height="32" rx="4" fill="#1e3a8a" stroke="#0e7490" stroke-width="2"/>
    <text x="97" y="21" text-anchor="middle" fill="#0e7490" font-size="9" font-family="monospace">WEB</text>
    <!-- cli -->
    <rect x="140" y="0" width="55" height="32" rx="4" fill="#1e3a8a" stroke="#f59e0b" stroke-width="2"/>
    <text x="167" y="21" text-anchor="middle" fill="#f59e0b" font-size="9" font-family="monospace">CLI</text>

    <!-- bridge / context line -->
    <g stroke="#00d4ff" stroke-width="3" opacity="0.7">
      <line x1="27" y1="16" x2="27" y2="70"/>
      <line x1="97" y1="16" x2="97" y2="70"/>
      <line x1="167" y1="16" x2="167" y2="70"/>
      <line x1="27" y1="70" x2="167" y2="70"/>
      <!-- bridge icon -->
      <rect x="70" y="55" width="55" height="18" rx="3" fill="#0a1628" stroke="#00d4ff" stroke-width="1.5"/>
      <text x="97" y="68" text-anchor="middle" fill="#00d4ff" font-size="8" font-family="monospace">CTX</text>
    </g>

    <!-- arrow from exec to channels -->
    <g stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow)">
      <line x1="-30" y1="20" x2="10" y2="20"/>
    </g>
  </g>

  <!-- bottom terminal bars -->
  <g transform="translate(120, 510)">
    <rect x="0" y="0" width="960" height="5" rx="2" fill="#162236"/>
    <rect x="0" y="12" width="720" height="3" rx="1" fill="#0e7490" opacity="0.55"/>
    <rect x="0" y="20" width="480" height="3" rx="1" fill="#ff6b00" opacity="0.4"/>
    <rect x="0" y="28" width="300" height="2" rx="1" fill="#00d4ff" opacity="0.3"/>
  </g>

  <!-- small linux penguin hint or terminal prompt on far left bottom -->
  <g transform="translate(80, 560)">
    <text x="0" y="0" fill="#f59e0b" font-size="14" font-family="monospace" opacity="0.6">$ cron</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f59e0b"/>
    </marker>
  </defs>
</svg>