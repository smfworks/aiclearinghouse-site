<?xml version="1.0" encoding="UTF-8"?>
<!-- Hero: three documents, different heights, the short slip not a crop of the tall sheet.
     Brand palette: navy #0a1628 / #1e3a8a, gold #f59e0b / #ff6b00, teal #0e7490 / #00d4ff. No text. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Three documents of different heights standing apart, the short slip not a crop of the tall sheet">
  <defs>
    <linearGradient id="voiceBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="55%" stop-color="#0c1e36"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <radialGradient id="voiceTeal" cx="28%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="voiceGold" cx="78%" cy="62%" r="34%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="voiceSheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#125e78"/>
      <stop offset="100%" stop-color="#0e4e66"/>
    </linearGradient>
    <linearGradient id="voiceMid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16345c"/>
      <stop offset="100%" stop-color="#102848"/>
    </linearGradient>
    <linearGradient id="voiceSlip" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ff6b00"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#voiceBg)"/>
  <rect width="1200" height="630" fill="url(#voiceTeal)"/>
  <rect width="1200" height="630" fill="url(#voiceGold)"/>

  <rect x="48" y="40" width="1104" height="550" rx="6" fill="none" stroke="#162236" stroke-width="2"/>
  <line x1="48" y1="508" x2="1152" y2="508" stroke="#13243d" stroke-width="2"/>

  <!-- tall sheet: the file -->
  <rect x="118" y="86" width="248" height="422" rx="10" fill="url(#voiceSheet)" stroke="#00d4ff" stroke-width="3"/>
  <g fill="#00d4ff">
    <rect x="146" y="114" width="168" height="10" rx="2" opacity="0.9"/>
    <rect x="146" y="140" width="190" height="6" rx="2" opacity="0.45"/>
    <rect x="146" y="158" width="150" height="6" rx="2" opacity="0.38"/>
    <rect x="146" y="176" width="176" height="6" rx="2" opacity="0.32"/>
    <rect x="146" y="194" width="132" height="6" rx="2" opacity="0.28"/>
    <rect x="146" y="224" width="184" height="6" rx="2" opacity="0.4"/>
    <rect x="146" y="242" width="160" height="6" rx="2" opacity="0.34"/>
    <rect x="146" y="260" width="142" height="6" rx="2" opacity="0.3"/>
    <rect x="146" y="278" width="188" height="6" rx="2" opacity="0.26"/>
    <rect x="146" y="308" width="170" height="6" rx="2" opacity="0.36"/>
    <rect x="146" y="326" width="154" height="6" rx="2" opacity="0.3"/>
    <rect x="146" y="344" width="136" height="6" rx="2" opacity="0.24"/>
    <rect x="146" y="374" width="180" height="6" rx="2" opacity="0.32"/>
    <rect x="146" y="392" width="148" height="6" rx="2" opacity="0.22"/>
    <rect x="146" y="422" width="162" height="6" rx="2" opacity="0.28"/>
    <rect x="146" y="440" width="120" height="6" rx="2" opacity="0.2"/>
    <rect x="146" y="470" width="174" height="8" rx="2" opacity="0.55"/>
  </g>

  <!-- middle sheet: checklist, not a scaled copy -->
  <rect x="456" y="168" width="220" height="340" rx="10" fill="url(#voiceMid)" stroke="#1e3a8a" stroke-width="3"/>
  <g fill="#7dd3fc">
    <rect x="480" y="196" width="120" height="12" rx="2" opacity="0.75"/>
    <rect x="480" y="228" width="172" height="7" rx="2" opacity="0.4"/>
    <rect x="480" y="248" width="148" height="7" rx="2" opacity="0.32"/>
    <rect x="480" y="280" width="160" height="7" rx="2" opacity="0.45"/>
    <rect x="480" y="300" width="136" height="7" rx="2" opacity="0.3"/>
    <rect x="480" y="332" width="168" height="7" rx="2" opacity="0.38"/>
    <rect x="480" y="352" width="110" height="7" rx="2" opacity="0.26"/>
    <rect x="480" y="384" width="156" height="7" rx="2" opacity="0.34"/>
    <rect x="480" y="416" width="144" height="9" rx="2" opacity="0.5"/>
    <rect x="480" y="448" width="96" height="7" rx="2" opacity="0.22"/>
  </g>
  <rect x="480" y="196" width="18" height="12" rx="2" fill="#f59e0b" opacity="0.85"/>

  <!-- short slip: the card, different color, ticks that do not align -->
  <rect x="792" y="292" width="250" height="216" rx="12" fill="#122033" stroke="url(#voiceSlip)" stroke-width="4"/>
  <rect x="818" y="318" width="196" height="14" rx="3" fill="#f59e0b" opacity="0.9"/>
  <rect x="818" y="350" width="168" height="8" rx="2" fill="#ff6b00" opacity="0.55"/>
  <rect x="818" y="372" width="140" height="8" rx="2" fill="#ff6b00" opacity="0.4"/>
  <rect x="818" y="406" width="184" height="8" rx="2" fill="#f59e0b" opacity="0.35"/>
  <rect x="818" y="428" width="112" height="8" rx="2" fill="#f59e0b" opacity="0.28"/>
  <rect x="818" y="462" width="150" height="10" rx="2" fill="#ff6b00" opacity="0.7"/>

  <!-- a rule under the slip that does not reach the tall sheet -->
  <line x1="792" y1="548" x2="1042" y2="548" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <line x1="366" y1="548" x2="430" y2="548" stroke="#00d4ff" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
</svg>
