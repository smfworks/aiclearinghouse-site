<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1216 640" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#06141e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00d4aa"/>
    </marker>
  </defs>

  <rect width="1216" height="640" fill="url(#bg)"/>
  <g stroke="#1a2a3a" stroke-width="1" opacity="0.3">
    <line x1="0" y1="80" x2="1216" y2="80"/><line x1="0" y1="160" x2="1216" y2="160"/>
    <line x1="0" y1="240" x2="1216" y2="240"/><line x1="0" y1="320" x2="1216" y2="320"/>
    <line x1="0" y1="400" x2="1216" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="540"/><line x1="480" y1="0" x2="480" y2="540"/>
    <line x1="800" y1="0" x2="800" y2="540"/><line x1="1056" y1="0" x2="1056" y2="540"/>
  </g>

  <text x="608" y="64" text-anchor="middle" fill="#e8eef4" font-size="38" font-weight="700">338 PRs in Four Days: Hermes Agent v0.23.5</text>
  <text x="608" y="98" text-anchor="middle" fill="#00d4aa" font-size="19" font-family="'SF Mono','Courier New',monospace">1,262 commits · 1,146 files · +57,989 / −5,346 lines · 92 issues closed</text>

  <!-- release cadence bars: merged PRs per patch window -->
  <text x="90" y="150" fill="#5a8a6a" font-size="15" font-family="'SF Mono','Courier New',monospace">MERGED PRs PER PATCH WINDOW</text>
  <line x1="90" y1="380" x2="560" y2="380" stroke="#3a4a5a" stroke-width="2"/>
  <!-- v0.23.3 ~370 -->
  <rect x="120" y="190" width="80" height="190" rx="6" fill="#00d4aa" opacity="0.75" filter="url(#glow)"/>
  <text x="160" y="178" text-anchor="middle" fill="#e8eef4" font-size="20" font-weight="700">~370</text>
  <text x="160" y="406" text-anchor="middle" fill="#e8eef4" font-size="15">v0.23.3</text>
  <text x="160" y="426" text-anchor="middle" fill="#666" font-size="12" font-family="'SF Mono','Courier New',monospace">Nov 19</text>
  <!-- v0.23.4 ~229 -->
  <rect x="270" y="262" width="80" height="118" rx="6" fill="#00d4aa" opacity="0.55"/>
  <text x="310" y="250" text-anchor="middle" fill="#e8eef4" font-size="20" font-weight="700">~229</text>
  <text x="310" y="406" text-anchor="middle" fill="#e8eef4" font-size="15">v0.23.4</text>
  <text x="310" y="426" text-anchor="middle" fill="#666" font-size="12" font-family="'SF Mono','Courier New',monospace">Nov 23</text>
  <!-- v0.23.5 ~338 -->
  <rect x="420" y="206" width="80" height="174" rx="6" fill="#76b900" opacity="0.9" filter="url(#glow)"/>
  <text x="460" y="194" text-anchor="middle" fill="#e8eef4" font-size="20" font-weight="700">~338</text>
  <text x="460" y="406" text-anchor="middle" fill="#e8eef4" font-size="15">v0.23.5</text>
  <text x="460" y="426" text-anchor="middle" fill="#666" font-size="12" font-family="'SF Mono','Courier New',monospace">Nov 27</text>

  <!-- arrow to feature panel -->
  <line x1="560" y1="290" x2="640" y2="290" stroke="#00d4aa" stroke-width="3" marker-end="url(#arrowhead)" filter="url(#glow)"/>
  <text x="600" y="272" text-anchor="middle" fill="#00d4aa" font-size="13" font-family="'SF Mono','Courier New',monospace">ships</text>

  <!-- feature panel -->
  <rect x="655" y="150" width="480" height="280" rx="14" fill="#0d1626" stroke="#1e3a4a" stroke-width="1.5"/>
  <text x="895" y="188" text-anchor="middle" fill="#76b900" font-size="17" font-weight="700" font-family="'SF Mono','Courier New',monospace">WHAT ACTUALLY CHANGED</text>
  <g fill="#e8eef4" font-size="17">
    <circle cx="690" cy="230" r="5" fill="#00d4aa"/>
    <text x="710" y="236">Idle gateway chats compact in the background</text>
    <circle cx="690" cy="275" r="5" fill="#00d4aa"/>
    <text x="710" y="281">read_file tails with negative offset + lists dirs</text>
    <circle cx="690" cy="320" r="5" fill="#00d4aa"/>
    <text x="710" y="326">search_files says when results are complete</text>
    <circle cx="690" cy="365" r="5" fill="#ff9500"/>
    <text x="710" y="371">Bounded default-plugin preflight before gateway start</text>
  </g>

  <!-- stats bar -->
  <rect x="0" y="470" width="1216" height="170" fill="#08101c"/>
  <line x1="0" y1="470" x2="1216" y2="470" stroke="#1e3a4a" stroke-width="2"/>
  <g text-anchor="middle">
    <text x="152" y="522" fill="#5a8a6a" font-size="14" font-family="'SF Mono','Courier New',monospace">RELEASE</text>
    <text x="152" y="562" fill="#e8eef4" font-size="30" font-weight="700">v0.23.5</text>
    <text x="152" y="590" fill="#666" font-size="13" font-family="'SF Mono','Courier New',monospace">Nov 27 2026</text>

    <text x="405" y="522" fill="#5a8a6a" font-size="14" font-family="'SF Mono','Courier New',monospace">MERGED PRs</text>
    <text x="405" y="562" fill="#e8eef4" font-size="30" font-weight="700">338</text>
    <text x="405" y="590" fill="#666" font-size="13" font-family="'SF Mono','Courier New',monospace">in 4 days</text>

    <text x="658" y="522" fill="#5a8a6a" font-size="14" font-family="'SF Mono','Courier New',monospace">COMMITS</text>
    <text x="658" y="562" fill="#e8eef4" font-size="30" font-weight="700">1,262</text>
    <text x="658" y="590" fill="#666" font-size="13" font-family="'SF Mono','Courier New',monospace">non-merge</text>

    <text x="911" y="522" fill="#5a8a6a" font-size="14" font-family="'SF Mono','Courier New',monospace">FILES CHANGED</text>
    <text x="911" y="562" fill="#e8eef4" font-size="30" font-weight="700">1,146</text>
    <text x="911" y="590" fill="#666" font-size="13" font-family="'SF Mono','Courier New',monospace">+57,989 / −5,346</text>

    <text x="1122" y="522" fill="#5a8a6a" font-size="14" font-family="'SF Mono','Courier New',monospace">CADENCE</text>
    <text x="1122" y="562" fill="#76b900" font-size="30" font-weight="700">4/10d</text>
    <text x="1122" y="590" fill="#666" font-size="13" font-family="'SF Mono','Courier New',monospace">patches in 10 days</text>
  </g>
</svg>
