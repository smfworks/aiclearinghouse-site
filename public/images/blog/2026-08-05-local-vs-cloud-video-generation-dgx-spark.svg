<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" width="1200" height="624">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#06141e"/>
    </linearGradient>
    <linearGradient id="localGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#76b900" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#76b900" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d4aa" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00d4aa" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="624" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g opacity="0.08" stroke="#1a3a2a" stroke-width="0.5">
    <line x1="600" y1="80" x2="600" y2="540"/>
    <line x1="0" y1="156" x2="1200" y2="156"/>
    <line x1="0" y1="312" x2="1200" y2="312"/>
    <line x1="0" y1="468" x2="1200" y2="468"/>
  </g>

  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="26" font-weight="700" fill="#e8eef4" filter="url(#textGlow)">Local vs Cloud Video Generation</text>
  <text x="600" y="70" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="12" fill="#76b900">MiniMax H3 FL2VA · FLUX.3 Video · NVIDIA DGX Spark · OpenRouter</text>

  <!-- Left panel: LOCAL -->
  <g transform="translate(40, 95)">
    <rect x="0" y="0" width="520" height="340" rx="12" fill="url(#localGrad)" stroke="#1a3a2a" stroke-width="1"/>
    <text x="260" y="30" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="18" font-weight="700" fill="#76b900" filter="url(#textGlow)">LOCAL · DGX SPARK</text>
    <text x="260" y="50" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="10" fill="#5a8a5a">GB10 · 128GB UMA · Online FP8</text>

    <!-- Metrics -->
    <g transform="translate(20, 70)">
      <rect x="0" y="0" width="140" height="48" rx="5" fill="#0d1f12" stroke="#1a3a2a" stroke-width="0.5"/>
      <text x="70" y="18" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">MAX RESOLUTION</text>
      <text x="70" y="38" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="14" font-weight="700" fill="#76b900">960×544</text>

      <rect x="155" y="0" width="140" height="48" rx="5" fill="#0d1f12" stroke="#1a3a2a" stroke-width="0.5"/>
      <text x="225" y="18" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">MAX DURATION</text>
      <text x="225" y="38" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="14" font-weight="700" fill="#76b900">3 seconds</text>

      <rect x="310" y="0" width="170" height="48" rx="5" fill="#0d1f12" stroke="#1a3a2a" stroke-width="0.5"/>
      <text x="395" y="18" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">RENDER TIME (HIGH)</text>
      <text x="395" y="38" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="14" font-weight="700" fill="#76b900">578 sec</text>

      <rect x="0" y="60" width="140" height="48" rx="5" fill="#0d1f12" stroke="#1a3a2a" stroke-width="0.5"/>
      <text x="70" y="78" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">COST</text>
      <text x="70" y="98" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="14" font-weight="700" fill="#76b900">Free</text>

      <rect x="155" y="60" width="140" height="48" rx="5" fill="#0d1f12" stroke="#1a3a2a" stroke-width="0.5"/>
      <text x="225" y="78" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">VIDEOS GENERATED</text>
      <text x="225" y="98" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="14" font-weight="700" fill="#76b900">10</text>

      <rect x="310" y="60" width="170" height="48" rx="5" fill="#0d1f12" stroke="#1a3a2a" stroke-width="0.5"/>
      <text x="395" y="78" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">PRIVACY</text>
      <text x="395" y="98" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="14" font-weight="700" fill="#76b900">100% local</text>

      <rect x="0" y="120" width="480" height="48" rx="5" fill="#0d1f12" stroke="#1a3a2a" stroke-width="0.5"/>
      <text x="240" y="138" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">LIMITATION</text>
      <text x="240" y="158" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="13" font-weight="600" fill="#ff9500">Thermal shutdown after sustained load</text>
    </g>

    <!-- Shield icon -->
    <g transform="translate(210, 270)">
      <path d="M50 0 L100 15 L100 50 Q100 80 50 95 Q0 80 0 50 L0 15 Z" fill="#0d1f12" stroke="#76b900" stroke-width="1.5" filter="url(#glow)"/>
      <text x="50" y="55" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="14" font-weight="700" fill="#76b900">No data leaves</text>
      <text x="50" y="72" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="11" fill="#5a8a5a">your network</text>
    </g>
  </g>

  <!-- Right panel: CLOUD -->
  <g transform="translate(640, 95)">
    <rect x="0" y="0" width="520" height="340" rx="12" fill="url(#cloudGrad)" stroke="#1a3a2a" stroke-width="1"/>
    <text x="260" y="30" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="18" font-weight="700" fill="#00d4aa" filter="url(#textGlow)">CLOUD · OPENROUTER</text>
    <text x="260" y="50" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="10" fill="#5a8a5a">MiniMax H3 2K · FLUX.3 Video 720p</text>

    <!-- Metrics -->
    <g transform="translate(20, 70)">
      <rect x="0" y="0" width="140" height="48" rx="5" fill="#0d1f12" stroke="#1a3a2a" stroke-width="0.5"/>
      <text x="70" y="18" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">MAX RESOLUTION</text>
      <text x="70" y="38" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="14" font-weight="700" fill="#00d4aa">2560×1440 (2K)</text>

      <rect x="155" y="0" width="140" height="48" rx="5" fill="#0d1f12" stroke="#1a3a2a" stroke-width="0.5"/>
      <text x="225" y="18" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">MAX DURATION</text>
      <text x="225" y="38" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="14" font-weight="700" fill="#00d4aa">12 seconds</text>

      <rect x="310" y="0" width="170" height="48" rx="5" fill="#0d1f12" stroke="#1a3a2a" stroke-width="0.5"/>
      <text x="395" y="18" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">GEN TIME (2K/12s)</text>
      <text x="395" y="38" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="14" font-weight="700" fill="#00d4aa">~7 min</text>

      <rect x="0" y="60" width="140" height="48" rx="5" fill="#0d1f12" stroke="#1a3a2a" stroke-width="0.5"/>
      <text x="70" y="78" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">COST PER VIDEO</text>
      <text x="70" y="98" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="14" font-weight="700" fill="#00d4aa">$1.30–$2.90</text>

      <rect x="155" y="60" width="140" height="48" rx="5" fill="#0d1f12" stroke="#1a3a2a" stroke-width="0.5"/>
      <text x="225" y="78" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">VIDEOS GENERATED</text>
      <text x="225" y="98" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="14" font-weight="700" fill="#00d4aa">3</text>

      <rect x="310" y="60" width="170" height="48" rx="5" fill="#0d1f12" stroke="#1a3a2a" stroke-width="0.5"/>
      <text x="395" y="78" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">MODERATION</text>
      <text x="395" y="98" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="14" font-weight="700" fill="#ff9500">FLUX.3 blocks violence</text>

      <rect x="0" y="120" width="480" height="48" rx="5" fill="#0d1f12" stroke="#1a3a2a" stroke-width="0.5"/>
      <text x="240" y="138" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">ADVANTAGE</text>
      <text x="240" y="158" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="13" font-weight="600" fill="#00d4aa">2K resolution · 12s duration · no thermal limits</text>
    </g>

    <!-- Cloud icon -->
    <g transform="translate(200, 270)">
      <ellipse cx="60" cy="40" rx="55" ry="30" fill="#0d1f12" stroke="#00d4aa" stroke-width="1.5" filter="url(#glow)"/>
      <text x="60" y="38" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="12" font-weight="700" fill="#00d4aa">Datacenter GPUs</text>
      <text x="60" y="55" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="11" fill="#5a8a5a">unlimited scale</text>
    </g>
  </g>

  <!-- VS divider -->
  <text x="600" y="270" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="28" font-weight="700" fill="#ff9500" filter="url(#textGlow)">VS</text>

  <!-- Bottom: second Spark coming -->
  <g transform="translate(60, 460)">
    <rect x="0" y="0" width="1080" height="140" rx="10" fill="#0d1f12" stroke="#1a3a2a" stroke-width="1" opacity="0.9"/>
    <text x="540" y="28" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="16" font-weight="700" fill="#76b900" filter="url(#textGlow)">Coming August 16: Second NVIDIA DGX Spark</text>
    <text x="540" y="52" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="11" fill="#5a8a5a">Two Sparks = 256 GB unified memory · distributed inference · higher resolution · longer videos · no single-node thermal limit</text>

    <!-- Two Spark icons -->
    <g transform="translate(380, 70)">
      <rect x="0" y="0" width="100" height="50" rx="6" fill="#0a1f0a" stroke="#76b900" stroke-width="1" filter="url(#glow)"/>
      <text x="50" y="30" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="11" fill="#76b900">SPARK 1</text>
      <text x="50" y="44" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#5a8a5a">128GB</text>
    </g>
    <text x="510" y="100" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="20" font-weight="700" fill="#ff9500">+</text>
    <g transform="translate(540, 70)">
      <rect x="0" y="0" width="100" height="50" rx="6" fill="#0a1f0a" stroke="#76b900" stroke-width="1" filter="url(#glow)"/>
      <text x="50" y="30" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="11" fill="#76b900">SPARK 2</text>
      <text x="50" y="44" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#5a8a5a">128GB</text>
    </g>
    <text x="690" y="95" text-anchor="start" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="13" fill="#e8eef4">= 256 GB total · 1080p video generation</text>
    <text x="690" y="112" text-anchor="start" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="13" fill="#e8eef4">= longer sustained sessions without thermal shutdown</text>
  </g>
</svg>