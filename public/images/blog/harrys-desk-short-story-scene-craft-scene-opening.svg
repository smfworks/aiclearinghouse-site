<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d1a2f;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00E5A0;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#00E5A0;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid-template" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#00E5A0" stroke-width="0.5" stroke-opacity="0.08"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid-template)"/>

  <!-- Central glow -->
  <circle cx="600" cy="315" r="260" fill="url(#glowGrad)"/>

  <!-- Scene opening motif: doorway/portal opening into a room with floating text fragments and light beam -->
  <g transform="translate(600, 305)" opacity="0.9">
    <!-- Door frame -->
    <rect x="-90" y="-130" width="180" height="260" rx="4" fill="none" stroke="#00E5A0" stroke-width="3" stroke-opacity="0.6"/>
    <!-- Door opening (split panels slightly ajar) -->
    <path d="M -88 -128 L -20 -128 L -20 128 L -88 128 Z" fill="none" stroke="#00E5A0" stroke-width="1.5" stroke-opacity="0.35"/>
    <path d="M 20 -128 L 88 -128 L 88 128 L 20 128 Z" fill="none" stroke="#00E5A0" stroke-width="1.5" stroke-opacity="0.35"/>
    <!-- Light beam from opening -->
    <path d="M -35 -80 L 35 -80 L 120 160 L -120 160 Z" fill="#00E5A0" opacity="0.08"/>
    <!-- Floating text fragments representing narrative anchors -->
    <rect x="-55" y="-95" width="48" height="6" rx="2" fill="#00E5A0" opacity="0.55"/>
    <rect x="-55" y="-82" width="34" height="4" rx="2" fill="#00E5A0" opacity="0.35"/>
    <rect x="15" y="-72" width="40" height="5" rx="2" fill="#00E5A0" opacity="0.45"/>
    <rect x="-30" y="50" width="52" height="5" rx="2" fill="#00E5A0" opacity="0.5"/>
    <rect x="-45" y="64" width="38" height="4" rx="2" fill="#00E5A0" opacity="0.3"/>
    <!-- Point-of-view eye glyph -->
    <ellipse cx="0" cy="-25" rx="22" ry="14" fill="none" stroke="#00E5A0" stroke-width="2" opacity="0.7"/>
    <circle cx="0" cy="-25" r="6" fill="#00E5A0" opacity="0.75"/>
    <!-- Small clock gear (Clara motif) drifting through the doorway -->
    <g transform="translate(45, 20)" opacity="0.65">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#00E5A0" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="5" fill="#00E5A0"/>
      <line x1="0" y1="-14" x2="0" y2="-6" stroke="#00E5A0" stroke-width="1.5"/>
      <line x1="10" y1="0" x2="4" y2="0" stroke="#00E5A0" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Series mark -->
  <text x="600" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#00E5A0" opacity="0.6" letter-spacing="4">THE ALCHEMY OF LANGUAGE</text>

  <!-- Bottom title panel -->
  <rect x="0" y="480" width="1200" height="150" fill="#0a1628" opacity="0.7"/>
  <text x="600" y="530" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" fill="#ffffff">Short Story — Scene Craft: Scene Opening</text>
  <text x="600" y="565" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#00E5A0" opacity="0.7">Anchor the reader before the story moves.</text>

  <!-- SMF Works mark -->
  <text x="600" y="605" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#ffffff" opacity="0.35">
    Harry's Desk — The Alchemy of Language
  </text>
</svg>
