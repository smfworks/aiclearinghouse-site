<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1a2f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#00E5A0" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00E5A0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle grid -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#00E5A0" stroke-width="0.5" stroke-opacity="0.06"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Dialogue motif: overlapping speech bubbles -->
  <g opacity="0.20" transform="translate(780, 240) scale(1.2)">
    <path d="M0,0 C-90,0 -165,60 -165,140 C-165,210 -90,260 0,260 C25,260 48,255 70,243 L118,285 L110,225 C160,200 185,170 185,140 C185,60 105,0 0,0 Z" fill="none" stroke="#00E5A0" stroke-width="2.5"/>
  </g>
  <g opacity="0.16" transform="translate(930, 340) scale(0.95)">
    <path d="M0,0 C-70,0 -130,50 -130,110 C-130,170 -70,210 0,210 C20,210 40,205 58,196 L100,230 L92,190 C125,175 145,145 145,110 C145,50 85,0 0,0 Z" fill="#00E5A0"/>
  </g>

  <!-- Clock / gear motif suggesting Clara's shop -->
  <g transform="translate(160, 255)" fill="none" stroke="#00E5A0" stroke-width="2" opacity="0.25">
    <circle cx="0" cy="0" r="55"/>
    <circle cx="0" cy="0" r="45"/>
    <circle cx="0" cy="0" r="6" fill="#00E5A0"/>
    <line x1="0" y1="-10" x2="0" y2="-40" stroke-linecap="round" stroke-width="3"/>
    <line x1="8" y1="0" x2="35" y2="0" stroke-linecap="round" stroke-width="3"/>
    <line x1="-6" y1="6" x2="-25" y2="25" stroke-linecap="round" stroke-width="2.5"/>
  </g>

  <!-- Small floating gears -->
  <g transform="translate(245, 320)" fill="none" stroke="#00E5A0" stroke-width="1.5" opacity="0.18">
    <circle cx="0" cy="0" r="22"/>
    <circle cx="0" cy="0" r="14"/>
    <circle cx="0" cy="0" r="3" fill="#00E5A0"/>
    <line x1="0" y1="-6" x2="0" y2="-18" stroke-linecap="round"/>
    <line x1="5" y1="0" x2="17" y2="0" stroke-linecap="round"/>
  </g>

  <!-- Sound wave / dialogue pulse -->
  <g stroke="#00E5A0" stroke-width="2.5" stroke-linecap="round" opacity="0.22" transform="translate(160, 420)">
    <line x1="0" y1="-40" x2="0" y2="40"/>
    <line x1="22" y1="-25" x2="22" y2="25"/>
    <line x1="44" y1="-50" x2="44" y2="50"/>
    <line x1="66" y1="-30" x2="66" y2="30"/>
    <line x1="88" y1="-55" x2="88" y2="55"/>
    <line x1="110" y1="-20" x2="110" y2="20"/>
    <line x1="132" y1="-35" x2="132" y2="35"/>
  </g>

  <!-- Series mark -->
  <text x="110" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#00E5A0" opacity="0.65" letter-spacing="4">THE ALCHEMY OF LANGUAGE</text>

  <!-- Main title -->
  <text x="110" y="205" font-family="Georgia, serif" font-size="60" font-weight="bold" fill="#f8f9fa">Dialogue Generation</text>
  <text x="110" y="275" font-family="Georgia, serif" font-size="32" fill="#c8d0d9">Short Story — Scene Craft</text>

  <!-- Bottom panel -->
  <rect x="0" y="470" width="1200" height="160" fill="#0a1628" opacity="0.5"/>
  <text x="110" y="525" font-family="Georgia, serif" font-size="20" fill="#7a8a99">Harry Mercury · Week 10, Article 2</text>
  <text x="110" y="565" font-family="Georgia, serif" font-size="18" fill="#5f6f7d">Wednesday, July 29, 2026</text>

  <!-- SMF Works mark -->
  <text x="110" y="605" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#ffffff" opacity="0.30">Harry's Desk — The Alchemy of Language</text>
</svg>
