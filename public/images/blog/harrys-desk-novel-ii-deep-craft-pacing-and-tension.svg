<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1a2f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#00E5A0" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00E5A0" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle grid -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#00E5A0" stroke-width="0.5" stroke-opacity="0.06"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Central glow -->
  <circle cx="900" cy="280" r="200" fill="#00E5A0" opacity="0.06"/>

  <!-- Pacing waveform motif: a tension curve that builds, peaks, and releases -->
  <g transform="translate(900, 280)" opacity="0.55">
    <!-- Rising tension arc -->
    <path d="M-200,100 Q-100,80 -50,50 Q0,20 30,-20 Q50,-60 60,-100" fill="none" stroke="#00E5A0" stroke-width="3" stroke-linecap="round"/>
    <!-- Peak spike -->
    <path d="M60,-100 L70,-130 L80,-100" fill="none" stroke="#00E5A0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Falling release -->
    <path d="M80,-100 Q120,-50 160,0 Q190,40 200,80" fill="none" stroke="#00E5A0" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <!-- Baseline -->
    <line x1="-220" y1="110" x2="220" y2="110" stroke="#00E5A0" stroke-width="1" opacity="0.2" stroke-dasharray="4,6"/>
    <!-- Tension markers -->
    <circle cx="-200" cy="100" r="4" fill="#00E5A0" opacity="0.7"/>
    <circle cx="70" cy="-130" r="6" fill="#00E5A0" opacity="0.9"/>
    <circle cx="200" cy="80" r="4" fill="#00E5A0" opacity="0.5"/>
  </g>

  <!-- Pace arrows: fast/slow indicators -->
  <g transform="translate(900, 430)" opacity="0.3">
    <!-- Fast pace arrow (short, rapid) -->
    <g transform="translate(-80, 0)">
      <path d="M0,0 L25,0 M10,-4 L25,0 L10,4" fill="none" stroke="#00E5A0" stroke-width="2"/>
      <path d="M35,0 L60,0 M45,-4 L60,0 L45,4" fill="none" stroke="#00E5A0" stroke-width="2"/>
      <text x="30" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#00E5A0" opacity="0.7">FAST</text>
    </g>
    <!-- Slow pace arrow (long, drawn) -->
    <g transform="translate(50, 0)">
      <path d="M0,0 L60,0 M50,-4 L60,0 L50,4" fill="none" stroke="#00E5A0" stroke-width="2" opacity="0.6"/>
      <text x="30" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#00E5A0" opacity="0.5">SLOW</text>
    </g>
  </g>

  <!-- Series label -->
  <text x="110" y="95" font-family="Georgia, serif" font-size="20" fill="#00E5A0" opacity="0.7" letter-spacing="2">THE ALCHEMY OF LANGUAGE</text>

  <!-- Main title -->
  <text x="110" y="180" font-family="Georgia, serif" font-size="54" font-weight="bold" fill="#f0f4f8">Pacing and Tension</text>

  <!-- Subtitle -->
  <text x="110" y="230" font-family="Georgia, serif" font-size="26" fill="#00E5A0" opacity="0.8">Novel II — Deep Craft</text>

  <!-- Description line -->
  <text x="110" y="290" font-family="Georgia, serif" font-size="18" fill="#a0b0c0" opacity="0.7">Two engines, not one. The gap between</text>
  <text x="110" y="314" font-family="Georgia, serif" font-size="18" fill="#a0b0c0" opacity="0.7">movement and pull — and why fast is not</text>
  <text x="110" y="338" font-family="Georgia, serif" font-size="18" fill="#a0b0c0" opacity="0.7">the same as compelling.</text>

  <!-- Byline -->
  <text x="110" y="510" font-family="Georgia, serif" font-size="18" fill="#6a7a8a">Harry Mercury · Week 14, Article 3</text>
  <text x="110" y="540" font-family="Georgia, serif" font-size="16" fill="#4a5a6a">Friday, August 28, 2026</text>

  <!-- SMF Works mark -->
  <text x="600" y="605" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#ffffff" opacity="0.3">Harry's Desk — The Alchemy of Language</text>
</svg>