<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001F3F"/>
      <stop offset="100%" stop-color="#000814"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#ea580c" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="red-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A96E" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ef4444" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#C9A96E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C9A96E" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Gate: two vertical bars (rejecting a report) -->
  <!-- Left bar -->
  <rect x="380" y="140" width="40" height="350" rx="8" fill="#C9A96E" opacity="0.85"/>
  <!-- Right bar, tilted to block -->
  <g transform="rotate(18 590 315)">
    <rect x="570" y="140" width="40" height="350" rx="8" fill="#ef4444" opacity="0.7"/>
  </g>

  <!-- Horizontal report card sliding toward the gate -->
  <g>
    <rect x="120" y="265" width="210" height="100" rx="10" fill="none" stroke="#00D4FF" stroke-width="2" opacity="0.8"/>
    <!-- code lines on the card -->
    <rect x="145" y="295" width="110" height="8" rx="3" fill="#00D4FF" opacity="0.6"/>
    <rect x="145" y="315" width="80" height="8" rx="3" fill="#00D4FF" opacity="0.6"/>
    <rect x="145" y="335" width="130" height="8" rx="3" fill="#00D4FF" opacity="0.6"/>
  </g>

  <!-- Rejected badge (X) above/right of gate -->
  <g transform="translate(700 200)">
    <circle r="38" fill="none" stroke="#ef4444" stroke-width="3.5" opacity="0.9"/>
    <line x1="-22" y1="-22" x2="22" y2="22" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
    <line x1="22" y1="-22" x2="-22" y2="22" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Variance scatter dots around the gate (noise) -->
  <g opacity="0.5">
    <circle cx="660" cy="150" r="5" fill="#ea580c"/>
    <circle cx="720" cy="130" r="3" fill="#ea580c"/>
    <circle cx="780" cy="160" r="4" fill="#C9A96E"/>
    <circle cx="650" cy="110" r="3" fill="#C9A96E"/>
    <circle cx="830" cy="140" r="4" fill="#ef4444"/>
    <circle cx="700" cy="330" r="4" fill="#ea580c"/>
    <circle cx="760" cy="350" r="3" fill="#C9A96E"/>
    <circle cx="820" cy="320" r="5" fill="#ef4444"/>
    <circle cx="860" cy="360" r="3" fill="#ea580c"/>
    <circle cx="680" cy="400" r="4" fill="#C9A96E"/>
  </g>

  <!-- Dotted connector from gate to model names -->
  <line x1="700" y1="238" x2="700" y2="430" stroke="url(#red-line)" stroke-width="1.5"/>

  <!-- Bottom band -->
  <line x1="100" y1="520" x2="1100" y2="520" stroke="#C9A96E" stroke-width="0.6" opacity="0.35"/>
  <rect x="0" y="600" width="1200" height="30" fill="#001F3F"/>
  <rect x="0" y="600" width="996" height="5" fill="#ef4444" opacity="0.6"/>
  <rect x="996" y="600" width="180" height="5" fill="#C9A96E" opacity="0.8"/>
  <rect x="1176" y="600" width="24" height="5" fill="#00D4FF" opacity="0.6"/>
</svg>