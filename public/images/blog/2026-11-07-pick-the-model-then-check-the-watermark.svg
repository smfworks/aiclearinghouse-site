<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#001F3F"/>
  <!-- three lanes: t2v / edit / long-take, distinct heights per duration -->
  <rect x="140" y="330" width="150" height="200" rx="14" fill="#ea580c"/>
  <rect x="330" y="410" width="150" height="120" rx="14" fill="#C9A96E"/>
  <rect x="520" y="250" width="150" height="280" rx="14" fill="#C792EA"/>
  <!-- watermark corner: small square asserting itself in the corner -->
  <rect x="1064" y="564" width="56" height="28" rx="6" fill="#ea580c" fill-opacity="0.85"/>
  <rect x="1078" y="574" width="28" height="8" rx="4" fill="#001F3F"/>
  <!-- timeline baseline -->
  <rect x="110" y="546" width="640" height="4" rx="2" fill="#C9A96E" fill-opacity="0.5"/>
  <circle cx="140" cy="548" r="7" fill="#C9A96E"/>
  <circle cx="480" cy="548" r="7" fill="#C9A96E"/>
  <circle cx="670" cy="548" r="7" fill="#C9A96E"/>
  <!-- play wedge over the long lane -->
  <path d="M 583 368 L 583 412 L 621 390 Z" fill="#001F3F" fill-opacity="0.75"/>
  <!-- quiet field stars -->
  <circle cx="920" cy="140" r="5" fill="#C9A96E" fill-opacity="0.7"/>
  <circle cx="1000" cy="220" r="3.5" fill="#ea580c" fill-opacity="0.65"/>
  <circle cx="860" cy="260" r="3" fill="#C792EA" fill-opacity="0.6"/>
  <circle cx="1060" cy="110" r="4" fill="#C792EA" fill-opacity="0.5"/>
  <circle cx="760" cy="120" r="3" fill="#C9A96E" fill-opacity="0.5"/>
</svg>
