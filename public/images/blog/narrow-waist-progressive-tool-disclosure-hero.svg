<?xml version="1.0" encoding="UTF-8"?>
<!-- Hero for "The Narrow Waist" — catalog collapse into three bridge nodes, no text.
     Brand palette: navy #0a1628 / #1e3a8a, gold #f59e0b / #ff6b00, teal #0e7490 / #00d4ff. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Progressive tool disclosure hero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="50%" stop-color="#0c1a30"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="72%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#ff6b00" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="22%" cy="42%" r="38%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="funnel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#1e3a8a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="spoke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowTeal)"/>
  <rect width="1200" height="630" fill="url(#glowGold)"/>

  <!-- frame -->
  <g stroke="#162236" stroke-width="2" fill="none">
    <rect x="48" y="48" width="1104" height="534" rx="4"/>
  </g>
  <g stroke="#13243d" stroke-width="1" opacity="0.55">
    <line x1="48" y1="210" x2="1152" y2="210"/>
    <line x1="48" y1="420" x2="1152" y2="420"/>
    <line x1="400" y1="48" x2="400" y2="582"/>
    <line x1="800" y1="48" x2="800" y2="582"/>
  </g>

  <!-- left: dense catalog cloud (many tools) -->
  <g>
    <circle cx="130" cy="140" r="9" fill="#0e7490" opacity="0.85"/>
    <circle cx="168" cy="118" r="7" fill="#00d4ff" opacity="0.7"/>
    <circle cx="196" cy="156" r="11" fill="#0e7490" opacity="0.9"/>
    <circle cx="148" cy="188" r="6" fill="#1e3a8a" opacity="0.9"/>
    <circle cx="220" cy="198" r="8" fill="#0e7490" opacity="0.8"/>
    <circle cx="188" cy="230" r="10" fill="#00d4ff" opacity="0.65"/>
    <circle cx="124" cy="232" r="7" fill="#1e3a8a" opacity="0.85"/>
    <circle cx="250" cy="148" r="6" fill="#3b82f6" opacity="0.7"/>
    <circle cx="236" cy="250" r="9" fill="#0e7490" opacity="0.85"/>
    <circle cx="160" cy="268" r="5" fill="#00d4ff" opacity="0.75"/>
    <circle cx="210" cy="290" r="8" fill="#1e3a8a" opacity="0.9"/>
    <circle cx="118" cy="300" r="10" fill="#0e7490" opacity="0.8"/>
    <circle cx="268" cy="210" r="7" fill="#00d4ff" opacity="0.6"/>
    <circle cx="280" cy="278" r="11" fill="#0e7490" opacity="0.88"/>
    <circle cx="148" cy="340" r="8" fill="#3b82f6" opacity="0.75"/>
    <circle cx="198" cy="352" r="6" fill="#0e7490" opacity="0.8"/>
    <circle cx="248" cy="330" r="9" fill="#00d4ff" opacity="0.7"/>
    <circle cx="126" cy="390" r="7" fill="#1e3a8a" opacity="0.9"/>
    <circle cx="176" cy="408" r="10" fill="#0e7490" opacity="0.85"/>
    <circle cx="228" cy="392" r="6" fill="#00d4ff" opacity="0.7"/>
    <circle cx="270" cy="360" r="8" fill="#1e3a8a" opacity="0.85"/>
    <circle cx="154" cy="450" r="9" fill="#0e7490" opacity="0.8"/>
    <circle cx="206" cy="468" r="7" fill="#3b82f6" opacity="0.75"/>
    <circle cx="250" cy="442" r="11" fill="#0e7490" opacity="0.9"/>
    <circle cx="292" cy="416" r="6" fill="#00d4ff" opacity="0.65"/>
    <circle cx="180" cy="500" r="8" fill="#1e3a8a" opacity="0.85"/>
    <circle cx="232" cy="512" r="7" fill="#0e7490" opacity="0.8"/>
    <circle cx="276" cy="488" r="9" fill="#00d4ff" opacity="0.7"/>
    <circle cx="310" cy="240" r="5" fill="#f59e0b" opacity="0.55"/>
    <circle cx="318" cy="320" r="6" fill="#ff6b00" opacity="0.45"/>
    <circle cx="308" cy="400" r="5" fill="#f59e0b" opacity="0.5"/>
  </g>

  <!-- funnel bands -->
  <path d="M340,90 L760,230 L760,400 L340,540 Z" fill="url(#funnel)" opacity="0.12"/>
  <path d="M340,90 L760,230 L760,400 L340,540 Z" fill="none" stroke="url(#spoke)" stroke-width="2" opacity="0.55"/>
  <path d="M340,160 L760,250" stroke="#0e7490" stroke-width="1.5" opacity="0.35"/>
  <path d="M340,315 L760,315" stroke="#1e3a8a" stroke-width="1.5" opacity="0.4"/>
  <path d="M340,470 L760,380" stroke="#0e7490" stroke-width="1.5" opacity="0.35"/>

  <!-- three bridge nodes (search / describe / call) — gold, no labels -->
  <g filter="url(#soft)">
    <rect x="742" y="188" width="56" height="56" rx="8" fill="#f59e0b" opacity="0.95"/>
    <rect x="742" y="287" width="56" height="56" rx="8" fill="#ff6b00" opacity="0.95"/>
    <rect x="742" y="386" width="56" height="56" rx="8" fill="#f59e0b" opacity="0.92"/>
  </g>
  <g fill="none" stroke="#ffb020" stroke-width="2" opacity="0.8">
    <rect x="742" y="188" width="56" height="56" rx="8"/>
    <rect x="742" y="287" width="56" height="56" rx="8"/>
    <rect x="742" y="386" width="56" height="56" rx="8"/>
  </g>

  <!-- right: narrow waist / core hub -->
  <circle cx="980" cy="315" r="92" fill="#1e3a8a" opacity="0.55"/>
  <circle cx="980" cy="315" r="92" fill="none" stroke="#3b82f6" stroke-width="3" opacity="0.7"/>
  <circle cx="980" cy="315" r="54" fill="#0a1628" opacity="0.7"/>
  <circle cx="980" cy="315" r="28" fill="#00d4ff" opacity="0.85"/>
  <circle cx="980" cy="315" r="28" fill="none" stroke="#f59e0b" stroke-width="3"/>

  <!-- bridge to hub -->
  <g stroke="#f59e0b" stroke-width="2.5" fill="none" opacity="0.75" stroke-linecap="round">
    <path d="M798,216 L888,290"/>
    <path d="M798,315 L888,315"/>
    <path d="M798,414 L888,340"/>
  </g>
</svg>
