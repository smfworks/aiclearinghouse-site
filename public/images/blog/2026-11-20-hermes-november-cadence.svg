<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="624" viewBox="0 0 1200 624">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#06141e"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="624" fill="url(#bg)"/>
  <g stroke="#1a2a3a" stroke-opacity="0.3">
    <line x1="80" y1="120" x2="80" y2="480"/>
    <line x1="80" y1="480" x2="1120" y2="480"/>
    <line x1="80" y1="330" x2="1120" y2="330" stroke-dasharray="4 6"/>
    <line x1="80" y1="180" x2="1120" y2="180" stroke-dasharray="4 6"/>
  </g>
  <text x="80" y="80" fill="#e8eef4" font-family="Helvetica Neue, Arial, sans-serif" font-size="40" font-weight="bold">Hermes Agent: November 2026</text>
  <text x="80" y="115" fill="#5a8a6a" font-family="SF Mono, Courier New, monospace" font-size="17">four stable releases in fifteen days · merged PRs per release window</text>
  <g filter="url(#glow)">
    <rect x="170" y="150" width="150" height="330" fill="url(#bar)" rx="4"/>
    <rect x="420" y="440" width="150" height="40" fill="url(#bar)" rx="4" opacity="0.85"/>
    <rect x="670" y="205" width="150" height="275" fill="url(#bar)" rx="4" opacity="0.92"/>
    <rect x="920" y="400" width="150" height="80" fill="url(#bar)" rx="4" opacity="0.88"/>
  </g>
  <g fill="#e8eef4" font-family="SF Mono, Courier New, monospace" font-size="20" text-anchor="middle" font-weight="bold">
    <text x="245" y="140">~1,950</text>
    <text x="495" y="428">~618</text>
    <text x="745" y="193">~1,989</text>
    <text x="995" y="388">~370</text>
  </g>
  <g fill="#5a8a6a" font-family="SF Mono, Courier New, monospace" font-size="15" text-anchor="middle">
    <text x="245" y="505">v0.23.0 Hearth</text><text x="245" y="525">Nov 5</text>
    <text x="495" y="505">v0.23.1</text><text x="495" y="525">Nov 9</text>
    <text x="745" y="505">v0.23.2</text><text x="745" y="525">Nov 16</text>
    <text x="995" y="505">v0.23.3</text><text x="995" y="525">Nov 19</text>
  </g>
  <g fill="#666" font-family="SF Mono, Courier New, monospace" font-size="12" text-anchor="end">
    <text x="72" y="185">2,000</text>
    <text x="72" y="335">1,000</text>
    <text x="72" y="485">0</text>
  </g>
  <g font-family="SF Mono, Courier New, monospace" font-size="13" fill="#00d4aa">
    <text x="80" y="580">666 contributors on v0.23.0 · 262,917 stars · plugin catalog 600 → 1,050+</text>
  </g>
  <text x="1120" y="580" fill="#666" font-family="SF Mono, Courier New, monospace" font-size="12" text-anchor="end">SMF Works · Nov 2026</text>
</svg>