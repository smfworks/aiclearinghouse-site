<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" width="1200" height="624">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#06141e"/>
    </linearGradient>
    <radialGradient id="gpuGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#76b900" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#76b900" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="expertActive" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#76b900"/>
      <stop offset="100%" stop-color="#3d5e00" stop-opacity="0.3"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="624" fill="url(#bg)"/>

  <!-- Grid -->
  <g opacity="0.15" stroke="#1a3a2a" stroke-width="0.5">
    <line x1="0" y1="78" x2="1200" y2="78"/>
    <line x1="0" y1="156" x2="1200" y2="156"/>
    <line x1="0" y1="234" x2="1200" y2="234"/>
    <line x1="0" y1="312" x2="1200" y2="312"/>
    <line x1="0" y1="390" x2="1200" y2="390"/>
    <line x1="0" y1="468" x2="1200" y2="468"/>
    <line x1="0" y1="546" x2="1200" y2="546"/>
    <line x1="120" y1="0" x2="120" y2="624"/>
    <line x1="300" y1="0" x2="300" y2="624"/>
    <line x1="480" y1="0" x2="480" y2="624"/>
    <line x1="660" y1="0" x2="660" y2="624"/>
    <line x1="840" y1="0" x2="840" y2="624"/>
    <line x1="1020" y1="0" x2="1020" y2="624"/>
  </g>

  <!-- GPU glow -->
  <ellipse cx="300" cy="312" rx="180" ry="120" fill="url(#gpuGlow)"/>

  <!-- DGX Spark chip representation -->
  <g transform="translate(210, 252)">
    <!-- Chip body -->
    <rect x="0" y="0" width="180" height="120" rx="12" fill="#0d1f12" stroke="#2a5a1a" stroke-width="2" filter="url(#glow)"/>
    <rect x="12" y="12" width="156" height="96" rx="6" fill="#061a0e" stroke="#1a4a10" stroke-width="1"/>

    <!-- Chip label -->
    <text x="90" y="48" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="18" font-weight="700" fill="#76b900">GB10</text>
    <text x="90" y="70" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="10" fill="#5a8a5a">SM121</text>
    <text x="90" y="88" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#4a6a4a">128GB UMA</text>

    <!-- Pin contacts left -->
    <g fill="#2a5a1a">
      <rect x="-8" y="20" width="8" height="3"/>
      <rect x="-8" y="32" width="8" height="3"/>
      <rect x="-8" y="44" width="8" height="3"/>
      <rect x="-8" y="56" width="8" height="3"/>
      <rect x="-8" y="68" width="8" height="3"/>
      <rect x="-8" y="80" width="8" height="3"/>
      <rect x="-8" y="92" width="8" height="3"/>
    </g>
    <!-- Pin contacts right -->
    <g fill="#2a5a1a">
      <rect x="180" y="20" width="8" height="3"/>
      <rect x="180" y="32" width="8" height="3"/>
      <rect x="180" y="44" width="8" height="3"/>
      <rect x="180" y="56" width="8" height="3"/>
      <rect x="180" y="68" width="8" height="3"/>
      <rect x="180" y="80" width="8" height="3"/>
      <rect x="180" y="92" width="8" height="3"/>
    </g>
  </g>

  <!-- DSpark speculative decode arrow -->
  <g transform="translate(420, 290)">
    <line x1="0" y1="22" x2="80" y2="22" stroke="#76b900" stroke-width="2" filter="url(#glow)"/>
    <polygon points="78,16 92,22 78,28" fill="#76b900"/>
    <text x="42" y="14" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="9" fill="#76b900" filter="url(#textGlow)">DSpark</text>
    <text x="42" y="42" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#5a8a5a">72% accept</text>
  </g>

  <!-- MoE Expert grid (8x4 = 32 experts, 4 active) -->
  <g transform="translate(530, 200)">
    <text x="120" y="-12" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="9" fill="#5a8a5a">ROUTED EXPERTS</text>
    <!-- Dim experts -->
    <g fill="#0d2a18" stroke="#1a3a2a" stroke-width="0.5">
      <!-- Row 1 -->
      <circle cx="15" cy="15" r="6"/><circle cx="35" cy="15" r="6"/><circle cx="55" cy="15" r="6"/><circle cx="75" cy="15" r="6"/>
      <circle cx="95" cy="15" r="6"/><circle cx="115" cy="15" r="6"/><circle cx="135" cy="15" r="6"/><circle cx="155" cy="15" r="6"/>
      <circle cx="175" cy="15" r="6"/><circle cx="195" cy="15" r="6"/><circle cx="215" cy="15" r="6"/><circle cx="235" cy="15" r="6"/>
      <!-- Row 2 -->
      <circle cx="15" cy="35" r="6"/><circle cx="35" cy="35" r="6"/><circle cx="55" cy="35" r="6"/><circle cx="75" cy="35" r="6"/>
      <circle cx="95" cy="35" r="6"/><circle cx="115" cy="35" r="6"/><circle cx="135" cy="35" r="6"/><circle cx="155" cy="35" r="6"/>
      <circle cx="175" cy="35" r="6"/><circle cx="195" cy="35" r="6"/><circle cx="215" cy="35" r="6"/><circle cx="235" cy="35" r="6"/>
      <!-- Row 3 -->
      <circle cx="15" cy="55" r="6"/><circle cx="35" cy="55" r="6"/><circle cx="55" cy="55" r="6"/><circle cx="75" cy="55" r="6"/>
      <circle cx="95" cy="55" r="6"/><circle cx="115" cy="55" r="6"/><circle cx="135" cy="55" r="6"/><circle cx="155" cy="55" r="6"/>
      <circle cx="175" cy="55" r="6"/><circle cx="195" cy="55" r="6"/><circle cx="215" cy="55" r="6"/><circle cx="235" cy="55" r="6"/>
      <!-- Row 4 -->
      <circle cx="15" cy="75" r="6"/><circle cx="35" cy="75" r="6"/><circle cx="55" cy="75" r="6"/><circle cx="75" cy="75" r="6"/>
      <circle cx="95" cy="75" r="6"/><circle cx="115" cy="75" r="6"/><circle cx="135" cy="75" r="6"/><circle cx="155" cy="75" r="6"/>
      <circle cx="175" cy="75" r="6"/><circle cx="195" cy="75" r="6"/><circle cx="215" cy="75" r="6"/><circle cx="235" cy="75" r="6"/>
    </g>
    <!-- Active experts (4) -->
    <circle cx="55" cy="15" r="8" fill="url(#expertActive)" filter="url(#glow)"/>
    <circle cx="135" cy="35" r="8" fill="url(#expertActive)" filter="url(#glow)"/>
    <circle cx="75" cy="55" r="8" fill="url(#expertActive)" filter="url(#glow)"/>
    <circle cx="195" cy="75" r="8" fill="url(#expertActive)" filter="url(#glow)"/>
    <!-- Shared expert -->
    <circle cx="275" cy="45" r="10" fill="#ff9500" fill-opacity="0.6" stroke="#ff9500" stroke-width="1" filter="url(#glow)"/>
    <text x="275" y="70" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#ff9500">SHARED</text>
  </g>

  <!-- Title -->
  <text x="600" y="430" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="36" font-weight="700" fill="#e8eef4" filter="url(#textGlow)">DeepSeek V4 Flash on DGX Spark</text>
  <text x="600" y="465" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="14" fill="#76b900">DwarfStar 4 Engine · IQ2XXS Q2 · DSpark Speculative Decode</text>

  <!-- Stats bar -->
  <g transform="translate(60, 510)">
    <rect x="0" y="0" width="1080" height="80" rx="8" fill="#0d1f12" stroke="#1a3a2a" stroke-width="1" opacity="0.8"/>

    <!-- Stat 1 -->
    <text x="20" y="22" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">MODEL SIZE</text>
    <text x="20" y="44" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="18" font-weight="700" fill="#e8eef4">81 GiB</text>
    <text x="20" y="62" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#5a8a5a">IQ2XXS Q2</text>

    <!-- Stat 2 -->
    <text x="195" y="22" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">DECODE</text>
    <text x="195" y="44" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="18" font-weight="700" fill="#76b900">20-25</text>
    <text x="195" y="62" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#5a8a5a">tok/s effective</text>

    <!-- Stat 3 -->
    <text x="370" y="22" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">SPEC ACCEPT</text>
    <text x="370" y="44" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="18" font-weight="700" fill="#76b900">65-81%</text>
    <text x="370" y="62" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#5a8a5a">DSpark drafter</text>

    <!-- Stat 4 -->
    <text x="545" y="22" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">TOOL CALLING</text>
    <text x="545" y="44" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="18" font-weight="700" fill="#e8eef4">3/3</text>
    <text x="545" y="62" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#5a8a5a">OpenAI-compatible</text>

    <!-- Stat 5 -->
    <text x="720" y="22" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">QUALITY</text>
    <text x="720" y="44" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="18" font-weight="700" fill="#e8eef4">8/8</text>
    <text x="720" y="62" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#5a8a5a">reasoning tests</text>

    <!-- Stat 6 -->
    <text x="895" y="22" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">CONTEXT</text>
    <text x="895" y="44" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="18" font-weight="700" fill="#e8eef4">262K</text>
    <text x="895" y="62" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#5a8a5a">token window</text>
  </g>
</svg>