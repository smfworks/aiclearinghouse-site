<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001F3F"/>
      <stop offset="50%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#051018"/>
    </linearGradient>
    <linearGradient id="inpipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="outpipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A96E" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#C9A96E" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- incoming request (clean cyan) -->
  <g filter="url(#glow)">
    <rect x="70" y="292" width="220" height="18" rx="9" fill="url(#inpipe)"/>
    <circle cx="70" cy="301" r="16" fill="#00D4FF"/>
  </g>

  <!-- minefield: staggered orange/gold pits between request and response -->
  <g>
    <circle cx="430" cy="180" r="22" fill="#ea580c" opacity="0.85"/>
    <circle cx="520" cy="250" r="16" fill="#C9A96E" opacity="0.75"/>
    <circle cx="610" cy="160" r="12" fill="#ea580c" opacity="0.55"/>
    <circle cx="480" cy="360" r="20" fill="#C9A96E" opacity="0.7"/>
    <circle cx="590" cy="410" r="26" fill="#ea580c" opacity="0.8"/>
    <circle cx="680" cy="300" r="14" fill="#C9A96E" opacity="0.65"/>
    <circle cx="560" cy="500" r="18" fill="#ea580c" opacity="0.5"/>
    <circle cx="700" cy="200" r="10" fill="#00D4FF" opacity="0.35"/>
    <circle cx="390" cy="470" r="11" fill="#C9A96E" opacity="0.45"/>
    <circle cx="640" cy="520" r="13" fill="#ea580c" opacity="0.4"/>
  </g>

  <!-- broken path through the field -->
  <path d="M290 301 C360 301, 400 220, 470 240 S560 380, 640 340 S760 301, 860 301"
        fill="none" stroke="#ea580c" stroke-width="4" stroke-linecap="round" opacity="0.9"/>

  <!-- outgoing response looks clean (gold) -->
  <g filter="url(#glow)">
    <rect x="860" y="292" width="220" height="18" rx="9" fill="url(#outpipe)"/>
    <circle cx="1130" cy="301" r="16" fill="#C9A96E"/>
  </g>

  <!-- the wrong number: a split mark on the output node -->
  <g>
    <rect x="1118" y="289" width="24" height="6" rx="2" fill="#001F3F"/>
    <rect x="1118" y="307" width="24" height="6" rx="2" fill="#ea580c"/>
  </g>
</svg>
