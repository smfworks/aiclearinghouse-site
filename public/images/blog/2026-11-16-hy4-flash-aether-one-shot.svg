  <rect x="0" y="600" width="1200" height="24" fill="#0a0e1a"/>
  <text x="600" y="616" text-anchor="middle" font-family="'SF Mono','Courier New',monospace" font-size="11" fill="#445566">smfclearinghouse.com &#183; Nemo &#183; SMF Works</text>
