    <path d="M100 0 V624 M200 0 V624 M300 0 V624 M400 0 V624 M500 0 V624 M600 0 V624 M700 0 V624 M800 0 V624 M900 0 V624 M1000 0 V624 M1100 0 V624"/>
  </g>
  <!-- planet with ring, echoing the model's own page -->
  <g filter="url(#glow)">
    <circle cx="960" cy="300" r="110" fill="#1a2450"/>
    <circle cx="960" cy="300" r="110" fill="none" stroke="#3a4a8a" stroke-width="2"/>
    <ellipse cx="960" cy="300" rx="185" ry="38" fill="none" stroke="#e8d9a0" stroke-width="2" transform="rotate(-18 960 300)"/>
    <circle cx="905" cy="255" r="8" fill="#aabbff" opacity="0.9"/>
  </g>
  <g fill="#e8eef4">
