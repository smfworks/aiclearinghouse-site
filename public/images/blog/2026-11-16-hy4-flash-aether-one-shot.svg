    <circle cx="520" cy="140" r="1.2" opacity="0.7"/><circle cx="700" cy="90" r="1" opacity="0.5"/>
    <circle cx="220" cy="180" r="1" opacity="0.5"/><circle cx="620" cy="170" r="1.2" opacity="0.7"/>
  </g>
  <text x="380" y="160" text-anchor="middle" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="52" font-weight="700" fill="#e8eef4">Hy4 Flash One-Shot:</text>
  <text x="380" y="220" text-anchor="middle" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="52" font-weight="700" fill="url(#bar)" filter="url(#glow)">Aether</text>
  <text x="380" y="268" text-anchor="middle" font-family="'SF Mono','Courier New',monospace" font-size="17" fill="#5a8a6a">tencent/hy4-flash &#183; released 2026-11-16</text>
  <g font-family="'SF Mono','Courier New',monospace" text-anchor="middle">
    <text x="200" y="470" font-size="30" font-weight="700" fill="#76b900">42 KB</text>
    <text x="200" y="494" font-size="12" fill="#667788">SINGLE HTML FILE</text>
    <text x="200" y="510" font-size="11" fill="#445566">0 dependencies</text>
    <text x="450" y="470" font-size="30" font-weight="700" fill="#00d4aa">109 s</text>
    <text x="450" y="494" font-size="12" fill="#667788">WALL CLOCK</text>
    <text x="450" y="510" font-size="11" fill="#445566">$0.0038</text>
    <text x="700" y="470" font-size="30" font-weight="700" fill="#b388ff">50%</text>
    <text x="700" y="494" font-size="12" fill="#667788">TOKENS THINKING</text>
    <text x="700" y="510" font-size="11" fill="#445566">13,698 of 27,131</text>
