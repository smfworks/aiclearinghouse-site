<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" width="1200" height="624">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#06141e"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00d4aa"/>
    </marker>
  </defs>
  <rect width="1200" height="624" fill="url(#bg)"/>
  <text x="48" y="52" fill="#e8eef4" font-family="'SF Pro Display', Helvetica, Arial, sans-serif" font-size="28" font-weight="700">Lock the bible before the GPU</text>
  <text x="48" y="82" fill="#5a8a6a" font-family="'SF Mono', Courier New, monospace" font-size="14">H3 long-form capture pack · continue / cut / fadeblack</text>
  <g font-family="'SF Mono', Courier New, monospace" font-size="13">
    <rect x="48" y="120" width="200" height="64" rx="6" fill="#122018" stroke="#76b900"/>
    <text x="148" y="148" text-anchor="middle" fill="#76b900">MAP</text>
    <text x="148" y="168" text-anchor="middle" fill="#e8eef4">clocks, not shots</text>
    <rect x="288" y="120" width="200" height="64" rx="6" fill="#122018" stroke="#00d4aa"/>
    <text x="388" y="148" text-anchor="middle" fill="#00d4aa">CARDS</text>
    <text x="388" y="168" text-anchor="middle" fill="#e8eef4">prop · face · look</text>
    <rect x="528" y="120" width="200" height="64" rx="6" fill="#122018" stroke="#ff9500"/>
    <text x="628" y="148" text-anchor="middle" fill="#ff9500">EDIT LIST</text>
    <text x="628" y="168" text-anchor="middle" fill="#e8eef4">one verb / row</text>
    <rect x="768" y="120" width="200" height="64" rx="6" fill="#122018" stroke="#76b900"/>
    <text x="868" y="148" text-anchor="middle" fill="#76b900">SMOKE</text>
    <text x="868" y="168" text-anchor="middle" fill="#e8eef4">hop-1 per take</text>
    <rect x="1008" y="120" width="144" height="64" rx="6" fill="#122018" stroke="#5a8a6a"/>
    <text x="1080" y="148" text-anchor="middle" fill="#5a8a6a">GPU</text>
    <text x="1080" y="168" text-anchor="middle" fill="#e8eef4">then</text>
  </g>
  <line x1="248" y1="152" x2="288" y2="152" stroke="#00d4aa" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="488" y1="152" x2="528" y2="152" stroke="#00d4aa" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="728" y1="152" x2="768" y2="152" stroke="#00d4aa" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="968" y1="152" x2="1008" y2="152" stroke="#00d4aa" stroke-width="2" marker-end="url(#arrowhead)"/>
  <g font-family="'SF Mono', Courier New, monospace" fill="#e8eef4">
    <text x="48" y="250" fill="#5a8a6a" font-size="12">THREE JOINS</text>
    <rect x="48" y="270" width="352" height="88" rx="6" fill="#0d1520" stroke="#1a2a3a"/>
    <text x="68" y="308" font-size="18" fill="#76b900">continue</text>
    <text x="68" y="336" font-size="13" fill="#666">Motion-Context hop · same room</text>
    <rect x="424" y="270" width="352" height="88" rx="6" fill="#0d1520" stroke="#1a2a3a"/>
    <text x="444" y="308" font-size="18" fill="#ff9500">cut</text>
    <text x="444" y="336" font-size="13" fill="#666">new T2V · no hold · chorus</text>
    <rect x="800" y="270" width="352" height="88" rx="6" fill="#0d1520" stroke="#1a2a3a"/>
    <text x="820" y="308" font-size="18" fill="#00d4aa">fadeblack</text>
    <text x="820" y="336" font-size="13" fill="#666">new take · 8 frames</text>
  </g>
  <g font-family="'SF Mono', Courier New, monospace" text-anchor="middle">
    <rect x="48" y="400" width="1104" height="176" rx="8" fill="#0d1520" stroke="#1a2a3a"/>
    <text x="200" y="448" font-size="12" fill="#5a8a6a">AXE RULE</text>
    <text x="200" y="488" font-size="22" fill="#e8eef4">pin, don't research</text>
    <text x="200" y="518" font-size="12" fill="#666">45 cm / 600 g / 10 cm</text>
    <text x="500" y="448" font-size="12" fill="#5a8a6a">CAMERA</text>
    <text x="500" y="488" font-size="22" fill="#e8eef4">one verb</text>
    <text x="500" y="518" font-size="12" fill="#666">type + amp + speed</text>
    <text x="800" y="448" font-size="12" fill="#5a8a6a">WINDOW</text>
    <text x="800" y="488" font-size="22" fill="#e8eef4">8.0 s</text>
    <text x="800" y="518" font-size="12" fill="#666">hits before fade</text>
    <text x="1050" y="448" font-size="12" fill="#5a8a6a">REPO</text>
    <text x="1050" y="488" font-size="18" fill="#76b900">MIT</text>
    <text x="1050" y="518" font-size="12" fill="#666">templates on GitHub</text>
  </g>
</svg>
