<?xml version="1.0" encoding="UTF-8"?>
<!-- Hero for "Hermes Agent Profiles" — no-text abstract: multiple isolated profile nodes (silos) on a shared Linux host, with gateway ports and swarm links. Navy #0a1628 / teal #0e7490 / gold #f59e0b / orange #ff6b00. Validates as well-formed XML. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Multiple isolated Hermes agent profile silos with memory, skills and gateway ports on a central Linux host, connected for swarm coordination">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="50%" stop-color="#0f1a2e"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="tealGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0e7490" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff6b00" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff6b00" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <pattern id="grid" patternUnits="userSpaceOnUse" width="40" height="40">
      <circle cx="20" cy="20" r="1" fill="#22d3ee" opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Central host rectangle (Linux box) -->
  <rect x="300" y="180" width="600" height="270" rx="12" fill="#1e2937" stroke="#334155" stroke-width="2" opacity="0.9"/>
  <!-- subtle grid inside host -->
  <rect x="310" y="190" width="580" height="250" fill="url(#grid)" opacity="0.4"/>

  <!-- Profile silos (isolated nodes) - left cluster teal -->
  <!-- Profile 1: liam -->
  <g transform="translate(380, 240)">
    <rect x="-45" y="-35" width="90" height="70" rx="8" fill="#0e7490" opacity="0.85"/>
    <rect x="-40" y="-30" width="80" height="60" rx="6" fill="#0f1a2e" stroke="#22d3ee" stroke-width="1.5" opacity="0.7"/>
    <!-- memory icon abstract -->
    <rect x="-25" y="-15" width="50" height="8" rx="2" fill="#22d3ee" opacity="0.6"/>
    <rect x="-25" y="0" width="35" height="6" rx="2" fill="#22d3ee" opacity="0.4"/>
    <!-- port label abstract -->
    <circle cx="25" cy="25" r="8" fill="#0a1628" stroke="#22d3ee" stroke-width="1.5"/>
  </g>

  <!-- Profile 2: another -->
  <g transform="translate(520, 240)">
    <rect x="-45" y="-35" width="90" height="70" rx="8" fill="#0e7490" opacity="0.75"/>
    <rect x="-40" y="-30" width="80" height="60" rx="6" fill="#0f1a2e" stroke="#22d3ee" stroke-width="1.5" opacity="0.6"/>
    <rect x="-25" y="-15" width="45" height="8" rx="2" fill="#22d3ee" opacity="0.5"/>
    <rect x="-25" y="0" width="30" height="6" rx="2" fill="#22d3ee" opacity="0.35"/>
    <circle cx="25" cy="25" r="8" fill="#0a1628" stroke="#22d3ee" stroke-width="1.5"/>
  </g>

  <!-- Gold cluster right for specialized e.g. research/publish -->
  <g transform="translate(660, 320)">
    <rect x="-45" y="-35" width="90" height="70" rx="8" fill="#f59e0b" opacity="0.8"/>
    <rect x="-40" y="-30" width="80" height="60" rx="6" fill="#0f1a2e" stroke="#ff6b00" stroke-width="1.5" opacity="0.65"/>
    <rect x="-25" y="-15" width="40" height="8" rx="2" fill="#ff6b00" opacity="0.55"/>
    <rect x="-25" y="0" width="28" height="6" rx="2" fill="#ff6b00" opacity="0.4"/>
    <circle cx="25" cy="25" r="8" fill="#0a1628" stroke="#ff6b00" stroke-width="1.5"/>
  </g>

  <g transform="translate(800, 320)">
    <rect x="-45" y="-35" width="90" height="70" rx="8" fill="#f59e0b" opacity="0.7"/>
    <rect x="-40" y="-30" width="80" height="60" rx="6" fill="#0f1a2e" stroke="#ff6b00" stroke-width="1.5" opacity="0.55"/>
    <rect x="-25" y="-15" width="38" height="8" rx="2" fill="#ff6b00" opacity="0.45"/>
    <circle cx="25" cy="25" r="8" fill="#0a1628" stroke="#ff6b00" stroke-width="1.5"/>
  </g>

  <!-- Faint swarm coordination links (dashed) -->
  <path d="M425 280 Q550 260 700 310" stroke="#22d3ee" stroke-width="1.5" fill="none" stroke-dasharray="4 6" opacity="0.35"/>
  <path d="M565 280 Q650 300 755 310" stroke="#ff6b00" stroke-width="1.5" fill="none" stroke-dasharray="4 6" opacity="0.3"/>
  <path d="M425 310 Q550 340 700 350" stroke="#1e3a8a" stroke-width="1" fill="none" stroke-dasharray="3 5" opacity="0.25"/>

  <!-- Central gateway / host symbol -->
  <g transform="translate(600, 380)">
    <rect x="-30" y="-15" width="60" height="30" rx="4" fill="#1e3a8a" stroke="#334155" stroke-width="1"/>
    <circle cx="-10" cy="0" r="4" fill="#22d3ee" opacity="0.8"/>
    <circle cx="10" cy="0" r="4" fill="#ff6b00" opacity="0.8"/>
  </g>

  <!-- Small isolated nodes upper for memory silos -->
  <g transform="translate(420, 150)">
    <circle cx="0" cy="0" r="18" fill="#0e7490" opacity="0.4"/>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.5"/>
  </g>
  <g transform="translate(780, 150)">
    <circle cx="0" cy="0" r="16" fill="#f59e0b" opacity="0.35"/>
    <circle cx="0" cy="0" r="9" fill="none" stroke="#ff6b00" stroke-width="2" opacity="0.45"/>
  </g>

  <!-- Subtle outer frame / isolation boundary -->
  <rect x="280" y="160" width="640" height="310" rx="16" fill="none" stroke="#1e3a8a" stroke-width="1.5" opacity="0.25" stroke-dasharray="8 12"/>
</svg>
