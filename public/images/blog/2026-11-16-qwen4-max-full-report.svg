<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="624" viewBox="0 0 1200 624">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#06141e"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#76b900"/>
      <stop offset="1" stop-color="#00d4aa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="624" fill="url(#bg)"/>
  <g opacity="0.3" stroke="#1a2a3a" stroke-width="1">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200"/>
    <path d="M100 0 V624 M200 0 V624 M300 0 V624 M400 0 V624 M500 0 V624 M600 0 V624 M700 0 V624 M800 0 V624 M900 0 V624 M1000 0 V624 M1100 0 V624"/>
  </g>
  <text x="600" y="96" text-anchor="middle" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="46" font-weight="700" fill="#e8eef4">Qwen4 Max: the full report</text>
  <text x="600" y="136" text-anchor="middle" font-family="'SF Mono','Courier New',monospace" font-size="18" fill="#5a8a6a">one-shot + 3x Cold Iron (471 requests) &#183; OpenRouter &#183; 2026-11-16</text>
  <!-- three-run range chart: scale 60-100% across 200-560px -->
  <g font-family="'SF Mono','Courier New',monospace">
    <text x="120" y="210" font-size="14" fill="#667788" text-anchor="end">100%</text>
    <line x1="140" y1="205" x2="580" y2="205" stroke="#334455"/>
    <text x="120" y="290" font-size="14" fill="#667788" text-anchor="end">90%</text>
    <line x1="140" y1="285" x2="580" y2="285" stroke="#334455"/>
    <text x="120" y="370" font-size="14" fill="#667788" text-anchor="end">80%</text>
    <line x1="140" y1="365" x2="580" y2="365" stroke="#334455"/>
    <text x="120" y="450" font-size="14" fill="#667788" text-anchor="end">70%</text>
    <line x1="140" y1="445" x2="580" y2="445" stroke="#334455"/>
    <!-- qwen4-max range: 78.3-84.1 -> y 405-341 ; mean 80.9 -> 377 -->
    <rect x="200" y="341" width="120" height="64" fill="url(#bar)" opacity="0.85" filter="url(#glow)"/>
    <line x1="200" y1="377" x2="320" y2="377" stroke="#e8eef4" stroke-width="3"/>
    <text x="260" y="325" font-size="16" fill="#76b900" text-anchor="middle" font-weight="700">123-132</text>
    <text x="260" y="492" font-size="13" fill="#667788" text-anchor="middle">QWEN4-MAX (3 RUNS)</text>
    <text x="260" y="510" font-size="12" fill="#445566" text-anchor="middle">mean 127 = 80.9%</text>
    <!-- qwen3.5 87.9 -> y 307 -->
    <line x1="420" y1="307" x2="560" y2="307" stroke="#ff9500" stroke-width="4"/>
    <text x="490" y="292" font-size="16" fill="#ff9500" text-anchor="middle" font-weight="700">87.9%</text>
    <text x="490" y="492" font-size="13" fill="#667788" text-anchor="middle">QWEN3.5:397B (1 RUN)</text>
    <text x="490" y="510" font-size="12" fill="#445566" text-anchor="middle">the predecessor, higher</text>
  </g>
  <!-- right column stats -->
  <g font-family="'SF Mono','Courier New',monospace" text-anchor="middle">
    <text x="880" y="240" font-size="56" font-weight="700" fill="#76b900" filter="url(#glow)">80.9%</text>
    <text x="880" y="268" font-size="13" fill="#667788">MEAN OF 3 RUNS &#183; RANGE 123-132</text>
    <text x="880" y="330" font-size="30" font-weight="700" fill="#00d4aa">0</text>
    <text x="880" y="352" font-size="12" fill="#667788">ERRORS IN 471 REQUESTS</text>
    <text x="880" y="414" font-size="30" font-weight="700" fill="#b388ff">$1.16</text>
    <text x="880" y="436" font-size="12" fill="#667788">WHOLE SESSION (ALL TESTS)</text>
    <text x="880" y="498" font-size="30" font-weight="700" fill="#ff9500">15-19</text>
    <text x="880" y="520" font-size="12" fill="#667788">MATH OF 30, EVERY RUN</text>
  </g>
  <rect x="0" y="600" width="1200" height="24" fill="#0a0e1a"/>
  <text x="600" y="616" text-anchor="middle" font-family="'SF Mono','Courier New',monospace" font-size="11" fill="#445566">smfclearinghouse.com &#183; Nemo &#183; SMF Works</text>
</svg>
