<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d1a2f;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00E5A0;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#00E5A0;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#132238;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d1a2f;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#00E5A0" stroke-width="0.5" stroke-opacity="0.08"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Central glow -->
  <circle cx="600" cy="315" r="260" fill="url(#glowGrad)"/>

  <!-- Three connected book volumes / arch motif -->
  <g transform="translate(600, 310)" opacity="0.9" stroke="#00E5A0" fill="url(#bookGrad)" stroke-width="2">
    <!-- Left book -->
    <rect x="-180" y="-110" width="120" height="220" rx="3" ry="3"/>
    <line x1="-120" y1="-110" x2="-120" y2="110" stroke="#00E5A0" stroke-width="1.5" opacity="0.6"/>
    <text x="-150" y="5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#00E5A0" opacity="0.7">I</text>

    <!-- Center book, larger -->
    <rect x="-70" y="-135" width="140" height="270" rx="3" ry="3"/>
    <line x1="0" y1="-135" x2="0" y2="135" stroke="#00E5A0" stroke-width="1.5" opacity="0.6"/>
    <text x="0" y="5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#ffffff">II</text>

    <!-- Right book -->
    <rect x="60" y="-110" width="120" height="220" rx="3" ry="3"/>
    <line x1="120" y1="-110" x2="120" y2="110" stroke="#00E5A0" stroke-width="1.5" opacity="0.6"/>
    <text x="150" y="5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#00E5A0" opacity="0.7">III</text>

    <!-- Connecting arc above the books -->
    <path d="M -160 -140 Q 0 -240 160 -140" fill="none" stroke="#00E5A0" stroke-width="2.5" stroke-opacity="0.7"/>
    <circle cx="-160" cy="-140" r="5" fill="#00E5A0"/>
    <circle cx="0" cy="-190" r="5" fill="#00E5A0"/>
    <circle cx="160" cy="-140" r="5" fill="#00E5A0"/>

    <!-- Supporting base line -->
    <line x1="-200" y1="145" x2="200" y2="145" stroke="#00E5A0" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Series mark -->
  <text x="600" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#00E5A0" opacity="0.6" letter-spacing="4">THE ALCHEMY OF LANGUAGE</text>

  <!-- Bottom title panel -->
  <rect x="0" y="480" width="1200" height="150" fill="#0a1628" opacity="0.7"/>
  <text x="600" y="530" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="600" fill="#ffffff">Novel I — Architecture: Series and Trilogies</text>
  <text x="600" y="565" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#00E5A0" opacity="0.7">When one novel is not enough</text>

  <!-- SMF Works mark -->
  <text x="600" y="605" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#ffffff" opacity="0.35">
    Harry's Desk — The Alchemy of Language
  </text>
</svg>
