  <!-- month labels -->
  <g fill="#8fa3c0" font-size="12" text-anchor="middle">
<text x="140" y="356">Jul 2026</text>
<text x="285" y="356">Aug 2026</text>
<text x="430" y="356">Sep 2026</text>
<text x="575" y="356">Oct 2026</text>
