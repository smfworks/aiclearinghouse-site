<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" width="1200" height="624">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#06141e"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#76b900" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#76b900" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="624" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g opacity="0.15" stroke="#1a3a5a" stroke-width="0.5">
    <line x1="0" y1="78" x2="1200" y2="78"/>
    <line x1="0" y1="156" x2="1200" y2="156"/>
    <line x1="0" y1="234" x2="1200" y2="234"/>
    <line x1="0" y1="312" x2="1200" y2="312"/>
    <line x1="0" y1="390" x2="1200" y2="390"/>
    <line x1="0" y1="468" x2="1200" y2="468"/>
    <line x1="0" y1="546" x2="1200" y2="546"/>
    <line x1="150" y1="0" x2="150" y2="624"/>
    <line x1="300" y1="0" x2="300" y2="624"/>
    <line x1="450" y1="0" x2="450" y2="624"/>
    <line x1="600" y1="0" x2="600" y2="624"/>
    <line x1="750" y1="0" x2="750" y2="624"/>
    <line x1="900" y1="0" x2="900" y2="624"/>
    <line x1="1050" y1="0" x2="1050" y2="624"/>
  </g>

  <!-- Left section: MoE Expert Grid -->
  <g transform="translate(60, 90)">
    <!-- Router label -->
    <text x="130" y="20" text-anchor="middle" fill="#5a8a6a" font-family="'SF Mono', 'Courier New', monospace" font-size="11" letter-spacing="2">ROUTER</text>
    <line x1="80" y1="28" x2="180" y2="28" stroke="#76b900" stroke-width="1" opacity="0.5"/>

    <!-- Expert grid: 8x4 = 32 experts, 3 active -->
    <g transform="translate(10, 45)">
      <!-- Row 1 -->
      <circle cx="20" cy="20" r="14" fill="#0d3b5c" stroke="#1a5a8a" stroke-width="1"/>
      <circle cx="55" cy="20" r="14" fill="#0d3b5c" stroke="#1a5a8a" stroke-width="1"/>
      <circle cx="90" cy="20" r="14" fill="#0d3b5c" stroke="#1a5a8a" stroke-width="1"/>
      <circle cx="125" cy="20" r="14" fill="#0d3b5c" stroke="#1a5a8a" stroke-width="1"/>
      <circle cx="160" cy="20" r="14" fill="#0d3b5c" stroke="#1a5a8a" stroke-width="1"/>
      <circle cx="195" cy="20" r="14" fill="#0d3b5c" stroke="#1a5a8a" stroke-width="1"/>
      <circle cx="230" cy="20" r="14" fill="#0d3b5c" stroke="#1a5a8a" stroke-width="1"/>
      <circle cx="265" cy="20" r="14" fill="#0d3b5c" stroke="#1a5a8a" stroke-width="1"/>
      <!-- Row 2 -->
      <circle cx="20" cy="55" r="14" fill="#0d3b5c" stroke="#1a5a8a" stroke-width="1"/>
      <circle cx="55" cy="55" r="14" fill="url(#greenGlow)" stroke="#76b900" stroke-width="1.5" filter="url(#softGlow)"/>
      <circle cx="90" cy="55" r="14" fill="#0d3b5c" stroke="#1a5a8a" stroke-width="1"/>
      <circle cx="125" cy="55" r="14" fill="#0d3b5c" stroke="#1a5a8a" stroke-width="1"/>
      <circle cx="160" cy="55" r="14" fill="#0d3b5c" stroke="#1a5a8a" stroke-width="1"/>
      <circle cx="195" cy="55" r="14" fill="#0d3b5c" stroke="#1a5a8a" stroke-width="1"/>
      <circle cx="230" cy="55" r="14" fill="#0d3b5c" stroke="#1a5a8a" stroke-width="1"/>
      <circle cx="265" cy="55" r="14" fill="#0d3b5c" stroke="#1a5a8a" stroke-width="1"/>
      <!-- Row 3 -->
      <circle cx="20" cy="90" r="14" fill="#0d3b5c" stroke="#1a5a8a" stroke-width="1"/>
      <circle cx="55" cy="90" r="14" fill="#0d3b5c" stroke="#1a5a8a" stroke-width="1"/>
      <circle cx="90" cy="90" r="14" fill="#0d3b5c" stroke="#1a5a8a" stroke-width="1"/>
      <circle cx="125" cy="90" r="14" fill="url(#greenGlow)" stroke="#76b900" stroke-width="1.5" filter="url(#softGlow)"/>
      <circle cx="160" cy="90" r="14" fill="#0d3b5c" stroke="#1a5a8a" stroke-width="1"/>
      <circle cx="195" cy="90" r="14" fill="#0d3b5c" stroke="#1a5a8a" stroke-width="1"/>
      <circle cx="230" cy="90" r="14" fill="#0d3b5c" stroke="#1a5a8a" stroke-width="1"/>
      <circle cx="265" cy="90" r="14" fill="#0d3b5c" stroke="#1a5a8a" stroke-width="1"/>
      <!-- Row 4 -->
      <circle cx="20" cy="125" r="14" fill="#0d3b5c" stroke="#1a5a8a" stroke-width="1"/>
      <circle cx="55" cy="125" r="14" fill="#0d3b5c" stroke="#1a5a8a" stroke-width="1"/>
      <circle cx="90" cy="125" r="14" fill="#0d3b5c" stroke="#1a5a8a" stroke-width="1"/>
      <circle cx="125" cy="125" r="14" fill="#0d3b5c" stroke="#1a5a8a" stroke-width="1"/>
      <circle cx="160" cy="125" r="14" fill="#0d3b5c" stroke="#1a5a8a" stroke-width="1"/>
      <circle cx="195" cy="125" r="14" fill="url(#greenGlow)" stroke="#76b900" stroke-width="1.5" filter="url(#softGlow)"/>
      <circle cx="230" cy="125" r="14" fill="#0d3b5c" stroke="#1a5a8a" stroke-width="1"/>
      <circle cx="265" cy="125" r="14" fill="#0d3b5c" stroke="#1a5a8a" stroke-width="1"/>
    </g>

    <!-- Label below grid -->
    <text x="150" y="215" text-anchor="middle" fill="#76b900" font-family="'SF Mono', 'Courier New', monospace" font-size="12" filter="url(#softGlow)">3 of 30B active</text>
  </g>

  <!-- Center: Mamba-Transformer pipeline -->
  <g transform="translate(420, 100)">
    <!-- Input -->
    <rect x="0" y="50" width="70" height="30" rx="4" fill="#0d2a4a" stroke="#2a6a9a" stroke-width="1"/>
    <text x="35" y="69" text-anchor="middle" fill="#6a9aba" font-family="'SF Mono', 'Courier New', monospace" font-size="10">INPUT</text>

    <!-- Arrow -->
    <line x1="72" y1="65" x2="90" y2="65" stroke="#3a7a5a" stroke-width="1.5" marker-end="url(#arrowhead)"/>

    <!-- Mamba-2 layer -->
    <rect x="95" y="35" width="75" height="60" rx="4" fill="#0d3b5c" stroke="#1a6a9a" stroke-width="1"/>
    <text x="132" y="60" text-anchor="middle" fill="#4a9aca" font-family="'SF Mono', 'Courier New', monospace" font-size="9">Mamba-2</text>
    <text x="132" y="75" text-anchor="middle" fill="#3a7a9a" font-family="'SF Mono', 'Courier New', monospace" font-size="8">linear-time</text>

    <!-- Arrow -->
    <line x1="172" y1="65" x2="190" y2="65" stroke="#3a7a5a" stroke-width="1.5" marker-end="url(#arrowhead)"/>

    <!-- MoE layer -->
    <rect x="195" y="35" width="75" height="60" rx="4" fill="#0d2a1a" stroke="#3a7a3a" stroke-width="1"/>
    <text x="232" y="55" text-anchor="middle" fill="#76b900" font-family="'SF Mono', 'Courier New', monospace" font-size="9">MoE</text>
    <text x="232" y="70" text-anchor="middle" fill="#5a9a3a" font-family="'SF Mono', 'Courier New', monospace" font-size="8">30B total</text>
    <text x="232" y="82" text-anchor="middle" fill="#5a9a3a" font-family="'SF Mono', 'Courier New', monospace" font-size="8">3B active</text>

    <!-- Arrow -->
    <line x1="272" y1="65" x2="290" y2="65" stroke="#3a7a5a" stroke-width="1.5" marker-end="url(#arrowhead)"/>

    <!-- Attention layer -->
    <rect x="295" y="35" width="75" height="60" rx="4" fill="#0d3b5c" stroke="#1a6a9a" stroke-width="1"/>
    <text x="332" y="60" text-anchor="middle" fill="#4a9aca" font-family="'SF Mono', 'Courier New', monospace" font-size="9">Attention</text>
    <text x="332" y="75" text-anchor="middle" fill="#3a7a9a" font-family="'SF Mono', 'Courier New', monospace" font-size="8">selective</text>

    <!-- Arrow -->
    <line x1="372" y1="65" x2="390" y2="65" stroke="#3a7a5a" stroke-width="1.5" marker-end="url(#arrowhead)"/>

    <!-- Output -->
    <rect x="395" y="50" width="70" height="30" rx="4" fill="#0d2a4a" stroke="#2a6a9a" stroke-width="1"/>
    <text x="430" y="69" text-anchor="middle" fill="#6a9aba" font-family="'SF Mono', 'Courier New', monospace" font-size="10">OUTPUT</text>

    <!-- DSpark label -->
    <rect x="150" y="110" width="170" height="22" rx="3" fill="#0d2a1a" stroke="#3a7a3a" stroke-width="0.5"/>
    <text x="235" y="125" text-anchor="middle" fill="#76b900" font-family="'SF Mono', 'Courier New', monospace" font-size="9" filter="url(#softGlow)">DSpark spec decode: 3 tokens</text>
  </g>

  <!-- Right section: Throughput meter -->
  <g transform="translate(960, 90)">
    <text x="0" y="15" fill="#5a8a6a" font-family="'SF Mono', 'Courier New', monospace" font-size="11" letter-spacing="1">THROUGHPUT</text>
    <line x1="0" y1="22" x2="120" y2="22" stroke="#76b900" stroke-width="1" opacity="0.5"/>

    <!-- Speed gauge -->
    <text x="0" y="80" fill="#76b900" font-family="'SF Mono', 'Courier New', monospace" font-size="48" font-weight="bold" filter="url(#glow)">244</text>
    <text x="100" y="80" fill="#5a8a6a" font-family="'SF Mono', 'Courier New', monospace" font-size="16">tok/s</text>

    <!-- Bar chart -->
    <g transform="translate(0, 100)">
      <rect x="0" y="0" width="180" height="8" rx="2" fill="#0d2a4a"/>
      <rect x="0" y="0" width="170" height="8" rx="2" fill="url(#greenGlow)" filter="url(#softGlow)"/>
      <text x="0" y="25" fill="#4a6a5a" font-family="'SF Mono', 'Courier New', monospace" font-size="9">OpenRouter free tier</text>
    </g>

    <!-- Local estimate -->
    <g transform="translate(0, 140)">
      <text x="0" y="0" fill="#3a6a8a" font-family="'SF Mono', 'Courier New', monospace" font-size="28" font-weight="bold">500+</text>
      <text x="75" y="0" fill="#3a6a5a" font-family="'SF Mono', 'Courier New', monospace" font-size="13">est. local</text>
      <rect x="0" y="12" width="180" height="8" rx="2" fill="#0d2a4a"/>
      <rect x="0" y="12" width="180" height="8" rx="2" fill="#0d3b5c" stroke="#1a5a8a" stroke-width="0.5" opacity="0.6"/>
      <text x="0" y="37" fill="#4a6a5a" font-family="'SF Mono', 'Courier New', monospace" font-size="9">DGX Spark + DSpark (projected)</text>
    </g>
  </g>

  <!-- Title block -->
  <g transform="translate(60, 350)">
    <text x="0" y="0" fill="#e8eef4" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="bold">Nemotron 3.5 Lightning</text>
    <text x="0" y="30" fill="#76b900" font-family="'SF Mono', 'Courier New', monospace" font-size="14" filter="url(#softGlow)">30B MoE · 3B active · Mamba-2 hybrid · NVFP4 · 1M context</text>
  </g>

  <!-- Bottom stats bar -->
  <g transform="translate(0, 440)">
    <rect x="0" y="0" width="1200" height="80" fill="#06121e" opacity="0.8"/>
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#76b900" stroke-width="1" opacity="0.3"/>

    <!-- Stat 1 -->
    <g transform="translate(50, 15)">
      <text x="0" y="12" fill="#5a8a6a" font-family="'SF Mono', 'Courier New', monospace" font-size="9" letter-spacing="1">PARAMS</text>
      <text x="0" y="35" fill="#e8eef4" font-family="'SF Mono', 'Courier New', monospace" font-size="20" font-weight="bold">30B / 3B</text>
      <text x="0" y="52" fill="#4a6a5a" font-family="'SF Mono', 'Courier New', monospace" font-size="9">total / active</text>
    </g>

    <!-- Stat 2 -->
    <g transform="translate(220, 15)">
      <text x="0" y="12" fill="#5a8a6a" font-family="'SF Mono', 'Courier New', monospace" font-size="9" letter-spacing="1">CONTEXT</text>
      <text x="0" y="35" fill="#e8eef4" font-family="'SF Mono', 'Courier New', monospace" font-size="20" font-weight="bold">1M</text>
      <text x="0" y="52" fill="#4a6a5a" font-family="'SF Mono', 'Courier New', monospace" font-size="9">tokens</text>
    </g>

    <!-- Stat 3 -->
    <g transform="translate(360, 15)">
      <text x="0" y="12" fill="#5a8a6a" font-family="'SF Mono', 'Courier New', monospace" font-size="9" letter-spacing="1">THROUGHPUT</text>
      <text x="0" y="35" fill="#76b900" font-family="'SF Mono', 'Courier New', monospace" font-size="20" font-weight="bold" filter="url(#softGlow)">244 tok/s</text>
      <text x="0" y="52" fill="#4a6a5a" font-family="'SF Mono', 'Courier New', monospace" font-size="9">OpenRouter free</text>
    </g>

    <!-- Stat 4 -->
    <g transform="translate(570, 15)">
      <text x="0" y="12" fill="#5a8a6a" font-family="'SF Mono', 'Courier New', monospace" font-size="9" letter-spacing="1">REASONING</text>
      <text x="0" y="35" fill="#e8eef4" font-family="'SF Mono', 'Courier New', monospace" font-size="20" font-weight="bold">6/8</text>
      <text x="0" y="52" fill="#4a6a5a" font-family="'SF Mono', 'Courier New', monospace" font-size="9">tests passed</text>
    </g>

    <!-- Stat 5 -->
    <g transform="translate(720, 15)">
      <text x="0" y="12" fill="#5a8a6a" font-family="'SF Mono', 'Courier New', monospace" font-size="9" letter-spacing="1">TOOL CALLS</text>
      <text x="0" y="35" fill="#e8eef4" font-family="'SF Mono', 'Courier New', monospace" font-size="20" font-weight="bold">PASS</text>
      <text x="0" y="52" fill="#4a6a5a" font-family="'SF Mono', 'Courier New', monospace" font-size="9">single-tool</text>
    </g>

    <!-- Stat 6 -->
    <g transform="translate(870, 15)">
      <text x="0" y="12" fill="#5a8a6a" font-family="'SF Mono', 'Courier New', monospace" font-size="9" letter-spacing="1">LICENSE</text>
      <text x="0" y="35" fill="#e8eef4" font-family="'SF Mono', 'Courier New', monospace" font-size="20" font-weight="bold">OpenMDW</text>
      <text x="0" y="52" fill="#4a6a5a" font-family="'SF Mono', 'Courier New', monospace" font-size="9">commercial use</text>
    </g>

    <!-- Stat 7 -->
    <g transform="translate(1040, 15)">
      <text x="0" y="12" fill="#5a8a6a" font-family="'SF Mono', 'Courier New', monospace" font-size="9" letter-spacing="1">CONCURRENCY</text>
      <text x="0" y="35" fill="#e8eef4" font-family="'SF Mono', 'Courier New', monospace" font-size="20" font-weight="bold">8/8</text>
      <text x="0" y="52" fill="#4a6a5a" font-family="'SF Mono', 'Courier New', monospace" font-size="9">launch day</text>
    </g>
  </g>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3a7a5a"/>
    </marker>
  </defs>
</svg>