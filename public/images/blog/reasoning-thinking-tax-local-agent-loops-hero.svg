<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="55%" stop-color="#0d1b2e"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ff6b00" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="navy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient glow orbs -->
  <circle cx="250" cy="180" r="190" fill="url(#gold)" filter="url(#blur)" opacity="0.30"/>
  <circle cx="980" cy="470" r="210" fill="url(#teal)" filter="url(#blur)" opacity="0.28"/>
  <circle cx="600" cy="315" r="150" fill="url(#navy)" filter="url(#blur)" opacity="0.30"/>

  <!-- Blueprint grid -->
  <g stroke="#13243d" stroke-width="1" opacity="0.5">
    <line x1="0" y1="158" x2="1200" y2="158"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472" x2="1200" y2="472"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- LEFT: reasoning cloud (thinking) — dense, tangled -->
  <g transform="translate(300, 250)" opacity="0.92">
    <!-- outer cloud ring -->
    <circle r="118" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.45" filter="url(#soft)"/>
    <circle r="98" fill="none" stroke="#ff6b00" stroke-width="1" opacity="0.35"/>
    <!-- tangled CoT threads -->
    <path d="M -90,-40 C -60,-70 -20,-30 -50,10 C -80,50 -30,80 10,50 C 50,20 30,-50 -10,-70 C -50,-90 60,-60 80,-20 C 100,20 60,70 20,80" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.55"/>
    <path d="M -70,20 C -40,-10 0,30 -20,60 C -40,90 20,40 50,10 C 80,-20 40,-60 0,-40" fill="none" stroke="#ff6b00" stroke-width="1.2" opacity="0.45"/>
    <path d="M -40,-60 C 0,-80 40,-40 20,0 C 0,40 60,20 70,-20" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.4"/>
    <!-- nodes -->
    <circle cx="-70" cy="-30" r="4" fill="#f59e0b" opacity="0.8"/>
    <circle cx="40" cy="-50" r="3.5" fill="#ff6b00" opacity="0.7"/>
    <circle cx="60" cy="40" r="4" fill="#f59e0b" opacity="0.75"/>
    <circle cx="-30" cy="60" r="3" fill="#ff6b00" opacity="0.6"/>
    <circle cx="0" cy="0" r="6" fill="#0a1628" stroke="#f59e0b" stroke-width="2"/>
  </g>

  <!-- CENTER: throughput meter / tax gauge -->
  <g transform="translate(600, 315)">
    <!-- gauge arc background -->
    <path d="M -150,0 A 150,150 0 0,1 150,0" fill="none" stroke="#13243d" stroke-width="16" stroke-linecap="round"/>
    <!-- gauge arc fill (gold, ~70%) -->
    <path d="M -150,0 A 150,150 0 0,1 110,-102" fill="none" stroke="url(#gold)" stroke-width="16" stroke-linecap="round" opacity="0.9"/>
    <!-- needle -->
    <line x1="0" y1="0" x2="92" y2="-78" stroke="#f2f2f5" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <circle r="9" fill="#0a1628" stroke="#f59e0b" stroke-width="2.5"/>
    <!-- tick marks -->
    <g stroke="#3b5478" stroke-width="2" opacity="0.7">
      <line x1="-150" y1="0" x2="-138" y2="0"/>
      <line x1="-106" y1="-106" x2="-97" y2="-97"/>
      <line x1="0" y1="-150" x2="0" y2="-138"/>
      <line x1="106" y1="-106" x2="97" y2="-97"/>
      <line x1="150" y1="0" x2="138" y2="0"/>
    </g>
  </g>

  <!-- RIGHT: direct-answer path (no thinking) — clean single arrow -->
  <g transform="translate(900, 250)" opacity="0.92">
    <circle r="118" fill="none" stroke="#0e7490" stroke-width="1.5" opacity="0.4" filter="url(#soft)"/>
    <circle r="98" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.3"/>
    <!-- clean direct arrow -->
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <polygon points="80,0 64,-12 64,12" fill="#06b6d4" opacity="0.85"/>
    <!-- input node -->
    <circle cx="-80" cy="0" r="8" fill="#0a1628" stroke="#0e7490" stroke-width="2.5"/>
    <!-- output node -->
    <circle cx="80" cy="0" r="8" fill="#0a1628" stroke="#06b6d4" stroke-width="2.5"/>
    <!-- small ticks indicating speed -->
    <g stroke="#0e7490" stroke-width="2" opacity="0.5" stroke-linecap="round">
      <line x1="-40" y1="-18" x2="-30" y2="-18"/>
      <line x1="-20" y1="-18" x2="-10" y2="-18"/>
      <line x1="0" y1="-18" x2="10" y2="-18"/>
      <line x1="-40" y1="18" x2="-30" y2="18"/>
      <line x1="-20" y1="18" x2="-10" y2="18"/>
      <line x1="0" y1="18" x2="10" y2="18"/>
    </g>
  </g>

  <!-- Connecting flow lines: reasoning cloud -> gauge -> direct path -->
  <g stroke="#3b5478" stroke-width="1.5" opacity="0.45" stroke-dasharray="6 6">
    <line x1="418" y1="250" x2="450" y2="315"/>
    <line x1="750" y1="315" x2="782" y2="250"/>
  </g>

  <!-- Bottom accent bar -->
  <rect x="0" y="618" width="1200" height="12" fill="url(#gold)" opacity="0.55"/>
</svg>