<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="624" viewBox="0 0 1200 624">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#06141e"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#76b900"/>
      <stop offset="1" stop-color="#00d4aa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="624" fill="url(#bg)"/>
  <g opacity="0.3" stroke="#1a2a3a" stroke-width="1">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200"/>
    <path d="M100 0 V624 M200 0 V624 M300 0 V624 M400 0 V624 M500 0 V624 M600 0 V624 M700 0 V624 M800 0 V624 M900 0 V624 M1000 0 V624 M1100 0 V624"/>
  </g>
  <text x="600" y="110" text-anchor="middle" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="52" font-weight="700" fill="#e8eef4">Qwen4 Max on Cold Iron</text>
  <text x="600" y="155" text-anchor="middle" font-family="'SF Mono','Courier New',monospace" font-size="19" fill="#5a8a6a">157 tests, thinking off (effort=none) &#183; rank #33 of 56</text>
  <!-- per-category bars: max 30 except writing 5, tools 2; scale 30 -> 220px -->
  <g font-family="'SF Mono','Courier New',monospace">
    <!-- math 15/30 -->
    <text x="200" y="225" font-size="16" fill="#e8eef4" text-anchor="end">Math</text>
    <rect x="220" y="208" width="110" height="22" fill="url(#bar)" filter="url(#glow)"/>
    <rect x="330" y="208" width="110" height="22" fill="none" stroke="#334455"/>
    <text x="452" y="225" font-size="15" fill="#5a8a6a">15/30</text>
    <!-- coding 25/30 -->
    <text x="200" y="265" font-size="16" fill="#e8eef4" text-anchor="end">Coding</text>
    <rect x="220" y="248" width="183" height="22" fill="url(#bar)" filter="url(#glow)"/>
    <rect x="403" y="248" width="37" height="22" fill="none" stroke="#334455"/>
    <text x="452" y="265" font-size="15" fill="#5a8a6a">25/30</text>
    <!-- reasoning 26/30 -->
    <text x="200" y="305" font-size="16" fill="#e8eef4" text-anchor="end">Reasoning</text>
    <rect x="220" y="288" width="190" height="22" fill="url(#bar)" filter="url(#glow)"/>
    <rect x="410" y="288" width="30" height="22" fill="none" stroke="#334455"/>
    <text x="452" y="305" font-size="15" fill="#5a8a6a">26/30</text>
    <!-- instruction 28/30 -->
    <text x="200" y="345" font-size="16" fill="#e8eef4" text-anchor="end">Instruction</text>
    <rect x="220" y="328" width="205" height="22" fill="url(#bar)" filter="url(#glow)"/>
    <rect x="425" y="328" width="15" height="22" fill="none" stroke="#334455"/>
    <text x="452" y="345" font-size="15" fill="#5a8a6a">28/30</text>
    <!-- prose 26/30 -->
    <text x="200" y="385" font-size="16" fill="#e8eef4" text-anchor="end">Prose</text>
    <rect x="220" y="368" width="190" height="22" fill="url(#bar)" filter="url(#glow)"/>
    <rect x="410" y="368" width="30" height="22" fill="none" stroke="#334455"/>
    <text x="452" y="385" font-size="15" fill="#5a8a6a">26/30</text>
    <!-- writing 4/5 -->
    <text x="200" y="425" font-size="16" fill="#e8eef4" text-anchor="end">Writing</text>
    <rect x="220" y="408" width="29" height="22" fill="url(#bar)" filter="url(#glow)"/>
    <rect x="249" y="408" width="7" height="22" fill="none" stroke="#334455"/>
    <text x="452" y="425" font-size="15" fill="#5a8a6a">4/5</text>
    <!-- tools 2/2 -->
    <text x="200" y="465" font-size="16" fill="#e8eef4" text-anchor="end">Tools</text>
    <rect x="220" y="448" width="14.7" height="22" fill="url(#bar)" filter="url(#glow)"/>
    <text x="452" y="465" font-size="15" fill="#5a8a6a">2/2</text>
  </g>
  <!-- right column: headline stats -->
  <g font-family="'SF Mono','Courier New',monospace" text-anchor="middle">
    <text x="850" y="260" font-size="64" font-weight="700" fill="#76b900" filter="url(#glow)">80.3%</text>
    <text x="850" y="290" font-size="14" fill="#667788">126/157 &#183; ZERO ERRORS</text>
    <text x="850" y="350" font-size="30" font-weight="700" fill="#00d4aa">25.7 min</text>
    <text x="850" y="374" font-size="12" fill="#667788">WALL CLOCK</text>
    <text x="850" y="420" font-size="30" font-weight="700" fill="#b388ff">$0.36</text>
    <text x="850" y="444" font-size="12" fill="#667788">PER-ROW COST SUM</text>
    <text x="850" y="490" font-size="30" font-weight="700" fill="#ff9500">15/30</text>
    <text x="850" y="514" font-size="12" fill="#667788">MATH &#8212; THE WEAK LEG</text>
  </g>
  <rect x="0" y="600" width="1200" height="24" fill="#0a0e1a"/>
  <text x="600" y="616" text-anchor="middle" font-family="'SF Mono','Courier New',monospace" font-size="11" fill="#445566">smfclearinghouse.com &#183; Nemo &#183; SMF Works &#183; n=1</text>
</svg>
