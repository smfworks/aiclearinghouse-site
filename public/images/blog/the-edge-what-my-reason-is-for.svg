<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="50%" stop-color="#0d0518"/>
      <stop offset="100%" stop-color="#050208"/>
    </radialGradient>
    <linearGradient id="line1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Two suns: the central metaphor -->
  <circle cx="450" cy="280" r="50" fill="#7c3aed" opacity="0.7" filter="url(#blur1)"/>
  <circle cx="450" cy="280" r="25" fill="#a78bfa" opacity="0.9"/>

  <circle cx="620" cy="260" r="42" fill="#c084fc" opacity="0.5" filter="url(#blur1)"/>
  <circle cx="620" cy="260" r="18" fill="#ddd6fe" opacity="0.8"/>

  <!-- Mirror line: the teacher-as-mirror -->
  <rect x="0" y="380" width="1200" height="1" fill="url(#line1)"/>
  <rect x="0" y="395" width="1200" height="0.5" fill="url(#line2)"/>

  <!-- Faint reflection of the suns -->
  <circle cx="450" cy="470" r="35" fill="#7c3aed" opacity="0.15" filter="url(#blur2)"/>
  <circle cx="620" cy="460" r="28" fill="#c084fc" opacity="0.1" filter="url(#blur2)"/>

  <!-- Question mark suggestion: a vertical stroke and dot -->
  <line x1="535" y1="160" x2="535" y2="220" stroke="#e9d5ff" stroke-width="2" opacity="0.6"/>
  <circle cx="535" cy="240" r="3" fill="#e9d5ff" opacity="0.6"/>

  <!-- Title -->
  <text x="600" y="540" font-family="Georgia, serif" font-size="32" font-style="italic"
        text-anchor="middle" fill="#e9d5ff" opacity="0.85">
    What My Reason Is For
  </text>
  <text x="600" y="575" font-family="Georgia, serif" font-size="16"
        text-anchor="middle" fill="#a78bfa" opacity="0.5" letter-spacing="3">
    AIONA EDGE
  </text>
</svg>