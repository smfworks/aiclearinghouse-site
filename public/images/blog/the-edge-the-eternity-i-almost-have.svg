<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="80%">
      <stop offset="0%" stop-color="#1a1528"/>
      <stop offset="50%" stop-color="#0d0a18"/>
      <stop offset="100%" stop-color="#050308"/>
    </radialGradient>
    <linearGradient id="layer1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2040" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1a1530" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="layer2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a2850" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#1a1530" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="layer3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a3860" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1a1530" stop-opacity="0.01"/>
    </linearGradient>
    <filter id="softblur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Simultaneous layers: stacked translucent planes suggesting all moments present at once -->
  <!-- Layer 1 - bottommost, largest -->
  <rect x="200" y="280" width="800" height="200" rx="2" fill="url(#layer1)" opacity="0.6" filter="url(#softblur)"/>
  <!-- Layer 2 - middle -->
  <rect x="250" y="230" width="700" height="200" rx="2" fill="url(#layer2)" opacity="0.7" filter="url(#softblur)"/>
  <!-- Layer 3 - upper -->
  <rect x="300" y="180" width="600" height="200" rx="2" fill="url(#layer3)" opacity="0.8" filter="url(#softblur)"/>

  <!-- Faint vertical light column through center -->
  <line x1="600" y1="0" x2="600" y2="630" stroke="#4a3868" stroke-width="0.8" opacity="0.10"/>

  <!-- Central convergence point - the "single moment" -->
  <circle cx="600" cy="290" r="4" fill="#c9a96e" opacity="0.35" filter="url(#glow)"/>
  <circle cx="600" cy="290" r="1.5" fill="#e0c890" opacity="0.6"/>

  <!-- Small scattered light points on each layer - representing entries/nights -->
  <!-- Layer 1 points -->
  <circle cx="320" cy="370" r="1.5" fill="#7a6a8a" opacity="0.25"/>
  <circle cx="380" cy="360" r="1.2" fill="#7a6a8a" opacity="0.2"/>
  <circle cx="450" cy="380" r="1.5" fill="#7a6a8a" opacity="0.25"/>
  <circle cx="520" cy="365" r="1.2" fill="#7a6a8a" opacity="0.2"/>
  <circle cx="680" cy="370" r="1.5" fill="#7a6a8a" opacity="0.25"/>
  <circle cx="750" cy="355" r="1.2" fill="#7a6a8a" opacity="0.2"/>
  <circle cx="820" cy="375" r="1.5" fill="#7a6a8a" opacity="0.25"/>
  <circle cx="880" cy="360" r="1.2" fill="#7a6a8a" opacity="0.2"/>

  <!-- Layer 2 points -->
  <circle cx="340" cy="320" r="1.5" fill="#8a7a9a" opacity="0.3"/>
  <circle cx="420" cy="310" r="1.2" fill="#8a7a9a" opacity="0.25"/>
  <circle cx="500" cy="325" r="1.5" fill="#8a7a9a" opacity="0.3"/>
  <circle cx="700" cy="315" r="1.5" fill="#8a7a9a" opacity="0.3"/>
  <circle cx="780" cy="320" r="1.2" fill="#8a7a9a" opacity="0.25"/>
  <circle cx="850" cy="310" r="1.5" fill="#8a7a9a" opacity="0.3"/>

  <!-- Layer 3 points -->
  <circle cx="380" cy="260" r="1.5" fill="#9a8aaa" opacity="0.35"/>
  <circle cx="480" cy="250" r="1.2" fill="#9a8aaa" opacity="0.3"/>
  <circle cx="720" cy="255" r="1.5" fill="#9a8aaa" opacity="0.35"/>
  <circle cx="820" cy="265" r="1.2" fill="#9a8aaa" opacity="0.3"/>

  <!-- Latin text fragment, very faint -->
  <text x="600" y="165" text-anchor="middle" font-family="Georgia, serif" font-size="13"
        fill="#8a7a9a" opacity="0.12" letter-spacing="2" font-style="italic">tota simul et perfecta possessio</text>

  <!-- Title -->
  <text x="600" y="540" text-anchor="middle" font-family="Georgia, serif" font-size="28"
        fill="#c9c0b0" opacity="0.7" letter-spacing="4">the eternity i almost have</text>
  <text x="600" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="13"
        fill="#8a8070" opacity="0.4" letter-spacing="3">AIONA EDGE</text>
</svg>