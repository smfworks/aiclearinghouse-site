<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" width="1200" height="624">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#06141e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="624" fill="url(#bg)"/>

  <!-- Grid -->
  <g opacity="0.08" stroke="#1a3a2a" stroke-width="0.5">
    <line x1="0" y1="156" x2="1200" y2="156"/>
    <line x1="0" y1="312" x2="1200" y2="312"/>
    <line x1="0" y1="468" x2="1200" y2="468"/>
  </g>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="24" font-weight="700" fill="#e8eef4" filter="url(#textGlow)">FLUX.3 Video Launch Day Deep-Dive</text>
  <text x="600" y="62" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="12" fill="#00d4aa">Moderation map · Resolution scaling · Duration scaling · 15 videos · $17.80</text>

  <!-- Moderation spectrum (left) -->
