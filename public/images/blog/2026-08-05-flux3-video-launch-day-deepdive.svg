      <line x1="260" y1="25" x2="260" y2="32" stroke="#76b900" stroke-width="1"/>
      <text x="260" y="42" text-anchor="middle">Drill</text>
      <line x1="325" y1="25" x2="325" y2="32" stroke="#76b900" stroke-width="1"/>
      <text x="325" y="42" text-anchor="middle">March</text>
      <line x1="370" y1="25" x2="370" y2="32" stroke="#76b900" stroke-width="1"/>
      <text x="370" y="42" text-anchor="middle">Buildup</text>
      <line x1="415" y1="25" x2="415" y2="32" stroke="#76b900" stroke-width="1"/>
      <text x="415" y="42" text-anchor="middle">Charge</text>
      <line x1="460" y1="25" x2="460" y2="32" stroke="#ff4444" stroke-width="1.5"/>
