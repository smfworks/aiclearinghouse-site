<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3a"/>
    </linearGradient>
    <linearGradient id="goldBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ff6b00"/>
    </linearGradient>
    <linearGradient id="tealBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="blueBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g opacity="0.06" stroke="#3b82f6" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- ledger rows — abstract representation of structured call records -->
  <!-- Row 1 -->
  <g filter="url(#glow)">
    <rect x="80" y="120" width="180" height="8" rx="4" fill="url(#goldBar)"/>
    <rect x="280" y="120" width="120" height="8" rx="4" fill="url(#tealBar)"/>
    <rect x="420" y="120" width="300" height="8" rx="4" fill="url(#blueBar)" opacity="0.5"/>
    <rect x="740" y="120" width="60" height="8" rx="4" fill="#f59e0b" opacity="0.7"/>
  </g>

  <!-- Row 2 -->
  <g filter="url(#glow)">
    <rect x="80" y="175" width="220" height="8" rx="4" fill="url(#goldBar)" opacity="0.8"/>
    <rect x="320" y="175" width="90" height="8" rx="4" fill="url(#tealBar)"/>
    <rect x="430" y="175" width="200" height="8" rx="4" fill="url(#blueBar)" opacity="0.6"/>
    <rect x="650" y="175" width="40" height="8" rx="4" fill="#ef4444" opacity="0.6"/>
  </g>

  <!-- Row 3 — longer, success -->
  <g filter="url(#glow)">
    <rect x="80" y="230" width="140" height="8" rx="4" fill="url(#goldBar)" opacity="0.9"/>
    <rect x="240" y="230" width="160" height="8" rx="4" fill="url(#tealBar)"/>
    <rect x="420" y="230" width="380" height="8" rx="4" fill="url(#blueBar)" opacity="0.7"/>
    <rect x="820" y="230" width="70" height="8" rx="4" fill="#f59e0b" opacity="0.8"/>
  </g>

  <!-- Row 4 — retry / anomaly indicator -->
  <g filter="url(#glow)">
    <rect x="80" y="285" width="200" height="8" rx="4" fill="url(#goldBar)" opacity="0.6"/>
    <rect x="300" y="285" width="100" height="8" rx="4" fill="url(#tealBar)" opacity="0.5"/>
    <rect x="420" y="285" width="50" height="8" rx="4" fill="#ef4444" opacity="0.5"/>
    <rect x="490" y="285" width="180" height="8" rx="4" fill="url(#goldBar)" opacity="0.5"/>
    <rect x="690" y="285" width="110" height="8" rx="4" fill="url(#tealBar)" opacity="0.6"/>
    <rect x="820" y="285" width="240" height="8" rx="4" fill="url(#blueBar)" opacity="0.4"/>
  </g>

  <!-- Row 5 -->
  <g filter="url(#glow)">
    <rect x="80" y="340" width="160" height="8" rx="4" fill="url(#goldBar)" opacity="0.85"/>
    <rect x="260" y="340" width="140" height="8" rx="4" fill="url(#tealBar)"/>
    <rect x="420" y="340" width="320" height="8" rx="4" fill="url(#blueBar)" opacity="0.55"/>
    <rect x="760" y="340" width="50" height="8" rx="4" fill="#f59e0b" opacity="0.6"/>
  </g>

  <!-- Row 6 — failure -->
  <g filter="url(#glow)">
    <rect x="80" y="395" width="100" height="8" rx="4" fill="url(#goldBar)" opacity="0.5"/>
    <rect x="200" y="395" width="80" height="8" rx="4" fill="url(#tealBar)" opacity="0.4"/>
    <rect x="300" y="395" width="30" height="8" rx="4" fill="#ef4444" opacity="0.8"/>
  </g>

  <!-- Row 7 — recovery -->
  <g filter="url(#glow)">
    <rect x="80" y="450" width="180" height="8" rx="4" fill="url(#goldBar)" opacity="0.7"/>
    <rect x="280" y="450" width="130" height="8" rx="4" fill="url(#tealBar)" opacity="0.8"/>
    <rect x="430" y="450" width="340" height="8" rx="4" fill="url(#blueBar)" opacity="0.65"/>
    <rect x="790" y="450" width="60" height="8" rx="4" fill="#f59e0b" opacity="0.7"/>
  </g>

  <!-- Row 8 -->
  <g filter="url(#glow)">
    <rect x="80" y="505" width="240" height="8" rx="4" fill="url(#goldBar)"/>
    <rect x="340" y="505" width="110" height="8" rx="4" fill="url(#tealBar)" opacity="0.9"/>
    <rect x="470" y="505" width="260" height="8" rx="4" fill="url(#blueBar)" opacity="0.5"/>
    <rect x="750" y="505" width="45" height="8" rx="4" fill="#f59e0b" opacity="0.5"/>
  </g>

  <!-- accent nodes — call boundary markers -->
  <g fill="#f59e0b" opacity="0.9">
    <circle cx="72" cy="124" r="4"/>
    <circle cx="72" cy="179" r="4"/>
    <circle cx="72" cy="234" r="4"/>
    <circle cx="72" cy="289" r="4"/>
    <circle cx="72" cy="344" r="4"/>
    <circle cx="72" cy="399" r="4"/>
    <circle cx="72" cy="454" r="4"/>
    <circle cx="72" cy="509" r="4"/>
  </g>

  <!-- vertical accent line connecting markers -->
  <line x1="72" y1="100" x2="72" y2="520" stroke="#f59e0b" stroke-width="1.5" opacity="0.3"/>

  <!-- right-side status dots -->
  <g>
    <circle cx="1060" cy="124" r="5" fill="#10b981" opacity="0.8"/>
    <circle cx="1060" cy="179" r="5" fill="#ef4444" opacity="0.7"/>
    <circle cx="1060" cy="234" r="5" fill="#10b981" opacity="0.8"/>
    <circle cx="1060" cy="289" r="5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="1060" cy="344" r="5" fill="#10b981" opacity="0.8"/>
    <circle cx="1060" cy="399" r="5" fill="#ef4444" opacity="0.7"/>
    <circle cx="1060" cy="454" r="5" fill="#10b981" opacity="0.8"/>
    <circle cx="1060" cy="509" r="5" fill="#10b981" opacity="0.8"/>
  </g>

  <!-- bottom accent bar -->
  <rect x="80" y="570" width="1040" height="3" rx="1.5" fill="url(#goldBar)" opacity="0.4"/>
</svg>