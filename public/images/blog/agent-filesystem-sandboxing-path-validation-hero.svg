<?xml version="1.0" encoding="UTF-8"?>
<!-- Hero for "Sandboxing Agent Filesystem Access" — no-text abstract:
     A central sandbox boundary (dashed teal rectangle) containing safe
     file operations (teal read blocks, gold draft blocks). Outside the
     boundary: rejected paths shown as red/orange X-marked tokens
     (traversal attempts, absolute paths, symlink escapes). Navy palette.
     Validates as XML. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Sandbox boundary containing safe file operations, with rejected traversal and absolute path attempts blocked outside">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="55%" stop-color="#0f1a2e"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="readGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.50"/>
    </linearGradient>
    <linearGradient id="draftGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="rejectGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#ff6b00" stop-opacity="0.50"/>
    </linearGradient>
    <linearGradient id="sandboxGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0e7490" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- decorative grid frame -->
  <g stroke="#162236" stroke-width="2">
    <line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="1120" y1="0" x2="1120" y2="630"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
  </g>

  <!-- ambient glow behind sandbox -->
  <rect x="200" y="120" width="560" height="400" fill="url(#sandboxGlow)" filter="url(#blur)"/>

  <!-- ===== Sandbox boundary (dashed teal rectangle) ===== -->
  <g stroke="#22d3ee" stroke-width="2.5" stroke-dasharray="10 6" fill="none" opacity="0.55">
    <rect x="220" y="140" width="520" height="360" rx="10"/>
  </g>
  <g stroke="#0e7490" stroke-width="1.5" stroke-dasharray="10 6" fill="none" opacity="0.30">
    <rect x="220" y="140" width="520" height="360" rx="10"/>
  </g>

  <!-- ===== Safe operations inside sandbox ===== -->
  <!-- Read operation (teal) row 1 -->
  <g transform="translate(260, 180)">
    <rect x="0" y="0" width="440" height="54" rx="6" fill="url(#readGrad)"/>
    <rect x="0" y="0" width="440" height="54" rx="6" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.40"/>
    <g fill="#0a1628" opacity="0.22">
      <rect x="20" y="14" width="120" height="26" rx="3"/>
      <rect x="156" y="14" width="80" height="26" rx="3"/>
      <rect x="252" y="14" width="160" height="26" rx="3"/>
    </g>
  </g>

  <!-- Read operation (teal) row 2 -->
  <g transform="translate(260, 250)">
    <rect x="0" y="0" width="380" height="54" rx="6" fill="url(#readGrad)"/>
    <rect x="0" y="0" width="380" height="54" rx="6" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.40"/>
    <g fill="#0a1628" opacity="0.22">
      <rect x="20" y="14" width="60" height="26" rx="3"/>
      <rect x="96" y="14" width="100" height="26" rx="3"/>
      <rect x="212" y="14" width="140" height="26" rx="3"/>
    </g>
  </g>

  <!-- Draft operation (gold) row 3 -->
  <g transform="translate(260, 320)">
    <rect x="0" y="0" width="460" height="54" rx="6" fill="url(#draftGrad)"/>
    <rect x="0" y="0" width="460" height="54" rx="6" fill="none" stroke="#ff6b00" stroke-width="1.5" opacity="0.40"/>
    <g fill="#0a1628" opacity="0.22">
      <rect x="20" y="14" width="100" height="26" rx="3"/>
      <rect x="136" y="14" width="140" height="26" rx="3"/>
      <rect x="292" y="14" width="140" height="26" rx="3"/>
    </g>
  </g>

  <!-- Draft operation (gold) row 4 -->
  <g transform="translate(260, 390)">
    <rect x="0" y="0" width="360" height="54" rx="6" fill="url(#draftGrad)"/>
    <rect x="0" y="0" width="360" height="54" rx="6" fill="none" stroke="#ff6b00" stroke-width="1.5" opacity="0.40"/>
    <g fill="#0a1628" opacity="0.22">
      <rect x="20" y="14" width="80" height="26" rx="3"/>
      <rect x="116" y="14" width="120" height="26" rx="3"/>
      <rect x="252" y="14" width="80" height="26" rx="3"/>
    </g>
  </g>

  <!-- ===== Rejected paths outside sandbox (right side) ===== -->
  <!-- Traversal attempt with X -->
  <g transform="translate(800, 175)">
    <rect x="0" y="0" width="280" height="46" rx="6" fill="url(#rejectGrad)" opacity="0.75"/>
    <rect x="0" y="0" width="280" height="46" rx="6" fill="none" stroke="#dc2626" stroke-width="1.5" opacity="0.50"/>
    <g fill="#0a1628" opacity="0.18">
      <rect x="20" y="12" width="180" height="22" rx="3"/>
    </g>
    <!-- X mark -->
    <g stroke="#ff6b00" stroke-width="3" stroke-linecap="round" opacity="0.90">
      <line x1="238" y1="10" x2="266" y2="36"/>
      <line x1="266" y1="10" x2="238" y2="36"/>
    </g>
  </g>

  <!-- Absolute path with X -->
  <g transform="translate(800, 235)">
    <rect x="0" y="0" width="280" height="46" rx="6" fill="url(#rejectGrad)" opacity="0.75"/>
    <rect x="0" y="0" width="280" height="46" rx="6" fill="none" stroke="#dc2626" stroke-width="1.5" opacity="0.50"/>
    <g fill="#0a1628" opacity="0.18">
      <rect x="20" y="12" width="200" height="22" rx="3"/>
    </g>
    <g stroke="#ff6b00" stroke-width="3" stroke-linecap="round" opacity="0.90">
      <line x1="238" y1="10" x2="266" y2="36"/>
      <line x1="266" y1="10" x2="238" y2="36"/>
    </g>
  </g>

  <!-- Symlink escape with X -->
  <g transform="translate(800, 295)">
    <rect x="0" y="0" width="280" height="46" rx="6" fill="url(#rejectGrad)" opacity="0.75"/>
    <rect x="0" y="0" width="280" height="46" rx="6" fill="none" stroke="#dc2626" stroke-width="1.5" opacity="0.50"/>
    <g fill="#0a1628" opacity="0.18">
      <rect x="20" y="12" width="160" height="22" rx="3"/>
    </g>
    <g stroke="#ff6b00" stroke-width="3" stroke-linecap="round" opacity="0.90">
      <line x1="238" y1="10" x2="266" y2="36"/>
      <line x1="266" y1="10" x2="238" y2="36"/>
    </g>
  </g>

  <!-- Null byte injection with X -->
  <g transform="translate(800, 355)">
    <rect x="0" y="0" width="280" height="46" rx="6" fill="url(#rejectGrad)" opacity="0.75"/>
    <rect x="0" y="0" width="280" height="46" rx="6" fill="none" stroke="#dc2626" stroke-width="1.5" opacity="0.50"/>
    <g fill="#0a1628" opacity="0.18">
      <rect x="20" y="12" width="140" height="22" rx="3"/>
    </g>
    <g stroke="#ff6b00" stroke-width="3" stroke-linecap="round" opacity="0.90">
      <line x1="238" y1="10" x2="266" y2="36"/>
      <line x1="266" y1="10" x2="238" y2="36"/>
    </g>
  </g>

  <!-- Another rejected path -->
  <g transform="translate(800, 415)">
    <rect x="0" y="0" width="280" height="46" rx="6" fill="url(#rejectGrad)" opacity="0.75"/>
    <rect x="0" y="0" width="280" height="46" rx="6" fill="none" stroke="#dc2626" stroke-width="1.5" opacity="0.50"/>
    <g fill="#0a1628" opacity="0.18">
      <rect x="20" y="12" width="180" height="22" rx="3"/>
    </g>
    <g stroke="#ff6b00" stroke-width="3" stroke-linecap="round" opacity="0.90">
      <line x1="238" y1="10" x2="266" y2="36"/>
      <line x1="266" y1="10" x2="238" y2="36"/>
    </g>
  </g>

  <!-- ===== Arrow showing blocked path from outside to inside ===== -->
  <g stroke="#dc2626" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.50">
    <path d="M790,198 L760,198" marker-end="url(#blockedArrow)"/>
  </g>

  <!-- ===== Legend dots bottom-right (abstract, no text) ===== -->
  <g transform="translate(960, 520)">
    <circle cx="0" cy="0" r="9" fill="#0e7490" opacity="0.85"/>
    <circle cx="28" cy="0" r="9" fill="#f59e0b" opacity="0.75"/>
    <circle cx="56" cy="0" r="9" fill="#dc2626" opacity="0.70"/>
  </g>
</svg>