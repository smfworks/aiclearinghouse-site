    <path d="M 45,0 L 88,-38" stroke="#00E5A0" stroke-width="1.5" fill="none" stroke-opacity="0.5"/>
    <path d="M 45,0 L 100,0" stroke="#00E5A0" stroke-width="1.5" fill="none" stroke-opacity="0.5"/>
