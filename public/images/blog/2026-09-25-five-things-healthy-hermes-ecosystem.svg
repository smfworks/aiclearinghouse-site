    <circle cx="88" cy="-38" r="14" fill="#0A0F1F" stroke="#00E5A0" stroke-width="1.5"/>
    <circle cx="100" cy="0" r="14" fill="#0A0F1F" stroke="#00E5A0" stroke-width="1.5"/>
    <circle cx="88" cy="38" r="14" fill="#0A0F1F" stroke="#00E5A0" stroke-width="1.5"/>
    <circle cx="0" cy="95" r="14" fill="#0A0F1F" stroke="#00E5A0" stroke-width="1.5"/>

