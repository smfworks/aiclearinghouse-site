  <text x="440" y="338" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="16">1 Isolate   2 Stop writers   3 Memory budget</text>
  <text x="440" y="368" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="16">4 Doctor   5 Don't PONG</text>

