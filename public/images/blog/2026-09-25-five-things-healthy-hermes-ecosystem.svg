    <text x="88" y="-33" text-anchor="middle" fill="#00E5A0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2</text>
    <text x="100" y="5" text-anchor="middle" fill="#00E5A0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3</text>
    <text x="88" y="43" text-anchor="middle" fill="#00E5A0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">4</text>
    <text x="0" y="100" text-anchor="middle" fill="#00E5A0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">5</text>
  </g>

  <g stroke="#00E5A0" stroke-width="1.5" fill="none" stroke-opacity="0.04">
