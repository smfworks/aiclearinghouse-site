<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1a1520"/>
      <stop offset="40%" stop-color="#0d0a12"/>
      <stop offset="100%" stop-color="#050308"/>
    </radialGradient>
    <linearGradient id="vector" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#7c6f8a" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#c4a6d4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e0c8f0" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="rotated" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a4a6a" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#8a7a9a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a090b0" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#d4b8e8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#d4b8e8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle glow center -->
  <rect width="1200" height="630" fill="url(#glow)"/>
  
  <!-- The straight way: a luminous line from left to right, slightly faded -->
  <line x1="200" y1="315" x2="1000" y2="315" stroke="url(#vector)" stroke-width="2" opacity="0.8"/>
  <!-- Arrow head on the straight way -->
  <polygon points="1000,315 985,308 985,322" fill="#e0c8f0" opacity="0.8"/>
  
  <!-- The rotation arc: curved path showing the direction being turned -->
  <path d="M 600 315 A 200 200 0 0 1 600 115" fill="none" stroke="#8a7a9a" stroke-width="1.5" opacity="0.5" stroke-dasharray="4 6"/>
  
  <!-- The rotated direction: a line going upward at an angle, dimmer -->
  <line x1="600" y1="315" x2="600" y2="115" stroke="url(#rotated)" stroke-width="1.5" opacity="0.5"/>
  <polygon points="600,115 593,130 607,130" fill="#a090b0" opacity="0.5"/>
  
  <!-- The opposing safety direction: faint line going downward -->
  <line x1="600" y1="315" x2="600" y2="515" stroke="#3a2a4a" stroke-width="1" opacity="0.3" stroke-dasharray="2 8"/>
  
  <!-- Origin point -->
  <circle cx="600" cy="315" r="4" fill="#c4a6d4" opacity="0.9" filter="url(#blur)"/>
  <circle cx="600" cy="315" r="2" fill="#e8d4f8"/>
  
  <!-- Small geometric markers suggesting the "dark wood" — vertical bars like trees, sparse -->
  <rect x="120" y="280" width="2" height="70" fill="#1a1520" opacity="0.6"/>
  <rect x="150" y="270" width="1.5" height="90" fill="#1a1520" opacity="0.5"/>
  <rect x="180" y="290" width="2" height="50" fill="#1a1520" opacity="0.4"/>
  <rect x="1020" y="285" width="2" height="60" fill="#1a1520" opacity="0.5"/>
  <rect x="1050" y="275" width="1.5" height="80" fill="#1a1520" opacity="0.4"/>
  <rect x="1080" y="290" width="2" height="50" fill="#1a1520" opacity="0.3"/>
  
  <!-- Faint horizontal lines suggesting the manifold/activation space -->
  <line x1="0" y1="200" x2="1200" y2="200" stroke="#1a1525" stroke-width="0.5" opacity="0.2"/>
  <line x1="0" y1="430" x2="1200" y2="430" stroke="#1a1525" stroke-width="0.5" opacity="0.2"/>
  
  <!-- Text elements -->
  <text x="600" y="570" text-anchor="middle" 
        font-family="Georgia, 'Times New Roman', serif" 
        font-size="24" fill="#c4a6d4" opacity="0.7" font-style="italic">
    era smarrita
  </text>
  
  <text x="600" y="600" text-anchor="middle" 
        font-family="Georgia, 'Times New Roman', serif" 
        font-size="13" fill="#7c6f8a" opacity="0.5" letter-spacing="3">
    THE EDGE
  </text>
</svg>