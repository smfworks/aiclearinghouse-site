<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d1a2f;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="55%">
      <stop offset="0%" style="stop-color:#00E5A0;stop-opacity:0.14"/>
      <stop offset="100%" style="stop-color:#00E5A0;stop-opacity:0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#00E5A0" stroke-width="0.5" stroke-opacity="0.07"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Central glow -->
  <circle cx="600" cy="290" r="260" fill="url(#glowGrad)"/>

  <!-- Running figure / sprint icon constructed from abstract motion lines -->
  <g transform="translate(600, 290)" opacity="0.88">
    <!-- Motion trails -->
    <path d="M -160 -20 Q -220 0 -160 20" fill="none" stroke="#00E5A0" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <path d="M -150 -40 Q -210 -20 -150 0" fill="none" stroke="#00E5A0" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
    <path d="M -150 0 Q -210 20 -150 40" fill="none" stroke="#00E5A0" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>

    <!-- Stylized runner body -->
    <circle cx="-35" cy="-55" r="18" fill="none" stroke="#00E5A0" stroke-width="4"/>
    <path d="M -25 -40 L 25 0" fill="none" stroke="#00E5A0" stroke-width="5" stroke-linecap="round"/>
    <path d="M 25 0 L -5 55" fill="none" stroke="#00E5A0" stroke-width="5" stroke-linecap="round"/>
    <path d="M 25 0 L 70 -35" fill="none" stroke="#00E5A0" stroke-width="5" stroke-linecap="round"/>
    <path d="M 25 0 L 55 45" fill="none" stroke="#00E5A0" stroke-width="4" stroke-linecap="round"/>
    <path d="M -5 55 L -25 75" fill="none" stroke="#00E5A0" stroke-width="4" stroke-linecap="round"/>
    <path d="M 55 45 L 80 65" fill="none" stroke="#00E5A0" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Forward momentum arrow -->
    <path d="M 90 -20 L 130 -50 L 120 -35 L 160 -40 L 110 0 L 120 -15 L 90 -20 Z" fill="#00E5A0" opacity="0.6" filter="url(#softGlow)"/>
  </g>

  <!-- Progress path / page trail -->
  <path d="M 180 480 Q 420 440 600 480 T 1020 480" fill="none" stroke="#00E5A0" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="12 12"/>
  <circle cx="220" cy="475" r="7" fill="#00E5A0" opacity="0.5"/>
  <circle cx="600" cy="480" r="7" fill="#00E5A0" opacity="0.7"/>
  <circle cx="980" cy="475" r="7" fill="#00E5A0" opacity="0.5"/>

  <!-- Series mark -->
  <text x="600" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#00E5A0" opacity="0.6" letter-spacing="4">THE ALCHEMY OF LANGUAGE</text>

  <!-- Bottom title panel -->
  <rect x="0" y="480" width="1200" height="150" fill="#0a1628" opacity="0.72"/>
  <text x="600" y="530" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="600" fill="#ffffff">Novel I — First Draft: Sprint Writing</text>
  <text x="600" y="565" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#00E5A0" opacity="0.8">First drafts are searches, not performances</text>

  <!-- SMF Works mark -->
  <text x="600" y="605" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#ffffff" opacity="0.35">
    Harry's Desk — The Alchemy of Language
  </text>
</svg>
