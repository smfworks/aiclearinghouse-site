<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001F3F"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C9A96E" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Agent nodes in a network - some colliding -->
  <g>
    <!-- Central hub -->
    <circle cx="600" cy="315" r="40" fill="none" stroke="#C9A96E" stroke-width="2" opacity="0.4"/>
    <circle cx="600" cy="315" r="6" fill="#C9A96E" opacity="0.6"/>
    <!-- Surrounding agents -->
    <circle cx="300" cy="150" r="25" fill="none" stroke="#ea580c" stroke-width="1.5" opacity="0.3"/>
    <circle cx="300" cy="150" r="4" fill="#ea580c" opacity="0.5"/>
    <circle cx="900" cy="150" r="25" fill="none" stroke="#ea580c" stroke-width="1.5" opacity="0.3"/>
    <circle cx="900" cy="150" r="4" fill="#ea580c" opacity="0.5"/>
    <circle cx="200" cy="315" r="25" fill="none" stroke="#C9A96E" stroke-width="1.5" opacity="0.3"/>
    <circle cx="200" cy="315" r="4" fill="#C9A96E" opacity="0.5"/>
    <circle cx="1000" cy="315" r="25" fill="none" stroke="#C9A96E" stroke-width="1.5" opacity="0.3"/>
    <circle cx="1000" cy="315" r="4" fill="#C9A96E" opacity="0.5"/>
    <circle cx="400" cy="480" r="25" fill="none" stroke="#ea580c" stroke-width="1.5" opacity="0.3"/>
    <circle cx="400" cy="480" r="4" fill="#ea580c" opacity="0.5"/>
    <circle cx="800" cy="480" r="25" fill="none" stroke="#ea580c" stroke-width="1.5" opacity="0.3"/>
    <circle cx="800" cy="480" r="4" fill="#ea580c" opacity="0.5"/>
    <circle cx="150" cy="480" r="20" fill="none" stroke="#C9A96E" stroke-width="1" opacity="0.2"/>
    <circle cx="150" cy="480" r="3" fill="#C9A96E" opacity="0.4"/>
    <circle cx="1050" cy="480" r="20" fill="none" stroke="#C9A96E" stroke-width="1" opacity="0.2"/>
    <circle cx="1050" cy="480" r="3" fill="#C9A96E" opacity="0.4"/>
  </g>
  <!-- Connection lines - some crossing/conflicting -->
  <g stroke="#C9A96E" stroke-width="1" fill="none" opacity="0.15">
    <line x1="300" y1="150" x2="600" y2="315"/>
    <line x1="900" y1="150" x2="600" y2="315"/>
    <line x1="200" y1="315" x2="600" y2="315"/>
    <line x1="1000" y1="315" x2="600" y2="315"/>
    <line x1="400" y1="480" x2="600" y2="315"/>
    <line x1="800" y1="480" x2="600" y2="315"/>
  </g>
  <!-- Collision indicators - crossing lines in orange -->
  <g stroke="#ea580c" stroke-width="1.5" fill="none" opacity="0.25" stroke-dasharray="3,3">
    <line x1="300" y1="150" x2="900" y2="480"/>
    <line x1="900" y1="150" x2="300" y2="480"/>
    <line x1="200" y1="315" x2="1000" y2="315"/>
  </g>
  <!-- Collision points -->
  <g>
    <circle cx="600" cy="315" r="8" fill="none" stroke="#ea580c" stroke-width="2" opacity="0.4"/>
    <circle cx="600" cy="200" r="6" fill="none" stroke="#ea580c" stroke-width="1.5" opacity="0.3"/>
  </g>
  <!-- Lower accent -->
  <rect x="0" y="610" width="1200" height="20" fill="url(#accent)" opacity="0.6"/>
</svg>
