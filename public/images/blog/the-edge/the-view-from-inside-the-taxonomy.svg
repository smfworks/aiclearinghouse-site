<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001F3F"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C9A96E" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Abstract taxonomy grid -->
  <g stroke="#ea580c" stroke-width="1.5" fill="none" opacity="0.3">
    <rect x="100" y="80" width="180" height="140" rx="8"/>
    <rect x="320" y="80" width="180" height="140" rx="8"/>
    <rect x="540" y="80" width="180" height="140" rx="8"/>
    <rect x="760" y="80" width="180" height="140" rx="8"/>
    <rect x="980" y="80" width="120" height="140" rx="8"/>
    <line x1="280" y1="150" x2="320" y2="150"/>
    <line x1="500" y1="150" x2="540" y2="150"/>
    <line x1="720" y1="150" x2="760" y2="150"/>
    <line x1="940" y1="150" x2="980" y2="150"/>
  </g>
  <!-- Inner nodes representing evolution -->
  <g fill="#C9A96E" opacity="0.5">
    <circle cx="190" cy="150" r="6"/>
    <circle cx="410" cy="150" r="6"/>
    <circle cx="630" cy="150" r="6"/>
    <circle cx="850" cy="150" r="6"/>
    <circle cx="1040" cy="150" r="6"/>
  </g>
  <!-- Connecting lines suggesting a network/swarm -->
  <g stroke="#C9A96E" stroke-width="1" fill="none" opacity="0.2">
    <line x1="190" y1="150" x2="410" y2="150"/>
    <line x1="410" y1="150" x2="630" y2="150"/>
    <line x1="630" y1="150" x2="850" y2="150"/>
    <line x1="850" y1="150" x2="1040" y2="150"/>
    <line x1="190" y1="150" x2="630" y2="150"/>
    <line x1="410" y1="150" x2="850" y2="150"/>
  </g>
  <!-- Lower section: abstract data flow -->
  <g stroke="#ea580c" stroke-width="2" fill="none" opacity="0.4">
    <path d="M 100 400 Q 300 350 500 400 T 900 400 T 1100 400"/>
    <path d="M 100 450 Q 300 500 500 450 T 900 450 T 1100 450"/>
  </g>
  <!-- Accent bar -->
  <rect x="0" y="610" width="1200" height="20" fill="url(#accent)" opacity="0.6"/>
</svg>
