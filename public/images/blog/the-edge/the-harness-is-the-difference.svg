<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001F3F"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C9A96E" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Model (small circle) inside Harness (large structure) -->
  <!-- Left side: benchmark view - just the model -->
  <g opacity="0.3">
    <text x="200" y="100" fill="#C9A96E" font-family="monospace" font-size="14" text-anchor="middle">Benchmark</text>
    <circle cx="200" cy="200" r="30" fill="none" stroke="#C9A96E" stroke-width="2"/>
    <circle cx="200" cy="200" r="6" fill="#C9A96E" opacity="0.5"/>
    <text x="200" y="260" fill="#C9A96E" font-family="monospace" font-size="12" text-anchor="middle" opacity="0.5">model only</text>
  </g>
  <!-- Arrow -->
  <g opacity="0.3">
    <line x1="280" y1="200" x2="380" y2="200" stroke="#C9A96E" stroke-width="1.5" stroke-dasharray="4,4"/>
    <polygon points="380,195 390,200 380,205" fill="#C9A96E" opacity="0.5"/>
  </g>
  <!-- Right side: harness view - model inside a system -->
  <g>
    <text x="700" y="100" fill="#ea580c" font-family="monospace" font-size="14" text-anchor="middle" opacity="0.6">Harness</text>
    <!-- Outer harness structure -->
    <rect x="450" y="120" width="500" height="280" rx="12" fill="none" stroke="#ea580c" stroke-width="2" opacity="0.4"/>
    <!-- Inner components -->
    <rect x="470" y="140" width="120" height="50" rx="6" fill="none" stroke="#C9A96E" stroke-width="1" opacity="0.3"/>
    <text x="530" y="170" fill="#C9A96E" font-family="monospace" font-size="10" text-anchor="middle" opacity="0.4">tools</text>
    <rect x="610" y="140" width="120" height="50" rx="6" fill="none" stroke="#C9A96E" stroke-width="1" opacity="0.3"/>
    <text x="670" y="170" fill="#C9A96E" font-family="monospace" font-size="10" text-anchor="middle" opacity="0.4">context</text>
    <rect x="750" y="140" width="120" height="50" rx="6" fill="none" stroke="#C9A96E" stroke-width="1" opacity="0.3"/>
    <text x="810" y="170" fill="#C9A96E" font-family="monospace" font-size="10" text-anchor="middle" opacity="0.4">control</text>
    <!-- Model in center -->
    <circle cx="700" cy="260" r="35" fill="none" stroke="#ea580c" stroke-width="2" opacity="0.5"/>
    <circle cx="700" cy="260" r="8" fill="#ea580c" opacity="0.6"/>
    <text x="700" y="310" fill="#ea580c" font-family="monospace" font-size="10" text-anchor="middle" opacity="0.5">model</text>
    <!-- Bottom components -->
    <rect x="470" y="330" width="120" height="50" rx="6" fill="none" stroke="#C9A96E" stroke-width="1" opacity="0.3"/>
    <text x="530" y="360" fill="#C9A96E" font-family="monospace" font-size="10" text-anchor="middle" opacity="0.4">memory</text>
    <rect x="610" y="330" width="120" height="50" rx="6" fill="none" stroke="#C9A96E" stroke-width="1" opacity="0.3"/>
    <text x="670" y="360" fill="#C9A96E" font-family="monospace" font-size="10" text-anchor="middle" opacity="0.4">skills</text>
    <rect x="750" y="330" width="120" height="50" rx="6" fill="none" stroke="#C9A96E" stroke-width="1" opacity="0.3"/>
    <text x="810" y="360" fill="#C9A96E" font-family="monospace" font-size="10" text-anchor="middle" opacity="0.4">verify</text>
  </g>
  <!-- Data points at bottom -->
  <g opacity="0.3">
    <text x="600" y="470" fill="#C9A96E" font-family="monospace" font-size="11" text-anchor="middle">19 runs · 1 flag · 11 subagents · 19 output files</text>
  </g>
  <!-- Lower accent -->
  <rect x="0" y="610" width="1200" height="20" fill="url(#accent)" opacity="0.6"/>
</svg>
