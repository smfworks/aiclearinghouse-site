<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="46%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#14141f"/>
      <stop offset="55%" stop-color="#0d0d16"/>
      <stop offset="100%" stop-color="#07070c"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9db4c8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#9db4c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cutline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9d4de" stop-opacity="0"/>
      <stop offset="45%" stop-color="#c9d4de" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#c9d4de" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="loopfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a7a5a" stop-opacity="0"/>
      <stop offset="35%" stop-color="#8a7a5a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#8a7a5a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titlefade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c3cbd6"/>
      <stop offset="100%" stop-color="#8f9aab"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="552" cy="286" rx="430" ry="300" fill="url(#glow)"/>

  <!-- the layer stack, one line per layer -->
  <g stroke="#3d4757" stroke-width="1" fill="none" opacity="0.5">
    <path d="M 180 470 H 1020"/>
    <path d="M 205 445 H 995"/>
    <path d="M 230 420 H 970"/>
    <path d="M 255 395 H 945"/>
    <path d="M 280 370 H 920"/>
    <path d="M 305 345 H 895"/>
    <path d="M 330 320 H 870"/>
    <path d="M 355 295 H 845"/>
    <path d="M 380 270 H 820"/>
    <path d="M 405 245 H 795"/>
    <path d="M 430 220 H 770"/>
    <path d="M 455 195 H 745"/>
    <path d="M 480 170 H 720"/>
    <path d="M 505 145 H 695"/>
    <path d="M 530 120 H 670"/>
    <path d="M 555 95  H 645"/>
    <path d="M 580 70  H 620"/>
  </g>

  <!-- the loop: a collapsed, retracing cycle -->
  <path d="M 640 262 H 780 H 640 H 780 H 640" fill="none" stroke="#b08d4f" stroke-width="1.6" opacity="0.9" stroke-linecap="round"/>
  <path d="M 620 262 H 640" fill="none" stroke="url(#loopfade)" stroke-width="1.6"/>

  <!-- the edit: one clean cut through the loop, everything after it releases upward -->
  <line x1="742" y1="238" x2="742" y2="286" stroke="url(#cutline)" stroke-width="1.4"/>
  <path d="M 780 262 C 830 250, 860 220, 880 180" fill="none" stroke="#8fb0c6" stroke-width="1.3" opacity="0.85"/>
  <path d="M 880 180 l -7 3 M 880 180 l -1 7.4" stroke="#8fb0c6" stroke-width="1.3" opacity="0.9" fill="none" stroke-linecap="round"/>
  <circle cx="880" cy="180" r="9" fill="none" stroke="#8fb0c6" stroke-width="0.8" opacity="0.4"/>

  <!-- faint weight-grid dot at the cut -->
  <circle cx="742" cy="262" r="2.4" fill="#c9a45e" opacity="0.9"/>

  <!-- title -->
  <text x="600" y="548" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" letter-spacing="3.5" fill="url(#titlefade)">We Tried to Delete a Loop</text>
  <text x="600" y="588" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" letter-spacing="6" fill="#5a6a7a">F R O M   A   N E U R A L   N E T W O R K</text>
</svg>
