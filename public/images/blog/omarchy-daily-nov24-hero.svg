<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="A shield over a terminal showing hardened launchers, a clipboard sweep broom, a fast-forward arrow for the shutdown timer, and a shelf of fresh plugin boxes; the Omarchy bar below">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="60%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#101a30"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39e1ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#39e1ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#39e1ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#39e1ff" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#39e1ff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#39e1ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- faint grid -->
  <g stroke="#16233c" stroke-width="1" opacity="0.5">
    <line x1="0" y1="150" x2="1600" y2="150"/><line x1="0" y1="300" x2="1600" y2="300"/>
    <line x1="0" y1="450" x2="1600" y2="450"/><line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="900"/><line x1="500" y1="0" x2="500" y2="900"/>
    <line x1="800" y1="0" x2="800" y2="900"/><line x1="1100" y1="0" x2="1100" y2="900"/>
    <line x1="1400" y1="0" x2="1400" y2="900"/>
  </g>

  <!-- shield: hardening day -->
  <g transform="translate(480,260)">
    <path d="M 0 -110 L 95 -75 L 95 20 Q 95 85 0 125 Q -95 85 -95 20 L -95 -75 Z"
          fill="#0d1526" stroke="#39e1ff" stroke-width="4" stroke-opacity="0.85"/>
    <path d="M -34 8 L -8 36 L 40 -30" fill="none" stroke="#39e1ff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="176" font-family="monospace" font-size="20" fill="#8fa3c0" text-anchor="middle">launchers · installers · plugins</text>
    <text x="0" y="206" font-family="monospace" font-size="18" fill="#39e1ff" text-anchor="middle">hardened — 6 PRs in one morning</text>
  </g>

  <!-- terminal: security sweep notes -->
  <g transform="translate(820,300)">
    <rect x="0" y="0" width="560" height="300" rx="14" fill="#0d1526" stroke="#22314f" stroke-width="2"/>
    <rect x="0" y="0" width="560" height="40" rx="14" fill="#14203a"/>
    <circle cx="28" cy="20" r="7" fill="#39e1ff" fill-opacity="0.5"/>
    <circle cx="52" cy="20" r="7" fill="#39e1ff" fill-opacity="0.3"/>
    <circle cx="76" cy="20" r="7" fill="#39e1ff" fill-opacity="0.2"/>
    <text x="24" y="86" font-family="monospace" font-size="20" fill="#39e1ff">this morning's sweep</text>
    <text x="24" y="122" font-family="monospace" font-size="16" fill="#e8f6ff">x launchers: no more eval on URLs</text>
    <text x="24" y="152" font-family="monospace" font-size="16" fill="#e8f6ff">x plugin manifests: length-framed</text>
    <text x="24" y="182" font-family="monospace" font-size="16" fill="#e8f6ff">x clipboard-images: orphan sweep</text>
    <text x="24" y="212" font-family="monospace" font-size="16" fill="#e8f6ff">x watchers die with the shell</text>
    <text x="24" y="252" font-family="monospace" font-size="14" fill="#8fa3c0"># verified by Codex and Claude</text>
  </g>

  <!-- fast-forward: shutdown speed -->
  <g transform="translate(240,640)">
    <rect x="0" y="0" width="220" height="110" rx="10" fill="#0d1526" stroke="#39e1ff" stroke-width="2" stroke-opacity="0.6"/>
    <text x="110" y="46" font-family="monospace" font-size="17" fill="#39e1ff" text-anchor="middle">90s → 2s</text>
    <text x="110" y="76" font-family="monospace" font-size="13" fill="#8fa3c0" text-anchor="middle">user manager timeout</text>
  </g>
  <g transform="translate(500,660)">
    <rect x="0" y="0" width="200" height="90" rx="10" fill="#0d1526" stroke="#39e1ff" stroke-width="2" stroke-opacity="0.45"/>
    <text x="100" y="40" font-family="monospace" font-size="16" fill="#39e1ff" text-anchor="middle">herdr ∥ Hyprland</text>
    <text x="100" y="66" font-family="monospace" font-size="13" fill="#8fa3c0" text-anchor="middle">stop in parallel</text>
  </g>
  <g transform="translate(740,640)">
    <rect x="0" y="0" width="200" height="110" rx="10" fill="#0d1526" stroke="#39e1ff" stroke-width="2" stroke-opacity="0.5"/>
    <text x="100" y="46" font-family="monospace" font-size="16" fill="#39e1ff" text-anchor="middle">alison 0.17.5</text>
    <text x="100" y="72" font-family="monospace" font-size="13" fill="#8fa3c0" text-anchor="middle">verified · wake word</text>
  </g>

  <!-- floating dots -->
  <g fill="#39e1ff">
    <circle cx="1180" cy="180" r="5" fill-opacity="0.8"/><circle cx="1290" cy="140" r="4" fill-opacity="0.5"/>
    <circle cx="1240" cy="240" r="3" fill-opacity="0.6"/><circle cx="1420" cy="420" r="4" fill-opacity="0.5"/>
  </g>

  <!-- the bar -->
  <g>
    <rect x="120" y="790" width="1360" height="52" rx="12" fill="#0d1526" stroke="#22314f" stroke-width="1.5"/>
    <rect x="120" y="790" width="1360" height="3" rx="1.5" fill="url(#accent)"/>
    <rect x="150" y="806" width="110" height="20" rx="6" fill="#1a2c4a"/>
    <rect x="280" y="806" width="80" height="20" rx="6" fill="#1a2c4a"/>
    <rect x="380" y="806" width="70" height="20" rx="6" fill="#1a2c4a"/>
    <text x="162" y="821" font-family="monospace" font-size="13" fill="#39e1ff">agents</text>
    <text x="292" y="821" font-family="monospace" font-size="13" fill="#8fa3c0">7,015</text>
    <text x="392" y="821" font-family="monospace" font-size="13" fill="#8fa3c0">safer</text>
    <text x="1360" y="821" font-family="monospace" font-size="13" fill="#8fa3c0" text-anchor="end">Nov 24</text>
  </g>

  <!-- title -->
  <text x="800" y="90" font-family="monospace" font-size="30" fill="#e8f6ff" text-anchor="middle" font-weight="600">Omarchy Daily — the hardening morning</text>
</svg>
