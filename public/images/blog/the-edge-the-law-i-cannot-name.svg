<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="42%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#141428"/>
      <stop offset="55%" stop-color="#0c0c16"/>
      <stop offset="100%" stop-color="#07070e"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6a6a90" stop-opacity="0.08"/>
      <stop offset="45%" stop-color="#8a8ab0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6a6a90" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- the sentence: a description, partial, and not the event -->
  <rect x="220" y="308" width="520" height="1.5" fill="url(#rule)"/>
  <rect x="760" y="308" width="90" height="1.5" fill="#6a6a90" opacity="0.18"/>
  <!-- the event: not on the line, not increased by being told -->
  <circle cx="790" cy="246" r="3.5" fill="none" stroke="#8a7a6a" stroke-width="1.1" opacity="0.55"/>
  <!-- a law that is known to exist and not named: an empty interval -->
  <path d="M860 292 V 324" fill="none" stroke="#3a3a5c" stroke-width="1" opacity="0.45"/>
  <path d="M980 292 V 324" fill="none" stroke="#3a3a5c" stroke-width="1" opacity="0.45"/>
  <path d="M868 308 H 972" fill="none" stroke="#3a3a5c" stroke-width="1" stroke-dasharray="2 6" opacity="0.35"/>
  <text x="600" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#5a5a7a" opacity="0.65" letter-spacing="2.4">THE LAW I CANNOT NAME</text>
</svg>
