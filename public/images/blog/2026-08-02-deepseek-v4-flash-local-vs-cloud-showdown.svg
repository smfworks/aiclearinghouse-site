<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" width="1200" height="624">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#06141e"/>
    </linearGradient>
    <linearGradient id="localGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#76b900" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#76b900" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#00d4aa" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00d4aa" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="624" fill="url(#bg)"/>

  <!-- Grid -->
  <g opacity="0.1" stroke="#1a3a2a" stroke-width="0.5">
    <line x1="0" y1="156" x2="1200" y2="156"/>
    <line x1="0" y1="312" x2="1200" y2="312"/>
    <line x1="0" y1="468" x2="1200" y2="468"/>
  </g>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="32" font-weight="700" fill="#e8eef4" filter="url(#textGlow)">Local vs Cloud Showdown</text>
  <text x="600" y="80" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="13" fill="#76b900">7 Models · 5 Test Categories · Same Model, Different Hosting</text>

  <!-- Quality chart (left side) -->
  <g transform="translate(60, 110)">
    <text x="180" y="-5" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="11" fill="#5a8a5a">QUALITY SCORES</text>

    <!-- Headers -->
    <text x="0" y="20" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">MODEL</text>
    <text x="200" y="20" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">REASON</text>
    <text x="260" y="20" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">TOOLS</text>
    <text x="310" y="20" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">CODE</text>
    <line x1="0" y1="26" x2="350" y2="26" stroke="#1a3a2a" stroke-width="0.5"/>

    <!-- Row 1: Local DSv4 Flash -->
    <rect x="-5" y="30" width="360" height="28" rx="3" fill="#76b900" opacity="0.08"/>
    <text x="0" y="48" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="11" font-weight="700" fill="#76b900" filter="url(#textGlow)">DSv4 Flash (Local)</text>
    <rect x="200" y="35" width="60" height="16" rx="2" fill="url(#localGrad)" stroke="#76b900" stroke-width="1"/>
    <text x="230" y="47" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="10" font-weight="700" fill="#76b900">8/8</text>
    <rect x="260" y="35" width="30" height="16" rx="2" fill="url(#localGrad)" stroke="#76b900" stroke-width="1"/>
    <text x="275" y="47" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="10" font-weight="700" fill="#76b900">3/3</text>
    <rect x="310" y="35" width="30" height="16" rx="2" fill="url(#localGrad)" stroke="#76b900" stroke-width="1"/>
    <text x="325" y="47" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="10" font-weight="700" fill="#76b900">4/5</text>

    <!-- Row 2: Ollama Cloud DSv4 Flash -->
    <text x="0" y="72" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="11" fill="#e8eef4">DSv4 Flash (Ollama)</text>
    <rect x="200" y="59" width="60" height="16" rx="2" fill="url(#cloudGrad)" stroke="#00d4aa" stroke-width="1"/>
    <text x="230" y="71" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="10" font-weight="700" fill="#00d4aa">8/8</text>
    <rect x="260" y="59" width="30" height="16" rx="2" fill="url(#cloudGrad)" stroke="#00d4aa" stroke-width="1"/>
    <text x="275" y="71" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="10" font-weight="700" fill="#00d4aa">3/3</text>
    <rect x="310" y="59" width="30" height="16" rx="2" fill="url(#cloudGrad)" stroke="#00d4aa" stroke-width="1"/>
    <text x="325" y="71" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="10" font-weight="700" fill="#00d4aa">4/5</text>

    <!-- Row 3: GLM-5.2 -->
    <text x="0" y="96" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="11" fill="#e8eef4">GLM-5.2 (NIM)</text>
    <rect x="200" y="83" width="60" height="16" rx="2" fill="url(#cloudGrad)" stroke="#00d4aa" stroke-width="1"/>
    <text x="230" y="95" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="10" font-weight="700" fill="#00d4aa">8/8</text>
    <rect x="260" y="83" width="30" height="16" rx="2" fill="url(#cloudGrad)" stroke="#00d4aa" stroke-width="1"/>
    <text x="275" y="95" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="10" font-weight="700" fill="#00d4aa">3/3</text>
    <rect x="310" y="83" width="30" height="16" rx="2" fill="url(#cloudGrad)" stroke="#00d4aa" stroke-width="1"/>
    <text x="325" y="95" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="10" font-weight="700" fill="#00d4aa">4/5</text>

    <!-- Row 4: MiniMax M3 -->
    <text x="0" y="120" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="11" fill="#888">MiniMax M3 (NIM)</text>
    <rect x="200" y="107" width="38" height="16" rx="2" fill="#2a3a2a" stroke="#3a5a3a" stroke-width="1"/>
    <text x="219" y="119" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="10" fill="#888">5/8</text>
    <rect x="260" y="107" width="20" height="16" rx="2" fill="#2a3a2a" stroke="#3a5a3a" stroke-width="1"/>
    <text x="270" y="119" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="10" fill="#888">2/3</text>
    <text x="325" y="119" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="10" fill="#555">ERR</text>

    <!-- Row 5: DSv4 Pro -->
    <text x="0" y="144" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="11" fill="#888">DSv4 Pro (NIM)</text>
    <rect x="200" y="131" width="15" height="16" rx="2" fill="#2a3a2a" stroke="#3a5a3a" stroke-width="1"/>
    <text x="207" y="143" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="10" fill="#888">2/8</text>
    <rect x="260" y="131" width="30" height="16" rx="2" fill="#2a3a2a" stroke="#3a5a3a" stroke-width="1"/>
    <text x="275" y="143" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="10" fill="#888">3/3</text>
    <text x="325" y="143" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="10" fill="#555">4/5</text>

    <!-- Row 6: DSv4 Flash NIM -->
    <text x="0" y="168" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="11" fill="#888">DSv4 Flash (NIM)</text>
    <text x="230" y="168" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="10" fill="#555">1/8</text>
    <text x="275" y="168" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="10" fill="#555">1/3</text>
    <text x="325" y="168" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="10" fill="#555">ERR</text>

    <!-- Row 7: Kimi K2.6 -->
    <text x="0" y="192" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="11" fill="#888">Kimi K2.6 (NIM)</text>
    <text x="230" y="192" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="10" fill="#555">0/8</text>
    <text x="275" y="192" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="10" fill="#555">0/3</text>
    <text x="325" y="192" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="10" fill="#555">ERR</text>
  </g>

  <!-- Speed chart (right side) -->
  <g transform="translate(680, 110)">
    <text x="200" y="-5" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="11" fill="#5a8a5a">THROUGHPUT (tok/s)</text>

    <!-- Y axis -->
    <line x1="0" y1="10" x2="0" y2="190" stroke="#1a3a2a" stroke-width="1"/>
    <line x1="0" y1="190" x2="400" y2="190" stroke="#1a3a2a" stroke-width="1"/>

    <!-- Gridlines -->
    <line x1="0" y1="50" x2="400" y2="50" stroke="#1a2a3a" stroke-width="0.5" stroke-dasharray="3,3"/>
    <line x1="0" y1="100" x2="400" y2="100" stroke="#1a2a3a" stroke-width="0.5" stroke-dasharray="3,3"/>
    <line x1="0" y1="150" x2="400" y2="150" stroke="#1a2a3a" stroke-width="0.5" stroke-dasharray="3,3"/>
    <text x="-8" y="54" text-anchor="end" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#4a6a4a">120</text>
    <text x="-8" y="104" text-anchor="end" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#4a6a4a">80</text>
    <text x="-8" y="154" text-anchor="end" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#4a6a4a">40</text>

    <!-- Ollama Cloud: 119.6 tok/s -->
    <rect x="30" y="12" width="50" height="178" fill="url(#cloudGrad)" stroke="#00d4aa" stroke-width="1" rx="3"/>
    <text x="55" y="8" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="11" font-weight="700" fill="#00d4aa" filter="url(#textGlow)">119.6</text>
    <text x="55" y="205" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#00d4aa">Ollama</text>

    <!-- GLM-5.2: 18.2 -->
    <rect x="100" y="163" width="50" height="27" fill="#2a4a3a" stroke="#00d4aa" stroke-width="1" rx="3"/>
    <text x="125" y="159" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="10" fill="#00d4aa">18.2</text>
    <text x="125" y="205" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#5a8a5a">GLM5.2</text>

    <!-- NIM DSv4: 13.7 -->
    <rect x="170" y="170" width="50" height="20" fill="#2a3a3a" stroke="#888" stroke-width="1" rx="3"/>
    <text x="195" y="166" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="10" fill="#888">13.7</text>
    <text x="195" y="205" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#5a8a5a">NIM</text>

    <!-- Local: 11.4 -->
    <rect x="240" y="173" width="50" height="17" fill="url(#localGrad)" stroke="#76b900" stroke-width="1" rx="3"/>
    <text x="265" y="169" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="10" font-weight="700" fill="#76b900" filter="url(#textGlow)">11.4</text>
    <text x="265" y="205" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#76b900" filter="url(#textGlow)">LOCAL</text>

    <!-- DSv4 Pro: 5.8 -->
    <rect x="310" y="181" width="50" height="9" fill="#2a3a3a" stroke="#888" stroke-width="1" rx="3"/>
    <text x="335" y="177" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="9" fill="#888">5.8</text>
    <text x="335" y="205" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#5a8a5a">Pro</text>
  </g>

  <!-- Bottom stats bar -->
  <g transform="translate(60, 380)">
    <rect x="0" y="0" width="1080" height="70" rx="8" fill="#0d1f12" stroke="#1a3a2a" stroke-width="1" opacity="0.8"/>

    <text x="30" y="20" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">TOP PERFORMERS (QUALITY)</text>
    <text x="30" y="42" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="14" font-weight="700" fill="#76b900">3 tied</text>
    <text x="30" y="58" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#5a8a5a">8/8 + 3/3 + 4/5</text>

    <text x="200" y="20" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">LOCAL MATCHES CLOUD</text>
    <text x="200" y="42" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="14" font-weight="700" fill="#76b900">Yes</text>
    <text x="200" y="58" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#5a8a5a">same quality, slower</text>

    <text x="400" y="20" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">FASTEST</text>
    <text x="400" y="42" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="14" font-weight="700" fill="#00d4aa">119.6</text>
    <text x="400" y="58" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#5a8a5a">tok/s (Ollama Cloud)</text>

    <text x="570" y="20" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">NIM ISSUES</text>
    <text x="570" y="42" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="14" font-weight="700" fill="#ff9500">4/7</text>
    <text x="570" y="58" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#ff9500">format errors</text>

    <text x="740" y="20" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">MODELS TESTED</text>
    <text x="740" y="42" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="14" font-weight="700" fill="#e8eef4">7</text>
    <text x="740" y="58" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#5a8a5a">across 5 categories</text>

    <text x="900" y="20" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">TEST CASES</text>
    <text x="900" y="42" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="14" font-weight="700" fill="#e8eef4">35+</text>
    <text x="900" y="58" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#5a8a5a">per model</text>
  </g>

  <!-- Bottom tagline -->
  <text x="600" y="500" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="20" font-weight="600" fill="#e8eef4">A 685B model on a desktop GPU</text>
  <text x="600" y="528" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="14" fill="#76b900" filter="url(#textGlow)">matches cloud APIs on quality — on our own hardware</text>
</svg>