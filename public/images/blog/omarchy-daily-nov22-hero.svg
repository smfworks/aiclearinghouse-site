<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="A terminal window with a package icon landing in it, a model-chip opening a harness, and the Omarchy bar below; a recalibrating boot progress bar above">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="60%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#101a30"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39e1ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#39e1ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#39e1ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#39e1ff" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#39e1ff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#39e1ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- faint grid -->
  <g stroke="#16233c" stroke-width="1" opacity="0.5">
    <line x1="0" y1="150" x2="1600" y2="150"/><line x1="0" y1="300" x2="1600" y2="300"/>
    <line x1="0" y1="450" x2="1600" y2="450"/><line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="900"/><line x1="500" y1="0" x2="500" y2="900"/>
    <line x1="800" y1="0" x2="800" y2="900"/><line x1="1100" y1="0" x2="1100" y2="900"/>
    <line x1="1400" y1="0" x2="1400" y2="900"/>
  </g>

  <!-- boot progress bar (recalibrated, nearly full) -->
  <g transform="translate(400,150)">
    <rect x="0" y="0" width="800" height="26" rx="13" fill="#0d1526" stroke="#22314f" stroke-width="2"/>
    <rect x="6" y="6" width="702" height="14" rx="7" fill="#39e1ff" fill-opacity="0.85"/>
    <text x="0" y="56" font-family="monospace" font-size="20" fill="#8fa3c0">plymouth: 15s → 4s · limit 0.7 → 0.9</text>
  </g>

  <!-- terminal window: package landing -->
  <g transform="translate(240,290)">
    <rect x="0" y="0" width="560" height="330" rx="14" fill="#0d1526" stroke="#22314f" stroke-width="2"/>
    <rect x="0" y="0" width="560" height="40" rx="14" fill="#14203a"/>
    <circle cx="28" cy="20" r="7" fill="#39e1ff" fill-opacity="0.5"/>
    <circle cx="52" cy="20" r="7" fill="#39e1ff" fill-opacity="0.3"/>
    <circle cx="76" cy="20" r="7" fill="#39e1ff" fill-opacity="0.2"/>
    <text x="24" y="90" font-family="monospace" font-size="21" fill="#39e1ff">$ pacman -Q pi-coding-agent</text>
    <text x="24" y="130" font-family="monospace" font-size="21" fill="#e8f6ff">pi-coding-agent 1.6.0-1</text>
    <text x="24" y="172" font-family="monospace" font-size="21" fill="#39e1ff">$ omarchy models harness</text>
    <text x="24" y="212" font-family="monospace" font-size="21" fill="#e8f6ff">pi  (default)</text>
    <text x="24" y="254" font-family="monospace" font-size="19" fill="#8fa3c0"># local models open in pi,</text>
    <text x="24" y="286" font-family="monospace" font-size="19" fill="#8fa3c0"># whatever the default agent is</text>
  </g>

  <!-- model chip + harness arc -->
  <g transform="translate(1120,430)">
    <rect x="-90" y="-70" width="180" height="140" rx="16" fill="#0d1526" stroke="#39e1ff" stroke-width="3" stroke-opacity="0.8"/>
    <text x="0" y="-8" font-family="monospace" font-size="26" fill="#39e1ff" text-anchor="middle">π</text>
    <text x="0" y="30" font-family="monospace" font-size="15" fill="#8fa3c0" text-anchor="middle">harness</text>
    <path d="M -150 90 A 190 120 0 0 1 150 90" fill="none" stroke="#39e1ff" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="6 8"/>
    <text x="0" y="130" font-family="monospace" font-size="15" fill="#8fa3c0" text-anchor="middle">pi | opencode | qwen</text>
  </g>

  <!-- floating package boxes -->
  <g fill="#39e1ff">
    <rect x="180" y="690" width="46" height="40" rx="6" fill-opacity="0.25" stroke="#39e1ff" stroke-opacity="0.7" stroke-width="2"/>
    <rect x="300" y="660" width="34" height="30" rx="5" fill-opacity="0.18" stroke="#39e1ff" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="1420" y="640" width="40" height="36" rx="6" fill-opacity="0.22" stroke="#39e1ff" stroke-opacity="0.6" stroke-width="2"/>
    <circle cx="1180" cy="200" r="5" fill-opacity="0.8"/><circle cx="1290" cy="150" r="4" fill-opacity="0.5"/>
  </g>

  <!-- the bar -->
  <g>
    <rect x="120" y="790" width="1360" height="52" rx="12" fill="#0d1526" stroke="#22314f" stroke-width="1.5"/>
    <rect x="120" y="790" width="1360" height="3" rx="1.5" fill="url(#accent)"/>
    <rect x="150" y="806" width="90" height="20" rx="6" fill="#1a2c4a"/>
    <rect x="260" y="806" width="60" height="20" rx="6" fill="#1a2c4a"/>
    <rect x="340" y="806" width="74" height="20" rx="6" fill="#1a2c4a"/>
    <text x="162" y="821" font-family="monospace" font-size="13" fill="#39e1ff">pi 1.6.0</text>
    <text x="272" y="821" font-family="monospace" font-size="13" fill="#8fa3c0">pkg</text>
    <text x="352" y="821" font-family="monospace" font-size="13" fill="#8fa3c0">harness</text>
    <circle cx="1420" cy="816" r="7" fill="#39e1ff" fill-opacity="0.8"/>
    <circle cx="1444" cy="816" r="7" fill="#39e1ff" fill-opacity="0.5"/>
  </g>

  <text x="800" y="872" font-family="monospace" font-size="16" fill="#8fa3c0" text-anchor="middle">omarchy daily · november 22, 2026 · smf works</text>
</svg>
