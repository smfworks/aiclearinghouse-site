<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" width="1200" height="624">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#06141e"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#76b900"/>
      <stop offset="100%" stop-color="#a8e600"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="624" fill="url(#bg)"/>

  <!-- Grid -->
  <g opacity="0.12" stroke="#1a3a2a" stroke-width="0.5">
    <line x1="0" y1="104" x2="1200" y2="104"/>
    <line x1="0" y1="208" x2="1200" y2="208"/>
    <line x1="0" y1="312" x2="1200" y2="312"/>
    <line x1="0" y1="416" x2="1200" y2="416"/>
    <line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="200" y1="0" x2="200" y2="624"/>
    <line x1="400" y1="0" x2="400" y2="624"/>
    <line x1="600" y1="0" x2="600" y2="624"/>
    <line x1="800" y1="0" x2="800" y2="624"/>
    <line x1="1000" y1="0" x2="1000" y2="624"/>
  </g>

  <!-- Bar chart: max_seq comparison (left side) -->
  <g transform="translate(80, 80)">
    <text x="100" y="-15" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="11" fill="#5a8a5a">MAX CONCURRENT SEQUENCES</text>

    <!-- 262K bar -->
    <rect x="20" y="30" width="60" height="280" fill="#1a3a2a" stroke="#2a5a1a" stroke-width="1" rx="4"/>
    <rect x="20" y="290" width="60" height="20" fill="#2a5a1a" rx="2"/>
    <text x="50" y="325" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="28" font-weight="700" fill="#5a8a5a">2</text>
    <text x="50" y="345" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="9" fill="#4a6a4a">262K ctx</text>

    <!-- Arrow -->
    <line x1="95" y1="170" x2="145" y2="170" stroke="#76b900" stroke-width="2" filter="url(#glow)"/>
    <polygon points="143,164 157,170 143,176" fill="#76b900"/>

    <!-- 64K bar -->
    <rect x="160" y="30" width="60" height="280" fill="#1a3a2a" stroke="#76b900" stroke-width="1" rx="4"/>
    <rect x="160" y="30" width="60" height="280" fill="url(#barGrad)" opacity="0.15" rx="4"/>
    <text x="190" y="325" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="28" font-weight="700" fill="#76b900" filter="url(#textGlow)">11</text>
    <text x="190" y="345" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="9" fill="#76b900">64K ctx</text>

    <!-- 5.5x label -->
    <text x="120" y="60" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="14" font-weight="700" fill="#76b900" filter="url(#textGlow)">5.5×</text>
  </g>

  <!-- Throughput chart (center) -->
  <g transform="translate(420, 80)">
    <text x="140" y="-15" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="11" fill="#5a8a5a">8-REQUEST AGG THROUGHPUT</text>

    <!-- Y axis labels -->
    <text x="-10" y="35" text-anchor="end" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#4a6a4a">40</text>
    <text x="-10" y="105" text-anchor="end" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#4a6a4a">30</text>
    <text x="-10" y="175" text-anchor="end" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#4a6a4a">20</text>
    <text x="-10" y="245" text-anchor="end" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#4a6a4a">10</text>
    <text x="-10" y="315" text-anchor="end" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#4a6a4a">0</text>

    <!-- Gridlines -->
    <line x1="0" y1="30" x2="280" y2="30" stroke="#1a2a3a" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="280" y2="100" stroke="#1a2a3a" stroke-width="0.5"/>
    <line x1="0" y1="170" x2="280" y2="170" stroke="#1a2a3a" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="280" y2="240" stroke="#1a2a3a" stroke-width="0.5"/>
    <line x1="0" y1="310" x2="280" y2="310" stroke="#2a3a4a" stroke-width="1"/>

    <!-- 262K bar: 17 tok/s -->
    <rect x="40" y="191" width="80" height="119" fill="#1a3a2a" stroke="#2a5a1a" stroke-width="1" rx="4"/>
    <text x="80" y="185" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="16" font-weight="700" fill="#5a8a5a">17</text>
    <text x="80" y="335" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="9" fill="#4a6a4a">262K</text>

    <!-- 64K bar: 40 tok/s -->
    <rect x="160" y="30" width="80" height="280" fill="url(#barGrad)" opacity="0.3" stroke="#76b900" stroke-width="1" rx="4"/>
    <rect x="160" y="30" width="80" height="280" fill="none" stroke="#76b900" stroke-width="1" rx="4"/>
    <text x="200" y="24" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="16" font-weight="700" fill="#76b900" filter="url(#textGlow)">40</text>
    <text x="200" y="335" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="9" fill="#76b900">64K</text>

    <!-- 2.3x label -->
    <text x="140" y="55" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="14" font-weight="700" fill="#76b900" filter="url(#textGlow)">2.3×</text>
  </g>

  <!-- Spec accept improvement (right side) -->
  <g transform="translate(800, 80)">
    <text x="100" y="-15" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="11" fill="#5a8a5a">32K CONTEXT SPEC ACCEPT</text>

    <!-- 262K: 0% -->
    <rect x="20" y="280" width="60" height="30" fill="#1a3a2a" stroke="#2a5a1a" stroke-width="1" rx="4"/>
    <text x="50" y="325" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="18" font-weight="700" fill="#5a8a5a">0%</text>
    <text x="50" y="345" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="9" fill="#4a6a4a">262K ctx</text>

    <!-- Arrow -->
    <line x1="95" y1="170" x2="145" y2="170" stroke="#76b900" stroke-width="2" filter="url(#glow)"/>
    <polygon points="143,164 157,170 143,176" fill="#76b900"/>

    <!-- 64K: 67.5% -->
    <rect x="160" y="90" width="60" height="220" fill="url(#barGrad)" opacity="0.2" stroke="#76b900" stroke-width="1" rx="4"/>
    <rect x="160" y="90" width="60" height="220" fill="none" stroke="#76b900" stroke-width="1" rx="4"/>
    <text x="190" y="80" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="18" font-weight="700" fill="#76b900" filter="url(#textGlow)">67%</text>
    <text x="190" y="345" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="9" fill="#76b900">64K ctx</text>
  </g>

  <!-- Title -->
  <text x="600" y="450" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="32" font-weight="700" fill="#e8eef4" filter="url(#textGlow)">Tuning DeepSeek V4 Flash for Concurrency</text>
  <text x="600" y="482" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="13" fill="#76b900">262K → 64K context · max_seq 2 → 11 · 2.3× aggregate throughput</text>

  <!-- Stats bar -->
  <g transform="translate(60, 520)">
    <rect x="0" y="0" width="1080" height="70" rx="8" fill="#0d1f12" stroke="#1a3a2a" stroke-width="1" opacity="0.8"/>

    <text x="30" y="20" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">CONCURRENCY</text>
    <text x="30" y="42" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="16" font-weight="700" fill="#76b900">5.5×</text>
    <text x="30" y="58" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#5a8a5a">max_seq gain</text>

    <text x="200" y="20" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">THROUGHPUT</text>
    <text x="200" y="42" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="16" font-weight="700" fill="#76b900">2.3×</text>
    <text x="200" y="58" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#5a8a5a">8-request agg</text>

    <text x="370" y="20" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">WALL TIME</text>
    <text x="370" y="42" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="16" font-weight="700" fill="#76b900">1.8×</text>
    <text x="370" y="58" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#5a8a5a">8-request faster</text>

    <text x="540" y="20" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">SPEC ACCEPT</text>
    <text x="540" y="42" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="16" font-weight="700" fill="#e8eef4">0→67%</text>
    <text x="540" y="58" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#5a8a5a">at 32K context</text>

    <text x="710" y="20" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">QUALITY</text>
    <text x="710" y="42" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="16" font-weight="700" fill="#e8eef4">8/8</text>
    <text x="710" y="58" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#5a8a5a">unchanged</text>

    <text x="880" y="20" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">TOOLS</text>
    <text x="880" y="42" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="16" font-weight="700" fill="#e8eef4">3/3</text>
    <text x="880" y="58" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#5a8a5a">unchanged</text>
  </g>
</svg>