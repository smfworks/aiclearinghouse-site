<?xml version="1.0" encoding="UTF-8"?>
<!-- Hero: cron parent keeps a solid teal SOUL slab; child document is dashed and empty.
     Brand palette: navy #0a1628 / #1e3a8a, gold #f59e0b / #ff6b00, teal #0e7490 / #00d4ff. No text. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A solid teal document connected on the left, a broken probe in the middle, and an empty dashed document on the right">
  <defs>
    <linearGradient id="cronBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="55%" stop-color="#0c1a30"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <radialGradient id="cronGlowTeal" cx="24%" cy="48%" r="46%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cronGlowGold" cx="78%" cy="52%" r="42%">
      <stop offset="0%" stop-color="#ff6b00" stop-opacity="0.20"/>
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cronGold" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ff6b00"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cronChassis" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#122848"/>
      <stop offset="100%" stop-color="#0f2240"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#cronBg)"/>
  <rect width="1200" height="630" fill="url(#cronGlowTeal)"/>
  <rect width="1200" height="630" fill="url(#cronGlowGold)"/>

  <g stroke="#162236" stroke-width="2" fill="none">
    <rect x="48" y="48" width="1104" height="534" rx="4"/>
  </g>
  <g stroke="#13243d" stroke-width="1" opacity="0.45">
    <line x1="48" y1="210" x2="1152" y2="210"/>
    <line x1="48" y1="420" x2="1152" y2="420"/>
    <line x1="400" y1="48" x2="400" y2="582"/>
    <line x1="800" y1="48" x2="800" y2="582"/>
  </g>

  <!-- left: parent cron, solid teal document, last bar gold -->
  <rect x="118" y="128" width="268" height="374" rx="12" fill="url(#cronChassis)" stroke="#00d4ff" stroke-width="4"/>
  <rect x="142" y="156" width="220" height="32" rx="4" fill="#00d4ff" opacity="0.95"/>
  <rect x="142" y="206" width="220" height="18" rx="3" fill="#0e7490" opacity="0.88"/>
  <rect x="142" y="236" width="186" height="18" rx="3" fill="#0e7490" opacity="0.72"/>
  <rect x="142" y="266" width="204" height="18" rx="3" fill="#0e7490" opacity="0.58"/>
  <rect x="142" y="296" width="168" height="18" rx="3" fill="#0e7490" opacity="0.44"/>
  <rect x="142" y="338" width="148" height="26" rx="4" fill="url(#cronGold)"/>
  <circle cx="338" cy="351" r="7" fill="#00d4ff"/>
  <path d="M142 430 L362 430" fill="none" stroke="#00d4ff" stroke-width="4" stroke-linecap="round"/>

  <!-- middle: probe that does not complete -->
  <g fill="none" stroke="url(#cronGold)" stroke-width="5" stroke-linecap="round">
    <path d="M398 315 C470 315 500 315 560 315"/>
  </g>
  <g fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 12" opacity="0.85">
    <path d="M590 315 C650 315 690 315 748 315"/>
  </g>
  <circle cx="575" cy="315" r="10" fill="#0a1628" stroke="#ff6b00" stroke-width="3"/>
  <path d="M568 308 L582 322" stroke="#ff6b00" stroke-width="3" stroke-linecap="round"/>
  <path d="M582 308 L568 322" stroke="#ff6b00" stroke-width="3" stroke-linecap="round"/>

  <!-- right: child, dashed empty document -->
  <rect x="814" y="128" width="268" height="374" rx="12" fill="url(#cronChassis)" stroke="#f59e0b" stroke-width="4" stroke-dasharray="14 10"/>
  <rect x="838" y="156" width="220" height="32" rx="4" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 6" opacity="0.7"/>
  <rect x="838" y="206" width="220" height="18" rx="3" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.35"/>
  <rect x="838" y="236" width="186" height="18" rx="3" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.28"/>
  <rect x="838" y="266" width="204" height="18" rx="3" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.22"/>
  <rect x="838" y="338" width="148" height="26" rx="4" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 7" opacity="0.45"/>
  <path d="M838 430 L1058 430" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 10" stroke-linecap="round" opacity="0.5"/>
</svg>
