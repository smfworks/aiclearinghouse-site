<svg xmlns="http://www.w3.org/2000/svg" width="1216" height="640" viewBox="0 0 1216 640" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#06141e"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4aa"/>
      <stop offset="1" stop-color="#76b900"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1216" height="640" fill="url(#bg)"/>
  <g stroke="#1a2a3a" stroke-width="1" opacity="0.35">
    <path d="M0 80 H1216 M0 160 H1216 M0 240 H1216 M0 320 H1216 M0 400 H1216 M0 480 H1216 M0 560 H1216"/>
    <path d="M101.3 0 V640 M202.6 0 V640 M304 0 V640 M405.3 0 V640 M506.6 0 V640 M608 0 V640 M709.3 0 V640 M810.6 0 V640 M912 0 V640 M1013.3 0 V640 M1114.6 0 V640"/>
  </g>

  <text x="608" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#e8eef4">One Suite, Two Arms</text>
  <text x="608" y="88" text-anchor="middle" font-size="15" fill="#5a8a6a">same 157 tests, scored twice — the arm label decides how to read the score</text>

  <!-- LEFT PANEL: analogue arm -->
  <g>
    <rect x="40" y="120" width="530" height="420" rx="12" fill="#0d1b26" stroke="#1e3a4a"/>
    <text x="305" y="158" text-anchor="middle" font-size="17" font-weight="700" fill="#ff9500">ANALOGUE ARM</text>
    <text x="305" y="180" text-anchor="middle" font-size="12" font-family="'SF Mono','Courier New',monospace" fill="#5a8a6a">reasoning mandatory — lowest effort that answers</text>
    <!-- brain icon with activity -->
    <g filter="url(#glow)">
      <circle cx="140" cy="250" r="26" fill="none" stroke="#ff9500" stroke-width="2.5"/>
      <path d="M130 250 q10 -14 20 0 q-10 14 -20 0" fill="#ff9500"/>
      <path d="M140 214 v-14 M140 286 v14 M112 250 h-14 M168 250 h14 M119 229 l-10 -10 M161 271 l10 10 M119 271 l-10 10 M161 229 l10 -10" stroke="#ff9500" stroke-width="2.5"/>
    </g>
    <text x="190" y="244" font-size="13" font-family="'SF Mono','Courier New',monospace" fill="#e8eef4">thinking still runs</text>
    <text x="190" y="262" font-size="13" font-family="'SF Mono','Courier New',monospace" fill="#5a8a6a">label the effort next to the score</text>
    <!-- score bars analogue -->
    <g font-family="'SF Mono','Courier New',monospace" font-size="12">
      <text x="70" y="330" fill="#5a8a6a">Hydrogen</text><rect x="200" y="318" width="330" height="14" rx="7" fill="url(#bar)" opacity="0.9"/><text x="545" y="330" fill="#e8eef4">151</text>
      <text x="70" y="362" fill="#5a8a6a">Astra</text><rect x="200" y="350" width="327" height="14" rx="7" fill="url(#bar)" opacity="0.8"/><text x="540" y="362" fill="#e8eef4">150</text>
      <text x="70" y="394" fill="#5a8a6a">Carbon</text><rect x="200" y="382" width="321" height="14" rx="7" fill="url(#bar)" opacity="0.8"/><text x="532" y="394" fill="#e8eef4">147</text>
      <text x="70" y="426" fill="#5a8a6a">Qwen4</text><rect x="200" y="414" width="278" height="14" rx="7" fill="url(#bar)" opacity="0.7"/><text x="488" y="426" fill="#e8eef4">127</text>
      <text x="70" y="458" fill="#5a8a6a">Inkling S</text><rect x="200" y="446" width="321" height="14" rx="7" fill="#00d4aa" opacity="0.65"/><text x="532" y="458" fill="#e8eef4">147</text>
      <text x="70" y="500" fill="#5a8a6a">Inkling Mini</text><rect x="200" y="488" width="198" height="14" rx="7" fill="#00d4aa" opacity="0.45"/><text x="408" y="500" fill="#e8eef4">90</text>
      <text x="200" y="522" font-size="10" fill="#666">score /157</text>
    </g>
  </g>

  <!-- CENTER divider -->
  <path d="M600 140 V520" stroke="#2a4a5a" stroke-width="1.5" stroke-dasharray="6 6"/>
  <g filter="url(#glow)">
    <text x="608" y="330" text-anchor="middle" font-size="22" fill="#76b900">vs</text>
  </g>

  <!-- RIGHT PANEL: true-off arm -->
  <g>
    <rect x="646" y="120" width="530" height="420" rx="12" fill="#0d1b26" stroke="#1e4a3a"/>
    <text x="911" y="158" text-anchor="middle" font-size="17" font-weight="700" fill="#76b900">TRUE-OFF ARM</text>
    <text x="911" y="180" text-anchor="middle" font-size="12" font-family="'SF Mono','Courier New',monospace" fill="#5a8a6a">reasoning: none accepted — zero reasoning tokens</text>
    <g filter="url(#glow)">
      <circle cx="746" cy="250" r="26" fill="none" stroke="#76b900" stroke-width="2.5"/>
      <path d="M736 250 q10 -14 20 0 q-10 14 -20 0" fill="none" stroke="#76b900" stroke-width="1.5"/>
      <path d="M746 288 v14" stroke="#76b900" stroke-width="2.5"/>
      <path d="M760 224 l24 -24" stroke="#76b900" stroke-width="2.5"/>
      <path d="M774 200 l10 0 l0 10" fill="none" stroke="#76b900" stroke-width="2.5"/>
    </g>
    <text x="796" y="244" font-size="13" font-family="'SF Mono','Courier New',monospace" fill="#e8eef4">thinking stays off</text>
    <text x="796" y="262" font-size="13" font-family="'SF Mono','Courier New',monospace" fill="#5a8a6a">same footing, scores can be compared</text>
    <!-- score bars true-off -->
    <g font-family="'SF Mono','Courier New',monospace" font-size="12">
      <text x="676" y="330" fill="#5a8a6a">Qwen4 Max</text><rect x="806" y="318" width="278" height="14" rx="7" fill="url(#bar)" opacity="0.8"/><text x="1096" y="330" fill="#e8eef4">127</text>
      <text x="676" y="362" fill="#5a8a6a">Hy4 Flash</text><rect x="806" y="350" width="278" height="14" rx="7" fill="url(#bar)" opacity="0.8"/><text x="1096" y="362" fill="#e8eef4">127</text>
      <text x="676" y="394" fill="#5a8a6a">Inkling Mini</text><rect x="806" y="382" width="198" height="14" rx="7" fill="#00d4aa" opacity="0.6"/><text x="1014" y="394" fill="#e8eef4">90</text>
      <text x="806" y="426" font-size="10" fill="#666">score /157</text>
      <!-- cost row -->
      <text x="676" y="470" fill="#5a8a6a">cost / suite</text>
      <rect x="806" y="458" width="8" height="14" rx="3" fill="#ff9500" opacity="0.9"/><text x="820" y="470" fill="#ff9500">$0.013</text>
      <rect x="806" y="484" width="52" height="14" rx="3" fill="#00d4aa" opacity="0.7"/><text x="866" y="496" fill="#00d4aa">$0.09</text>
      <text x="806" y="522" font-size="10" fill="#666">Hy4 Flash vs Inkling 2 Mini, whole 157-test suite</text>
    </g>
  </g>

  <text x="608" y="586" text-anchor="middle" font-size="13" fill="#5a8a6a">SMF Works · Cold Iron 157 · window 2026-11-15 → 2026-11-22</text>
  <text x="608" y="608" text-anchor="middle" font-size="11" font-family="'SF Mono','Courier New',monospace" fill="#444">read the arm label before you compare two rows</text>
</svg>
