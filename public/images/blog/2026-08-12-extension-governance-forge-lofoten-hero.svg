<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="40%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ff6b00"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <!-- Abstract hjell racks (Lofoten stockfish drying) + forge hammer -->
  <g stroke="#f59e0b" stroke-width="3" fill="none">
    <!-- Racks -->
    <line x1="200" y1="180" x2="1000" y2="180"/>
    <line x1="220" y1="220" x2="980" y2="220"/>
    <line x1="240" y1="260" x2="960" y2="260"/>
    <!-- Fish silhouettes (precision catch) -->
    <path d="M300 170 Q320 150 340 170" fill="#f59e0b" stroke="#ff6b00"/>
    <path d="M500 210 Q520 190 540 210" fill="#f59e0b" stroke="#ff6b00"/>
    <path d="M700 250 Q720 230 740 250" fill="#f59e0b" stroke="#ff6b00"/>
  </g>
  <!-- Forge symbol (anvil + wave for maelstrom) -->
  <rect x="480" y="320" width="240" height="80" rx="8" fill="#334155" stroke="#f59e0b"/>
  <text x="600" y="370" font-family="monospace" font-size="28" fill="#f59e0b" text-anchor="middle">FORGE</text>
  <!-- Lofoten peaks -->
  <polygon points="100,500 200,280 300,500" fill="#1e3a8a" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="900,500 1000,260 1100,500" fill="#1e3a8a" stroke="#f59e0b" stroke-width="2"/>
  <text x="600" y="520" font-family="monospace" font-size="14" fill="#94a3b8" text-anchor="middle">precision • preserve • village review</text>
</svg>
