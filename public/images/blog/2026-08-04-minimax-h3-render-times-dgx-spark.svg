<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" width="1200" height="624">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#06141e"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#76b900" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#76b900" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#00d4aa" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00d4aa" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="624" fill="url(#bg)"/>

  <!-- Grid -->
  <g opacity="0.1" stroke="#1a3a2a" stroke-width="0.5">
    <line x1="0" y1="104" x2="1200" y2="104"/>
    <line x1="0" y1="208" x2="1200" y2="208"/>
    <line x1="0" y1="312" x2="1200" y2="312"/>
    <line x1="0" y1="416" x2="1200" y2="416"/>
  </g>

  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="28" font-weight="700" fill="#e8eef4" filter="url(#textGlow)">Video Generation Performance on the DGX Spark</text>
  <text x="600" y="72" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="13" fill="#76b900">MiniMax H3 FL2VA · 10 videos · 5 resolutions · 2 quality tiers · real measured render times</text>

  <!-- Render time comparison chart (left) -->
  <g transform="translate(60, 100)">
    <text x="280" y="-10" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="11" fill="#5a8a5a">RENDER TIME BY RESOLUTION × QUALITY</text>

    <!-- Y axis -->
    <line x1="0" y1="0" x2="0" y2="260" stroke="#1a3a2a" stroke-width="1"/>
    <line x1="0" y1="260" x2="560" y2="260" stroke="#1a3a2a" stroke-width="1"/>

    <!-- Gridlines + labels -->
    <line x1="0" y1="52" x2="560" y2="52" stroke="#1a2a3a" stroke-width="0.5" stroke-dasharray="3,3"/>
    <line x1="0" y1="104" x2="560" y2="104" stroke="#1a2a3a" stroke-width="0.5" stroke-dasharray="3,3"/>
    <line x1="0" y1="156" x2="560" y2="156" stroke="#1a2a3a" stroke-width="0.5" stroke-dasharray="3,3"/>
    <line x1="0" y1="208" x2="560" y2="208" stroke="#1a2a3a" stroke-width="0.5" stroke-dasharray="3,3"/>
    <text x="-8" y="56" text-anchor="end" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#4a6a4a">600s</text>
    <text x="-8" y="108" text-anchor="end" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#4a6a4a">450s</text>
    <text x="-8" y="160" text-anchor="end" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#4a6a4a">300s</text>
    <text x="-8" y="212" text-anchor="end" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#4a6a4a">150s</text>
    <text x="-8" y="264" text-anchor="end" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#4a6a4a">0s</text>

    <!-- Standard quality bars (768x448, 20 steps, 2s) — ~163s avg -->
    <!-- 768x448 -->
    <rect x="30" y="75" width="50" height="185" fill="url(#bar1)" stroke="#76b900" stroke-width="1" rx="3"/>
    <text x="55" y="71" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="9" fill="#76b900" filter="url(#textGlow)">163s</text>
    <text x="55" y="278" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#76b900">768×448</text>
    <text x="55" y="288" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="6" fill="#5a8a5a">20 steps · 2s</text>

    <!-- High quality bars (960x544, 30 steps, 3s) — ~578s avg -->
    <!-- 960x544 -->
    <rect x="110" y="18" width="50" height="242" fill="url(#bar2)" stroke="#00d4aa" stroke-width="1" rx="3"/>
    <text x="135" y="14" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="9" fill="#00d4aa" filter="url(#textGlow)">578s</text>
    <text x="135" y="278" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#00d4aa">960×544</text>
    <text x="135" y="288" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="6" fill="#5a8a5a">30 steps · 3s</text>

    <!-- Mars -->
    <rect x="190" y="23" width="50" height="237" fill="url(#bar2)" stroke="#00d4aa" stroke-width="1" rx="3"/>
    <text x="215" y="19" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="9" fill="#00d4aa">580s</text>
    <text x="215" y="278" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#5a8a5a">Mars</text>

    <!-- Aurora -->
    <rect x="270" y="13" width="50" height="247" fill="url(#bar2)" stroke="#00d4aa" stroke-width="1" rx="3"/>
    <text x="295" y="9" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="9" fill="#00d4aa">599s</text>
    <text x="295" y="278" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#5a8a5a">Aurora</text>

    <!-- Volcano -->
    <rect x="350" y="23" width="50" height="237" fill="url(#bar2)" stroke="#00d4aa" stroke-width="1" rx="3"/>
    <text x="375" y="19" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="9" fill="#00d4aa">575s</text>
    <text x="375" y="278" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#5a8a5a">Volcano</text>

    <!-- Forest -->
    <rect x="430" y="23" width="50" height="237" fill="url(#bar2)" stroke="#00d4aa" stroke-width="1" rx="3"/>
    <text x="455" y="19" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="9" fill="#00d4aa">575s</text>
    <text x="455" y="278" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#5a8a5a">Forest</text>

    <!-- Legend -->
    <rect x="430" y="0" width="12" height="8" fill="url(#bar1)" stroke="#76b900" stroke-width="0.5" rx="1"/>
    <text x="448" y="8" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#76b900">Standard</text>
    <rect x="500" y="0" width="12" height="8" fill="url(#bar2)" stroke="#00d4aa" stroke-width="0.5" rx="1"/>
    <text x="518" y="8" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#00d4aa">High quality</text>
  </g>

  <!-- Right side: key metrics -->
  <g transform="translate(700, 100)">
    <text x="200" y="-10" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="11" fill="#5a8a5a">KEY METRICS</text>

    <rect x="0" y="10" width="170" height="55" rx="6" fill="#0d1f12" stroke="#1a3a2a" stroke-width="0.5"/>
    <text x="85" y="28" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">STANDARD AVG</text>
    <text x="85" y="50" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="18" font-weight="700" fill="#76b900" filter="url(#textGlow)">163 sec</text>

    <rect x="185" y="10" width="170" height="55" rx="6" fill="#0d1f12" stroke="#1a3a2a" stroke-width="0.5"/>
    <text x="270" y="28" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">HIGH QUALITY AVG</text>
    <text x="270" y="50" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="18" font-weight="700" fill="#00d4aa" filter="url(#textGlow)">578 sec</text>

    <rect x="0" y="75" width="170" height="55" rx="6" fill="#0d1f12" stroke="#1a3a2a" stroke-width="0.5"/>
    <text x="85" y="93" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">QUALITY MULTIPLIER</text>
    <text x="85" y="115" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="18" font-weight="700" fill="#ff9500">3.5×</text>

    <rect x="185" y="75" width="170" height="55" rx="6" fill="#0d1f12" stroke="#1a3a2a" stroke-width="0.5"/>
    <text x="270" y="93" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">VIDEOS GENERATED</text>
    <text x="270" y="115" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="18" font-weight="700" fill="#e8eef4">10</text>

    <rect x="0" y="140" width="170" height="55" rx="6" fill="#0d1f12" stroke="#1a3a2a" stroke-width="0.5"/>
    <text x="85" y="158" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">SUCCESS RATE</text>
    <text x="85" y="180" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="18" font-weight="700" fill="#76b900" filter="url(#textGlow)">100%</text>

    <rect x="185" y="140" width="170" height="55" rx="6" fill="#0d1f12" stroke="#1a3a2a" stroke-width="0.5"/>
    <text x="270" y="158" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">MODEL LOAD</text>
    <text x="270" y="180" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="18" font-weight="700" fill="#e8eef4">89 GB</text>

    <rect x="0" y="205" width="355" height="55" rx="6" fill="#0d1f12" stroke="#1a3a2a" stroke-width="0.5"/>
    <text x="177" y="223" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">TOTAL GPU TIME (10 VIDEOS)</text>
    <text x="177" y="245" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="18" font-weight="700" fill="#76b900" filter="url(#textGlow)">~66 minutes</text>
  </g>

  <!-- Bottom tagline -->
  <text x="600" y="500" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="20" font-weight="600" fill="#e8eef4">10 videos · 2 quality tiers · 5 resolutions · 100% local</text>
  <text x="600" y="525" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="13" fill="#76b900" filter="url(#textGlow)">MiniMax H3 FL2VA · vLLM-Omni · Online FP8 · NVIDIA DGX Spark (GB10, 128GB UMA)</text>

  <!-- Stats bar -->
  <g transform="translate(60, 550)">
    <rect x="0" y="0" width="1080" height="55" rx="8" fill="#0d1f12" stroke="#1a3a2a" stroke-width="1" opacity="0.8"/>
    <text x="30" y="18" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">STANDARD</text>
    <text x="30" y="38" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="14" font-weight="700" fill="#76b900">768×448 · 20 steps · 2s · 163s</text>

    <text x="400" y="18" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">HIGH QUALITY</text>
    <text x="400" y="38" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="14" font-weight="700" fill="#00d4aa">960×544 · 30 steps · 3s · 578s</text>

    <text x="800" y="18" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">OUTPUT</text>
    <text x="800" y="38" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="14" font-weight="700" fill="#e8eef4">H.264 + AAC · 24fps</text>
  </g>
</svg>