  <rect x="0" y="480" width="1200" height="150" fill="#0a1628" opacity="0.78"/>
  <text x="600" y="538" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="600" fill="#ffffff">The Submission Package</text>
  <text x="600" y="574" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#00E5A0" opacity="0.8">The letter describes the book. It does not rewrite it.</text>
