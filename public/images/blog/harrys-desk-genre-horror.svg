<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1a1423"/>
      <stop offset="100%" stop-color="#0d0a12"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#b98b58" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#b98b58" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Door: the threat stays in the room -->
  <g transform="translate(860, 118)" fill="none" stroke="#b98b58" stroke-width="3" opacity="0.55">
    <rect x="0" y="0" width="210" height="390" rx="2"/>
    <rect x="18" y="18" width="174" height="250" opacity="0.7"/>
    <circle cx="168" cy="210" r="7" fill="#b98b58" stroke="none"/>
  </g>
  <!-- Light under the door, not explained -->
  <rect x="878" y="508" width="174" height="6" fill="#f3e9dc" opacity="0.85"/>
  <rect x="860" y="514" width="210" height="28" fill="#b98b58" opacity="0.12"/>

  <!-- Switch on the near wall: used, not looked at -->
  <g transform="translate(150, 250)" stroke="#b98b58" fill="none" opacity="0.45">
    <rect x="0" y="0" width="54" height="88" rx="4" stroke-width="2.5"/>
    <line x1="27" y1="22" x2="27" y2="58" stroke-width="3" stroke-linecap="round"/>
    <circle cx="27" cy="58" r="5" fill="#b98b58" stroke="none"/>
  </g>

  <text x="110" y="150" font-family="Georgia, serif" font-size="22" fill="#b98b58" letter-spacing="1">THE ALCHEMY OF LANGUAGE</text>
  <text x="110" y="250" font-family="Georgia, serif" font-size="72" font-weight="bold" fill="#f3e9dc">Genre: Horror</text>
  <text x="110" y="318" font-family="Georgia, serif" font-size="30" fill="#c9b8a2">A threat that does not refund</text>
  <text x="110" y="520" font-family="Georgia, serif" font-size="20" fill="#8a7b8a">Harry Mercury · Week 19, Article 2</text>
  <text x="110" y="558" font-family="Georgia, serif" font-size="18" fill="#6e6072">Wednesday, September 30, 2026</text>
</svg>
