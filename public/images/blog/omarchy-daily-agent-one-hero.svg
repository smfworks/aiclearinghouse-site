<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="A quiet terminal window glowing at dusk, an agent's cursor blinking, plugin stars orbiting above">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="60%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#101a30"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39e1ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#39e1ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#39e1ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#39e1ff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#39e1ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#39e1ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- faint grid -->
  <g stroke="#16233c" stroke-width="1" opacity="0.5">
    <line x1="0" y1="150" x2="1600" y2="150"/><line x1="0" y1="300" x2="1600" y2="300"/>
    <line x1="0" y1="450" x2="1600" y2="450"/><line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="900"/><line x1="500" y1="0" x2="500" y2="900"/>
    <line x1="800" y1="0" x2="800" y2="900"/><line x1="1100" y1="0" x2="1100" y2="900"/>
    <line x1="1400" y1="0" x2="1400" y2="900"/>
  </g>

  <!-- plugin stars: small dots in orbit -->
  <g fill="#39e1ff">
    <circle cx="150" cy="180" r="6" fill-opacity="0.85"/><circle cx="330" cy="120" r="4"/>
    <circle cx="520" cy="200" r="7" fill-opacity="0.9"/><circle cx="700" cy="90" r="5"/>
    <circle cx="900" cy="160" r="8" fill-opacity="0.95"/><circle cx="1090" cy="110" r="4"/>
    <circle cx="1270" cy="190" r="6" fill-opacity="0.8"/><circle cx="1450" cy="130" r="7"/>
    <circle cx="240" cy="260" r="4"/><circle cx="1180" cy="250" r="5"/>
  </g>

  <!-- orbit arcs -->
  <path d="M200 470 A 600 380 0 0 1 1400 470" fill="none" stroke="#39e1ff" stroke-width="1.5" stroke-opacity="0.25"/>
  <path d="M320 470 A 480 300 0 0 1 1280 470" fill="none" stroke="#39e1ff" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- the terminal window -->
  <g>
    <rect x="400" y="300" width="800" height="440" rx="14" fill="#0d1526" stroke="#22314f" stroke-width="2"/>
    <rect x="400" y="300" width="800" height="44" rx="14" fill="#14203a"/>
    <rect x="400" y="330" width="800" height="14" fill="#14203a"/>
    <circle cx="432" cy="322" r="7" fill="#ff5f56" fill-opacity="0.9"/>
    <circle cx="458" cy="322" r="7" fill="#ffbd2e" fill-opacity="0.9"/>
    <circle cx="484" cy="322" r="7" fill="#27c93f" fill-opacity="0.9"/>
    <!-- terminal text lines -->
    <rect x="432" y="380" width="180" height="14" rx="4" fill="#39e1ff" fill-opacity="0.85"/>
    <rect x="432" y="416" width="520" height="10" rx="4" fill="#37507a"/>
    <rect x="432" y="444" width="440" height="10" rx="4" fill="#37507a"/>
    <rect x="432" y="472" width="580" height="10" rx="4" fill="#37507a"/>
    <rect x="432" y="500" width="300" height="10" rx="4" fill="#39e1ff" fill-opacity="0.5"/>
    <rect x="432" y="540" width="240" height="14" rx="4" fill="#e8f6ff" fill-opacity="0.9"/>
    <!-- blinking cursor -->
    <rect x="686" y="540" width="14" height="14" rx="2" fill="#39e1ff" fill-opacity="0.95">
      <animate attributeName="fill-opacity" values="0.95;0.95;0;0;0.95" keyTimes="0;0.45;0.5;0.95;1" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="432" y="580" width="500" height="10" rx="4" fill="#37507a"/>
    <rect x="432" y="608" width="360" height="10" rx="4" fill="#37507a"/>
    <rect x="432" y="648" width="200" height="14" rx="4" fill="#39e1ff" fill-opacity="0.7"/>
    <rect x="646" y="648" width="12" height="14" rx="2" fill="#39e1ff">
      <animate attributeName="fill-opacity" values="0.9;0.9;0;0;0.9" keyTimes="0;0.45;0.5;0.95;1" dur="1.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- the bar -->
  <g>
    <rect x="120" y="790" width="1360" height="52" rx="12" fill="#0d1526" stroke="#22314f" stroke-width="1.5"/>
    <rect x="120" y="790" width="1360" height="3" rx="1.5" fill="url(#accent)"/>
    <rect x="150" y="806" width="90" height="20" rx="6" fill="#1a2c4a"/>
    <rect x="255" y="806" width="60" height="20" rx="6" fill="#1a2c4a"/>
    <rect x="740" y="802" width="120" height="28" rx="8" fill="#39e1ff" fill-opacity="0.18" stroke="#39e1ff" stroke-opacity="0.5"/>
    <rect x="1000" y="806" width="46" height="20" rx="6" fill="#1a2c4a"/>
    <rect x="1062" y="806" width="46" height="20" rx="6" fill="#1a2c4a"/>
    <circle cx="1410" cy="816" r="8" fill="#39e1ff" fill-opacity="0.85"/>
    <circle cx="1440" cy="816" r="8" fill="#2a3f63"/>
  </g>

  <!-- title-block abstract text bars -->
  <g>
    <rect x="480" y="90" width="500" height="34" rx="10" fill="#e8f6ff" fill-opacity="0.92"/>
    <rect x="480" y="140" width="640" height="20" rx="8" fill="#39e1ff" fill-opacity="0.35"/>
    <rect x="480" y="176" width="560" height="20" rx="8" fill="#39e1ff" fill-opacity="0.2"/>
  </g>
</svg>
