<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="624" viewBox="0 0 1200 624" role="img" aria-labelledby="title desc">
  <title id="title">SMF Week In Review, 27 September to 4 October 2026</title>
  <desc id="desc">Volume bars for 56 linked posts. Peak is Monday with 13. Read-time sum is 631 minutes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
