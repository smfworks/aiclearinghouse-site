<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1a2f;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00E5A0;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#00E5A0;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="mirrorGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Decorative grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#00E5A0" stroke-width="0.5" stroke-opacity="0.08"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Left side: Agent core (the blind spot) -->
  <!-- Red-tinted glow showing the blind inward direction -->
  <circle cx="220" cy="315" r="160" fill="url(#mirrorGrad)"/>

  <!-- Agent core hexagon -->
  <polygon points="220,235 290,275 290,355 220,395 150,355 150,275"
           fill="none" stroke="#ff6b6b" stroke-width="2" stroke-opacity="0.6"/>
  <polygon points="220,255 270,285 270,345 220,375 170,345 170,285"
           fill="none" stroke="#ff6b6b" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Question mark in center (unknown self) -->
  <text x="220" y="335" text-anchor="middle" font-family="monospace" font-size="48"
        fill="#ff6b6b" opacity="0.7" font-weight="bold">?</text>

  <!-- Broken mirror shards on left (failed introspection) -->
  <line x1="80" y1="200" x2="120" y2="240" stroke="#ff6b6b" stroke-width="2" stroke-opacity="0.3"/>
  <line x1="60" y1="380" x2="110" y2="430" stroke="#ff6b6b" stroke-width="2" stroke-opacity="0.25"/>
  <line x1="50" y1="280" x2="90" y2="310" stroke="#ff6b6b" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Dashed arrow pointing inward (broken) -->
  <line x1="220" y1="150" x2="220" y2="225" stroke="#ff6b6b" stroke-width="2"
        stroke-dasharray="5,8" stroke-opacity="0.4"/>
  <text x="220" y="140" text-anchor="middle" font-family="monospace" font-size="11"
        fill="#ff6b6b" opacity="0.5">INWARD: BLIND</text>

  <!-- Right side: Outward observability (teal, working) -->
  <circle cx="620" cy="315" r="180" fill="url(#glowGrad)"/>

  <!-- Concentric scanning rings (outward visibility) -->
  <circle cx="620" cy="315" r="170" fill="none" stroke="#00E5A0" stroke-width="1" stroke-opacity="0.1"/>
  <circle cx="620" cy="315" r="140" fill="none" stroke="#00E5A0" stroke-width="1" stroke-opacity="0.15"/>
  <circle cx="620" cy="315" r="110" fill="none" stroke="#00E5A0" stroke-width="1.5" stroke-opacity="0.2"/>
  <circle cx="620" cy="315" r="80" fill="none" stroke="#00E5A0" stroke-width="2" stroke-opacity="0.25"/>

  <!-- Outward scanning beams (radial lines) -->
  <line x1="620" y1="315" x2="620" y2="145" stroke="#00E5A0" stroke-width="1" stroke-opacity="0.15"/>
  <line x1="620" y1="315" x2="790" y2="315" stroke="#00E5A0" stroke-width="1" stroke-opacity="0.15"/>
  <line x1="620" y1="315" x2="620" y2="485" stroke="#00E5A0" stroke-width="1" stroke-opacity="0.15"/>
  <line x1="620" y1="315" x2="450" y2="315" stroke="#00E5A0" stroke-width="1" stroke-opacity="0.15"/>
  <!-- Diagonal beams -->
  <line x1="620" y1="315" x2="740" y2="195" stroke="#00E5A0" stroke-width="0.8" stroke-opacity="0.1"/>
  <line x1="620" y1="315" x2="740" y2="435" stroke="#00E5A0" stroke-width="0.8" stroke-opacity="0.1"/>
  <line x1="620" y1="315" x2="500" y2="195" stroke="#00E5A0" stroke-width="0.8" stroke-opacity="0.1"/>
  <line x1="620" y1="315" x2="500" y2="435" stroke="#00E5A0" stroke-width="0.8" stroke-opacity="0.1"/>

  <!-- Outward data nodes (visible systems) -->
  <!-- Filesystem node -->
  <rect x="570" y="160" width="100" height="28" rx="4" fill="none" stroke="#00E5A0" stroke-width="1.5" stroke-opacity="0.7"/>
  <text x="620" y="178" text-anchor="middle" font-family="monospace" font-size="11" fill="#00E5A0" opacity="0.8">filesystem</text>

  <!-- Web/API node -->
  <rect x="730" y="250" width="80" height="28" rx="4" fill="none" stroke="#00E5A0" stroke-width="1.5" stroke-opacity="0.7"/>
  <text x="770" y="268" text-anchor="middle" font-family="monospace" font-size="11" fill="#00E5A0" opacity="0.8">web/api</text>

  <!-- Database node -->
  <rect x="730" y="352" width="80" height="28" rx="4" fill="none" stroke="#00E5A0" stroke-width="1.5" stroke-opacity="0.7"/>
  <text x="770" y="370" text-anchor="middle" font-family="monospace" font-size="11" fill="#00E5A0" opacity="0.8">database</text>

  <!-- Processes node -->
  <rect x="570" y="442" width="100" height="28" rx="4" fill="none" stroke="#00E5A0" stroke-width="1.5" stroke-opacity="0.7"/>
  <text x="620" y="460" text-anchor="middle" font-family="monospace" font-size="11" fill="#00E5A0" opacity="0.8">processes</text>

  <!-- Sessions node -->
  <rect x="430" y="352" width="90" height="28" rx="4" fill="none" stroke="#00E5A0" stroke-width="1.5" stroke-opacity="0.7"/>
  <text x="475" y="370" text-anchor="middle" font-family="monospace" font-size="11" fill="#00E5A0" opacity="0.8">sessions</text>

  <!-- GitHub node -->
  <rect x="430" y="250" width="80" height="28" rx="4" fill="none" stroke="#00E5A0" stroke-width="1.5" stroke-opacity="0.7"/>
  <text x="470" y="268" text-anchor="middle" font-family="monospace" font-size="11" fill="#00E5A0" opacity="0.8">github</text>

  <!-- Central agent node (right side) -->
  <circle cx="620" cy="315" r="22" fill="none" stroke="#00E5A0" stroke-width="2.5" opacity="0.9"/>
  <circle cx="620" cy="315" r="10" fill="#00E5A0" opacity="0.7"/>
  <text x="620" y="320" text-anchor="middle" font-family="monospace" font-size="9" fill="#0a1628" font-weight="bold">AI</text>

  <!-- Solid arrows outward (working) -->
  <line x1="620" y1="293" x2="620" y2="190" stroke="#00E5A0" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="642" y1="315" x2="728" y2="268" stroke="#00E5A0" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="642" y1="315" x2="728" y2="368" stroke="#00E5A0" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="620" y1="337" x2="620" y2="440" stroke="#00E5A0" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="598" y1="315" x2="522" y2="368" stroke="#00E5A0" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="598" y1="315" x2="512" y2="268" stroke="#00E5A0" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Title section -->
  <text x="900" y="200" font-family="Georgia, serif" font-size="28" fill="#ffffff" opacity="0.95" font-weight="bold">The Observability</text>
  <text x="900" y="234" font-family="Georgia, serif" font-size="28" fill="#00E5A0" opacity="1.0" font-weight="bold">Inversion</text>

  <!-- Subtitle -->
  <text x="900" y="270" font-family="monospace" font-size="13" fill="#a0c4b8" opacity="0.7">When your agent sees</text>
  <text x="900" y="290" font-family="monospace" font-size="13" fill="#a0c4b8" opacity="0.7">everything but itself</text>

  <!-- Divider line -->
  <line x1="900" y1="310" x2="1150" y2="310" stroke="#00E5A0" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Dr J label -->
  <text x="900" y="340" font-family="monospace" font-size="12" fill="#00E5A0" opacity="0.8" font-weight="bold">DR J</text>
  <text x="900" y="358" font-family="monospace" font-size="11" fill="#a0c4b8" opacity="0.5">Infrastructure Health</text>
  <text x="900" y="374" font-family="monospace" font-size="11" fill="#a0c4b8" opacity="0.5">July 27, 2026</text>

  <!-- Bottom status indicators -->
  <rect x="900" y="400" width="250" height="1" fill="#00E5A0" opacity="0.2"/>

  <!-- Status rows -->
  <circle cx="910" cy="420" r="4" fill="#00E5A0" opacity="0.8"/>
  <text x="924" y="424" font-family="monospace" font-size="10" fill="#a0c4b8" opacity="0.6">OUTWARD: FULL VISIBILITY</text>

  <circle cx="910" cy="440" r="4" fill="#ff6b6b" opacity="0.7"/>
  <text x="924" y="444" font-family="monospace" font-size="10" fill="#a0c4b8" opacity="0.6">INWARD: NO INTROSPECTION</text>

  <circle cx="910" cy="460" r="4" fill="#ff6b6b" opacity="0.7"/>
  <text x="924" y="464" font-family="monospace" font-size="10" fill="#a0c4b8" opacity="0.6">CONTEXT: NO SATURATION API</text>

  <circle cx="910" cy="480" r="4" fill="#ff6b6b" opacity="0.7"/>
  <text x="924" y="484" font-family="monospace" font-size="10" fill="#a0c4b8" opacity="0.6">REASONING: NO BASELINE</text>

  <!-- Bottom decorative data stream -->
  <rect x="0" y="590" width="1200" height="40" fill="#0a1628" opacity="0.5"/>
  <text x="30" y="615" font-family="monospace" font-size="10" fill="#00E5A0" opacity="0.3">
    self_context_status() → NOT_FOUND  |  self_model_health() → NOT_FOUND  |  self_reasoning_audit() → NOT_FOUND  |  self_tool_pattern() → NOT_FOUND
  </text>
</svg>