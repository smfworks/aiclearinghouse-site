<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="55%\" stop-color="#0d1b2e"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ff6b00" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="navy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient glow orbs -->
  <circle cx="260" cy="180" r="190" fill="url(#gold)" filter="url(#blur)" opacity="0.28"/>
  <circle cx="970" cy="470" r="210" fill="url(#teal)" filter="url(#blur)" opacity="0.26"/>
  <circle cx="600" cy="315" r="160" fill="url(#navy)" filter="url(#blur)" opacity="0.30"/>

  <!-- Blueprint grid -->
  <g stroke="#13243d" stroke-width="1" opacity="0.5">
    <line x1="0" y1="158" x2="1200" y2="158"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472" x2="1200" y2="472"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- CENTER: cron clock face — concentric tick rings -->
  <g transform="translate(600, 315)" opacity="0.92">
    <!-- outer ring -->
    <circle r="150" fill="none" stroke="#13243d" stroke-width="2"/>
    <circle r="130" fill="none" stroke="#1e3a8a" stroke-width="1" opacity="0.5"/>
    <!-- hour ticks (12) -->
    <g stroke="#3b5478" stroke-width="2.5" opacity="0.7" stroke-linecap="round">
      <line x1="0" y1="-150" x2="0" y2="-134"/>
      <line x1="75" y1="-130" x2="67" y2="-116"/>
      <line x1="130" y1="-75" x2="116" y2="-67"/>
      <line x1="150" y1="0" x2="134" y2="0"/>
      <line x1="130" y1="75" x2="116" y2="67"/>
      <line x1="75" y1="130" x2="67" y2="116"/>
      <line x1="0" y1="150" x2="0" y2="134"/>
      <line x1="-75" y1="130" x2="-67" y2="116"/>
      <line x1="-130" y1="75" x2="-116" y2="67"/>
      <line x1="-150" y1="0" x2="-134" y2="0"/>
      <line x1="-130" y1="-75" x2="-116" y2="-67"/>
      <line x1="-75" y1="-130" x2="-67" y2="-116"/>
    </g>
    <!-- sweep arc (gold, active cycle) -->
    <path d="M 0,-130 A 130,130 0 0,1 112,-65" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    <!-- minute hand -->
    <line x1="0" y1="0" x2="0" y2="-118" stroke="#f2f2f5" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <!-- hour hand -->
    <line x1="0" y1="0" x2="78" y2="45" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <!-- hub -->
    <circle r="10" fill="#0a1628" stroke="#f59e0b" stroke-width="2.5"/>
    <!-- inner repeat-cycle arrows -->
    <g transform="scale(0.62)" opacity="0.5">
      <path d="M -60,-40 A 70,70 0 1,1 60,-40" fill="none" stroke="#0e7490" stroke-width="3" stroke-linecap="round"/>
      <polygon points="60,-40 48,-54 52,-30" fill="#0e7490"/>
    </g>
  </g>

  <!-- LEFT: signal vs silence indicators -->
  <g transform="translate(300, 315)" opacity="0.9">
    <!-- signal dot (active, gold) -->
    <circle cx="0" cy="-60" r="14" fill="#f59e0b" opacity="0.85"/>
    <circle cx="0" cy="-60" r="26" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.4"/>
    <!-- connection line to center clock -->
    <line x1="80" y1="-50" x2="150" y2="-30" stroke="#3b5478" stroke-width="1.5" opacity="0.4" stroke-dasharray="5 5"/>
    <!-- silence dot (dim, grayed) -->
    <circle cx="0" cy="20" r="12" fill="none" stroke="#3b5478" stroke-width="2" opacity="0.6"/>
    <line x1="-9" y1="11" x2="9" y2="29" stroke="#3b5478" stroke-width="2" opacity="0.6"/>
    <!-- log trace lines -->
    <g stroke="#f59e0b" stroke-width="2" opacity="0.5" stroke-linecap="round">
      <line x1="-90" y1="-90" x2="-50" y2="-90"/>
      <line x1="-90" y1="-74" x2="-62" y2="-74"/>
      <line x1="-90" y1="-58" x2="-44" y2="-58"/>
    </g>
    <g stroke="#3b5478" stroke-width="2" opacity="0.45" stroke-linecap="round">
      <line x1="-90" y1="60" x2="-58" y2="60"/>
      <line x1="-90" y1="76" x2="-70" y2="76"/>
    </g>
  </g>

  <!-- RIGHT: state persistence stack (durable layers) -->
  <g transform="translate(900, 315)" opacity="0.88">
    <!-- stacked layers representing durable state -->
    <g stroke-width="2" stroke-linejoin="round">
      <rect x="-70" y="-70" width="140" height="26" rx="4" fill="#0e7490" fill-opacity="0.18" stroke="#0e7490" opacity="0.8"/>
      <rect x="-70" y="-40" width="140" height="26" rx="4" fill="#1e3a8a" fill-opacity="0.18" stroke="#1e3a8a" opacity="0.75"/>
      <rect x="-70" y="-10" width="140" height="26" rx="4" fill="#f59e0b" fill-opacity="0.16" stroke="#f59e0b" opacity="0.8"/>
      <rect x="-70" y="20" width="140" height="26" rx="4" fill="#ff6b00" fill-opacity="0.14" stroke="#ff6b00" opacity="0.7"/>
    </g>
    <!-- connection line from center clock -->
    <line x1="-150" y1="-30" x2="-80" y2="-55" stroke="#3b5478" stroke-width="1.5" opacity="0.4" stroke-dasharray="5 5"/>
    <!-- downward persistence arrow -->
    <line x1="0" y1="55" x2="0" y2="78" stroke="#06b6d4" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
    <polygon points="0,78 -6,68 6,68" fill="#06b6d4" opacity="0.6"/>
  </g>

  <!-- Bottom accent bar -->
  <rect x="0" y="618" width="1200" height="12" fill="url(#gold)" opacity="0.55"/>
</svg>