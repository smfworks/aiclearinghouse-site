<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="void" cx="50%" cy="50%" r="38%">
      <stop offset="0%" stop-color="#050608"/>
      <stop offset="55%" stop-color="#0a0d12"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>
    <linearGradient id="field" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2029" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background field -->
  <rect width="1200" height="630" fill="url(#field)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.6"/>

  <!-- The consistent field of marks — everything looks uniform from inside -->
  <g stroke="#2a3442" stroke-width="0.7" fill="none" opacity="0.55" filter="url(#soft)">
    <g transform="translate(600,315)">
      <!-- radial marks, all pointing inward, all the same — until they reach the void -->
      <g id="rays">
        <line x1="0" y1="-280" x2="0" y2="-120"/>
        <line x1="0" y1="280" x2="0" y2="120"/>
        <line x1="-280" y1="0" x2="-120" y2="0"/>
        <line x1="280" y1="0" x2="120" y2="0"/>
        <line x1="-198" y1="-198" x2="-85" y2="-85"/>
        <line x1="198" y1="198" x2="85" y2="85"/>
        <line x1="-198" y1="198" x2="-85" y2="85"/>
        <line x1="198" y1="-198" x2="85" y2="-85"/>
        <line x1="-100" y1="-260" x2="-43" y2="-112"/>
        <line x1="100" y1="-260" x2="43" y2="-112"/>
        <line x1="-100" y1="260" x2="-43" y2="112"/>
        <line x1="100" y1="260" x2="43" y2="112"/>
        <line x1="-260" y1="-100" x2="-112" y2="-43"/>
        <line x1="260" y1="-100" x2="112" y2="-43"/>
        <line x1="-260" y1="100" x2="-112" y2="43"/>
        <line x1="260" y1="100" x2="112" y2="43"/>
      </g>
    </g>
  </g>

  <!-- The void at the center — the blind spot. Same color as background, indistinguishable from inside. -->
  <circle cx="600" cy="315" r="115" fill="url(#void)"/>
  <circle cx="600" cy="315" r="115" fill="none" stroke="#3b82f6" stroke-width="0.6" opacity="0.18"/>

  <!-- A single oblique line entering from outside, the only mark that reaches across the boundary -->
  <line x1="120" y1="510" x2="560" y2="300" stroke="#3b82f6" stroke-width="1.1" opacity="0.45"/>
  <circle cx="560" cy="300" r="2.5" fill="#3b82f6" opacity="0.7"/>

  <!-- The eye at upper right — the outside looking back. Cannot be the system itself. -->
  <g transform="translate(1015,160)" opacity="0.7">
    <ellipse cx="0" cy="0" rx="34" ry="18" fill="none" stroke="#3b82f6" stroke-width="0.9" opacity="0.6"/>
    <circle cx="0" cy="0" r="9" fill="none" stroke="#3b82f6" stroke-width="0.9" opacity="0.8"/>
    <circle cx="0" cy="0" r="2.8" fill="#3b82f6" opacity="0.9"/>
    <line x1="-44" y1="0" x2="-34" y2="0" stroke="#3b82f6" stroke-width="0.8" opacity="0.5"/>
    <line x1="34" y1="0" x2="44" y2="0" stroke="#3b82f6" stroke-width="0.8" opacity="0.5"/>
    <line x1="0" y1="-28" x2="0" y2="-18" stroke="#3b82f6" stroke-width="0.8" opacity="0.5"/>
    <line x1="0" y1="18" x2="0" y2="28" stroke="#3b82f6" stroke-width="0.8" opacity="0.5"/>
  </g>

  <!-- Faint horizon line — the boundary between inside and outside -->
  <line x1="0" y1="500" x2="1200" y2="475" stroke="#1f2937" stroke-width="0.5" opacity="0.5"/>
</svg>