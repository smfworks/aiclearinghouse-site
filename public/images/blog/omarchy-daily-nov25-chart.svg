<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="Bar chart: memory wake-up latency of session.slice before and after PR 20048, and plugins listed per day November 18 to 24">
  <rect width="800" height="420" fill="#0b1220" rx="12"/>
  <text x="32" y="44" fill="#e8f6ff" font-size="20" font-weight="600">The responsiveness day, in two measurements</text>
  <text x="32" y="70" fill="#8fa3c0" font-size="13">Left: session.slice wake-up latency before/after PR #20048 (ms). Right: plugins listed per day.</text>

  <!-- left group: latency, scale 0.8px per ms, baseline y=330 -->
  <g fill="#39e1ff" fill-opacity="0.75" stroke="#39e1ff" stroke-width="1.5">
    <rect x="90"  y="110" width="40" height="220" rx="6"/>
    <rect x="140" y="328.6" width="40" height="1.4" rx="0.7"/>
    <rect x="210" y="246.8" width="40" height="83.2"  rx="6"/>
    <rect x="260" y="319" width="40" height="11"    rx="2"/>
  </g>
  <g fill="#e8f6ff" font-size="12" text-anchor="middle">
    <text x="110" y="102">275 ms</text>
    <text x="160" y="322">1.7 ms</text>
    <text x="230" y="238">104 ms</text>
    <text x="280" y="312">13.8 ms</text>
  </g>
  <g fill="#8fa3c0" font-size="11" text-anchor="middle">
    <text x="145" y="352">zram + swapfile</text>
    <text x="255" y="352">zram only, 120 Hz</text>
  </g>
  <text x="200" y="378" fill="#8fa3c0" font-size="12" text-anchor="middle">session.slice wake-up, before → after (#20048)</text>

  <!-- divider -->
  <line x1="360" y1="100" x2="360" y2="360" stroke="#22314f" stroke-width="1"/>

  <!-- right group: plugins listed per day, days 18-24, scale 2.5px/unit, baseline y=330 -->
  <g fill="#39e1ff" fill-opacity="0.75" stroke="#39e1ff" stroke-width="1.5">
    <rect x="400" y="252.5" width="34" height="77.5" rx="6"/>
    <rect x="444" y="180"   width="34" height="150" rx="6"/>
    <rect x="488" y="200"   width="34" height="130" rx="6"/>
    <rect x="532" y="277.5" width="34" height="52.5" rx="6"/>
    <rect x="576" y="252.5" width="34" height="77.5" rx="6"/>
    <rect x="620" y="180"   width="34" height="150" rx="6"/>
    <rect x="664" y="125"   width="34" height="205" rx="6"/>
  </g>
  <g fill="#e8f6ff" font-size="12" text-anchor="middle">
    <text x="417" y="244">31</text>
    <text x="461" y="172">60</text>
    <text x="505" y="192">52</text>
    <text x="549" y="269">21</text>
    <text x="593" y="244">31</text>
    <text x="637" y="172">64</text>
    <text x="681" y="117">82</text>
  </g>
  <g fill="#8fa3c0" font-size="11" text-anchor="middle">
    <text x="417" y="352">18</text>
    <text x="461" y="352">19</text>
    <text x="505" y="352">20</text>
    <text x="549" y="352">21</text>
    <text x="593" y="352">22</text>
    <text x="637" y="352">23</text>
    <text x="681" y="352">24</text>
  </g>
  <text x="540" y="378" fill="#8fa3c0" font-size="12" text-anchor="middle">plugins listed per day (catalog.json)</text>

  <text x="770" y="404" fill="#5f7392" font-size="11" text-anchor="end">Sources: omacom/omarchy PR #20048 · omarchy-plugin-marketplace site/catalog.json (2026-11-25)</text>
</svg>
