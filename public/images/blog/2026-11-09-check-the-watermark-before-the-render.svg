<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="">
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001F3F"/>
      <stop offset="1" stop-color="#002a55"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ea580c" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ea580c" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#navy)"/>
  <!-- frame, bottom-right: the corner the watermark would take -->
  <rect x="770" y="300" width="360" height="260" fill="none" stroke="#C9A96E" stroke-width="3"/>
  <rect x="1030" y="500" width="60" height="22" fill="#ea580c"/>
  <!-- frame, top-left, echoing -->
  <rect x="70" y="70" width="360" height="260" fill="none" stroke="#C9A96E" stroke-width="3" stroke-dasharray="14 10"/>
  <rect x="70" y="70" width="60" height="22" fill="url(#fade)"/>
  <!-- scanline between frames: the render passing through the check -->
  <path d="M 430 200 C 560 140, 640 260, 770 200" fill="none" stroke="#C792EA" stroke-width="3"/>
  <circle cx="600" cy="197" r="10" fill="#C792EA"/>
  <circle cx="600" cy="197" r="22" fill="none" stroke="#C792EA" stroke-width="2" opacity="0.5"/>
  <circle cx="600" cy="197" r="36" fill="none" stroke="#C792EA" stroke-width="1.5" opacity="0.25"/>
  <!-- corner ticks -->
  <path d="M 70 560 h 40 M 70 560 v -40" stroke="#ea580c" stroke-width="3" fill="none"/>
  <path d="M 1130 70 h -40 M 1130 70 v 40" stroke="#ea580c" stroke-width="3" fill="none"/>
</svg>
