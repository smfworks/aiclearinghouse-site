<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" width="1200" height="624">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#06141e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="624" fill="url(#bg)"/>
  <g stroke="#1a2a3a" stroke-width="1" opacity="0.3">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="80" y1="0" x2="80" y2="624"/>
  </g>
  <text x="48" y="48" fill="#76b900" font-family="'SF Mono','Courier New',monospace" font-size="14">SPARK-56BC · FL2VA · 2026-09-05</text>
  <text x="48" y="100" fill="#e8eef4" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="700">8 s clips, then splice</text>
  <text x="48" y="136" fill="#5a8a6a" font-family="'SF Mono','Courier New',monospace" font-size="15">768×448 · 20 steps · concat -c copy · 15 Hermes profiles</text>

  <!-- duration bars: wall time scaled ~1445s = 720px -->
  <text x="48" y="200" fill="#888" font-family="'SF Mono','Courier New',monospace" font-size="12">WALL vs CLIP</text>
  <text x="48" y="236" fill="#e8eef4" font-family="'SF Mono','Courier New',monospace" font-size="13">2 s</text>
  <rect x="120" y="218" width="80" height="22" rx="3" fill="#76b900" opacity="0.9"/>
  <text x="210" y="236" fill="#e8eef4" font-family="'SF Mono','Courier New',monospace" font-size="13">159 s → 2.36 s</text>

  <text x="48" y="280" fill="#e8eef4" font-family="'SF Mono','Courier New',monospace" font-size="13">5 s</text>
  <rect x="120" y="262" width="211" height="22" rx="3" fill="#00d4aa" opacity="0.9"/>
  <text x="341" y="280" fill="#e8eef4" font-family="'SF Mono','Courier New',monospace" font-size="13">423 s → 5.21 s</text>

  <text x="48" y="324" fill="#e8eef4" font-family="'SF Mono','Courier New',monospace" font-size="13">8 s</text>
  <rect x="120" y="306" width="720" height="22" rx="3" fill="#ff9500" opacity="0.9" filter="url(#glow)"/>
  <text x="850" y="324" fill="#e8eef4" font-family="'SF Mono','Courier New',monospace" font-size="13">1445 s → 8.03 s</text>

  <text x="48" y="380" fill="#e8eef4" font-family="'SF Mono','Courier New',monospace" font-size="13">splice</text>
  <rect x="120" y="362" width="180" height="22" rx="3" fill="#76b900"/>
  <rect x="300" y="362" width="280" height="22" rx="3" fill="#ff9500"/>
  <text x="600" y="380" fill="#e8eef4" font-family="'SF Mono','Courier New',monospace" font-size="13">5.21 + 8.03 = 13.24 s  ffmpeg -c copy</text>

  <rect x="0" y="520" width="1200" height="104" fill="#081018"/>
  <g font-family="'SF Mono','Courier New',monospace" fill="#e8eef4">
    <text x="48" y="556" fill="#5a8a6a" font-size="12">8 s PIN</text>
    <text x="48" y="586" font-size="20">24.1 min</text>
    <text x="280" y="556" fill="#5a8a6a" font-size="12">FRAMES</text>
    <text x="280" y="586" font-size="20">192</text>
    <text x="480" y="556" fill="#5a8a6a" font-size="12">SPLICE</text>
    <text x="480" y="586" font-size="20">13.24 s</text>
    <text x="720" y="556" fill="#5a8a6a" font-size="12">CLIENT</text>
    <text x="720" y="586" font-size="20">1800 s</text>
    <text x="960" y="556" fill="#5a8a6a" font-size="12">FLEET</text>
    <text x="960" y="586" font-size="20">15 agents</text>
  </g>
</svg>
