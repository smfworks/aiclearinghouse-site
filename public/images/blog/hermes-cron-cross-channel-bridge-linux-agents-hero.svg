<?xml version="1.0" encoding="UTF-8"?>
<!-- Hero for "Hermes Cron + Cross-Channel Bridge" — no-text abstract: 
     central cron clock fused with bridge arch, platform nodes (cli, web, tg), 
     repeating schedule dots, navy/gold/teal palette. Validates as well-formed XML. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Abstract Hermes cron scheduler bridged to cross-channel context nodes on Linux">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="50%" stop-color="#0f1a2e"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="tealGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0e7490" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff6b00" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff6b00" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="bridgeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- decorative grid frame -->
  <g stroke="#162236" stroke-width="1.5" opacity="0.6">
    <line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="1120" y1="0" x2="1120" y2="630"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
    <!-- inner grid -->
    <line x1="200" y1="0" x2="200" y2="630" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke-width="1"/>
    <line x1="0" y1="430" x2="1200" y2="430" stroke-width="1"/>
  </g>

  <!-- soft horizontal glows -->
  <rect x="0" y="180" width="1200" height="50" fill="url(#tealGlow)" filter="url(#blur)"/>
  <rect x="0" y="380" width="1200" height="50" fill="url(#goldGlow)" filter="url(#blur)"/>

  <!-- Central fused cron clock + bridge arch -->
  <g transform="translate(600, 315)">
    <!-- outer cron ring -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="#1e3a8a" stroke-width="10" opacity="0.8"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="#0e7490" stroke-width="4" opacity="0.5"/>
    <!-- inner fill -->
    <circle cx="0" cy="0" r="85" fill="#0a1628" stroke="#22d3ee" stroke-width="2" opacity="0.9"/>
    <!-- cron ticks -->
    <g stroke="#f59e0b" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="-75" x2="0" y2="-95"/>
      <line x1="53" y1="-53" x2="66" y2="-66"/>
      <line x1="75" y1="0" x2="95" y2="0"/>
      <line x1="53" y1="53" x2="66" y2="66"/>
      <line x1="0" y1="75" x2="0" y2="95"/>
      <line x1="-53" y1="53" x2="-66" y2="66"/>
      <line x1="-75" y1="0" x2="-95" y2="0"/>
      <line x1="-53" y1="-53" x2="-66" y2="-66"/>
    </g>
    <!-- center dot -->
    <circle cx="0" cy="0" r="18" fill="#ff6b00"/>
    <circle cx="0" cy="0" r="9" fill="#0a1628"/>
    <!-- bridge arch overlay -->
    <path d="M -80 -40 Q 0 -95 80 -40" fill="none" stroke="url(#bridgeGrad)" stroke-width="6" opacity="0.85"/>
    <path d="M -60 -25 Q 0 -65 60 -25" fill="none" stroke="#22d3ee" stroke-width="3" opacity="0.6"/>
  </g>

  <!-- Platform nodes -->
  <!-- CLI node (left) -->
  <g transform="translate(280, 220)">
    <rect x="-60" y="-40" width="120" height="80" rx="8" fill="#0f1a2e" stroke="#1e3a8a" stroke-width="2"/>
    <!-- terminal lines -->
    <rect x="-50" y="-28" width="100" height="7" rx="2" fill="#0e7490" opacity="0.7"/>
    <rect x="-50" y="-15" width="75" height="5" rx="1" fill="#f59e0b" opacity="0.6"/>
    <rect x="-50" y="-2" width="90" height="5" rx="1" fill="#22d3ee" opacity="0.5"/>
    <rect x="-50" y="11" width="65" height="5" rx="1" fill="#f59e0b" opacity="0.5"/>
    <!-- prompt dot -->
    <circle cx="-42" cy="-31" r="4" fill="#ff6b00"/>
    <circle cx="-30" cy="-31" r="4" fill="#f59e0b"/>
    <circle cx="-18" cy="-31" r="4" fill="#0e7490"/>
  </g>

  <!-- Web node (right) -->
  <g transform="translate(920, 220)">
    <rect x="-60" y="-40" width="120" height="80" rx="8" fill="#0f1a2e" stroke="#1e3a8a" stroke-width="2"/>
    <!-- browser bars -->
    <rect x="-50" y="-28" width="100" height="7" rx="2" fill="#0e7490" opacity="0.7"/>
    <rect x="-50" y="-15" width="100" height="5" rx="1" fill="#f59e0b" opacity="0.6"/>
    <rect x="-50" y="-2" width="85" height="5" rx="1" fill="#22d3ee" opacity="0.5"/>
    <rect x="-50" y="11" width="70" height="5" rx="1" fill="#f59e0b" opacity="0.5"/>
    <circle cx="-42" cy="-31" r="4" fill="#ff6b00"/>
    <circle cx="-30" cy="-31" r="4" fill="#f59e0b"/>
    <circle cx="-18" cy="-31" r="4" fill="#0e7490"/>
  </g>

  <!-- Telegram-like node (bottom center left) -->
  <g transform="translate(380, 450)">
    <rect x="-50" y="-30" width="100" height="60" rx="8" fill="#0f1a2e" stroke="#1e3a8a" stroke-width="2"/>
    <circle cx="-25" cy="-10" r="8" fill="#0e7490" opacity="0.8"/>
    <circle cx="5" cy="-10" r="8" fill="#f59e0b" opacity="0.8"/>
    <rect x="-35" y="8" width="70" height="6" rx="2" fill="#22d3ee" opacity="0.6"/>
    <rect x="-25" y="18" width="50" height="4" rx="1" fill="#f59e0b" opacity="0.5"/>
  </g>

  <!-- Obsidian / persistence node (bottom center right) -->
  <g transform="translate(820, 450)">
    <rect x="-50" y="-30" width="100" height="60" rx="8" fill="#0f1a2e" stroke="#1e3a8a" stroke-width="2"/>
    <rect x="-35" y="-18" width="70" height="8" rx="2" fill="#0e7490" opacity="0.7"/>
    <rect x="-35" y="-5" width="70" height="5" rx="1" fill="#f59e0b" opacity="0.6"/>
    <rect x="-35" y="8" width="55" height="5" rx="1" fill="#22d3ee" opacity="0.5"/>
    <circle cx="-25" cy="20" r="3" fill="#ff6b00"/>
    <circle cx="0" cy="20" r="3" fill="#f59e0b"/>
    <circle cx="25" cy="20" r="3" fill="#0e7490"/>
  </g>

  <!-- Connecting bridge lines from center to nodes -->
  <g stroke="#1e3a8a" stroke-width="3" opacity="0.65" stroke-linecap="round" fill="none">
    <!-- to CLI -->
    <path d="M 490 260 Q 400 240 340 240"/>
    <!-- to Web -->
    <path d="M 710 260 Q 800 240 860 240"/>
    <!-- to TG -->
    <path d="M 520 380 Q 450 410 430 420"/>
    <!-- to Obsidian -->
    <path d="M 680 380 Q 750 410 770 420"/>
    <!-- vertical from clock -->
    <path d="M 600 225 Q 600 300 600 340"/>
  </g>

  <!-- Schedule repeat indicator dots -->
  <g fill="#f59e0b" opacity="0.85">
    <circle cx="480" cy="140" r="5"/>
    <circle cx="520" cy="140" r="5"/>
    <circle cx="560" cy="140" r="5"/>
    <circle cx="600" cy="140" r="5"/>
    <circle cx="640" cy="140" r="5"/>
    <circle cx="680" cy="140" r="5"/>
    <circle cx="720" cy="140" r="5"/>
  </g>

  <!-- Subtle context flow arcs -->
  <g stroke="#0e7490" stroke-width="2" opacity="0.4" fill="none">
    <path d="M 300 300 Q 450 280 600 300"/>
    <path d="M 600 300 Q 750 280 900 300"/>
  </g>
</svg>