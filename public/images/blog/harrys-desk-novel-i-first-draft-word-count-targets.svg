<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1a1423"/>
      <stop offset="100%" stop-color="#0d0a12"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#b98b58" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#b98b58" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barFill" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#b98b58"/>
      <stop offset="100%" stop-color="#d4a574"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#glow)"/>

  <!-- Ledger / counter motif -->
  <g opacity="0.22" transform="translate(880, 200)">
    <rect x="0" y="0" width="220" height="280" rx="8" fill="none" stroke="#b98b58" stroke-width="2"/>
    <rect x="16" y="20" width="188" height="36" rx="4" fill="#b98b58" opacity="0.35"/>
    <rect x="16" y="72" width="188" height="16" fill="#b98b58" opacity="0.2"/>
    <rect x="16" y="100" width="140" height="16" fill="#b98b58" opacity="0.15"/>
    <rect x="16" y="128" width="170" height="16" fill="#b98b58" opacity="0.18"/>
    <rect x="16" y="168" width="188" height="14" rx="7" fill="none" stroke="#b98b58" stroke-width="2"/>
    <rect x="16" y="168" width="118" height="14" rx="7" fill="#b98b58" opacity="0.55"/>
    <rect x="16" y="200" width="188" height="14" rx="7" fill="none" stroke="#b98b58" stroke-width="2"/>
    <rect x="16" y="200" width="72" height="14" rx="7" fill="#b98b58" opacity="0.35"/>
    <rect x="16" y="232" width="188" height="14" rx="7" fill="none" stroke="#b98b58" stroke-width="2"/>
    <rect x="16" y="232" width="154" height="14" rx="7" fill="#b98b58" opacity="0.7"/>
  </g>

  <!-- Track / finish-line hash marks -->
  <g fill="none" stroke="#b98b58" stroke-width="2" opacity="0.18" transform="translate(140, 470)">
    <line x1="0" y1="0" x2="420" y2="0"/>
    <line x1="0" y1="-18" x2="0" y2="18"/>
    <line x1="70" y1="-10" x2="70" y2="10"/>
    <line x1="140" y1="-10" x2="140" y2="10"/>
    <line x1="210" y1="-10" x2="210" y2="10"/>
    <line x1="280" y1="-10" x2="280" y2="10"/>
    <line x1="350" y1="-10" x2="350" y2="10"/>
    <line x1="420" y1="-22" x2="420" y2="22"/>
    <circle cx="280" cy="0" r="7" fill="#b98b58" stroke="none" opacity="0.9"/>
  </g>

  <!-- Small odometer ticks -->
  <g fill="none" stroke="#b98b58" stroke-width="1.5" opacity="0.2" transform="translate(160, 180)">
    <rect x="0" y="0" width="86" height="54" rx="4"/>
    <rect x="96" y="0" width="86" height="54" rx="4"/>
    <rect x="192" y="0" width="86" height="54" rx="4"/>
  </g>
  <g font-family="Georgia, serif" font-size="28" fill="#b98b58" opacity="0.28">
    <text x="178" y="218">8</text>
    <text x="274" y="218">5</text>
    <text x="360" y="218">k</text>
  </g>

  <!-- Text -->
  <text x="110" y="170" font-family="Georgia, serif" font-size="22" fill="#b98b58" letter-spacing="1">THE ALCHEMY OF LANGUAGE</text>
  <text x="110" y="250" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#f3e9dc">Word Count Targets</text>
  <text x="110" y="318" font-family="Georgia, serif" font-size="28" fill="#c9b8a2">Novel I — First Draft</text>
  <text x="110" y="530" font-family="Georgia, serif" font-size="20" fill="#8a7b8a">Harry Mercury · Week 12, Article 3</text>
  <text x="110" y="568" font-family="Georgia, serif" font-size="18" fill="#6e6072">Friday, August 14, 2026</text>
</svg>
