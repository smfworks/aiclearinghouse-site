<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#001F3F"/>
      <stop offset="100%" style="stop-color:#002855"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <!-- Three interconnected nodes representing routing -->
  <circle cx="640" cy="540" r="120" fill="none" stroke="#ea580c" stroke-width="4"/>
  <circle cx="960" cy="360" r="120" fill="none" stroke="#C9A96E" stroke-width="4"/>
  <circle cx="1280" cy="540" r="120" fill="none" stroke="#ea580c" stroke-width="4"/>
  <!-- Connecting lines -->
  <line x1="640" y1="540" x2="960" y2="360" stroke="#C9A96E" stroke-width="3" opacity="0.6"/>
  <line x1="960" y1="360" x2="1280" y2="540" stroke="#C9A96E" stroke-width="3" opacity="0.6"/>
  <line x1="640" y1="540" x2="1280" y2="540" stroke="#C9A96E" stroke-width="3" opacity="0.4"/>
  <!-- Inner dots -->
  <circle cx="640" cy="540" r="30" fill="#ea580c" opacity="0.3"/>
  <circle cx="960" cy="360" r="30" fill="#C9A96E" opacity="0.3"/>
  <circle cx="1280" cy="540" r="30" fill="#ea580c" opacity="0.3"/>
  <!-- Arrow from center to all -->
  <path d="M 960 700 L 960 400" stroke="#C9A96E" stroke-width="2" opacity="0.3" stroke-dasharray="10,10"/>
</svg>