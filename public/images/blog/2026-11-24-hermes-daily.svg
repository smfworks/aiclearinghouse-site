<svg xmlns="http://www.w3.org/2000/svg" width="1216" height="640" viewBox="0 0 1216 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#06141e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="cb"/>
      <feMerge><feMergeNode in="cb"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10B981"/>
    </marker>
  </defs>
  <rect width="1216" height="640" fill="url(#bg)"/>
  <g stroke="#1a2a3a" stroke-width="1" opacity="0.3">
    <line x1="0" y1="80" x2="1216" y2="80"/><line x1="0" y1="160" x2="1216" y2="160"/>
    <line x1="0" y1="240" x2="1216" y2="240"/><line x1="0" y1="320" x2="1216" y2="320"/>
    <line x1="0" y1="400" x2="1216" y2="400"/><line x1="0" y1="480" x2="1216" y2="480"/>
    <line x1="152" y1="0" x2="152" y2="640"/><line x1="304" y1="0" x2="304" y2="640"/>
    <line x1="456" y1="0" x2="456" y2="640"/><line x1="608" y1="0" x2="608" y2="640"/>
    <line x1="760" y1="0" x2="760" y2="640"/><line x1="912" y1="0" x2="912" y2="640"/>
    <line x1="1064" y1="0" x2="1064" y2="640"/>
  </g>
  <text x="60" y="70" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="bold" fill="#e8eef4">Hermes Agent v0.23.3 → v0.23.4</text>
  <text x="60" y="102" font-family="'SF Mono','Courier New',monospace" font-size="17" fill="#5a8a6a">SIX DAYS · ~600 MERGED PRs · RELEASED NOV 19 + NOV 23, 2026</text>

  <!-- PR bars -->
  <text x="60" y="168" font-family="'SF Mono','Courier New',monospace" font-size="15" fill="#5a8a6a" letter-spacing="2">PULL REQUESTS MERGED PER RELEASE WINDOW</text>
  <rect x="60" y="190" width="560" height="46" rx="6" fill="#10B981" opacity="0.85" filter="url(#glow)"/>
  <text x="640" y="221" font-family="'SF Mono','Courier New',monospace" font-size="24" font-weight="bold" fill="#10B981" text-anchor="end">v0.23.3 · 370 PRs</text>
  <rect x="60" y="252" width="347" height="46" rx="6" fill="#0ea5a4" opacity="0.85" filter="url(#glow)"/>
  <text x="427" y="283" font-family="'SF Mono','Courier New',monospace" font-size="24" font-weight="bold" fill="#0ea5a4" text-anchor="end">v0.23.4 · 229 PRs</text>
  <line x1="652" y1="190" x2="652" y2="298" stroke="#5a8a6a" stroke-dasharray="4 4"/>
  <text x="662" y="230" font-family="'SF Mono','Courier New',monospace" font-size="15" fill="#5a8a6a">618 PRs in the</text>
  <text x="662" y="250" font-family="'SF Mono','Courier New',monospace" font-size="15" fill="#5a8a6a">earlier v0.23.1 window</text>
  <text x="662" y="281" font-family="'SF Mono','Courier New',monospace" font-size="15" fill="#666">(for reference)</text>

  <!-- Stats row -->
  <g font-family="'SF Mono','Courier New',monospace">
    <text x="60" y="360" font-size="14" fill="#5a8a6a" letter-spacing="2">COMMITS (NON-MERGE)</text>
    <text x="60" y="392" font-size="30" font-weight="bold" fill="#e8eef4">2,779</text>
    <text x="60" y="414" font-size="13" fill="#666">across both windows</text>

    <text x="330" y="360" font-size="14" fill="#5a8a6a" letter-spacing="2">ISSUES CLOSED</text>
    <text x="330" y="392" font-size="30" font-weight="bold" fill="#e8eef4">341</text>
    <text x="330" y="414" font-size="13" fill="#666">60 + 281</text>

    <text x="580" y="360" font-size="14" fill="#5a8a6a" letter-spacing="2">LINES CHANGED</text>
    <text x="580" y="392" font-size="30" font-weight="bold" fill="#e8eef4">+319k</text>
    <text x="580" y="414" font-size="13" fill="#666">−159k across 5,264 files</text>

    <text x="880" y="360" font-size="14" fill="#5a8a6a" letter-spacing="2">CATALOG CAP</text>
    <text x="880" y="392" font-size="30" font-weight="bold" fill="#10B981">2 → 16 MiB</text>
    <text x="880" y="414" font-size="13" fill="#666">plugin installs fixed</text>
  </g>

  <!-- Feature flow -->
  <text x="60" y="470" font-family="'SF Mono','Courier New',monospace" font-size="15" fill="#5a8a6a" letter-spacing="2">WHAT SHIPPED</text>
  <g font-family="'SF Mono','Courier New',monospace" font-size="16" fill="#e8eef4">
    <rect x="60" y="492" width="240" height="72" rx="8" fill="#0d1b2a" stroke="#1a2a3a"/>
    <text x="80" y="522" fill="#10B981" font-weight="bold">prompt cache</text>
    <text x="80" y="546" fill="#5a8a6a" font-size="13">warming + auto TTL</text>

    <line x1="304" y1="528" x2="330" y2="528" stroke="#10B981" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="336" y="492" width="240" height="72" rx="8" fill="#0d1b2a" stroke="#1a2a3a"/>
    <text x="356" y="522" fill="#10B981" font-weight="bold">plugins config</text>
    <text x="356" y="546" fill="#5a8a6a" font-size="13">edit settings in terminal</text>

    <line x1="580" y1="528" x2="606" y2="528" stroke="#10B981" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="612" y="492" width="240" height="72" rx="8" fill="#0d1b2a" stroke="#1a2a3a"/>
    <text x="632" y="522" fill="#10B981" font-weight="bold">run-elsewhere</text>
    <text x="632" y="546" fill="#5a8a6a" font-size="13">sandbox marker guard</text>

    <line x1="856" y1="528" x2="882" y2="528" stroke="#10B981" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="888" y="492" width="268" height="72" rx="8" fill="#0d1b2a" stroke="#1a2a3a"/>
    <text x="908" y="522" fill="#10B981" font-weight="bold">gateway migrate</text>
    <text x="908" y="546" fill="#5a8a6a" font-size="13">--backends consolidation</text>
  </g>
  <text x="60" y="612" font-family="'SF Mono','Courier New',monospace" font-size="13" fill="#666">Sources: github.com/NousResearch/hermes-agent release notes v0.23.3 &amp; v0.23.4, fetched 2026-11-24</text>
</svg>
