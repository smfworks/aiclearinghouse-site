<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840">
  <!-- DeepSeek super-agent: design reference, not dependency. No-text hero. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001F3F"/>
      <stop offset="1" stop-color="#0a1626"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ea580c"/>
      <stop offset="1" stop-color="#C9A96E"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D4FF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#00D4FF" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="840" fill="url(#bg)"/>

  <!-- faint grid, machine-paper feel -->
  <g stroke="#00D4FF" stroke-opacity="0.06" stroke-width="1">
    <path d="M 100 0 V 840 M 300 0 V 840 M 500 0 V 840 M 700 0 V 840 M 900 0 V 840 M 1100 0 V 840 M 1300 0 V 840 M 1500 0 V 840"/>
    <path d="M 0 120 H 1600 M 0 240 H 1600 M 0 360 H 1600 M 0 480 H 1600 M 0 600 H 1600 M 0 720 H 1600"/>
  </g>

  <!-- incoming event stream (left): many dots, most grey = filtered noise -->
  <g>
    <circle cx="120" cy="180" r="7" fill="#3b4a5a"/>
    <circle cx="150" cy="240" r="7" fill="#3b4a5a"/>
    <circle cx="110" cy="310" r="7" fill="#3b4a5a"/>
    <circle cx="165" cy="380" r="7" fill="#3b4a5a"/>
    <circle cx="125" cy="455" r="7" fill="#3b4a5a"/>
    <circle cx="150" cy="530" r="7" fill="#3b4a5a"/>
    <circle cx="105" cy="600" r="7" fill="#3b4a5a"/>
    <circle cx="160" cy="670" r="7" fill="#3b4a5a"/>
    <!-- the few that pass the gate -->
    <circle cx="140" cy="265" r="10" fill="#00D4FF"/>
    <circle cx="130" cy="565" r="10" fill="#00D4FF"/>
    <circle cx="145" cy="415" r="10" fill="#00D4FF"/>
  </g>

  <!-- flow lines from events to the gate -->
  <g stroke="url(#flow)" stroke-width="3" fill="none">
    <path d="M 160 265 C 300 265, 380 300, 520 330"/>
    <path d="M 155 415 C 300 415, 380 395, 520 370"/>
    <path d="M 165 565 C 300 565, 380 480, 520 420"/>
  </g>
  <g stroke="#3b4a5a" stroke-width="2" fill="none" stroke-dasharray="4 8" stroke-opacity="0.5">
    <path d="M 150 180 C 280 190, 360 250, 500 300"/>
    <path d="M 150 240 C 260 260, 360 280, 500 315"/>
    <path d="M 120 310 C 250 330, 380 340, 505 345"/>
    <path d="M 150 530 C 290 525, 390 470, 510 435"/>
    <path d="M 110 600 C 270 590, 390 500, 505 445"/>
    <path d="M 155 670 C 300 640, 400 540, 510 455"/>
  </g>

  <!-- central gate: an aperture that only some events pass -->
  <g>
    <rect x="520" y="270" width="180" height="300" rx="18" fill="none" stroke="url(#gate)" stroke-width="6"/>
    <rect x="560" y="330" width="100" height="180" rx="10" fill="url(#gate)" fill-opacity="0.12" stroke="#ea580c" stroke-width="2"/>
    <!-- check marks: accepted -->
    <path d="M 585 385 l 16 16 l 30 -34" stroke="#C9A96E" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 585 465 l 16 16 l 30 -34" stroke="#C9A96E" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- accepted flow to workers -->
  <g stroke="#00D4FF" stroke-width="4" fill="none" stroke-opacity="0.85">
    <path d="M 700 330 C 820 330, 880 240, 1000 240"/>
    <path d="M 700 370 C 830 370, 890 400, 1000 400"/>
    <path d="M 700 410 C 820 410, 880 560, 1000 560"/>
  </g>

  <!-- worker panes: three isolated boxes (right) -->
  <g>
    <rect x="1000" y="185" width="330" height="110" rx="12" fill="#0d1f33" stroke="#00D4FF" stroke-width="3"/>
    <rect x="1000" y="345" width="330" height="110" rx="12" fill="#0d1f33" stroke="#00D4FF" stroke-width="3"/>
    <rect x="1000" y="505" width="330" height="110" rx="12" fill="#0d1f33" stroke="#00D4FF" stroke-width="3"/>
    <!-- code-ish lines inside each pane -->
    <g stroke="#C9A96E" stroke-width="5" stroke-linecap="round">
      <line x1="1030" y1="220" x2="1260" y2="220"/>
      <line x1="1030" y1="245" x2="1180" y2="245"/>
      <line x1="1030" y1="380" x2="1250" y2="380"/>
      <line x1="1030" y1="405" x2="1140" y2="405"/>
      <line x1="1030" y1="540" x2="1240" y2="540"/>
      <line x1="1030" y1="565" x2="1170" y2="565"/>
    </g>
  </g>

  <!-- the shovel, left in the ground: bottom-right quiet vignette -->
  <g transform="translate(1380,700) rotate(24)">
    <rect x="0" y="0" width="10" height="86" rx="4" fill="#C9A96E"/>
    <path d="M -2 86 h 14 l 6 26 q -13 10 -26 0 z" fill="#8a8f98"/>
    <rect x="-8" y="-8" width="26" height="10" rx="4" fill="#ea580c"/>
  </g>
  <ellipse cx="1398" cy="818" rx="90" ry="12" fill="#001F3F"/>
  <path d="M 1290 820 q 110 -26 220 0 l 0 20 l -220 0 z" fill="#0d1f33"/>

  <!-- small node accents, corners -->
  <circle cx="80" cy="80" r="4" fill="#ea580c"/>
  <circle cx="1540" cy="80" r="4" fill="#00D4FF"/>
  <circle cx="1540" cy="760" r="4" fill="#C9A96E"/>
</svg>
