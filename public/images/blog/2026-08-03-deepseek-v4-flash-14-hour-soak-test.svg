<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" width="1200" height="624">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#06141e"/>
    </linearGradient>
    <linearGradient id="throughputGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#76b900" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#76b900" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="624" fill="url(#bg)"/>

  <!-- Grid -->
  <g opacity="0.1" stroke="#1a3a2a" stroke-width="0.5">
    <line x1="0" y1="156" x2="1200" y2="156"/>
    <line x1="0" y1="312" x2="1200" y2="312"/>
    <line x1="0" y1="468" x2="1200" y2="468"/>
  </g>

  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="30" font-weight="700" fill="#e8eef4" filter="url(#textGlow)">14.7-Hour Soak Test: DeepSeek V4 Flash on the DGX Spark</text>
  <text x="600" y="72" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="13" fill="#76b900">971 requests · 220K tokens · 0 errors · 0 crashes</text>

  <!-- Throughput timeline chart (left/center) -->
  <g transform="translate(80, 100)">
    <text x="250" y="-10" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="11" fill="#5a8a5a">THROUGHPUT OVER 14.7 HOURS (tok/s by hour)</text>

    <!-- Y axis -->
    <line x1="0" y1="0" x2="0" y2="240" stroke="#1a3a2a" stroke-width="1"/>
    <line x1="0" y1="240" x2="500" y2="240" stroke="#1a3a2a" stroke-width="1"/>

    <!-- Gridlines -->
    <line x1="0" y1="60" x2="500" y2="60" stroke="#1a2a3a" stroke-width="0.5" stroke-dasharray="3,3"/>
    <line x1="0" y1="120" x2="500" y2="120" stroke="#1a2a3a" stroke-width="0.5" stroke-dasharray="3,3"/>
    <line x1="0" y1="180" x2="500" y2="180" stroke="#1a2a3a" stroke-width="0.5" stroke-dasharray="3,3"/>
    <text x="-8" y="64" text-anchor="end" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#4a6a4a">12</text>
    <text x="-8" y="124" text-anchor="end" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#4a6a4a">9</text>
    <text x="-8" y="184" text-anchor="end" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#4a6a4a">6</text>
    <text x="-8" y="244" text-anchor="end" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#4a6a4a">3</text>

    <!-- Bars: 15 hours of data (0-14) -->
    <!-- Hour 0: 11.2 -->
    <rect x="10" y="56" width="28" height="184" fill="url(#throughputGrad)" stroke="#76b900" stroke-width="1" rx="2"/>
    <!-- Hour 1: 10.7 -->
    <rect x="42" y="66" width="28" height="174" fill="url(#throughputGrad)" stroke="#76b900" stroke-width="1" rx="2"/>
    <!-- Hour 2: 10.6 -->
    <rect x="74" y="68" width="28" height="172" fill="url(#throughputGrad)" stroke="#76b900" stroke-width="1" rx="2"/>
    <!-- Hour 3: 10.3 -->
    <rect x="106" y="74" width="28" height="166" fill="url(#throughputGrad)" stroke="#76b900" stroke-width="1" rx="2"/>
    <!-- Hour 4: 9.9 -->
    <rect x="138" y="82" width="28" height="158" fill="url(#throughputGrad)" stroke="#76b900" stroke-width="1" rx="2"/>
    <!-- Hour 5: 9.2 -->
    <rect x="170" y="96" width="28" height="144" fill="url(#throughputGrad)" stroke="#76b900" stroke-width="1" rx="2"/>
    <!-- Hour 6: 9.3 -->
    <rect x="202" y="94" width="28" height="146" fill="url(#throughputGrad)" stroke="#76b900" stroke-width="1" rx="2"/>
    <!-- Hour 7: 9.1 -->
    <rect x="234" y="98" width="28" height="142" fill="url(#throughputGrad)" stroke="#76b900" stroke-width="1" rx="2"/>
    <!-- Hour 8: 9.1 -->
    <rect x="266" y="98" width="28" height="142" fill="url(#throughputGrad)" stroke="#76b900" stroke-width="1" rx="2"/>
    <!-- Hour 9: 8.9 -->
    <rect x="298" y="102" width="28" height="138" fill="url(#throughputGrad)" stroke="#76b900" stroke-width="1" rx="2"/>
    <!-- Hour 10: 8.4 -->
    <rect x="330" y="112" width="28" height="128" fill="url(#throughputGrad)" stroke="#76b900" stroke-width="1" rx="2"/>
    <!-- Hour 11: 8.2 -->
    <rect x="362" y="116" width="28" height="124" fill="url(#throughputGrad)" stroke="#76b900" stroke-width="1" rx="2"/>
    <!-- Hour 12: 8.3 -->
    <rect x="394" y="114" width="28" height="126" fill="url(#throughputGrad)" stroke="#76b900" stroke-width="1" rx="2"/>
    <!-- Hour 13: 8.2 -->
    <rect x="426" y="116" width="28" height="124" fill="url(#throughputGrad)" stroke="#76b900" stroke-width="1" rx="2"/>
    <!-- Hour 14: 7.8 -->
    <rect x="458" y="124" width="28" height="116" fill="#2a4a1a" stroke="#5a8a3a" stroke-width="1" rx="2"/>

    <!-- Trend line overlay -->
    <polyline points="24,56 56,66 88,68 120,74 152,82 184,96 216,94 248,98 280,98 312,102 344,112 376,116 408,114 440,116 472,124" fill="none" stroke="#76b900" stroke-width="2" opacity="0.5" filter="url(#glow)"/>

    <!-- X axis labels -->
    <text x="24" y="258" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#4a6a4a">0h</text>
    <text x="152" y="258" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#4a6a4a">4h</text>
    <text x="280" y="258" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#4a6a4a">8h</text>
    <text x="408" y="258" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#4a6a4a">12h</text>
    <text x="472" y="258" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#5a8a5a">14h</text>
  </g>

  <!-- Right side: key metrics -->
  <g transform="translate(680, 100)">
    <text x="200" y="-10" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="11" fill="#5a8a5a">STABILITY METRICS</text>

    <!-- Big numbers -->
    <text x="20" y="30" font-family="SF Mono, Courier New, monospace" font-size="9" fill="#666">DURATION</text>
    <text x="20" y="55" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="22" font-weight="700" fill="#76b900" filter="url(#textGlow)">14.7h</text>

    <text x="130" y="30" font-family="SF Mono, Courier New, monospace" font-size="9" fill="#666">ITERATIONS</text>
    <text x="130" y="55" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="22" font-weight="700" fill="#76b900" filter="url(#textGlow)">971</text>

    <text x="250" y="30" font-family="SF Mono, Courier New, monospace" font-size="9" fill="#666">ERRORS</text>
    <text x="250" y="55" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="22" font-weight="700" fill="#76b900" filter="url(#textGlow)">0</text>

    <text x="330" y="30" font-family="SF Mono, Courier New, monospace" font-size="9" fill="#666">TOKENS</text>
    <text x="330" y="55" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="22" font-weight="700" fill="#76b900" filter="url(#textGlow)">220K</text>

    <!-- Divider -->
    <line x1="0" y1="80" x2="400" y2="80" stroke="#1a3a2a" stroke-width="0.5"/>

    <!-- Spec accept by prompt type -->
    <text x="20" y="105" font-family="SF Mono, Courier New, monospace" font-size="9" fill="#666">SPEC ACCEPT BY TYPE</text>

    <text x="20" y="125" font-family="SF Mono, Courier New, monospace" font-size="10" fill="#e8eef4">Tool calls</text>
    <rect x="120" y="118" width="91" height="12" fill="#76b900" opacity="0.5" rx="2"/>
    <text x="216" y="128" font-family="SF Mono, Courier New, monospace" font-size="10" font-weight="700" fill="#76b900">91%</text>

    <text x="20" y="143" font-family="SF Mono, Courier New, monospace" font-size="10" fill="#e8eef4">Reasoning</text>
    <rect x="120" y="136" width="84" height="12" fill="#76b900" opacity="0.4" rx="2"/>
    <text x="209" y="146" font-family="SF Mono, Courier New, monospace" font-size="10" font-weight="700" fill="#76b900">84%</text>

    <text x="20" y="161" font-family="SF Mono, Courier New, monospace" font-size="10" fill="#e8eef4">Math</text>
    <rect x="120" y="154" width="84" height="12" fill="#76b900" opacity="0.4" rx="2"/>
    <text x="209" y="164" font-family="SF Mono, Courier New, monospace" font-size="10" font-weight="700" fill="#76b900">84%</text>

    <text x="20" y="179" font-family="SF Mono, Courier New, monospace" font-size="10" fill="#e8eef4">Knowledge</text>
    <rect x="120" y="172" width="76" height="12" fill="#76b900" opacity="0.3" rx="2"/>
    <text x="201" y="182" font-family="SF Mono, Courier New, monospace" font-size="10" fill="#76b900">76%</text>

    <text x="20" y="197" font-family="SF Mono, Courier New, monospace" font-size="10" fill="#e8eef4">Coding</text>
    <rect x="120" y="190" width="70" height="12" fill="#76b900" opacity="0.3" rx="2"/>
    <text x="195" y="200" font-family="SF Mono, Courier New, monospace" font-size="10" fill="#76b900">70%</text>

    <text x="20" y="215" font-family="SF Mono, Courier New, monospace" font-size="10" fill="#e8eef4">Creative</text>
    <rect x="120" y="208" width="58" height="12" fill="#76b900" opacity="0.2" rx="2"/>
    <text x="183" y="218" font-family="SF Mono, Courier New, monospace" font-size="10" fill="#5a8a5a">58%</text>

    <!-- Divider -->
    <line x1="0" y1="232" x2="400" y2="232" stroke="#1a3a2a" stroke-width="0.5"/>

    <!-- Throughput degradation callout -->
    <text x="20" y="255" font-family="SF Mono, Courier New, monospace" font-size="9" fill="#666">THROUGHPUT DRIFT</text>
    <text x="20" y="275" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="16" font-weight="700" fill="#ff9500">-27.9%</text>
    <text x="110" y="275" font-family="SF Mono, Courier New, monospace" font-size="10" fill="#5a8a5a">11.2 → 7.8 tok/s</text>
    <text x="20" y="290" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">gradual decline (thermal)</text>
  </g>

  <!-- Bottom stats bar -->
  <g transform="translate(60, 400)">
    <rect x="0" y="0" width="1080" height="70" rx="8" fill="#0d1f12" stroke="#1a3a2a" stroke-width="1" opacity="0.8"/>

    <text x="30" y="20" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">CRASHES</text>
    <text x="30" y="42" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="16" font-weight="700" fill="#76b900">0</text>
    <text x="30" y="58" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#5a8a5a">zero crashes</text>

    <text x="160" y="20" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">MEMORY LEAKS</text>
    <text x="160" y="42" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="16" font-weight="700" fill="#76b900">0</text>
    <text x="160" y="58" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#5a8a5a">RSS stable at 3.0 GB</text>

    <text x="370" y="20" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">TOOL CALLS</text>
    <text x="370" y="42" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="16" font-weight="700" fill="#76b900">121</text>
    <text x="370" y="58" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#5a8a5a">100% success rate</text>

    <text x="560" y="20" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">SLOWEST REQUEST</text>
    <text x="560" y="42" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="16" font-weight="700" fill="#ff9500">1.8</text>
    <text x="560" y="58" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#5a8a5a">tok/s (iter 321, recovered)</text>

    <text x="800" y="20" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">VERDICT</text>
    <text x="800" y="42" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="16" font-weight="700" fill="#76b900" filter="url(#textGlow)">STABLE</text>
    <text x="800" y="58" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#5a8a5a">production-ready</text>
  </g>

  <!-- Bottom tagline -->
  <text x="600" y="530" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="18" font-weight="600" fill="#e8eef4">971 requests over 14.7 hours — zero errors, zero crashes</text>
  <text x="600" y="555" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="13" fill="#76b900" filter="url(#textGlow)">The ds4 server on the DGX Spark is stable under sustained load</text>
</svg>