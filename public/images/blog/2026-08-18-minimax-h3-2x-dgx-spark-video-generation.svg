      <text x="198" y="12" font-family="'SF Mono',monospace" font-size="8" fill="#00d4aa">221s</text>
      <text x="290" y="12" font-family="'SF Mono',monospace" font-size="8" fill="#5a8a6a">1×: 579s</text>
