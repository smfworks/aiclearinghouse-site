      <rect x="80" y="5" width="440" height="12" rx="2" fill="#1a2a3a"/>
      <rect x="80" y="5" width="214" height="12" rx="2" fill="#ff9500"/>
      <text x="530" y="14" font-family="'SF Mono',monospace" font-size="9" fill="#ff9500">106.9s</text>
