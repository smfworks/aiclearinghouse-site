      <rect x="140" y="0" width="8" height="4"/><rect x="180" y="0" width="8" height="4"/><rect x="220" y="0" width="8" height="4"/>
      <rect x="260" y="0" width="8" height="4"/><rect x="300" y="0" width="8" height="4"/><rect x="340" y="0" width="8" height="4"/>
      <rect x="380" y="0" width="8" height="4"/><rect x="420" y="0" width="8" height="4"/><rect x="460" y="0" width="8" height="4"/>
      <rect x="500" y="0" width="8" height="4"/><rect x="540" y="0" width="8" height="4"/><rect x="580" y="0" width="8" height="4"/>
      <rect x="620" y="0" width="8" height="4"/><rect x="660" y="0" width="8" height="4"/><rect x="700" y="0" width="8" height="4"/>
      <rect x="740" y="0" width="8" height="4"/><rect x="780" y="0" width="8" height="4"/><rect x="820" y="0" width="8" height="4"/>
      <rect x="860" y="0" width="8" height="4"/><rect x="900" y="0" width="8" height="4"/><rect x="940" y="0" width="8" height="4"/>
      <rect x="980" y="0" width="8" height="4"/><rect x="1020" y="0" width="8" height="4"/><rect x="1060" y="0" width="8" height="4"/>
      <rect x="1100" y="0" width="8" height="4"/><rect x="1140" y="0" width="8" height="4"/><rect x="1180" y="0" width="8" height="4"/>
