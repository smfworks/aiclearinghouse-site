<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="624" viewBox="0 0 1200 624">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#06141e"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2a3a"/>
      <stop offset="100%" stop-color="#0a1a2a"/>
    </linearGradient>
    <linearGradient id="filmGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#76b900" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00d4aa" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00d4aa"/>
    </marker>
  </defs>

  <rect width="1200" height="624" fill="url(#bg)"/>

  <!-- Grid -->
  <g opacity="0.1">
    <line x1="0" y1="156" x2="1200" y2="156" stroke="#1a2a3a"/>
    <line x1="0" y1="312" x2="1200" y2="312" stroke="#1a2a3a"/>
    <line x1="0" y1="468" x2="1200" y2="468" stroke="#1a2a3a"/>
    <line x1="300" y1="0" x2="300" y2="624" stroke="#1a2a3a"/>
    <line x1="600" y1="0" x2="600" y2="624" stroke="#1a2a3a"/>
    <line x1="900" y1="0" x2="900" y2="624" stroke="#1a2a3a"/>
