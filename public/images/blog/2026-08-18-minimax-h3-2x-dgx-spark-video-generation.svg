      <rect x="80" y="5" width="440" height="12" rx="2" fill="#1a2a3a"/>
      <rect x="80" y="5" width="44" height="12" rx="2" fill="#00d4aa" filter="url(#glow)"/>
      <text x="530" y="14" font-family="'SF Mono',monospace" font-size="9" fill="#00d4aa">22.0s</text>
    </g>
    <g transform="translate(0, 28)">
      <text x="0" y="14" font-family="'SF Mono',monospace" font-size="9" fill="#5a8a6a">640×384</text>
      <rect x="80" y="5" width="440" height="12" rx="2" fill="#1a2a3a"/>
