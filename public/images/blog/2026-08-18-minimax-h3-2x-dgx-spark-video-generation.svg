  <text x="600" y="62" text-anchor="middle" font-family="'SF Mono','Courier New',monospace" font-size="12" fill="#5a8a6a">Ray TP=2 · Ulysses SP · NCCL/RoCE v2 · Online FP8 · $0.00 per video</text>

