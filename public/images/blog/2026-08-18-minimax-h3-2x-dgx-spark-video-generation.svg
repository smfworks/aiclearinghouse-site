    <text x="90" y="196" text-anchor="middle" font-family="'SF Mono',monospace" font-size="9" fill="#e8eef4">Rank 0</text>
    <text x="90" y="216" text-anchor="middle" font-family="'SF Mono',monospace" font-size="8" fill="#5a8a6a">Encoders + VAE</text>
    <text x="90" y="232" text-anchor="middle" font-family="'SF Mono',monospace" font-size="8" fill="#5a8a6a">+ MP4 encode</text>
