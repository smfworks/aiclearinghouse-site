      <rect x="80" y="5" width="440" height="12" rx="2" fill="#1a2a3a"/>
      <rect x="80" y="5" width="114" height="12" rx="2" fill="#00d4aa" filter="url(#glow)"/>
      <text x="530" y="14" font-family="'SF Mono',monospace" font-size="9" fill="#00d4aa">57.2s</text>
