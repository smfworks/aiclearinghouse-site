<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2e"/>
      <stop offset="1" stop-color="#132642"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- subtle grid -->
  <g stroke="#1d3557" stroke-width="1" opacity="0.35">
    <path d="M0 105 H1200 M0 210 H1200 M0 315 H1200 M0 420 H1200 M0 525 H1200"/>
    <path d="M150 0 V630 M300 0 V630 M450 0 V630 M600 0 V630 M750 0 V630 M900 0 V630 M1050 0 V630"/>
  </g>
  <!-- script document, outside the fence -->
  <g>
    <rect x="150" y="205" width="150" height="220" rx="14" fill="#1b2f4d" stroke="#3e5c8a" stroke-width="2.5"/>
    <path d="M180 255 h90 M180 285 h90 M180 315 h60" stroke="#7fa3d1" stroke-width="5" stroke-linecap="round"/>
    <circle cx="225" cy="380" r="13" fill="none" stroke="#4fd1c5" stroke-width="3"/>
    <path d="M219 380 l4 5 8 -10" stroke="#4fd1c5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- fence between document and server -->
  <g stroke="#f5a623" stroke-width="6" stroke-linecap="round">
    <line x1="430" y1="160" x2="430" y2="470"/>
    <line x1="490" y1="160" x2="490" y2="470"/>
    <line x1="550" y1="160" x2="550" y2="470"/>
    <line x1="610" y1="160" x2="610" y2="470"/>
    <line x1="400" y1="215" x2="640" y2="215"/>
    <line x1="400" y1="315" x2="640" y2="315"/>
    <line x1="400" y1="415" x2="640" y2="415"/>
  </g>
  <!-- denied path arcs from doc to fence -->
  <g stroke="#e4574f" stroke-width="3.5" fill="none" stroke-dasharray="7 9" stroke-linecap="round">
    <path d="M310 250 C 350 240, 375 240, 398 262"/>
    <path d="M310 380 C 350 390, 375 390, 398 368"/>
  </g>
  <!-- allowed path, through gate to server -->
  <g stroke="#4fd1c5" stroke-width="3.5" fill="none" stroke-linecap="round">
    <path d="M310 315 H 396"/>
    <path d="M644 315 H 760"/>
    <path d="M752 307 l10 8 -10 8" fill="none" stroke-linejoin="round"/>
  </g>
  <!-- gate gap on middle rail -->
  <rect x="522" y="309" width="56" height="12" fill="#0f2138"/>
  <circle cx="550" cy="315" r="14" fill="#0f2138" stroke="#4fd1c5" stroke-width="3.5"/>
  <path d="M544 315 l4 5 8 -10" stroke="#4fd1c5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- server, inside the fence -->
  <g>
    <rect x="780" y="235" width="180" height="160" rx="14" fill="#1b2f4d" stroke="#3e5c8a" stroke-width="2.5"/>
    <line x1="805" y1="280" x2="935" y2="280" stroke="#f5a623" stroke-width="5" stroke-linecap="round"/>
    <line x1="805" y1="315" x2="935" y2="315" stroke="#f5a623" stroke-width="5" stroke-linecap="round" opacity="0.65"/>
    <line x1="805" y1="350" x2="890" y2="350" stroke="#f5a623" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
    <circle cx="922" cy="368" r="6" fill="#4fd1c5"/>
  </g>
  <!-- lock, bottom right -->
  <g>
    <rect x="1010" y="430" width="64" height="52" rx="10" fill="#f5a623"/>
    <path d="M1024 430 v-12 a18 18 0 0 1 36 0 v12" fill="none" stroke="#f5a623" stroke-width="7"/>
    <circle cx="1042" cy="452" r="6" fill="#0d1b2e"/>
  </g>
  <!-- accent bar -->
  <rect x="0" y="614" width="1200" height="16" fill="#f5a623"/>
</svg>
