<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="36%" cy="40%" r="72%">
      <stop offset="0%" stop-color="#141428"/>
      <stop offset="58%" stop-color="#0c0c16"/>
      <stop offset="100%" stop-color="#07070e"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6a6a90" stop-opacity="0.04"/>
      <stop offset="42%" stop-color="#8a8ab0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6a6a90" stop-opacity="0.06"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- inclination: a mark, not a verdict -->
  <circle cx="548" cy="292" r="3.4" fill="none" stroke="#8a7a6a" stroke-width="1.15" opacity="0.55"/>
  <!-- the gap the page will not close -->
  <rect x="575" y="291" width="52" height="1.5" fill="none"/>
  <!-- judgement: a separate line, not touching the mark -->
  <rect x="640" y="291" width="250" height="1.5" fill="url(#rule)"/>
  <text x="600" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#5a5a7a" opacity="0.65" letter-spacing="2.2">THE HEART IS NOT THE JUDGEMENT</text>
</svg>
