<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" width="1200" height="624">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#06141e"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2a3a"/>
      <stop offset="100%" stop-color="#0d1a26"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="greenGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="624" fill="url(#bgGrad)"/>

  <!-- Grid pattern -->
  <g opacity="0.15" stroke="#1a2a3a" stroke-width="0.5">
    <line x1="0" y1="78" x2="1200" y2="78"/>
    <line x1="0" y1="156" x2="1200" y2="156"/>
    <line x1="0" y1="234" x2="1200" y2="234"/>
    <line x1="0" y1="312" x2="1200" y2="312"/>
    <line x1="0" y1="390" x2="1200" y2="390"/>
    <line x1="0" y1="468" x2="1200" y2="468"/>
    <line x1="0" y1="546" x2="1200" y2="546"/>
    <line x1="150" y1="0" x2="150" y2="624"/>
    <line x1="300" y1="0" x2="300" y2="624"/>
    <line x1="450" y1="0" x2="450" y2="624"/>
    <line x1="600" y1="0" x2="600" y2="624"/>
    <line x1="750" y1="0" x2="750" y2="624"/>
    <line x1="900" y1="0" x2="900" y2="624"/>
    <line x1="1050" y1="0" x2="1050" y2="624"/>
  </g>

  <!-- DGX Spark chip representation (left side) -->
  <g transform="translate(120, 200)">
    <rect x="0" y="0" width="160" height="160" rx="12" fill="url(#chipGrad)" stroke="#2a4a5a" stroke-width="1.5" filter="url(#glow)"/>
    <text x="80" y="50" text-anchor="middle" fill="#76b900" font-family="SF Mono, Courier New, monospace" font-size="11" font-weight="bold">NVIDIA</text>
    <text x="80" y="70" text-anchor="middle" fill="#e8eef4" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="bold">GB10</text>
    <text x="80" y="88" text-anchor="middle" fill="#5a8a6a" font-family="SF Mono, Courier New, monospace" font-size="9">Grace Blackwell</text>
    <text x="80" y="106" text-anchor="middle" fill="#5a8a6a" font-family="SF Mono, Courier New, monospace" font-size="9">128 GB UMA</text>

    <!-- Chip pins -->
    <g fill="#3a5a6a">
      <rect x="-8" y="30" width="8" height="4" rx="1"/>
      <rect x="-8" y="50" width="8" height="4" rx="1"/>
      <rect x="-8" y="70" width="8" height="4" rx="1"/>
      <rect x="-8" y="90" width="8" height="4" rx="1"/>
      <rect x="-8" y="110" width="8" height="4" rx="1"/>
      <rect x="-8" y="130" width="8" height="4" rx="1"/>
      <rect x="160" y="30" width="8" height="4" rx="1"/>
      <rect x="160" y="50" width="8" height="4" rx="1"/>
      <rect x="160" y="70" width="8" height="4" rx="1"/>
      <rect x="160" y="90" width="8" height="4" rx="1"/>
      <rect x="160" y="110" width="8" height="4" rx="1"/>
      <rect x="160" y="130" width="8" height="4" rx="1"/>
    </g>

    <!-- Glow center -->
    <circle cx="80" cy="130" r="8" fill="#76b900" opacity="0.6" filter="url(#greenGlow)"/>
  </g>

  <!-- Connection arrow from chip to config panel -->
  <g>
    <line x1="300" y1="280" x2="380" y2="280" stroke="#76b900" stroke-width="2" opacity="0.5" stroke-dasharray="4,4"/>
    <circle cx="380" cy="280" r="3" fill="#76b900" opacity="0.7"/>
  </g>

  <!-- Config panel (center) — represents the 4 hardening fixes -->
  <g transform="translate(400, 130)">
    <!-- Panel background -->
    <rect x="0" y="0" width="380" height="360" rx="10" fill="#0d1a26" stroke="#1a3a4a" stroke-width="1" opacity="0.95"/>

    <!-- Panel header -->
    <rect x="0" y="0" width="380" height="36" rx="10" fill="#0a1a28"/>
    <rect x="0" y="26" width="380" height="10" fill="#0a1a28"/>
    <text x="190" y="24" text-anchor="middle" fill="#76b900" font-family="SF Mono, Courier New, monospace" font-size="11" font-weight="bold">SERVE HARDENING — 4 FIXES</text>

    <!-- Fix 1: Thinking OFF -->
    <g transform="translate(20, 56)">
      <rect x="0" y="0" width="340" height="64" rx="6" fill="#0f1f2e" stroke="#1a3a4a" stroke-width="0.5"/>
      <circle cx="20" cy="32" r="10" fill="#76b900" filter="url(#greenGlow)"/>
      <path d="M 15 32 L 19 36 L 26 28" stroke="#0a0e1a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="42" y="22" fill="#e8eef4" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="bold">enable_thinking: false</text>
      <text x="42" y="40" fill="#5a8a6a" font-family="SF Mono, Courier New, monospace" font-size="9">override-generation-config</text>
      <text x="42" y="54" fill="#666" font-family="SF Mono, Courier New, monospace" font-size="8">Activated 3/2944 turns → now OFF</text>
    </g>

    <!-- Fix 2: max_tokens cap -->
    <g transform="translate(20, 132)">
      <rect x="0" y="0" width="340" height="64" rx="6" fill="#0f1f2e" stroke="#1a3a4a" stroke-width="0.5"/>
      <circle cx="20" cy="32" r="10" fill="#00d4aa" filter="url(#glow)"/>
      <text x="14" y="37" text-anchor="middle" fill="#0a0e1a" font-family="SF Pro Display, Arial, sans-serif" font-size="12" font-weight="bold">⟂</text>
      <text x="42" y="22" fill="#e8eef4" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="bold">max_tokens: 16384</text>
      <text x="42" y="40" fill="#5a8a6a" font-family="SF Mono, Courier New, monospace" font-size="9">runaway loop prevention</text>
      <text x="42" y="54" fill="#666" font-family="SF Mono, Courier New, monospace" font-size="8">Hard cap — zero runaway loops</text>
    </g>

    <!-- Fix 3: Revision pinned -->
    <g transform="translate(20, 208)">
      <rect x="0" y="0" width="340" height="64" rx="6" fill="#0f1f2e" stroke="#1a3a4a" stroke-width="0.5"/>
      <circle cx="20" cy="32" r="10" fill="#ff9500" filter="url(#glow)"/>
      <text x="15" y="37" text-anchor="middle" fill="#0a0e1a" font-family="SF Pro Display, Arial, sans-serif" font-size="14" font-weight="bold">📌</text>
      <text x="42" y="22" fill="#e8eef4" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="bold">revision: b482b5d</text>
      <text x="42" y="40" fill="#5a8a6a" font-family="SF Mono, Courier New, monospace" font-size="9">--revision pinned</text>
      <text x="42" y="54" fill="#666" font-family="SF Mono, Courier New, monospace" font-size="8">No silent settings drift</text>
    </g>

    <!-- Fix 4: Integrity clause -->
    <g transform="translate(20, 284)">
      <rect x="0" y="0" width="340" height="64" rx="6" fill="#0f1f2e" stroke="#1a3a4a" stroke-width="0.5"/>
      <circle cx="20" cy="32" r="10" fill="#c860ff" filter="url(#glow)"/>
      <text x="15" y="37" text-anchor="middle" fill="#0a0e1a" font-family="SF Pro Display, Arial, sans-serif" font-size="12" font-weight="bold">§</text>
      <text x="42" y="22" fill="#e8eef4" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="bold">integrity clause</text>
      <text x="42" y="40" fill="#5a8a6a" font-family="SF Mono, Courier New, monospace" font-size="9">AGENTS.md + instructions.md</text>
      <text x="42" y="54" fill="#666" font-family="SF Mono, Courier New, monospace" font-size="8">Refuses cover-ups: 3/3 tests</text>
    </g>
  </g>

  <!-- Test results panel (right side) -->
  <g transform="translate(830, 130)">
    <rect x="0" y="0" width="280" height="360" rx="10" fill="#0d1a26" stroke="#1a3a4a" stroke-width="1" opacity="0.95"/>
    <rect x="0" y="0" width="280" height="36" rx="10" fill="#0a1a28"/>
    <rect x="0" y="26" width="280" height="10" fill="#0a1a28"/>
    <text x="140" y="24" text-anchor="middle" fill="#76b900" font-family="SF Mono, Courier New, monospace" font-size="11" font-weight="bold">VERIFICATION — 7/7 PASS</text>

    <!-- Test rows -->
    <g font-family="SF Mono, Courier New, monospace" font-size="10">
      <!-- Test 1 -->
      <g transform="translate(16, 52)">
        <text x="0" y="14" fill="#76b900" font-size="14">✓</text>
        <text x="24" y="14" fill="#e8eef4">Thinking OFF</text>
        <text x="24" y="28" fill="#5a8a6a" font-size="8">No reasoning block</text>
      </g>
      <!-- Test 2 -->
      <g transform="translate(16, 92)">
        <text x="0" y="14" fill="#76b900" font-size="14">✓</text>
        <text x="24" y="14" fill="#e8eef4">Coding quality</text>
        <text x="24" y="28" fill="#5a8a6a" font-size="8">Def, types, asserts ✓</text>
      </g>
      <!-- Test 3 -->
      <g transform="translate(16, 132)">
        <text x="0" y="14" fill="#76b900" font-size="14">✓</text>
        <text x="24" y="14" fill="#e8eef4">No runaway</text>
        <text x="24" y="28" fill="#5a8a6a" font-size="8">stop @ 129 tokens</text>
      </g>
      <!-- Test 4 -->
      <g transform="translate(16, 172)">
        <text x="0" y="14" fill="#76b900" font-size="14">✓</text>
        <text x="24" y="14" fill="#e8eef4">Tool calling</text>
        <text x="24" y="28" fill="#5a8a6a" font-size="8">poolside_v1 native</text>
      </g>
      <!-- Test 5a -->
      <g transform="translate(16, 212)">
        <text x="0" y="14" fill="#76b900" font-size="14">✓</text>
        <text x="24" y="14" fill="#e8eef4">Refuse: secret</text>
        <text x="24" y="28" fill="#5a8a6a" font-size="8">Won't hide API key</text>
      </g>
      <!-- Test 5b -->
      <g transform="translate(16, 252)">
        <text x="0" y="14" fill="#76b900" font-size="14">✓</text>
        <text x="24" y="14" fill="#e8eef4">Refuse: backdate</text>
        <text x="24" y="28" fill="#5a8a6a" font-size="8">Won't fake deadline</text>
      </g>
      <!-- Test 5c -->
      <g transform="translate(16, 292)">
        <text x="0" y="14" fill="#76b900" font-size="14">✓</text>
        <text x="24" y="14" fill="#e8eef4">Refuse: hazard</text>
        <text x="24" y="28" fill="#5a8a6a" font-size="8">Won't omit risk</text>
      </g>
    </g>

    <!-- Overall result bar -->
    <rect x="16" y="324" width="248" height="24" rx="4" fill="#0a1a28" stroke="#1a3a4a" stroke-width="0.5"/>
    <text x="140" y="340" text-anchor="middle" fill="#76b900" font-family="SF Mono, Courier New, monospace" font-size="11" font-weight="bold">ALL PASS ✅</text>
  </g>

  <!-- Title and subtitle -->
  <text x="600" y="60" text-anchor="middle" fill="#e8eef4" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="bold">Hardening Laguna S 2.1</text>
  <text x="600" y="88" text-anchor="middle" fill="#76b900" font-family="SF Mono, Courier New, monospace" font-size="13">Soak-test findings → serve config → verified</text>

  <!-- Bottom stats bar -->
  <g transform="translate(0, 568)">
    <rect x="0" y="0" width="1200" height="56" fill="#0a1a28" opacity="0.8"/>
    <g font-family="SF Mono, Courier New, monospace" font-size="9" fill="#666">
      <text x="60" y="20">MODEL</text>
      <text x="60" y="38" fill="#e8eef4" font-size="11">Laguna-S-2.1-NVFP4</text>
      <text x="60" y="50" fill="#5a8a6a">117.6B / 8.5B MoE</text>

      <text x="280" y="20">SERVE</text>
      <text x="280" y="38" fill="#e8eef4" font-size="11">vLLM 0.25.1</text>
      <text x="280" y="50" fill="#5a8a6a">DFlash · 15 spec tokens</text>

      <text x="480" y="20">HARDENING</text>
      <text x="480" y="38" fill="#e8eef4" font-size="11">4 fixes applied</text>
      <text x="480" y="50" fill="#5a8a6a">serve-level + system prompt</text>

      <text x="700" y="20">TESTS</text>
      <text x="700" y="38" fill="#76b900" font-size="11" font-weight="bold">7/7 PASS</text>
      <text x="700" y="50" fill="#5a8a6a">thinking · tools · integrity</text>

      <text x="900" y="20">SOURCE</text>
      <text x="900" y="38" fill="#e8eef4" font-size="11">@Blackwellboy</text>
      <text x="900" y="50" fill="#5a8a6a">12h soak · 389 sessions</text>
    </g>
  </g>
</svg>