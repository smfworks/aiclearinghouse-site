<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001F3F"/>
      <stop offset="55%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#051018"/>
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C9A96E" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="lock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0077A8" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- abstract envelope chain (left → center) -->
  <g opacity="0.95" filter="url(#glow)">
    <rect x="120" y="220" width="160" height="100" rx="14" fill="none" stroke="#00D4FF" stroke-width="3" stroke-opacity="0.55"/>
    <rect x="300" y="200" width="180" height="140" rx="16" fill="none" stroke="#C9A96E" stroke-width="3" stroke-opacity="0.7"/>
    <rect x="500" y="180" width="200" height="180" rx="18" fill="none" stroke="#ea580c" stroke-width="3.5" stroke-opacity="0.85"/>
  </g>

  <!-- dashed portability arcs -->
  <path d="M280 270 C340 120, 480 120, 600 250" fill="none" stroke="#C9A96E" stroke-width="2.5" stroke-dasharray="10 8" opacity="0.7"/>
  <path d="M280 300 C360 480, 520 500, 620 340" fill="none" stroke="#00D4FF" stroke-width="2.5" stroke-dasharray="10 8" opacity="0.55"/>

  <!-- central lock-ish monogram (no letters) -->
  <g transform="translate(600,315)">
    <circle r="78" fill="none" stroke="url(#orb)" stroke-width="6" opacity="0.9"/>
    <circle r="54" fill="#001F3F" stroke="#00D4FF" stroke-width="3" opacity="0.95"/>
    <rect x="-22" y="-6" width="44" height="36" rx="8" fill="url(#lock)"/>
    <path d="M-14 -6 V-28 a14 14 0 0 1 28 0 V-6" fill="none" stroke="#C9A96E" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="12" r="5" fill="#001F3F"/>
  </g>

  <!-- weaker sibling nodes (right) -->
  <g opacity="0.9">
    <circle cx="880" cy="200" r="28" fill="#0a1628" stroke="#ea580c" stroke-width="3"/>
    <circle cx="960" cy="315" r="36" fill="#0a1628" stroke="#C9A96E" stroke-width="3.5"/>
    <circle cx="880" cy="440" r="28" fill="#0a1628" stroke="#00D4FF" stroke-width="3"/>
    <path d="M700 280 L850 210" stroke="#ea580c" stroke-width="2" opacity="0.5"/>
    <path d="M700 315 L920 315" stroke="#C9A96E" stroke-width="2.5" opacity="0.65"/>
    <path d="M700 350 L850 420" stroke="#00D4FF" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- bottom accent bar -->
  <rect x="0" y="600" width="1200" height="30" fill="#001F3F"/>
  <rect x="0" y="600" width="420" height="6" fill="#ea580c"/>
  <rect x="420" y="600" width="360" height="6" fill="#C9A96E"/>
  <rect x="780" y="600" width="420" height="6" fill="#00D4FF"/>
</svg>
