<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="cut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C792EA"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0b1020" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- compression cut -->
  <rect x="594" y="40" width="12" height="550" fill="url(#cut)" rx="6"/>
  <!-- scattered fragments on the left (lost free-text) -->
  <g fill="#67e8f9" opacity="0.3">
    <rect x="180" y="120" width="90" height="8" rx="4"/>
    <rect x="240" y="150" width="60" height="8" rx="4"/>
    <rect x="160" y="210" width="120" height="8" rx="4"/>
    <rect x="300" y="260" width="50" height="8" rx="4"/>
    <rect x="200" y="330" width="80" height="8" rx="4"/>
    <rect x="270" y="400" width="70" height="8" rx="4"/>
    <rect x="190" y="460" width="100" height="8" rx="4"/>
    <rect x="310" y="500" width="55" height="8" rx="4"/>
  </g>
  <!-- the pinned contract crossing the boundary intact -->
  <rect x="440" y="250" width="320" height="130" fill="url(#pin)" opacity="0.12" rx="10"/>
  <rect x="440" y="250" width="320" height="130" fill="none" stroke="url(#pin)" stroke-width="3" opacity="0.85" rx="10"/>
  <g stroke="#C792EA" stroke-width="2" opacity="0.6" fill="none">
    <path d="M460,290 L740,290"/>
    <path d="M460,315 L700,315"/>
    <path d="M460,340 L720,340"/>
    <path d="M460,365 L680,365"/>
  </g>
  <!-- core glow at the boundary -->
  <circle cx="600" cy="315" r="180" fill="url(#core)" opacity="0.5"/>
  <!-- anchor points -->
  <g fill="#e0f2fe" opacity="0.8">
    <circle cx="440" cy="315" r="6"/>
    <circle cx="760" cy="315" r="6"/>
  </g>
</svg>