<?xml version="1.0" encoding="UTF-8"?>
<!-- Hero for "Don't Fill the Hole" — document gap vs disconnected gold guess vs teal lookup.
     Brand palette: navy #0a1628 / #1e3a8a, gold #f59e0b / #ff6b00, teal #0e7490 / #00d4ff. No text. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A navy document with an empty rectangular hole, a disconnected gold blob that does not fill it, and a teal lookup probe pointing at the gap">
  <defs>
    <linearGradient id="holeBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="50%" stop-color="#0c1a30"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <radialGradient id="holeGlowGold" cx="78%" cy="48%" r="44%">
      <stop offset="0%" stop-color="#ff6b00" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="holeGlowTeal" cx="24%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="holeGold" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ff6b00"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="holeChassis" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#122848"/>
      <stop offset="100%" stop-color="#0f2240"/>
    </linearGradient>
    <mask id="holeCut">
      <rect x="0" y="0" width="1200" height="630" fill="#fff"/>
      <rect x="168" y="228" width="196" height="132" rx="8" fill="#000"/>
    </mask>
  </defs>

  <rect width="1200" height="630" fill="url(#holeBg)"/>
  <rect width="1200" height="630" fill="url(#holeGlowGold)"/>
  <rect width="1200" height="630" fill="url(#holeGlowTeal)"/>

  <g stroke="#162236" stroke-width="2" fill="none">
    <rect x="48" y="48" width="1104" height="534" rx="4"/>
  </g>
  <g stroke="#13243d" stroke-width="1" opacity="0.45">
    <line x1="48" y1="210" x2="1152" y2="210"/>
    <line x1="48" y1="420" x2="1152" y2="420"/>
    <line x1="400" y1="48" x2="400" y2="582"/>
    <line x1="800" y1="48" x2="800" y2="582"/>
  </g>

  <!-- left: document with a punched hole -->
  <g mask="url(#holeCut)">
    <rect x="118" y="118" width="296" height="394" rx="10" fill="url(#holeChassis)" stroke="#1e3a8a" stroke-width="2"/>
    <g fill="#0e7490" opacity="0.55">
      <rect x="142" y="146" width="248" height="8" rx="2"/>
      <rect x="142" y="170" width="216" height="8" rx="2"/>
      <rect x="142" y="194" width="232" height="8" rx="2"/>
      <rect x="142" y="382" width="248" height="8" rx="2"/>
      <rect x="142" y="406" width="188" height="8" rx="2"/>
      <rect x="142" y="430" width="220" height="8" rx="2"/>
      <rect x="142" y="454" width="160" height="8" rx="2"/>
      <rect x="142" y="478" width="204" height="8" rx="2"/>
    </g>
  </g>
  <rect x="168" y="228" width="196" height="132" rx="8" fill="none" stroke="#0e7490" stroke-width="3" stroke-dasharray="10 9"/>

  <!-- floating gold guess: near the hole, not in it -->
  <g opacity="0.92">
    <circle cx="392" cy="188" r="38" fill="url(#holeGold)"/>
    <circle cx="392" cy="188" r="38" fill="none" stroke="#ff6b00" stroke-width="2" opacity="0.7"/>
  </g>
  <g fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 8" opacity="0.55">
    <path d="M372 214 C340 236 300 248 266 278"/>
  </g>

  <!-- right: lookup probe / tool chassis -->
  <g>
    <rect x="760" y="168" width="312" height="294" rx="12" fill="url(#holeChassis)" stroke="#1e3a8a" stroke-width="2"/>
    <rect x="788" y="196" width="256" height="42" rx="6" fill="#0e7490" opacity="0.85"/>
    <rect x="788" y="254" width="256" height="42" rx="6" fill="#0e7490" opacity="0.55"/>
    <rect x="788" y="312" width="256" height="42" rx="6" fill="#0e7490" opacity="0.32"/>
    <rect x="788" y="370" width="168" height="42" rx="6" fill="url(#holeGold)"/>
  </g>
  <g fill="none" stroke="#00d4ff" stroke-width="4" stroke-linecap="round">
    <path d="M760 292 L560 292"/>
    <path d="M560 292 L528 276"/>
    <path d="M560 292 L528 308"/>
  </g>
  <circle cx="504" cy="292" r="10" fill="#00d4ff"/>
</svg>
