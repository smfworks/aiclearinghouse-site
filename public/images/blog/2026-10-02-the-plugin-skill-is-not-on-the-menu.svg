<?xml version="1.0" encoding="UTF-8"?>
<!-- Hero: a menu board with three empty slots, and a separate cluster of lit chips that never connect.
     Brand palette. No visible text. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A dark menu board with three empty slots, and a separate cluster of lit chips that do not connect">
  <defs>
    <linearGradient id="menuBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="58%" stop-color="#0c1e36"/>
      <stop offset="100%" stop-color="#081018"/>
    </linearGradient>
    <radialGradient id="menuTeal" cx="78%" cy="42%" r="32%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="menuGold" cx="28%" cy="30%" r="28%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chipLit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b00"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="chipTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#menuBg)"/>
  <rect width="1200" height="630" fill="url(#menuTeal)"/>
  <rect width="1200" height="630" fill="url(#menuGold)"/>
  <rect x="48" y="40" width="1104" height="550" rx="8" fill="none" stroke="#162236" stroke-width="2"/>

  <!-- menu board -->
  <rect x="120" y="96" width="520" height="438" rx="10" fill="#0d1a2c" stroke="#1e3a5f" stroke-width="2"/>
  <rect x="156" y="128" width="72" height="8" rx="2" fill="#f59e0b" opacity="0.85"/>

  <!-- three empty slots -->
  <rect x="156" y="176" width="448" height="86" rx="6" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="7 6" opacity="0.85"/>
  <rect x="180" y="206" width="210" height="8" rx="2" fill="#1a3050"/>
  <rect x="180" y="224" width="120" height="6" rx="2" fill="#14263f"/>

  <rect x="156" y="286" width="448" height="86" rx="6" fill="none" stroke="#0e7490" stroke-width="2" stroke-dasharray="7 6"/>
  <rect x="180" y="316" width="180" height="8" rx="2" fill="#1a3050"/>
  <rect x="180" y="334" width="96" height="6" rx="2" fill="#14263f"/>

  <rect x="156" y="396" width="448" height="86" rx="6" fill="none" stroke="#ff6b00" stroke-width="2" stroke-dasharray="7 6" opacity="0.8"/>
  <rect x="180" y="426" width="240" height="8" rx="2" fill="#1a3050"/>
  <rect x="180" y="444" width="140" height="6" rx="2" fill="#14263f"/>

  <!-- gap, then lit chips that do not reach the board -->
  <path d="M640 320 H710" fill="none" stroke="#1e3a5f" stroke-width="3" stroke-linecap="round"/>
  <path d="M748 320 H790" fill="none" stroke="#1e3a5f" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 8"/>

  <g>
    <rect x="820" y="168" width="92" height="36" rx="6" fill="url(#chipLit)"/>
    <rect x="928" y="168" width="92" height="36" rx="6" fill="url(#chipTeal)"/>
    <rect x="820" y="220" width="92" height="36" rx="6" fill="url(#chipTeal)"/>
    <rect x="928" y="220" width="92" height="36" rx="6" fill="#16345c" stroke="#00d4ff" stroke-width="2"/>
    <rect x="820" y="272" width="92" height="36" rx="6" fill="url(#chipLit)" opacity="0.85"/>
    <rect x="928" y="272" width="92" height="36" rx="6" fill="#123044" stroke="#f59e0b" stroke-width="2"/>
    <rect x="874" y="332" width="92" height="36" rx="6" fill="url(#chipTeal)" opacity="0.7"/>
    <rect x="874" y="384" width="92" height="36" rx="6" fill="#1a2a18" stroke="#ff6b00" stroke-width="2"/>
  </g>

  <circle cx="730" cy="320" r="5" fill="#f59e0b"/>
</svg>
