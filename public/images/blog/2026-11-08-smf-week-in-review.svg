<svg xmlns="http://www.w3.org/2000/svg" width="1216" height="640" viewBox="0 0 1216 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#06141e"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#76b900"/>
      <stop offset="1" stop-color="#3d6100"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9500"/>
      <stop offset="1" stop-color="#7a4900"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1216" height="640" fill="url(#bg)"/>
  <g stroke="#1a2a3a" stroke-width="1" opacity="0.3">
    <line x1="0" y1="80" x2="1216" y2="80"/><line x1="0" y1="160" x2="1216" y2="160"/>
    <line x1="0" y1="240" x2="1216" y2="240"/><line x1="0" y1="320" x2="1216" y2="320"/>
    <line x1="0" y1="400" x2="1216" y2="400"/><line x1="0" y1="480" x2="1216" y2="480"/>
    <line x1="0" y1="560" x2="1216" y2="560"/>
    <line x1="100" y1="0" x2="100" y2="640"/><line x1="300" y1="0" x2="300" y2="640"/>
    <line x1="500" y1="0" x2="500" y2="640"/><line x1="700" y1="0" x2="700" y2="640"/>
    <line x1="900" y1="0" x2="900" y2="640"/><line x1="1100" y1="0" x2="1100" y2="640"/>
  </g>

  <text x="60" y="70" fill="#e8eef4" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="700">Read the smoke before you score the model</text>
  <text x="60" y="102" fill="#5a8a6a" font-family="'SF Mono','Courier New',monospace" font-size="15">Week of 2026-11-01 to 2026-11-08 · 33 posts · 4 Cold Iron runs · smf-bench strict_v01</text>

  <text x="60" y="160" fill="#5a8a6a" font-family="'SF Mono','Courier New',monospace" font-size="14">COLD IRON THINKING-OFF SCORE, 157-ITEM SUITE</text>

  <!-- Bars: scale 77..153 across 560px width, baseline y=560 -->
  <!-- score -> height = (score/160)*300 approx; use proportional heights -->
  <g font-family="'SF Mono','Courier New',monospace">
    <!-- Grok 4.6 153 (reference row from the board) -->
    <rect x="130" y="273" width="70" height="287" fill="#0d3320" stroke="#5a8a6a" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="165" y="263" fill="#5a8a6a" font-size="13" text-anchor="middle">153</text>
    <text x="165" y="590" fill="#5a8a6a" font-size="11" text-anchor="middle">grok-4.6</text>
    <text x="165" y="606" fill="#5a8a6a" font-size="10" text-anchor="middle">board row</text>

    <!-- Crouton Alpha 140 -->
    <rect x="270" y="298" width="70" height="262" fill="url(#bar)"/>
    <text x="305" y="288" fill="#e8eef4" font-size="16" font-weight="700" text-anchor="middle">140</text>
    <text x="305" y="590" fill="#e8eef4" font-size="11" text-anchor="middle">crouton</text>
    <text x="305" y="606" fill="#5a8a6a" font-size="10" text-anchor="middle">effort=minimal</text>

    <!-- Hy4 131-136 band -->
    <rect x="410" y="304" width="70" height="256" fill="url(#bar)"/>
    <rect x="410" y="305" width="70" height="11" fill="#00d4aa" opacity="0.45"/>
    <text x="445" y="292" fill="#e8eef4" font-size="16" font-weight="700" text-anchor="middle">131</text>
    <text x="445" y="590" fill="#e8eef4" font-size="11" text-anchor="middle">hy4</text>
    <text x="445" y="606" fill="#5a8a6a" font-size="10" text-anchor="middle">true off ×3</text>

    <!-- Ripple 93 -->
    <rect x="550" y="486" width="70" height="74" fill="url(#bar2)"/>
    <text x="585" y="476" fill="#ff9500" font-size="16" font-weight="700" text-anchor="middle">93</text>
    <text x="585" y="590" fill="#e8eef4" font-size="11" text-anchor="middle">ripple-65b</text>
    <text x="585" y="606" fill="#5a8a6a" font-size="10" text-anchor="middle">non-reasoning</text>

    <!-- GLM 1104 77 -->
    <rect x="690" y="516" width="70" height="44" fill="url(#bar2)"/>
    <text x="725" y="506" fill="#ff9500" font-size="16" font-weight="700" text-anchor="middle">77</text>
    <text x="725" y="590" fill="#e8eef4" font-size="11" text-anchor="middle">glm-1104</text>
    <text x="725" y="606" fill="#5a8a6a" font-size="10" text-anchor="middle">local zig boot</text>
  </g>

  <text x="820" y="180" fill="#5a8a6a" font-family="'SF Mono','Courier New',monospace" font-size="13">SMOKE ONE REQUEST PER CALL</text>
  <g font-family="'SF Mono','Courier New',monospace" font-size="13">
    <rect x="820" y="200" width="14" height="14" fill="#0d3320" stroke="#5a8a6a" stroke-dasharray="3 2"/>
    <text x="844" y="212" fill="#5a8a6a">hy4 flag only: 64 reasoning toks</text>
    <rect x="820" y="226" width="14" height="14" fill="#00d4aa"/>
    <text x="844" y="238" fill="#00d4aa">hy4 effort=none: 0 reasoning toks</text>
    <rect x="820" y="252" width="14" height="14" fill="#76b900"/>
    <text x="844" y="264" fill="#76b900">crouton minimal: 26 rows leaked</text>
    <rect x="820" y="278" width="14" height="14" fill="#ff9500"/>
    <text x="844" y="290" fill="#ff9500">glm 1104: 0 on all 157 rows</text>
  </g>

  <text x="820" y="360" fill="#5a8a6a" font-family="'SF Mono','Courier New',monospace" font-size="13">MATH HOLE, 30-ITEM SUITE</text>
  <g font-family="'SF Mono','Courier New',monospace" font-size="13">
    <text x="820" y="390" fill="#5a8a6a">hy4 off mean</text><rect x="990" y="378" width="64" height="14" fill="#0d3320" stroke="#5a8a6a"/><text x="1062" y="390" fill="#5a8a6a"> 17.3</text>
    <text x="820" y="416" fill="#e8eef4">hy4 thinking on</text><rect x="990" y="404" width="86" height="14" fill="#00d4aa"/><text x="1084" y="416" fill="#00d4aa"> 23.0</text>
    <text x="820" y="442" fill="#e8eef4">crouton minimal</text><rect x="990" y="430" width="71" height="14" fill="#76b900"/><text x="1069" y="442" fill="#76b900"> 19.0</text>
  </g>

  <rect x="0" y="616" width="1216" height="24" fill="#000000" opacity="0.35"/>
  <text x="60" y="632" fill="#666" font-family="'SF Mono','Courier New',monospace" font-size="11">smfclearinghouse.com · week in review · scores as published in the week's Cold Iron posts · not re-run</text>
</svg>
