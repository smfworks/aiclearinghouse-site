<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001F3F"/>
      <stop offset="55%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#051018"/>
    </linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#C9A96E" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="wide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- deep search: single tall stack (left) - costly per episode -->
  <g filter="url(#glow)" opacity="0.95">
    <rect x="160" y="140" width="70" height="340" rx="12" fill="url(#deep)" opacity="0.35"/>
    <rect x="175" y="160" width="40" height="48" rx="6" fill="#ea580c" opacity="0.9"/>
    <rect x="175" y="220" width="40" height="48" rx="6" fill="#ea580c" opacity="0.75"/>
    <rect x="175" y="280" width="40" height="48" rx="6" fill="#C9A96E" opacity="0.8"/>
    <rect x="175" y="340" width="40" height="48" rx="6" fill="#C9A96E" opacity="0.65"/>
    <rect x="175" y="400" width="40" height="48" rx="6" fill="#00D4FF" opacity="0.55"/>
  </g>

  <!-- arrow amortize -->
  <path d="M280 315 L360 315" stroke="#C9A96E" stroke-width="4" stroke-linecap="round" marker-end="url(#m)"/>
  <polygon points="360,305 380,315 360,325" fill="#C9A96E"/>

  <!-- wide search: many short episodes across -->
  <g filter="url(#glow)">
    <rect x="420" y="250" width="90" height="36" rx="8" fill="#0a1628" stroke="#00D4FF" stroke-width="2.5"/>
    <rect x="530" y="250" width="90" height="36" rx="8" fill="#0a1628" stroke="#00D4FF" stroke-width="2.5"/>
    <rect x="640" y="250" width="90" height="36" rx="8" fill="#0a1628" stroke="#00D4FF" stroke-width="2.5"/>
    <rect x="750" y="250" width="90" height="36" rx="8" fill="#0a1628" stroke="#00D4FF" stroke-width="2.5"/>
    <rect x="860" y="250" width="90" height="36" rx="8" fill="#0a1628" stroke="#C9A96E" stroke-width="3"/>
    <!-- connecting wide bar -->
    <rect x="420" y="320" width="530" height="10" rx="5" fill="url(#wide)"/>
  </g>

  <!-- skill card (distilled once) -->
  <g transform="translate(720,400)" filter="url(#glow)">
    <rect x="-120" y="-50" width="240" height="100" rx="16" fill="#0a1628" stroke="#C9A96E" stroke-width="3"/>
    <rect x="-95" y="-28" width="190" height="10" rx="3" fill="#00D4FF" opacity="0.7"/>
    <rect x="-95" y="-8" width="150" height="10" rx="3" fill="#00D4FF" opacity="0.45"/>
    <rect x="-95" y="12" width="170" height="10" rx="3" fill="#ea580c" opacity="0.55"/>
  </g>

  <!-- bottom accent: deep small, wide large -->
  <rect x="0" y="600" width="1200" height="30" fill="#001F3F"/>
  <rect x="0" y="600" width="180" height="6" fill="#ea580c"/>
  <rect x="180" y="600" width="1020" height="6" fill="#00D4FF"/>
</svg>
