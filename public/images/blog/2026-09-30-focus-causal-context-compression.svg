<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0f1726"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.3" cy="0.4" r="0.3">
      <stop offset="0%" stop-color="#2d6a4f" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#2d6a4f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.75" cy="0.6" r="0.25">
      <stop offset="0%" stop-color="#c792ea" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#c792ea" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- left cluster: dense spans (being pruned) -->
  <g opacity="0.7">
    <rect x="120" y="140" width="40" height="16" fill="none" stroke="#1e3a5f" stroke-width="1.5" rx="2"/>
    <rect x="170" y="170" width="40" height="16" fill="none" stroke="#1e3a5f" stroke-width="1.5" rx="2"/>
    <rect x="125" y="200" width="40" height="16" fill="none" stroke="#1e3a5f" stroke-width="1.5" rx="2"/>
    <rect x="180" y="225" width="40" height="16" fill="none" stroke="#1e3a5f" stroke-width="1.5" rx="2" stroke-dasharray="3 2"/>
    <rect x="115" y="255" width="40" height="16" fill="none" stroke="#1e3a5f" stroke-width="1.5" rx="2" stroke-dasharray="3 2"/>
    <rect x="165" y="120" width="40" height="16" fill="none" stroke="#1e3a5f" stroke-width="1.5" rx="2" stroke-dasharray="3 2"/>
    <rect x="100" y="290" width="40" height="16" fill="none" stroke="#1e3a5f" stroke-width="1.5" rx="2" stroke-dasharray="3 2"/>
    <rect x="155" y="315" width="40" height="16" fill="none" stroke="#1e3a5f" stroke-width="1.5" rx="2" stroke-dasharray="3 2"/>
  </g>

  <!-- center: decision node with rollout branches -->
  <circle cx="600" cy="315" r="55" fill="none" stroke="#2d6a4f" stroke-width="2.5" opacity="0.8"/>
  <circle cx="600" cy="315" r="30" fill="#2d6a4f" opacity="0.08"/>
  <circle cx="600" cy="315" r="8" fill="#2d6a4f" opacity="0.7"/>

  <!-- rollout branches from center -->
  <line x1="600" y1="260" x2="600" y2="180" stroke="#2d6a4f" stroke-width="1.5" opacity="0.4"/>
  <line x1="555" y1="290" x2="470" y2="230" stroke="#2d6a4f" stroke-width="1.5" opacity="0.4"/>
  <line x1="645" y1="290" x2="730" y2="230" stroke="#2d6a4f" stroke-width="1.5" opacity="0.4"/>
  <line x1="555" y1="340" x2="470" y2="400" stroke="#2d6a4f" stroke-width="1.5" opacity="0.4"/>
  <line x1="645" y1="340" x2="730" y2="400" stroke="#2d6a4f" stroke-width="1.5" opacity="0.4"/>

  <!-- small nodes at rollout ends -->
  <circle cx="600" cy="175" r="5" fill="none" stroke="#2d6a4f" stroke-width="1.5" opacity="0.6"/>
  <circle cx="465" cy="225" r="5" fill="none" stroke="#2d6a4f" stroke-width="1.5" opacity="0.6"/>
  <circle cx="735" cy="225" r="5" fill="none" stroke="#2d6a4f" stroke-width="1.5" opacity="0.6"/>
  <circle cx="465" cy="405" r="5" fill="none" stroke="#2d6a4f" stroke-width="1.5" opacity="0.6"/>
  <circle cx="735" cy="405" r="5" fill="none" stroke="#2d6a4f" stroke-width="1.5" opacity="0.6"/>

  <!-- dependency lines back to retained spans -->
  <line x1="465" cy="225" x2="160" y2="178" stroke="#c792ea" stroke-width="1" opacity="0.3" stroke-dasharray="2 4"/>
  <line x1="600" cy="175" x2="145" y2="263" stroke="#c792ea" stroke-width="1" opacity="0.3" stroke-dasharray="2 4"/>

  <!-- right cluster: retained spans (after compression) -->
  <g opacity="0.85">
    <rect x="950" y="200" width="40" height="16" fill="none" stroke="#c792ea" stroke-width="2" rx="2"/>
    <rect x="1010" y="230" width="40" height="16" fill="none" stroke="#c792ea" stroke-width="2" rx="2"/>
    <rect x="945" y="260" width="40" height="16" fill="none" stroke="#c792ea" stroke-width="2" rx="2"/>
    <rect x="1000" y="290" width="40" height="16" fill="none" stroke="#c792ea" stroke-width="2" rx="2"/>
  </g>

  <!-- flow arrow left to center -->
  <line x1="220" y1="315" x2="530" y2="315" stroke="#1e3a5f" stroke-width="2" opacity="0.5"/>
  <polygon points="530,315 520,310 520,320" fill="#1e3a5f" opacity="0.5"/>

  <!-- flow arrow center to right -->
  <line x1="670" y1="315" x2="930" y2="315" stroke="#1e3a5f" stroke-width="2" opacity="0.5"/>
  <polygon points="930,315 920,310 920,320" fill="#1e3a5f" opacity="0.5"/>

  <!-- decorative edges -->
  <rect x="80" y="80" width="180" height="2" fill="#1e3a5f" opacity="0.2"/>
  <rect x="940" y="80" width="180" height="2" fill="#1e3a5f" opacity="0.2"/>
  <rect x="80" y="548" width="180" height="2" fill="#1e3a5f" opacity="0.2"/>
  <rect x="940" y="548" width="180" height="2" fill="#1e3a5f" opacity="0.2"/>

  <!-- bottom threshold bars -->
  <rect x="200" y="500" width="800" height="1" fill="#1e3a5f" opacity="0.15"/>
  <rect x="200" y="500" width="160" height="1" fill="#e05858" opacity="0.4"/>
  <rect x="200" y="510" width="800" height="1" fill="#1e3a5f" opacity="0.15"/>
  <rect x="200" y="510" width="420" height="1" fill="#2d6a4f" opacity="0.4"/>
</svg>