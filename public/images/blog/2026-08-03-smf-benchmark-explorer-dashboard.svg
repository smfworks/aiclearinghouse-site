<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" width="1200" height="624">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#06141e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="624" fill="url(#bg)"/>

  <!-- Grid -->
  <g opacity="0.1" stroke="#1a3a2a" stroke-width="0.5">
    <line x1="0" y1="156" x2="1200" y2="156"/>
    <line x1="0" y1="312" x2="1200" y2="312"/>
    <line x1="0" y1="468" x2="1200" y2="468"/>
  </g>

  <!-- Dashboard mockup -->
  <g transform="translate(100, 90)">
    <!-- Browser window frame -->
    <rect x="0" y="0" width="1000" height="420" rx="8" fill="#0d1f12" stroke="#1a3a2a" stroke-width="1"/>
    
    <!-- Nav bar -->
    <rect x="0" y="0" width="1000" height="32" rx="8" fill="#081410"/>
    <rect x="0" y="24" width="1000" height="8" fill="#081410"/>
    <circle cx="16" cy="16" r="5" fill="#ff5555" opacity="0.6"/>
    <circle cx="32" cy="16" r="5" fill="#ffaa00" opacity="0.6"/>
    <circle cx="48" cy="16" r="5" fill="#55aa55" opacity="0.6"/>
    <text x="500" y="20" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="9" fill="#555">smfclearinghouse.com/explorer</text>

    <!-- Summary cards -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="140" height="60" rx="6" fill="#0a1a0e" stroke="#1a3a2a" stroke-width="0.5"/>
      <text x="70" y="20" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#666">TOTAL BENCHMARKS</text>
      <text x="70" y="42" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="20" font-weight="700" fill="#76b900" filter="url(#textGlow)">15</text>

      <rect x="155" y="0" width="140" height="60" rx="6" fill="#0a1a0e" stroke="#1a3a2a" stroke-width="0.5"/>
      <text x="225" y="20" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#666">UNIQUE MODELS</text>
      <text x="225" y="42" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="20" font-weight="700" fill="#76b900" filter="url(#textGlow)">10</text>

      <rect x="310" y="0" width="140" height="60" rx="6" fill="#0a1a0e" stroke="#1a3a2a" stroke-width="0.5"/>
      <text x="380" y="20" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#666">LATEST TEST</text>
      <text x="380" y="42" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="14" font-weight="700" fill="#e8eef4">Aug 1, 2026</text>

      <rect x="465" y="0" width="140" height="60" rx="6" fill="#0a1a0e" stroke="#1a3a2a" stroke-width="0.5"/>
      <text x="535" y="20" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="7" fill="#666">HARDWARE</text>
      <text x="535" y="42" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="14" font-weight="700" fill="#e8eef4">3 configs</text>
    </g>

    <!-- Table -->
    <g transform="translate(20, 130)">
      <!-- Header row -->
      <rect x="0" y="0" width="960" height="24" rx="4" fill="#0a1a0e"/>
      <text x="10" y="16" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#76b900">MODEL</text>
      <text x="220" y="16" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#76b900">DATE</text>
      <text x="330" y="16" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#76b900">HARDWARE</text>
      <text x="600" y="16" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#76b900">THROUGHPUT</text>
      <text x="720" y="16" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#76b900">TTFT</text>
      <text x="820" y="16" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#76b900">PASS RATE</text>

      <!-- Data rows -->
      <g font-family="SF Mono, Courier New, monospace" font-size="9" fill="#aaa">
        <text x="10" y="42">deepseek-v4-flash</text>
        <text x="220" y="42">Aug 1, 2026</text>
        <text x="330" y="42">DGX Spark (GB10)</text>
        <text x="600" y="42" fill="#76b900">21.6 tok/s</text>
        <text x="720" y="42">9536 ms</text>
        <text x="820" y="42" fill="#76b900">7/8</text>

        <text x="10" y="62">showdown (multiple)</text>
        <text x="220" y="62">—</text>
        <text x="330" y="62">multiple</text>
        <text x="600" y="62">—</text>
        <text x="720" y="62">—</text>
        <text x="820" y="62" fill="#76b900">3/7 perfect</text>

        <text x="10" y="82">nvidia/Qwen3.6-27B-NVFP4</text>
        <text x="220" y="82">Jul 3, 2026</text>
        <text x="330" y="82">DGX Spark (GB10)</text>
        <text x="600" y="82">—</text>
        <text x="720" y="82" fill="#76b900">244 ms</text>
        <text x="820" y="82" fill="#76b900">8/8</text>

        <text x="10" y="102">poolside/Laguna-S-2.1-NVFP4</text>
        <text x="220" y="102">Jul 25, 2026</text>
        <text x="330" y="102">—</text>
        <text x="600" y="102">—</text>
        <text x="720" y="102">—</text>
        <text x="820" y="102">—</text>

        <text x="10" y="122" fill="#666">nvidia/Qwen3.6-35B-A3B-NVFP4</text>
        <text x="220" y="122" fill="#666">Jul 5, 2026</text>
        <text x="330" y="122" fill="#666">DGX Spark (GB10)</text>
        <text x="600" y="122" fill="#666">—</text>
        <text x="720" y="122" fill="#666">—</text>
        <text x="820" y="122" fill="#666">—</text>

        <text x="10" y="142" fill="#555">...10 more entries</text>
      </g>

      <!-- Row separators -->
      <g stroke="#0a1a0e" stroke-width="0.5">
        <line x1="0" y1="48" x2="960" y2="48"/>
        <line x1="0" y1="68" x2="960" y2="68"/>
        <line x1="0" y1="88" x2="960" y2="88"/>
        <line x1="0" y1="108" x2="960" y2="108"/>
        <line x1="0" y1="128" x2="960" y2="128"/>
      </g>
    </g>
  </g>

  <!-- Title -->
  <text x="600" y="540" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="30" font-weight="700" fill="#e8eef4" filter="url(#textGlow)">The SMF Benchmark Explorer</text>
  <text x="600" y="570" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="13" fill="#76b900">15 benchmarks · 10 models · built by DeepSeek V4 Flash · auto-updating</text>

  <!-- Stats bar -->
  <g transform="translate(60, 590)">
    <text x="20" y="12" font-family="SF Mono, Courier New, monospace" font-size="9" fill="#666">MODELS</text>
    <text x="20" y="28" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="14" font-weight="700" fill="#76b900">10</text>

    <text x="120" y="12" font-family="SF Mono, Courier New, monospace" font-size="9" fill="#666">BENCHMARKS</text>
    <text x="120" y="28" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="14" font-weight="700" fill="#76b900">15</text>

    <text x="250" y="12" font-family="SF Mono, Courier New, monospace" font-size="9" fill="#666">BUILT BY</text>
    <text x="250" y="28" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="14" font-weight="700" fill="#e8eef4">DeepSeek V4 Flash</text>

    <text x="500" y="12" font-family="SF Mono, Courier New, monospace" font-size="9" fill="#666">AUTO-UPDATE</text>
    <text x="500" y="28" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="14" font-weight="700" fill="#76b900">Daily 9 AM</text>

    <text x="680" y="12" font-family="SF Mono, Courier New, monospace" font-size="9" fill="#666">LIVE AT</text>
    <text x="680" y="28" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="14" font-weight="700" fill="#76b900">/explorer</text>
  </g>
</svg>