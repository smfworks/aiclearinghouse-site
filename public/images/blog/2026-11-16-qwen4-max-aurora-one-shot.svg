<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="624" viewBox="0 0 1200 624">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#06141e"/>
    </linearGradient>
    <linearGradient id="aur" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#76b900"/>
      <stop offset="0.5" stop-color="#00d4aa"/>
      <stop offset="1" stop-color="#b388ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="624" fill="url(#bg)"/>
  <g opacity="0.3" stroke="#1a2a3a" stroke-width="1">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200"/>
    <path d="M100 0 V624 M200 0 V624 M300 0 V624 M400 0 V624 M500 0 V624 M600 0 V624 M700 0 V624 M800 0 V624 M900 0 V624 M1000 0 V624 M1100 0 V624"/>
  </g>
  <!-- aurora curtain sweep -->
  <g filter="url(#glow)" opacity="0.85">
    <path d="M60 430 C 240 300, 340 480, 520 330 S 820 180, 950 300 S 1090 380, 1150 330"
          fill="none" stroke="url(#aur)" stroke-width="10" stroke-linecap="round"/>
    <path d="M60 470 C 250 360, 360 500, 540 380 S 830 240, 960 350 S 1090 420, 1150 380"
          fill="none" stroke="url(#aur)" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <path d="M60 390 C 230 250, 330 440, 510 280 S 810 130, 940 250 S 1090 340, 1150 290"
          fill="none" stroke="url(#aur)" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  </g>
  <!-- stars -->
  <g fill="#e8eef4">
