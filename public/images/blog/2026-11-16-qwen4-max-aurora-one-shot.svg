    <circle cx="520" cy="140" r="1.2" opacity="0.7"/><circle cx="700" cy="90" r="1" opacity="0.5"/>
    <circle cx="880" cy="130" r="1.5" opacity="0.8"/><circle cx="1050" cy="70" r="1" opacity="0.6"/>
    <circle cx="240" cy="180" r="1" opacity="0.5"/><circle cx="980" cy="170" r="1.2" opacity="0.7"/>
  </g>
  <!-- title -->
  <text x="600" y="150" text-anchor="middle" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="58" font-weight="700" fill="#e8eef4">Qwen4 Max: One-Shot + Cold Iron</text>
  <text x="600" y="200" text-anchor="middle" font-family="'SF Mono','Courier New',monospace" font-size="20" fill="#5a8a6a">qwen/qwen4-max &#183; OpenRouter &#183; tested 2026-11-16</text>
  <!-- stats bar -->
  <g font-family="'SF Mono','Courier New',monospace" text-anchor="middle">
    <g>
      <text x="150" y="530" font-size="30" font-weight="700" fill="#76b900">21835</text>
      <text x="150" y="556" font-size="12" fill="#667788">COMPLETION TOKENS</text>
      <text x="150" y="572" font-size="11" fill="#445566">5601 reasoning</text>
    </g>
    <g>
      <text x="450" y="530" font-size="30" font-weight="700" fill="#00d4aa">5.6 min</text>
      <text x="450" y="556" font-size="12" fill="#667788">ONE-SHOT WALL</text>
      <text x="450" y="572" font-size="11" fill="#445566">$0.098</text>
    </g>
