<?xml version="1.0" encoding="UTF-8"?>
<!-- Hero for "Hermes Agent Cron Jobs" — no-text abstract: central scheduler with periodic diverging execution paths.
     Navy/teal/gold palette, abstract timed branches and task nodes. Validates as well-formed XML. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Central cron scheduler with multiple timed agent execution paths diverging into background tasks">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="50%" stop-color="#0f1a2e"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="tealGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0e7490" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff6b00" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff6b00" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <!-- subtle periodic tick marks -->
    <pattern id="ticks" patternUnits="userSpaceOnUse" width="40" height="40" patternTransform="rotate(0)">
      <circle cx="20" cy="20" r="1.5" fill="#22d3ee" opacity="0.3"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- decorative grid frame -->
  <g stroke="#162236" stroke-width="2">
    <line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="1120" y1="0" x2="1120" y2="630"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
  </g>

  <!-- soft horizontal glows -->
  <rect x="0" y="220" width="1200" height="50" fill="url(#tealGlow)" filter="url(#blur)"/>
  <rect x="0" y="340" width="1200" height="50" fill="url(#goldGlow)" filter="url(#blur)"/>

  <!-- central scheduler node (cron core) -->
  <g transform="translate(300, 315)">
    <!-- outer ring suggesting periodic cycle -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="#1e3a8a" stroke-width="8" opacity="0.6"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#0e7490" stroke-width="2" stroke-dasharray="8 12" opacity="0.8"/>
    <!-- inner core -->
    <circle cx="0" cy="0" r="32" fill="#0e7490" opacity="0.9"/>
    <circle cx="0" cy="0" r="32" fill="none" stroke="#22d3ee" stroke-width="3" opacity="0.7"/>
    <circle cx="0" cy="0" r="12" fill="#0a1628"/>
    <!-- small tick indicators for schedule -->
    <circle cx="0" cy="-38" r="3" fill="#f59e0b" opacity="0.8"/>
    <circle cx="27" cy="-27" r="2.5" fill="#f59e0b" opacity="0.6"/>
    <circle cx="38" cy="0" r="2.5" fill="#f59e0b" opacity="0.6"/>
  </g>

  <!-- trunk from scheduler to first split -->
  <path d="M348,315 L480,315" stroke="#1e3a8a" stroke-width="7" stroke-linecap="round"/>

  <!-- first branch point -->
  <g transform="translate(480, 315)">
    <circle cx="0" cy="0" r="18" fill="#1e3a8a"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- upper teal path (e.g. daily health/research) -->
  <path d="M498,315 Q620,280 720,220 Q820,200 950,195" stroke="#0e7490" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- task nodes along upper -->
  <g transform="translate(620, 280)">
    <circle cx="0" cy="0" r="12" fill="#0e7490" opacity="0.85"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.6"/>
  </g>
  <g transform="translate(720, 220)">
    <circle cx="0" cy="0" r="14" fill="#0e7490" opacity="0.9"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.7"/>
    <circle cx="0" cy="0" r="5" fill="#0a1628"/>
  </g>
  <g transform="translate(820, 200)">
    <circle cx="0" cy="0" r="10" fill="#0e7490" opacity="0.75"/>
  </g>
  <g transform="translate(950, 195)">
    <circle cx="0" cy="0" r="18" fill="#0e7490" opacity="0.95"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#22d3ee" stroke-width="3" opacity="0.7"/>
    <circle cx="0" cy="0" r="6" fill="#0a1628"/>
  </g>

  <!-- lower gold path (e.g. publishing, maintenance) -->
  <path d="M498,315 Q620,350 720,400 Q820,420 950,425" stroke="#ff6b00" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- task nodes along lower -->
  <g transform="translate(620, 350)">
    <circle cx="0" cy="0" r="12" fill="#f59e0b" opacity="0.85"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="#ff6b00" stroke-width="2" opacity="0.6"/>
  </g>
  <g transform="translate(720, 400)">
    <circle cx="0" cy="0" r="14" fill="#f59e0b" opacity="0.9"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#ff6b00" stroke-width="2" opacity="0.7"/>
    <circle cx="0" cy="0" r="5" fill="#0a1628"/>
  </g>
  <g transform="translate(820, 420)">
    <circle cx="0" cy="0" r="10" fill="#f59e0b" opacity="0.75"/>
  </g>
  <g transform="translate(950, 425)">
    <circle cx="0" cy="0" r="18" fill="#f59e0b" opacity="0.95"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#ff6b00" stroke-width="3" opacity="0.7"/>
    <circle cx="0" cy="0" r="6" fill="#0a1628"/>
  </g>

  <!-- small periodic markers / ticks on paths -->
  <circle cx="560" cy="300" r="4" fill="#22d3ee" opacity="0.5"/>
  <circle cx="560" cy="330" r="4" fill="#ff6b00" opacity="0.5"/>
  <circle cx="780" cy="240" r="3" fill="#22d3ee" opacity="0.4"/>
  <circle cx="780" cy="390" r="3" fill="#ff6b00" opacity="0.4"/>

  <!-- subtle shared object / schedule ring linking back -->
  <ellipse cx="620" cy="315" rx="420" ry="180" fill="none" stroke="#1e3a8a" stroke-width="1.5" stroke-dasharray="5 8" opacity="0.35"/>

  <!-- faint repeating schedule glyph (abstract arcs) -->
  <path d="M200,315 A60,60 0 0,1 260,255" fill="none" stroke="#0e7490" stroke-width="2" opacity="0.25"/>
  <path d="M200,315 A60,60 0 0,0 260,375" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.25"/>
</svg>