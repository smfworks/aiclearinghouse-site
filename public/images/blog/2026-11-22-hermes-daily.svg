<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="624" viewBox="0 0 1200 624" font-family="'SF Mono','Courier New',monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#06141e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="624" fill="url(#bg)"/>
  <g stroke="#1a2a3a" stroke-width="1" opacity="0.3">
    <line x1="0" y1="156" x2="1200" y2="156"/><line x1="0" y1="312" x2="1200" y2="312"/><line x1="0" y1="468" x2="1200" y2="468"/>
  </g>

  <text x="60" y="70" fill="#e8eef4" font-size="30" font-weight="bold" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif">Hermes Plugin Catalog — daily new entries</text>
  <text x="60" y="100" fill="#5a8a6a" font-size="15">New catalog entries by day, Nov 19–22 2026 · counted from the hermes-agent commit log</text>

  <!-- bars: scale ~ 1.2px per entry -->
  <g filter="url(#glow)">
    <rect x="260" y="150" width="420" height="56" fill="#00d4aa" opacity="0.85"/>
    <rect x="260" y="240" width="360" height="56" fill="#00d4aa" opacity="0.7"/>
    <rect x="260" y="330" width="420" height="56" fill="#76b900" opacity="0.85"/>
    <rect x="260" y="420" width="420" height="56" fill="#76b900" opacity="0.7"/>
  </g>
  <text x="60" y="184" fill="#5a8a6a" font-size="16">Nov 19</text>
  <text x="60" y="274" fill="#5a8a6a" font-size="16">Nov 20</text>
  <text x="60" y="364" fill="#5a8a6a" font-size="16">Nov 21</text>
  <text x="60" y="454" fill="#5a8a6a" font-size="16">Nov 22</text>
  <text x="700" y="184" fill="#e8eef4" font-size="20" font-weight="bold">~35</text>
  <text x="640" y="274" fill="#e8eef4" font-size="20" font-weight="bold">~30</text>
  <text x="700" y="364" fill="#e8eef4" font-size="20" font-weight="bold">~35</text>
  <text x="700" y="454" fill="#e8eef4" font-size="20" font-weight="bold">~35</text>

  <!-- headline stat -->
  <g filter="url(#glow)">
    <rect x="880" y="150" width="260" height="140" rx="10" fill="#0d1f2d" stroke="#76b900" stroke-width="1.5"/>
  </g>
  <text x="1010" y="200" fill="#76b900" font-size="44" font-weight="bold" text-anchor="middle">570</text>
  <text x="1010" y="228" fill="#e8eef4" font-size="14" text-anchor="middle">plugins in the catalog</text>
  <text x="1010" y="252" fill="#5a8a6a" font-size="12" text-anchor="middle">21 official · 13 verified</text>

  <!-- review pipeline -->
  <g filter="url(#glow)">
    <rect x="880" y="320" width="260" height="156" rx="10" fill="#0d1f2d" stroke="#00d4aa" stroke-width="1"/>
  </g>
  <text x="900" y="348" fill="#00d4aa" font-size="13" font-weight="bold">REVIEW PIPELINE</text>
  <text x="900" y="376" fill="#e8eef4" font-size="12">1. contributor entry</text>
  <text x="900" y="398" fill="#e8eef4" font-size="12">2. review disclosure</text>
  <text x="900" y="420" fill="#e8eef4" font-size="12">3. self-updater gate</text>
  <text x="900" y="442" fill="#e8eef4" font-size="12">4. commit-pinned live</text>
  <text x="900" y="466" fill="#5a8a6a" font-size="11">~100 new / 3 days</text>

  <!-- footer stats bar -->
  <rect x="0" y="560" width="1200" height="64" fill="#060a12"/>
  <text x="60" y="598" fill="#5a8a6a" font-size="13">CATALOG 570</text>
  <text x="240" y="598" fill="#5a8a6a" font-size="13">NEW ~100 / 3 DAYS</text>
  <text x="470" y="598" fill="#5a8a6a" font-size="13">PINNED COMMITS</text>
  <text x="680" y="598" fill="#5a8a6a" font-size="13">HUMAN-REVIEWED</text>
  <text x="900" y="598" fill="#5a8a6a" font-size="13">2026-11-22</text>
</svg>
