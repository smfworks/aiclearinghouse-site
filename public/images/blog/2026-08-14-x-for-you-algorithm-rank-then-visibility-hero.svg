<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001F3F"/>
      <stop offset="55%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#051018"/>
    </linearGradient>
    <linearGradient id="rank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#001F3F" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#C9A96E" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- viewer history (left rail) -->
  <g filter="url(#glow)">
    <rect x="80" y="120" width="28" height="390" rx="8" fill="#0a1628" stroke="#00D4FF" stroke-width="2"/>
    <rect x="86" y="140" width="16" height="22" rx="3" fill="#00D4FF" opacity="0.85"/>
    <rect x="86" y="176" width="16" height="22" rx="3" fill="#00D4FF" opacity="0.7"/>
    <rect x="86" y="212" width="16" height="22" rx="3" fill="#C9A96E" opacity="0.75"/>
    <rect x="86" y="248" width="16" height="22" rx="3" fill="#00D4FF" opacity="0.55"/>
    <rect x="86" y="284" width="16" height="22" rx="3" fill="#C9A96E" opacity="0.55"/>
    <rect x="86" y="320" width="16" height="22" rx="3" fill="#00D4FF" opacity="0.4"/>
    <rect x="86" y="356" width="16" height="22" rx="3" fill="#ea580c" opacity="0.55"/>
    <rect x="86" y="392" width="16" height="22" rx="3" fill="#00D4FF" opacity="0.3"/>
    <rect x="86" y="428" width="16" height="22" rx="3" fill="#C9A96E" opacity="0.35"/>
    <rect x="86" y="464" width="16" height="22" rx="3" fill="#00D4FF" opacity="0.25"/>
  </g>

  <!-- transformer trunk -->
  <g filter="url(#glow)">
    <rect x="180" y="180" width="220" height="270" rx="20" fill="#0a1628" stroke="#C9A96E" stroke-width="3"/>
    <rect x="210" y="210" width="160" height="18" rx="4" fill="#C9A96E" opacity="0.85"/>
    <rect x="210" y="244" width="160" height="18" rx="4" fill="#C9A96E" opacity="0.65"/>
    <rect x="210" y="278" width="160" height="18" rx="4" fill="#00D4FF" opacity="0.55"/>
    <rect x="210" y="312" width="160" height="18" rx="4" fill="#00D4FF" opacity="0.4"/>
    <rect x="210" y="346" width="160" height="18" rx="4" fill="#ea580c" opacity="0.45"/>
    <rect x="210" y="380" width="160" height="18" rx="4" fill="#C9A96E" opacity="0.35"/>
  </g>

  <!-- isolated candidates: no cross-links -->
  <g filter="url(#glow)">
    <rect x="500" y="140" width="150" height="70" rx="12" fill="#0a1628" stroke="#00D4FF" stroke-width="2.5"/>
    <rect x="500" y="240" width="150" height="70" rx="12" fill="#0a1628" stroke="#00D4FF" stroke-width="2.5"/>
    <rect x="500" y="340" width="150" height="70" rx="12" fill="#0a1628" stroke="#00D4FF" stroke-width="2.5"/>
    <rect x="500" y="440" width="150" height="70" rx="12" fill="#0a1628" stroke="#00D4FF" stroke-width="2.5"/>
    <line x1="400" y1="315" x2="500" y2="175" stroke="#00D4FF" stroke-width="2" opacity="0.55"/>
    <line x1="400" y1="315" x2="500" y2="275" stroke="#00D4FF" stroke-width="2" opacity="0.55"/>
    <line x1="400" y1="315" x2="500" y2="375" stroke="#00D4FF" stroke-width="2" opacity="0.55"/>
    <line x1="400" y1="315" x2="500" y2="475" stroke="#00D4FF" stroke-width="2" opacity="0.55"/>
  </g>

  <!-- visibility gate -->
  <g filter="url(#glow)">
    <polygon points="760,180 860,315 760,450" fill="url(#gate)" opacity="0.9"/>
    <polygon points="780,210 840,315 780,420" fill="#001F3F" opacity="0.45"/>
  </g>

  <!-- allow vs drop stacks -->
  <g filter="url(#glow)">
    <rect x="920" y="160" width="80" height="260" rx="10" fill="#C9A96E" opacity="0.85"/>
    <rect x="1030" y="280" width="80" height="140" rx="10" fill="#ea580c" opacity="0.85"/>
  </g>

  <rect x="0" y="600" width="1200" height="30" fill="#001F3F"/>
  <rect x="0" y="600" width="700" height="6" fill="#00D4FF"/>
  <rect x="700" y="600" width="500" height="6" fill="#ea580c"/>
</svg>
