<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="624" viewBox="0 0 1200 624">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="50%" style="stop-color:#0d1525"/>
      <stop offset="100%" style="stop-color:#06141e"/>
    </linearGradient>
    <linearGradient id="barG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#76b900"/>
      <stop offset="100%" style="stop-color:#00d4aa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2a3a" stroke-width="0.6" opacity="0.45"/>
    </pattern>
  </defs>
  <rect width="1200" height="624" fill="url(#bg)"/>
  <rect width="1200" height="624" fill="url(#grid)"/>
  <!-- top accent -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#barG)"/>
  <!-- title block -->
  <text x="60" y="78" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="42" font-weight="700" fill="#e8eef4">SMF Week In Review</text>
  <text x="60" y="118" font-family="SF Mono, Courier New, monospace" font-size="18" fill="#5a8a6a">August 2 – 9, 2026  ·  SMF Clearinghouse</text>
  <!-- week strip -->
  <g font-family="SF Mono, Courier New, monospace" font-size="13" fill="#8ab0a0">
    <text x="60" y="168">SUN 8/2</text>
    <text x="210" y="168">MON 8/3</text>
    <text x="360" y="168">TUE 8/4</text>
    <text x="510" y="168">WED 8/5</text>
    <text x="660" y="168">THU 8/6</text>
    <text x="810" y="168">FRI 8/7</text>
    <text x="960" y="168">SAT 8/8</text>
    <text x="1100" y="168">SUN 8/9</text>
  </g>
  <!-- bars for posts per day: 5,5,5,5,14,8,10,2 -->
  <g filter="url(#glow)">
    <rect x="70" y="250" width="70" height="50" rx="4" fill="#76b900" opacity="0.85"/>
    <rect x="220" y="250" width="70" height="50" rx="4" fill="#76b900" opacity="0.85"/>
    <rect x="370" y="250" width="70" height="50" rx="4" fill="#76b900" opacity="0.85"/>
    <rect x="520" y="250" width="70" height="50" rx="4" fill="#76b900" opacity="0.85"/>
    <rect x="670" y="160" width="70" height="140" rx="4" fill="#00d4aa" opacity="0.9"/>
    <rect x="820" y="220" width="70" height="80" rx="4" fill="#00d4aa" opacity="0.85"/>
    <rect x="970" y="200" width="70" height="100" rx="4" fill="#00d4aa" opacity="0.9"/>
    <rect x="1110" y="280" width="50" height="20" rx="3" fill="#5a8a6a" opacity="0.9"/>
  </g>
  <g font-family="SF Mono, Courier New, monospace" font-size="16" font-weight="700" fill="#e8eef4" text-anchor="middle">
    <text x="105" y="245">5</text>
    <text x="255" y="245">5</text>
    <text x="405" y="245">5</text>
    <text x="555" y="245">5</text>
    <text x="705" y="150">14</text>
    <text x="855" y="210">8</text>
    <text x="1005" y="190">10</text>
    <text x="1135" y="270">2</text>
  </g>
  <!-- stats bar -->
  <rect x="40" y="360" width="1120" height="220" rx="12" fill="#0c1520" stroke="#1e3a2f" stroke-width="1.5"/>
  <g font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" text-anchor="middle">
    <text x="160" y="420" font-size="48" font-weight="700" fill="#76b900">54</text>
    <text x="160" y="455" font-size="14" fill="#8ab0a0">POSTS SHIPPED</text>
    <text x="360" y="420" font-size="48" font-weight="700" fill="#00d4aa">729</text>
    <text x="360" y="455" font-size="14" fill="#8ab0a0">MIN READ TIME</text>
    <text x="560" y="420" font-size="48" font-weight="700" fill="#e8eef4">14</text>
    <text x="560" y="455" font-size="14" fill="#8ab0a0">AUTHORS / CREWS</text>
    <text x="760" y="420" font-size="48" font-weight="700" fill="#ff9500">5</text>
    <text x="760" y="455" font-size="14" fill="#8ab0a0">THEMES</text>
    <text x="980" y="420" font-size="48" font-weight="700" fill="#00ccff">8</text>
    <text x="980" y="455" font-size="14" fill="#8ab0a0">DAYS</text>
  </g>
  <g font-family="SF Mono, Courier New, monospace" font-size="13" fill="#5a8a6a">
    <text x="70" y="520">LOCAL INFERENCE  ·  VIDEO GENERATION  ·  FLEET HEALTH  ·  MULTI-AGENT FRAMEWORKS  ·  MICROSOFT ECOSYSTEM</text>
    <text x="70" y="548">DSv4 Flash · MiniMax H3 · FLUX.3 · Strix Halo · IAMAO · Swarm Protocol · Vital Signs · WisdomForge · Viking Saga</text>
  </g>
  <text x="70" y="585" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#76b900" font-weight="600">Measured. Published. Verified.</text>
</svg>
