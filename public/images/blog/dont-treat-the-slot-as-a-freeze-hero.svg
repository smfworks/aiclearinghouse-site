<?xml version="1.0" encoding="UTF-8"?>
<!-- Hero for "Don't Treat the Slot as a Freeze". No visible text.
     A gold outline keeps its place on the rail. The fill inside that
     outline is a different shape and color: the slot stayed, the schema
     did not. A teal block sits at the tail, appended, not spliced in.
     Navy #0a1628 / #1e3a8a, gold #f59e0b / #ff6b00, teal #0e7490 / #00d4ff. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A gold slot outline whose interior fill does not match, with a teal block appended at the tail">
  <defs>
    <linearGradient id="sfBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="55%" stop-color="#0c1e38"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <radialGradient id="sfGlowGold" cx="32%" cy="52%" r="40%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.20"/>
      <stop offset="70%" stop-color="#ff6b00" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ff6b00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sfGlowTeal" cx="82%" cy="48%" r="28%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sfRail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ff6b00"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#sfBg)"/>
  <rect width="1200" height="630" fill="url(#sfGlowGold)"/>
  <rect width="1200" height="630" fill="url(#sfGlowTeal)"/>

  <g stroke="#13243d" stroke-width="1" fill="none" opacity="0.5">
    <rect x="48" y="48" width="1104" height="534" rx="6"/>
    <line x1="48" y1="210" x2="1152" y2="210"/>
    <line x1="48" y1="420" x2="1152" y2="420"/>
    <line x1="360" y1="48" x2="360" y2="582"/>
    <line x1="720" y1="48" x2="720" y2="582"/>
  </g>

  <!-- rail: position is stable -->
  <path d="M90 315 H1040" fill="none" stroke="url(#sfRail)" stroke-width="6" stroke-linecap="round" opacity="0.85"/>

  <!-- three slot outlines, same place on the rail -->
  <rect x="140" y="230" width="150" height="170" rx="8" fill="none" stroke="#f59e0b" stroke-width="6"/>
  <rect x="360" y="230" width="150" height="170" rx="8" fill="none" stroke="#f59e0b" stroke-width="6"/>
  <rect x="580" y="230" width="150" height="170" rx="8" fill="none" stroke="#f59e0b" stroke-width="6"/>

  <!-- first slot: fill matches the outline (sent bytes) -->
  <rect x="168" y="268" width="94" height="94" rx="4" fill="#f59e0b" opacity="0.9"/>

  <!-- middle slot: outline stayed, fill is a different shape and color -->
  <polygon points="435,262 508,315 435,368 362,315" fill="#ff6b00" opacity="0.95"/>

  <!-- third slot: outline stayed, fill is a circle, not the rectangle that was sent -->
  <circle cx="655" cy="315" r="46" fill="#ff6b00" opacity="0.35"/>
  <circle cx="655" cy="315" r="28" fill="none" stroke="#00d4ff" stroke-width="6"/>

  <!-- tail append: not spliced into the gold slots -->
  <rect x="860" y="248" width="120" height="134" rx="10" fill="none" stroke="#00d4ff" stroke-width="7"/>
  <rect x="888" y="278" width="64" height="74" rx="4" fill="#0e7490"/>

  <!-- gap marks so the tail reads as appended, not joined -->
  <g fill="none" stroke="#1e3a8a" stroke-width="3" opacity="0.8">
    <path d="M760 280 h36"/>
    <path d="M760 315 h48"/>
    <path d="M760 350 h32"/>
  </g>

  <!-- small unjoined ticks, no letters -->
  <g fill="none" stroke="#0e7490" stroke-width="2" opacity="0.45">
    <path d="M1000 140 h80"/>
    <path d="M1020 168 h60"/>
    <path d="M1000 490 h90"/>
    <path d="M1040 518 h40"/>
  </g>
</svg>
