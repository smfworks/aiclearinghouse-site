<?xml version="1.0" encoding="UTF-8"?>
<!-- Hero: a filled paragraph band, and a dashed empty band under it that never connects.
     A detached chip sits off to the side. Brand palette. No visible text. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A filled band above a dashed empty band, with a detached chip that does not connect">
  <defs>
    <linearGradient id="destBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="55%" stop-color="#0c1e36"/>
      <stop offset="100%" stop-color="#081018"/>
    </linearGradient>
    <radialGradient id="destTeal" cx="72%" cy="28%" r="36%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="destGold" cx="18%" cy="78%" r="30%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bandFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#destBg)"/>
  <rect width="1200" height="630" fill="url(#destTeal)"/>
  <rect width="1200" height="630" fill="url(#destGold)"/>
  <rect x="48" y="40" width="1104" height="550" rx="8" fill="none" stroke="#162236" stroke-width="2"/>

  <rect x="140" y="150" width="680" height="118" rx="8" fill="#0d1a2c" stroke="#1e3a5f" stroke-width="2"/>
  <rect x="168" y="178" width="520" height="14" rx="3" fill="url(#bandFill)"/>
  <rect x="168" y="206" width="430" height="10" rx="2" fill="#1a3050"/>
  <rect x="168" y="228" width="280" height="8" rx="2" fill="#14263f"/>

  <rect x="140" y="340" width="680" height="118" rx="8" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 7" opacity="0.9"/>
  <rect x="168" y="392" width="360" height="8" rx="2" fill="#1a3050" opacity="0.35"/>

