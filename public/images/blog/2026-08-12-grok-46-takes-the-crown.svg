<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="624" viewBox="0 0 1200 624">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#06141e"/>
    </linearGradient>
    <linearGradient id="grok46Bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#76b900"/>
      <stop offset="100%" stop-color="#4d7a00"/>
    </linearGradient>
    <linearGradient id="grok45Bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a8a3a"/>
      <stop offset="100%" stop-color="#3a5a20"/>
    </linearGradient>
    <linearGradient id="kimiBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9500"/>
      <stop offset="100%" stop-color="#b86b00"/>
    </linearGradient>
    <linearGradient id="glmBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#008a72"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="624" fill="url(#bgGrad)"/>

  <!-- Grid pattern -->
  <g opacity="0.15">
    <line x1="0" y1="156" x2="1200" y2="156" stroke="#1a2a3a" stroke-width="1"/>
    <line x1="0" y1="312" x2="1200" y2="312" stroke="#1a2a3a" stroke-width="1"/>
    <line x1="0" y1="468" x2="1200" y2="468" stroke="#1a2a3a" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="624" stroke="#1a2a3a" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="624" stroke="#1a2a3a" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="624" stroke="#1a2a3a" stroke-width="1"/>
  </g>

  <!-- Title -->
  <text x="60" y="52" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="bold" fill="#e8eef4">Grok 4.6 Takes the Crown</text>
  <text x="60" y="78" font-family="'SF Mono', 'Courier New', monospace" font-size="14" fill="#5a8a6a">smf-bench Official A · 157 tests · 4 cloud models · 2026-08-12</text>

  <!-- Bar chart: Overall scores -->
  <!-- Chart area: x=60-540, y=110-460 -->

  <!-- Y-axis labels and gridlines -->
  <g font-family="'SF Mono', 'Courier New', monospace" font-size="11" fill="#666">
    <text x="165" y="135" text-anchor="end">100%</text>
    <line x1="170" y1="130" x2="540" y2="130" stroke="#1a2a3a" stroke-width="0.5" stroke-dasharray="2,4"/>
    <text x="165" y="225" text-anchor="end">75%</text>
    <line x1="170" y1="220" x2="540" y2="220" stroke="#1a2a3a" stroke-width="0.5" stroke-dasharray="2,4"/>
    <text x="165" y="320" text-anchor="end">50%</text>
    <line x1="170" y1="315" x2="540" y2="315" stroke="#1a2a3a" stroke-width="0.5" stroke-dasharray="2,4"/>
    <text x="165" y="415" text-anchor="end">25%</text>
    <line x1="170" y1="410" x2="540" y2="410" stroke="#1a2a3a" stroke-width="0.5" stroke-dasharray="2,4"/>
  </g>

  <!-- Bars: each model gets a bar. Scale: 100% = 370px height, starting from y=500 (bottom) -->
  <!-- Grok 4.6: 97.5% → height = 360.75px, top at y=139 -->
  <rect x="190" y="139" width="70" height="361" fill="url(#grok46Bar)" rx="3" filter="url(#glow)"/>
  <text x="225" y="130" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="bold" fill="#76b900">97.5%</text>
  <text x="225" y="518" text-anchor="middle" font-family="'SF Mono', 'Courier New', monospace" font-size="11" fill="#e8eef4">Grok 4.6</text>
  <text x="225" y="533" text-anchor="middle" font-family="'SF Mono', 'Courier New', monospace" font-size="10" fill="#76b900">153/157</text>

  <!-- Grok 4.5: 96.8% → height = 358.16px, top at y=142 -->
  <rect x="300" y="142" width="70" height="358" fill="url(#grok45Bar)" rx="3"/>
  <text x="335" y="133" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" fill="#5a8a3a">96.8%</text>
  <text x="335" y="518" text-anchor="middle" font-family="'SF Mono', 'Courier New', monospace" font-size="11" fill="#e8eef4">Grok 4.5</text>
  <text x="335" y="533" text-anchor="middle" font-family="'SF Mono', 'Courier New', monospace" font-size="10" fill="#5a8a3a">152/157</text>

  <!-- Kimi K3: 89.2% → height = 330.04px, top at y=170 -->
  <rect x="410" y="170" width="70" height="330" fill="url(#kimiBar)" rx="3"/>
  <text x="445" y="161" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" fill="#ff9500">89.2%</text>
  <text x="445" y="518" text-anchor="middle" font-family="'SF Mono', 'Courier New', monospace" font-size="11" fill="#e8eef4">Kimi K3</text>
  <text x="445" y="533" text-anchor="middle" font-family="'SF Mono', 'Courier New', monospace" font-size="10" fill="#ff9500">140/157</text>

  <!-- GLM-5.2: 77.1% → height = 285.27px, top at y=215 -->
  <rect x="520" y="215" width="70" height="285" fill="url(#glmBar)" rx="3"/>
  <text x="555" y="206" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" fill="#00d4aa">77.1%</text>
  <text x="555" y="518" text-anchor="middle" font-family="'SF Mono', 'Courier New', monospace" font-size="11" fill="#e8eef4">GLM-5.2</text>
  <text x="555" y="533" text-anchor="middle" font-family="'SF Mono', 'Courier New', monospace" font-size="10" fill="#00d4aa">121/157</text>

  <!-- Right side: Category breakdown mini-table -->
  <g transform="translate(680, 110)">
    <text x="0" y="0" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="bold" fill="#e8eef4">Per-Category Breakdown</text>

    <!-- Header row -->
    <g font-family="'SF Mono', 'Courier New', monospace" font-size="11" fill="#5a8a6a">
      <text x="0" y="25">Category</text>
      <text x="140" y="25" text-anchor="end">4.6</text>
      <text x="200" y="25" text-anchor="end">4.5</text>
      <text x="260" y="25" text-anchor="end">K3</text>
      <text x="320" y="25" text-anchor="end">GLM</text>
    </g>
    <line x1="0" y1="32" x2="330" y2="32" stroke="#1a2a3a" stroke-width="1"/>

    <!-- Data rows -->
    <g font-family="'SF Mono', 'Courier New', monospace" font-size="12" fill="#e8eef4">
      <text x="0" y="50">Coding</text>
      <text x="140" y="50" text-anchor="end" fill="#76b900" font-weight="bold">30/30</text>
      <text x="200" y="50" text-anchor="end" fill="#76b900" font-weight="bold">30/30</text>
      <text x="260" y="50" text-anchor="end">23/30</text>
      <text x="320" y="50" text-anchor="end" fill="#ff6b6b">14/30</text>

      <text x="0" y="72">Reasoning</text>
      <text x="140" y="72" text-anchor="end" fill="#76b900" font-weight="bold">30/30</text>
      <text x="200" y="72" text-anchor="end" fill="#76b900" font-weight="bold">30/30</text>
      <text x="260" y="72" text-anchor="end">28/30</text>
      <text x="320" y="72" text-anchor="end">28/30</text>

      <text x="0" y="94">Math</text>
      <text x="140" y="94" text-anchor="end" fill="#76b900" font-weight="bold">28/30</text>
      <text x="200" y="94" text-anchor="end">27/30</text>
      <text x="260" y="94" text-anchor="end">24/30</text>
      <text x="320" y="94" text-anchor="end" fill="#ff6b6b">17/30</text>

      <text x="0" y="116">Instruction</text>
      <text x="140" y="116" text-anchor="end" fill="#76b900" font-weight="bold">30/30</text>
      <text x="200" y="116" text-anchor="end" fill="#76b900" font-weight="bold">30/30</text>
      <text x="260" y="116" text-anchor="end" fill="#76b900" font-weight="bold">30/30</text>
      <text x="320" y="116" text-anchor="end">28/30</text>

      <text x="0" y="138">Prose</text>
      <text x="140" y="138" text-anchor="end">28/30</text>
      <text x="200" y="138" text-anchor="end">28/30</text>
      <text x="260" y="138" text-anchor="end">28/30</text>
      <text x="320" y="138" text-anchor="end">27/30</text>

      <text x="0" y="160">Writing</text>
      <text x="140" y="160" text-anchor="end" fill="#76b900" font-weight="bold">5/5</text>
      <text x="200" y="160" text-anchor="end" fill="#76b900" font-weight="bold">5/5</text>
      <text x="260" y="160" text-anchor="end" fill="#76b900" font-weight="bold">5/5</text>
      <text x="320" y="160" text-anchor="end" fill="#76b900" font-weight="bold">5/5</text>

      <text x="0" y="182">Tools</text>
      <text x="140" y="182" text-anchor="end" fill="#76b900" font-weight="bold">2/2</text>
      <text x="200" y="182" text-anchor="end" fill="#76b900" font-weight="bold">2/2</text>
      <text x="260" y="182" text-anchor="end" fill="#76b900" font-weight="bold">2/2</text>
      <text x="320" y="182" text-anchor="end" fill="#76b900" font-weight="bold">2/2</text>
    </g>
  </g>

  <!-- Bottom stats bar -->
  <g transform="translate(60, 556)">
    <rect x="0" y="0" width="1080" height="48" rx="4" fill="#0d1320" stroke="#1a2a3a" stroke-width="1"/>

    <g font-family="'SF Mono', 'Courier New', monospace" fill="#e8eef4">
      <!-- SyntaxErrors -->
      <text x="20" y="20" font-size="10" fill="#5a8a6a">SYNTAX ERRORS</text>
      <text x="20" y="38" font-size="14" font-weight="bold">
        <tspan fill="#76b900">0</tspan>
        <tspan fill="#666" font-size="11">  |  K3: 5  |  GLM: 16</tspan>
      </text>

      <!-- Regressions -->
      <text x="280" y="20" font-size="10" fill="#5a8a6a">REGRESSIONS vs 4.5</text>
      <text x="280" y="38" font-size="14" font-weight="bold" fill="#76b900">0</text>

      <!-- Fixed tests -->
      <text x="480" y="20" font-size="10" fill="#5a8a6a">FIXED vs 4.5</text>
      <text x="480" y="38" font-size="14" font-weight="bold" fill="#76b900">+1</text>

      <!-- Frontier -->
      <text x="640" y="20" font-size="10" fill="#5a8a6a">FRONTIER TIER</text>
      <text x="640" y="38" font-size="14" font-weight="bold" fill="#76b900">60/60</text>
      <text x="710" y="38" font-size="11" fill="#666">100%</text>

      <!-- Wall time -->
      <text x="820" y="20" font-size="10" fill="#5a8a6a">WALL TIME</text>
      <text x="820" y="38" font-size="14" font-weight="bold" fill="#e8eef4">150 min</text>
      <text x="910" y="38" font-size="11" fill="#666">4.5: 112 min</text>
    </g>
  </g>
</svg>