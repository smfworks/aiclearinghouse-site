<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" width="1200" height="624">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#06141e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="624" fill="url(#bg)"/>
  <g stroke="#1a2a3a" stroke-width="1" opacity="0.35">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="80" y1="0" x2="80" y2="624"/>
    <line x1="240" y1="0" x2="240" y2="624"/>
  </g>
  <text x="48" y="52" fill="#76b900" font-family="'SF Mono','Courier New',monospace" font-size="14">SPARK-56BC · SOL-H3-SPARK · 2026-09-11</text>
  <text x="48" y="108" fill="#e8eef4" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="36" font-weight="700">5 s of 768p in 68 s</text>
  <text x="48" y="148" fill="#5a8a6a" font-family="'SF Mono','Courier New',monospace" font-size="16">1344×768 · 4-step FastH3 + 3-step LTX · one GB10</text>

  <text x="48" y="230" fill="#e8eef4" font-family="'SF Mono','Courier New',monospace" font-size="14">FL2VA 5 s</text>
  <rect x="220" y="208" width="780" height="28" rx="4" fill="#12301a"/>
  <rect x="220" y="208" width="780" height="28" rx="4" fill="#3a5a20" opacity="0.9"/>
  <text x="1012" y="228" fill="#e8eef4" font-family="'SF Mono','Courier New',monospace" font-size="18">423.2 s</text>

  <text x="48" y="290" fill="#e8eef4" font-family="'SF Mono','Courier New',monospace" font-size="14">Sol-H3 5 s</text>
  <rect x="220" y="268" width="126" height="28" rx="4" fill="#0a2a32"/>
  <rect x="220" y="268" width="126" height="28" rx="4" fill="#76b900" opacity="0.95" filter="url(#glow)"/>
  <text x="360" y="288" fill="#e8eef4" font-family="'SF Mono','Courier New',monospace" font-size="18">68.1 s</text>

  <text x="48" y="350" fill="#888" font-family="'SF Mono','Courier New',monospace" font-size="13">6.2× wall on the 5 s cell · 3× pixels · NVIDIA 56 s not reproduced</text>

  <rect x="0" y="520" width="1200" height="104" fill="#081018"/>
  <g font-family="'SF Mono','Courier New',monospace" fill="#e8eef4">
    <text x="48" y="556" fill="#5a8a6a" font-size="12">CLIP</text>
    <text x="48" y="584" font-size="22">5.04 s</text>
    <text x="48" y="606" fill="#666" font-size="11">121 fr · 24 fps</text>

    <text x="280" y="556" fill="#5a8a6a" font-size="12">SIZE</text>
    <text x="280" y="584" font-size="22">1344×768</text>
    <text x="280" y="606" fill="#666" font-size="11">3× vs 768×448</text>

    <text x="540" y="556" fill="#5a8a6a" font-size="12">E2E</text>
    <text x="540" y="584" font-size="22">68.12 s</text>
    <text x="540" y="606" fill="#666" font-size="11">warmup excluded</text>

    <text x="780" y="556" fill="#5a8a6a" font-size="12">VS FL2VA</text>
    <text x="780" y="584" font-size="22">6.2×</text>
    <text x="780" y="606" fill="#666" font-size="11">different sampler</text>

    <text x="1000" y="556" fill="#5a8a6a" font-size="12">NVIDIA</text>
    <text x="1000" y="584" font-size="22">56 s</text>
    <text x="1000" y="606" fill="#666" font-size="11">not our number</text>
