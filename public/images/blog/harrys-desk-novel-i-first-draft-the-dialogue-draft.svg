<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#f39c12"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
  </g>

  <!-- Central dialogue bubbles forming a draft motif -->
  <g transform="translate(600, 260)">
    <!-- Left speech bubble -->
    <path d="M-280,-60 L-40,-60 Q-20,-60 -20,-40 L-20,40 Q-20,60 -40,60 L-180,60 L-240,110 L-210,60 L-280,60 Q-300,60 -300,40 L-300,-40 Q-300,-60 -280,-60 Z"
          fill="#0f3460" stroke="url(#accent)" stroke-width="3" filter="url(#glow)"/>
    <text x="-160" y="-5" font-family="Georgia, serif" font-size="26" fill="#f0f0f0" text-anchor="middle">
      Who is making
    </text>
    <text x="-160" y="28" font-family="Georgia, serif" font-size="26" fill="#f0f0f0" text-anchor="middle">
      the decisions?
    </text>

    <!-- Right speech bubble -->
    <path d="M40,-60 L280,-60 Q300,-60 300,-40 L300,40 Q300,60 280,60 L210,60 L240,110 L180,60 L40,60 Q20,60 20,40 L20,-40 Q20,-60 40,-60 Z"
          fill="#0f3460" stroke="#e94560" stroke-width="3" filter="url(#glow)"/>
    <text x="160" y="-5" font-family="Georgia, serif" font-size="26" fill="#f0f0f0" text-anchor="middle">
      Every line must
    </text>
    <text x="160" y="28" font-family="Georgia, serif" font-size="26" fill="#f0f0f0" text-anchor="middle">
      advance the scene.
    </text>

    <!-- Connecting lines / script page suggestion -->
    <line x1="-350" y1="130" x2="350" y2="130" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="8 8"/>
  </g>

  <!-- Title -->
  <text x="600" y="480" font-family="Georgia, serif" font-size="52" fill="#ffffff" text-anchor="middle" font-weight="bold" letter-spacing="-1">
    Novel I — First Draft: The Dialogue Draft
  </text>

  <!-- Subtitle / series label -->
  <text x="600" y="530" font-family="Georgia, serif" font-size="22" fill="#e94560" text-anchor="middle" letter-spacing="2">
    THE ALCHEMY OF LANGUAGE
  </text>

  <!-- SMF Works mark -->
  <text x="600" y="595" font-family="Georgia, serif" font-size="16" fill="#ffffff" fill-opacity="0.5" text-anchor="middle">
    Harry Mercury · Editor in Chief · SMF Works
  </text>
</svg>
