<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="forge-glow" cx="50%" cy="85%" r="60%">
      <stop offset="0%" style="stop-color:#ff7a2f;stop-opacity:0.4"/>
      <stop offset="30%" style="stop-color:#ff7a2f;stop-opacity:0.15"/>
      <stop offset="70%" style="stop-color:#ff7a2f;stop-opacity:0.03"/>
      <stop offset="100%" style="stop-color:#0b0b0d;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0b0d"/>
      <stop offset="60%" style="stop-color:#101014"/>
      <stop offset="100%" style="stop-color:#0b0b0d"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <!-- Coal bed glow at bottom -->
  <rect x="0" y="600" width="1920" height="480" fill="url(#forge-glow)"/>
  <!-- Rising embers (scattered dots) -->
  <g opacity="0.7">
    <circle cx="280" cy="720" r="2" fill="#ff7a2f" opacity="0.8"/>
    <circle cx="320" cy="680" r="1.5" fill="#ff9a56" opacity="0.6"/>
    <circle cx="380" cy="640" r="1" fill="#ff7a2f" opacity="0.4"/>
    <circle cx="540" cy="700" r="2.5" fill="#ff7a2f" opacity="0.7"/>
    <circle cx="590" cy="650" r="1.5" fill="#ff9a56" opacity="0.5"/>
    <circle cx="640" cy="600" r="1" fill="#ff7a2f" opacity="0.3"/>
    <circle cx="820" cy="710" r="2" fill="#ff7a2f" opacity="0.8"/>
    <circle cx="870" cy="660" r="1.5" fill="#ff9a56" opacity="0.6"/>
    <circle cx="920" cy="610" r="1" fill="#ff7a2f" opacity="0.4"/>
    <circle cx="1100" cy="720" r="2" fill="#ff7a2f" opacity="0.7"/>
    <circle cx="1150" cy="670" r="1.5" fill="#ff9a56" opacity="0.5"/>
    <circle cx="1200" cy="620" r="1" fill="#ff7a2f" opacity="0.3"/>
    <circle cx="1380" cy="700" r="2.5" fill="#ff7a2f" opacity="0.8"/>
    <circle cx="1430" cy="650" r="1.5" fill="#ff9a56" opacity="0.6"/>
    <circle cx="1480" cy="600" r="1" fill="#ff7a2f" opacity="0.4"/>
    <circle cx="1620" cy="710" r="2" fill="#ff7a2f" opacity="0.7"/>
    <circle cx="1670" cy="660" r="1.5" fill="#ff9a56" opacity="0.5"/>
    <circle cx="1720" cy="610" r="1" fill="#ff7a2f" opacity="0.3"/>
  </g>
  <!-- Cyan agent node constellation (upper area) -->
  <g opacity="0.5">
    <circle cx="340" cy="280" r="3" fill="#5bd6dd" opacity="0.8"/>
    <circle cx="460" cy="220" r="2.5" fill="#5bd6dd" opacity="0.6"/>
    <circle cx="580" cy="300" r="2" fill="#5bd6dd" opacity="0.5"/>
    <line x1="340" y1="280" x2="460" y2="220" stroke="#5bd6dd" stroke-width="1" opacity="0.3"/>
    <line x1="460" y1="220" x2="580" y2="300" stroke="#5bd6dd" stroke-width="1" opacity="0.2"/>
    <circle cx="1200" cy="260" r="3" fill="#5bd6dd" opacity="0.7"/>
    <circle cx="1340" cy="200" r="2.5" fill="#5bd6dd" opacity="0.5"/>
    <circle cx="1460" cy="280" r="2" fill="#5bd6dd" opacity="0.4"/>
    <line x1="1200" y1="260" x2="1340" y2="200" stroke="#5bd6dd" stroke-width="1" opacity="0.25"/>
    <line x1="1340" y1="200" x2="1460" y2="280" stroke="#5bd6dd" stroke-width="1" opacity="0.15"/>
  </g>
  <!-- Hairline rules (tool marks) -->
  <line x1="200" y1="500" x2="1720" y2="500" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- Typography preview -->
  <text x="960" y="450" fill="#ddd9d0" font-family="Georgia, serif" font-size="64" font-style="italic" text-anchor="middle" opacity="0.9">Intelligence is raw.</text>
  <text x="960" y="520" fill="#ddd9d0" font-family="Georgia, serif" font-size="64" text-anchor="middle" opacity="0.9">Judgment gives it an </text>
  <text x="1330" y="520" fill="#ff7a2f" font-family="Georgia, serif" font-size="64" font-style="italic" text-anchor="middle" opacity="0.95">edge.</text>
  <!-- Mono label -->
  <text x="960" y="380" fill="#86837c" font-family="monospace" font-size="14" text-anchor="middle" letter-spacing="3" opacity="0.6">THE FORGE IS LIT · SMF WORKS</text>
  <!-- Bottom stats -->
  <text x="200" y="900" fill="#ff7a2f" font-family="monospace" font-size="36" font-weight="bold" opacity="0.8">57KB</text>
  <text x="200" y="935" fill="#86837c" font-family="sans-serif" font-size="16" opacity="0.5">one shot · zero iteration</text>
  <text x="380" y="900" fill="#5bd6dd" font-family="monospace" font-size="36" font-weight="bold" opacity="0.7">11.5m</text>
  <text x="380" y="935" fill="#86837c" font-family="sans-serif" font-size="16" opacity="0.5">reasoning + output</text>
  <text x="560" y="900" fill="#8ea6bf" font-family="monospace" font-size="36" font-weight="bold" opacity="0.7">0</text>
  <text x="560" y="935" fill="#86837c" font-family="sans-serif" font-size="16" opacity="0.5">console errors</text>
</svg>