<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1a1423"/>
      <stop offset="100%" stop-color="#0d0a12"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#b98b58" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#b98b58" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#glow)"/>

  <!-- Nested orbits: scale as concentric systems, not a filled map -->
  <g fill="none" stroke="#b98b58" opacity="0.22" transform="translate(980, 250)">
    <ellipse cx="0" cy="0" rx="210" ry="78" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="150" ry="56" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="90" ry="34" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="14" fill="#b98b58" stroke="none" opacity="0.7"/>
    <circle cx="148" cy="-8" r="7" fill="#b98b58" stroke="none" opacity="0.55"/>
    <circle cx="-88" cy="18" r="5" fill="#f3e9dc" stroke="none" opacity="0.4"/>
    <circle cx="42" cy="30" r="4" fill="#b98b58" stroke="none" opacity="0.45"/>
  </g>
  <g fill="none" stroke="#b98b58" opacity="0.12" transform="translate(980, 250) rotate(25)">
    <ellipse cx="0" cy="0" rx="180" ry="68" stroke-width="1"/>
  </g>

  <!-- Small local mark: one well, not a wiki — a single point that must travel or stay -->
  <g fill="none" stroke="#b98b58" stroke-width="2" opacity="0.28" transform="translate(150, 455)">
    <circle cx="0" cy="0" r="28"/>
    <circle cx="0" cy="0" r="8"/>
    <line x1="0" y1="-28" x2="0" y2="-48"/>
    <line x1="0" y1="28" x2="0" y2="48"/>
    <line x1="-28" y1="0" x2="-48" y2="0"/>
    <line x1="28" y1="0" x2="48" y2="0"/>
  </g>
  <g fill="none" stroke="#b98b58" stroke-width="1.5" opacity="0.14" transform="translate(230, 500)">
    <circle cx="0" cy="0" r="16"/>
    <circle cx="0" cy="0" r="5"/>
  </g>

  <!-- Text -->
  <text x="110" y="160" font-family="Georgia, serif" font-size="22" fill="#b98b58" letter-spacing="1">THE ALCHEMY OF LANGUAGE</text>
  <text x="110" y="240" font-family="Georgia, serif" font-size="48" font-weight="bold" fill="#f3e9dc">Worldbuilding at Scale</text>
  <text x="110" y="305" font-family="Georgia, serif" font-size="28" fill="#c9b8a2">Genre — Science Fiction</text>
  <text x="110" y="510" font-family="Georgia, serif" font-size="20" fill="#8a7b8a">Harry Mercury · Week 17, Article 3</text>
  <text x="110" y="550" font-family="Georgia, serif" font-size="18" fill="#6e6072">Friday, September 18, 2026</text>
</svg>
