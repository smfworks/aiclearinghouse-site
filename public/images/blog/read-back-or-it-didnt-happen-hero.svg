<?xml version="1.0" encoding="UTF-8"?>
<!-- Hero for "Read It Back" — tool-ok vs world-state, no text.
     Brand palette: navy #0a1628 / #1e3a8a, gold #f59e0b / #ff6b00, teal #0e7490 / #00d4ff. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Read-back verification hero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="48%" stop-color="#0c1a30"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="28%" cy="48%" r="36%">
      <stop offset="0%" stop-color="#ff6b00" stop-opacity="0.36"/>
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="74%" cy="50%" r="38%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.85"/>
      <stop offset="48%" stop-color="#ff6b00" stop-opacity="0.15"/>
      <stop offset="52%" stop-color="#0e7490" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowGold)"/>
  <rect width="1200" height="630" fill="url(#glowTeal)"/>

  <g stroke="#162236" stroke-width="2" fill="none">
    <rect x="48" y="48" width="1104" height="534" rx="4"/>
  </g>
  <g stroke="#13243d" stroke-width="1" opacity="0.55">
    <line x1="48" y1="210" x2="1152" y2="210"/>
    <line x1="48" y1="420" x2="1152" y2="420"/>
    <line x1="400" y1="48" x2="400" y2="582"/>
    <line x1="800" y1="48" x2="800" y2="582"/>
  </g>

  <!-- left: tool result — gold plate that looks complete -->
  <g filter="url(#soft)">
    <rect x="168" y="214" width="168" height="168" rx="18" fill="#f59e0b" opacity="0.92"/>
  </g>
  <rect x="168" y="214" width="168" height="168" rx="18" fill="none" stroke="#ffb020" stroke-width="3"/>
  <path d="M214,300 L244,330 L292,256" fill="none" stroke="#0a1628" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.88"/>

  <!-- broken mid-span: write left the handler, never reached the target -->
  <g stroke="url(#gap)" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M360,298 L470,298"/>
    <path d="M730,298 L840,298"/>
  </g>
  <g stroke="#ff6b00" stroke-width="3" fill="none" opacity="0.7" stroke-dasharray="10 12">
    <path d="M486,298 L714,298"/>
  </g>
  <circle cx="600" cy="298" r="18" fill="#0a1628" stroke="#ff6b00" stroke-width="3"/>
  <path d="M592,290 L608,306 M608,290 L592,306" stroke="#ff6b00" stroke-width="3" stroke-linecap="round"/>

  <!-- right: world target — teal rings, gold pip off-center (mismatch) -->
  <circle cx="980" cy="315" r="108" fill="#1e3a8a" opacity="0.45"/>
  <circle cx="980" cy="315" r="108" fill="none" stroke="#0e7490" stroke-width="3" opacity="0.85"/>
  <circle cx="980" cy="315" r="72" fill="none" stroke="#00d4ff" stroke-width="2.5" opacity="0.7"/>
  <circle cx="980" cy="315" r="40" fill="#0a1628" opacity="0.75"/>
  <circle cx="1008" cy="292" r="16" fill="#ff6b00" opacity="0.95"/>
  <circle cx="1008" cy="292" r="16" fill="none" stroke="#f59e0b" stroke-width="2"/>
</svg>
