  <line x1="1450" y1="560" x2="1560" y2="690" stroke="#C9A96E" stroke-width="2" opacity="0.5"/>
  <text x="1400" y="545" text-anchor="middle" fill="#C9A96E" font-size="14" font-family="monospace">COORD</text>
