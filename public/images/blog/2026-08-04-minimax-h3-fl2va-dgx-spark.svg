<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" width="1200" height="624">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#06141e"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#16213e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f3460" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#76b900" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#76b900" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="624" fill="url(#bg)"/>

  <!-- Grid -->
  <g opacity="0.1" stroke="#1a3a2a" stroke-width="0.5">
    <line x1="0" y1="156" x2="1200" y2="156"/>
    <line x1="0" y1="312" x2="1200" y2="312"/>
    <line x1="0" y1="468" x2="1200" y2="468"/>
  </g>

  <!-- Video player frame (left) -->
  <g transform="translate(60, 90)">
    <rect x="0" y="0" width="640" height="360" rx="12" fill="url(#screen)" stroke="#1a3a2a" stroke-width="1.5"/>
    <ellipse cx="320" cy="180" rx="280" ry="160" fill="url(#glow1)"/>

    <!-- Play button -->
    <circle cx="320" cy="180" r="48" fill="#0d1f12" stroke="#76b900" stroke-width="2" filter="url(#glow)"/>
    <polygon points="305,160 305,200 345,180" fill="#76b900" filter="url(#glow)"/>

    <!-- Video timeline -->
    <rect x="20" y="320" width="600" height="4" rx="2" fill="#1a2a3a"/>
    <rect x="20" y="320" width="200" height="4" rx="2" fill="#76b900"/>
    <circle cx="220" cy="322" r="6" fill="#76b900" filter="url(#glow)"/>

    <!-- Resolution badge -->
    <rect x="20" y="20" width="100" height="24" rx="4" fill="#0d1f12" stroke="#1a3a2a" stroke-width="0.5"/>
    <text x="70" y="37" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="10" fill="#76b900">768×448</text>

    <!-- Duration badge -->
    <rect x="540" y="20" width="80" height="24" rx="4" fill="#0d1f12" stroke="#1a3a2a" stroke-width="0.5"/>
    <text x="580" y="37" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="10" fill="#76b900">2.3s</text>

    <!-- Audio waveform overlay -->
    <g transform="translate(240, 280)" opacity="0.4">
      <rect x="0" y="0" width="2" height="20" fill="#76b900"/>
      <rect x="6" y="-5" width="2" height="30" fill="#76b900"/>
      <rect x="12" y="3" width="2" height="14" fill="#76b900"/>
      <rect x="18" y="-8" width="2" height="36" fill="#76b900"/>
      <rect x="24" y="0" width="2" height="20" fill="#76b900"/>
      <rect x="30" y="-3" width="2" height="26" fill="#76b900"/>
      <rect x="36" y="5" width="2" height="10" fill="#76b900"/>
      <rect x="42" y="-2" width="2" height="24" fill="#76b900"/>
      <rect x="48" y="2" width="2" height="16" fill="#76b900"/>
      <rect x="54" y="-6" width="2" height="32" fill="#76b900"/>
      <rect x="60" y="0" width="2" height="20" fill="#76b900"/>
      <rect x="66" y="-1" width="2" height="22" fill="#76b900"/>
      <rect x="72" y="4" width="2" height="12" fill="#76b900"/>
      <rect x="78" y="-4" width="2" height="28" fill="#76b900"/>
      <rect x="84" y="1" width="2" height="18" fill="#76b900"/>
      <rect x="90" y="-2" width="2" height="24" fill="#76b900"/>
      <rect x="96" y="3" width="2" height="14" fill="#76b900"/>
      <rect x="102" y="0" width="2" height="20" fill="#76b900"/>
      <rect x="108" y="-7" width="2" height="34" fill="#76b900"/>
      <rect x="114" y="2" width="2" height="16" fill="#76b900"/>
      <rect x="120" y="-3" width="2" height="26" fill="#76b900"/>
      <rect x="126" y="5" width="2" height="10" fill="#76b900"/>
      <rect x="132" y="-1" width="2" height="22" fill="#76b900"/>
      <rect x="138" y="0" width="2" height="20" fill="#76b900"/>
      <rect x="144" y="3" width="2" height="14" fill="#76b900"/>
      <rect x="150" y="-5" width="2" height="30" fill="#76b900"/>
      <rect x="156" y="1" width="2" height="18" fill="#76b900"/>
      <rect x="162" y="-2" width="2" height="24" fill="#76b900"/>
    </g>

    <!-- Audio label -->
    <text x="320" y="265" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="9" fill="#5a8a5a" opacity="0.6">AAC STEREO · 32kHz</text>
  </g>

  <!-- Stats panel (right) -->
  <g transform="translate(750, 90)">
    <text x="190" y="-10" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="11" fill="#5a8a5a">DEPLOYMENT METRICS</text>

    <!-- Metric cards -->
    <rect x="0" y="10" width="170" height="55" rx="6" fill="#0d1f12" stroke="#1a3a2a" stroke-width="0.5"/>
    <text x="85" y="28" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">CHECKPOINT</text>
    <text x="85" y="50" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="16" font-weight="700" fill="#76b900" filter="url(#textGlow)">135 GiB</text>

    <rect x="185" y="10" width="170" height="55" rx="6" fill="#0d1f12" stroke="#1a3a2a" stroke-width="0.5"/>
    <text x="270" y="28" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">MODEL LOAD</text>
    <text x="270" y="50" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="16" font-weight="700" fill="#76b900" filter="url(#textGlow)">89 GB</text>

    <rect x="0" y="75" width="170" height="55" rx="6" fill="#0d1f12" stroke="#1a3a2a" stroke-width="0.5"/>
    <text x="85" y="93" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">COLD START</text>
    <text x="85" y="115" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="16" font-weight="700" fill="#76b900" filter="url(#textGlow)">9 min</text>

    <rect x="185" y="75" width="170" height="55" rx="6" fill="#0d1f12" stroke="#1a3a2a" stroke-width="0.5"/>
    <text x="270" y="93" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">GEN TIME</text>
    <text x="270" y="115" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="16" font-weight="700" fill="#76b900" filter="url(#textGlow)">163 sec</text>

    <rect x="0" y="140" width="170" height="55" rx="6" fill="#0d1f12" stroke="#1a3a2a" stroke-width="0.5"/>
    <text x="85" y="158" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">OUTPUT</text>
    <text x="85" y="180" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="14" font-weight="700" fill="#e8eef4">768×448 24fps</text>

    <rect x="185" y="140" width="170" height="55" rx="6" fill="#0d1f12" stroke="#1a3a2a" stroke-width="0.5"/>
    <text x="270" y="158" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">QUANTIZATION</text>
    <text x="270" y="180" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="14" font-weight="700" fill="#e8eef4">Online FP8</text>

    <rect x="0" y="205" width="170" height="55" rx="6" fill="#0d1f12" stroke="#1a3a2a" stroke-width="0.5"/>
    <text x="85" y="223" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">VIDEOS GEN</text>
    <text x="85" y="245" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="16" font-weight="700" fill="#76b900" filter="url(#textGlow)">4</text>

    <rect x="185" y="205" width="170" height="55" rx="6" fill="#0d1f12" stroke="#1a3a2a" stroke-width="0.5"/>
    <text x="270" y="223" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="8" fill="#666">SUCCESS RATE</text>
    <text x="270" y="245" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="16" font-weight="700" fill="#76b900" filter="url(#textGlow)">100%</text>
  </g>

  <!-- Title -->
  <text x="600" y="500" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="28" font-weight="700" fill="#e8eef4" filter="url(#textGlow)">MiniMax H3 FL2VA on the DGX Spark</text>
  <text x="600" y="528" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="13" fill="#76b900">Text-to-video-and-audio generation on 128 GB unified memory · Online FP8 · vLLM-Omni</text>

  <!-- Bottom tagline -->
  <text x="600" y="560" text-anchor="middle" font-family="SF Mono, Courier New, monospace" font-size="11" fill="#5a8a5a">First successful deployment · Further testing underway</text>
</svg>