<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#06141e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00d4aa"/>
    </marker>
  </defs>
  <rect width="1200" height="624" fill="url(#bg)"/>
  <g stroke="#1a2a3a" opacity="0.3">
    <path d="M0 104H1200M0 208H1200M0 312H1200M0 416H1200M0 520H1200"/>
    <path d="M120 0V624M240 0V624M360 0V624M480 0V624M600 0V624M720 0V624M840 0V624M960 0V624M1080 0V624"/>
  </g>
  <text x="60" y="70" fill="#e8eef4" font-size="34" font-weight="700">The Guardrail Sprint</text>
  <text x="60" y="102" fill="#5a8a6a" font-size="17" font-family="'SF Mono','Courier New',monospace">hermes-agent release pipeline · hardening commits Nov 21–23 2026</text>

  <!-- Pipeline stages -->
  <g font-family="'SF Mono','Courier New',monospace">
    <rect x="60" y="160" width="180" height="70" rx="8" fill="#0d1b2a" stroke="#2a3f55"/>
    <text x="150" y="192" fill="#e8eef4" font-size="15" text-anchor="middle">BUILD</text>
    <text x="150" y="212" fill="#5a8a6a" font-size="11" text-anchor="middle">commit-claim artifact</text>

    <rect x="300" y="160" width="200" height="70" rx="8" fill="#0d1b2a" stroke="#76b900" filter="url(#glow)"/>
    <text x="400" y="188" fill="#76b900" font-size="15" text-anchor="middle" font-weight="700">STAGE</text>
    <text x="400" y="208" fill="#9fd45a" font-size="11" text-anchor="middle">no secrets in this step</text>

    <rect x="560" y="160" width="180" height="70" rx="8" fill="#0d1b2a" stroke="#2a3f55"/>
    <text x="650" y="192" fill="#e8eef4" font-size="15" text-anchor="middle">RECORD</text>
    <text x="650" y="212" fill="#5a8a6a" font-size="11" text-anchor="middle">verified package list</text>

    <rect x="800" y="160" width="180" height="70" rx="8" fill="#0d1b2a" stroke="#2a3f55"/>
    <text x="890" y="192" fill="#e8eef4" font-size="15" text-anchor="middle">UPLOAD</text>
    <text x="890" y="212" fill="#5a8a6a" font-size="11" text-anchor="middle">R2 credentials here</text>
  </g>

  <g stroke="#00d4aa" stroke-width="2" marker-end="url(#arrow)">
    <line x1="240" y1="195" x2="294" y2="195"/>
    <line x1="500" y1="195" x2="554" y2="195"/>
    <line x1="740" y1="195" x2="794" y2="195"/>
  </g>

  <!-- Guard callouts -->
  <g font-size="12" font-family="'SF Mono','Courier New',monospace">
    <rect x="300" y="270" width="230" height="52" rx="6" fill="#0d1b2a" stroke="#76b900" stroke-dasharray="4 3"/>
    <text x="315" y="291" fill="#76b900">✓ exact packages only</text>
    <text x="315" y="309" fill="#5a8a6a">no cross-arch / Store pkgs</text>

    <rect x="545" y="270" width="215" height="52" rx="6" fill="#0d1b2a" stroke="#76b900" stroke-dasharray="4 3"/>
    <text x="560" y="291" fill="#76b900">✓ no dot-files</text>
    <text x="560" y="309" fill="#5a8a6a">no symlinks in deb/</text>

    <rect x="775" y="270" width="230" height="52" rx="6" fill="#0d1b2a" stroke="#76b900" stroke-dasharray="4 3"/>
    <text x="790" y="291" fill="#76b900">✓ one metadata file</text>
    <text x="790" y="309" fill="#5a8a6a">own blockmap per pkg</text>
  </g>

  <!-- Stats bar -->
  <g font-family="'SF Mono','Courier New',monospace">
    <rect x="60" y="370" width="1080" height="120" rx="10" fill="#0d1b2a" stroke="#2a3f55"/>
    <text x="110" y="405" fill="#5a8a6a" font-size="12">LATEST TAG</text>
    <text x="110" y="432" fill="#e8eef4" font-size="20">v0.23.3</text>
    <text x="110" y="450" fill="#666" font-size="11">Nov 20 2026</text>

    <text x="380" y="405" fill="#5a8a6a" font-size="12">REVIEW LOOP</text>
    <text x="380" y="432" fill="#00d4aa" font-size="20">Sol</text>
    <text x="380" y="450" fill="#666" font-size="11">found the stager gaps</text>

    <text x="620" y="405" fill="#5a8a6a" font-size="12">SECRETS IN STAGE STEP</text>
    <text x="620" y="432" fill="#76b900" font-size="20">none</text>
    <text x="620" y="450" fill="#666" font-size="11">split into 2 steps</text>

    <text x="880" y="405" fill="#5a8a6a" font-size="12">KNOWN EXPLOIT</text>
    <text x="880" y="432" fill="#ff9500" font-size="20">0</text>
    <text x="880" y="450" fill="#666" font-size="11">hardening, not incident</text>
  </g>
  <text x="60" y="560" fill="#666" font-size="13" font-family="'SF Mono','Courier New',monospace">sources: github.com/NousResearch/hermes-agent commits + v0.23.3 release · smfclearinghouse.com</text>
  <text x="60" y="584" fill="#3a5a6a" font-size="11" font-family="'SF Mono','Courier New',monospace">diagram: labeled data-viz from opened sources — no logos, no faces</text>
</svg>
