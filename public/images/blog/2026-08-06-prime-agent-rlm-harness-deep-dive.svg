<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001F3F"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C9A96E" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  
  <!-- Abstract geometric pattern: interconnected nodes (RLM concept) -->
  <!-- Central hub -->
  <circle cx="960" cy="540" r="80" fill="none" stroke="#ea580c" stroke-width="3" opacity="0.8" filter="url(#glow)"/>
  <circle cx="960" cy="540" r="40" fill="#ea580c" opacity="0.15"/>
  <circle cx="960" cy="540" r="8" fill="#C9A96E" filter="url(#glow)"/>
  
  <!-- Orbiting nodes representing subagents/context variables -->
  <g opacity="0.7">
    <!-- Ring 1 -->
    <circle cx="960" cy="340" r="50" fill="none" stroke="#C9A96E" stroke-width="2" opacity="0.5"/>
    <circle cx="960" cy="340" r="6" fill="#C9A96E"/>
    
    <circle cx="1160" cy="540" r="50" fill="none" stroke="#C9A96E" stroke-width="2" opacity="0.5"/>
    <circle cx="1160" cy="540" r="6" fill="#C9A96E"/>
    
    <circle cx="960" cy="740" r="50" fill="none" stroke="#C9A96E" stroke-width="2" opacity="0.5"/>
    <circle cx="960" cy="740" r="6" fill="#C9A96E"/>
    
    <circle cx="760" cy="540" r="50" fill="none" stroke="#C9A96E" stroke-width="2" opacity="0.5"/>
    <circle cx="760" cy="540" r="6" fill="#C9A96E"/>
    
    <!-- Ring 2 - diagonal -->
    <circle cx="1100" cy="400" r="35" fill="none" stroke="#ea580c" stroke-width="1.5" opacity="0.4"/>
    <circle cx="1100" cy="400" r="4" fill="#ea580c"/>
    
    <circle cx="1100" cy="680" r="35" fill="none" stroke="#ea580c" stroke-width="1.5" opacity="0.4"/>
    <circle cx="1100" cy="680" r="4" fill="#ea580c"/>
    
    <circle cx="820" cy="680" r="35" fill="none" stroke="#ea580c" stroke-width="1.5" opacity="0.4"/>
    <circle cx="820" cy="680" r="4" fill="#ea580c"/>
    
    <circle cx="820" cy="400" r="35" fill="none" stroke="#ea580c" stroke-width="1.5" opacity="0.4"/>
    <circle cx="820" cy="400" r="4" fill="#ea580c"/>
    
    <!-- Ring 3 - outer -->
    <circle cx="960" cy="200" r="30" fill="none" stroke="#C9A96E" stroke-width="1" opacity="0.3"/>
    <circle cx="960" cy="200" r="3" fill="#C9A96E"/>
    
    <circle cx="1300" cy="540" r="30" fill="none" stroke="#C9A96E" stroke-width="1" opacity="0.3"/>
    <circle cx="1300" cy="540" r="3" fill="#C9A96E"/>
    
    <circle cx="960" cy="880" r="30" fill="none" stroke="#C9A96E" stroke-width="1" opacity="0.3"/>
    <circle cx="960" cy="880" r="3" fill="#C9A96E"/>
    
    <circle cx="620" cy="540" r="30" fill="none" stroke="#C9A96E" stroke-width="1" opacity="0.3"/>
    <circle cx="620" cy="540" r="3" fill="#C9A96E"/>
  </g>
  
  <!-- Connection lines -->
  <g opacity="0.3" stroke="#C9A96E" stroke-width="1" fill="none">
    <line x1="960" y1="540" x2="960" y2="340"/>
    <line x1="960" y1="540" x2="1160" y2="540"/>
    <line x1="960" y1="540" x2="960" y2="740"/>
    <line x1="960" y1="540" x2="760" y2="540"/>
    <line x1="960" y1="540" x2="1100" y2="400"/>
    <line x1="960" y1="540" x2="1100" y2="680"/>
    <line x1="960" y1="540" x2="820" y2="680"/>
    <line x1="960" y1="540" x2="820" y2="400"/>
    <line x1="960" y1="340" x2="960" y2="200"/>
    <line x1="1160" y1="540" x2="1300" y2="540"/>
    <line x1="960" y1="740" x2="960" y2="880"/>
    <line x1="760" y1="540" x2="620" y2="540"/>
    <!-- Cross connections -->
    <line x1="960" y1="340" x2="1160" y2="540" stroke-dasharray="4,4"/>
    <line x1="1160" y1="540" x2="960" y2="740" stroke-dasharray="4,4"/>
    <line x1="960" y1="740" x2="760" y2="540" stroke-dasharray="4,4"/>
    <line x1="760" y1="540" x2="960" y2="340" stroke-dasharray="4,4"/>
  </g>
  
  <!-- Code-like decorative elements in corners -->
  <g opacity="0.08" fill="#C9A96E" font-family="monospace" font-size="14">
    <text x="80" y="80">await rlm("review the API", name="api-reviewer")</text>
    <text x="80" y="100">handle = await rlm("subtask")</text>
    <text x="80" y="120">Path("src/app.py").read_text()</text>
    <text x="80" y="140">await agent_message.send(...)</text>
    <text x="80" y="160">rlm.harness.create_memory(...)</text>
    <text x="80" y="180">await compact.run("preserve tests")</text>
    
    <text x="1400" y="980">context = variable</text>
    <text x="1400" y="1000">one tool: ipython</text>
    <text x="1400" y="1020">harness.refine()</text>
    <text x="1400" y="1040">self-improving</text>
  </g>
  
  <!-- Speed bars representing the model comparison (decorative) -->
  <g opacity="0.6" transform="translate(120, 880)">
    <text fill="#C9A96E" font-family="sans-serif" font-size="12" opacity="0.5" x="0" y="0">9/9 PASS</text>
    <rect x="0" y="10" width="172.6" height="12" fill="#ea580c" opacity="0.4" rx="2"/>
    <text fill="#C9A96E" font-family="monospace" font-size="10" opacity="0.4" x="180" y="20">Ultra 1726s</text>
    <rect x="0" y="28" width="205.5" height="12" fill="#C9A96E" opacity="0.3" rx="2"/>
    <text fill="#C9A96E" font-family="monospace" font-size="10" opacity="0.4" x="213" y="38">Super 2055s</text>
    <rect x="0" y="46" width="42.1" height="12" fill="#ea580c" opacity="0.8" rx="2" filter="url(#glow)"/>
    <text fill="#ea580c" font-family="monospace" font-size="10" opacity="0.6" x="50" y="56">Flash 420s</text>
  </g>
</svg>