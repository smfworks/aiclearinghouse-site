<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" width="1200" height="624">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#06141e"/>
    </linearGradient>
    <linearGradient id="nvgreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9ed836"/>
      <stop offset="100%" stop-color="#5a8a00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00d4aa"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="624" fill="url(#bg)"/>

  <!-- Grid -->
  <g opacity="0.15">
    <line x1="0" y1="78" x2="1200" y2="78" stroke="#1a3a4a" stroke-width="1"/>
    <line x1="0" y1="156" x2="1200" y2="156" stroke="#1a3a4a" stroke-width="1"/>
    <line x1="0" y1="234" x2="1200" y2="234" stroke="#1a3a4a" stroke-width="1"/>
    <line x1="0" y1="312" x2="1200" y2="312" stroke="#1a3a4a" stroke-width="1"/>
    <line x1="0" y1="390" x2="1200" y2="390" stroke="#1a3a4a" stroke-width="1"/>
    <line x1="0" y1="468" x2="1200" y2="468" stroke="#1a3a4a" stroke-width="1"/>
    <line x1="0" y1="546" x2="1200" y2="546" stroke="#1a3a4a" stroke-width="1"/>
    <line x1="150" y1="0" x2="150" y2="624" stroke="#1a3a4a" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="624" stroke="#1a3a4a" stroke-width="1"/>
    <line x1="450" y1="0" x2="450" y2="624" stroke="#1a3a4a" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="624" stroke="#1a3a4a" stroke-width="1"/>
    <line x1="750" y1="0" x2="750" y2="624" stroke="#1a3a4a" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="624" stroke="#1a3a4a" stroke-width="1"/>
    <line x1="1050" y1="0" x2="1050" y2="624" stroke="#1a3a4a" stroke-width="1"/>
  </g>

  <!-- Title -->
  <text x="600" y="48" text-anchor="middle" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="bold" fill="#e8eef4">IAMAO: Infrastructure-Aware Multi-Agent Orchestration</text>
  <text x="600" y="72" text-anchor="middle" font-family="'SF Mono','Courier New',monospace" font-size="13" fill="#5a8a6a">5 Principles · 5 Tests · Real Data</text>

  <!-- Central GPU chip representation -->
  <rect x="490" y="210" width="220" height="140" rx="12" fill="#0d1f2a" stroke="#76b900" stroke-width="2" filter="url(#glow)"/>
  <text x="600" y="255" text-anchor="middle" font-family="'SF Pro Display',Arial,sans-serif" font-size="16" font-weight="bold" fill="#76b900">ORCHESTRATION</text>
  <text x="600" y="275" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" fill="#5a8a6a">CORE</text>
  
  <!-- GPU pins -->
  <g fill="#2a4a5a">
    <rect x="510" y="200" width="4" height="10"/>
    <rect x="525" y="200" width="4" height="10"/>
    <rect x="540" y="200" width="4" height="10"/>
    <rect x="555" y="200" width="4" height="10"/>
    <rect x="570" y="200" width="4" height="10"/>
    <rect x="585" y="200" width="4" height="10"/>
    <rect x="600" y="200" width="4" height="10"/>
    <rect x="615" y="200" width="4" height="10"/>
    <rect x="630" y="200" width="4" height="10"/>
    <rect x="645" y="200" width="4" height="10"/>
    <rect x="660" y="200" width="4" height="10"/>
    <rect x="675" y="200" width="4" height="10"/>
    <rect x="690" y="200" width="4" height="10"/>
    <rect x="510" y="350" width="4" height="10"/>
    <rect x="525" y="350" width="4" height="10"/>
    <rect x="540" y="350" width="4" height="10"/>
    <rect x="555" y="350" width="4" height="10"/>
    <rect x="570" y="350" width="4" height="10"/>
    <rect x="585" y="350" width="4" height="10"/>
    <rect x="600" y="350" width="4" height="10"/>
    <rect x="615" y="350" width="4" height="10"/>
    <rect x="630" y="350" width="4" height="10"/>
    <rect x="645" y="350" width="4" height="10"/>
    <rect x="660" y="350" width="4" height="10"/>
    <rect x="675" y="350" width="4" height="10"/>
    <rect x="690" y="350" width="4" height="10"/>
  </g>

  <!-- 5 Principle nodes around the core -->
  <!-- Node 1: Model-Task Matching (top left) -->
  <circle cx="200" cy="160" r="50" fill="#0d1f2a" stroke="#00d4aa" stroke-width="2" filter="url(#glow)"/>
  <text x="200" y="155" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#00d4aa">MODEL</text>
  <text x="200" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#00d4aa">MATCHING</text>
  <text x="200" y="195" text-anchor="middle" font-family="SF Mono,monospace" font-size="9" fill="#5a8a6a">2.26s vs 6.67s</text>
  <line x1="250" y1="175" x2="490" y2="265" stroke="#00d4aa" stroke-width="1.5" opacity="0.6" marker-end="url(#arrowhead)"/>

  <!-- Node 2: Parallel Execution (top right) -->
  <circle cx="1000" cy="160" r="50" fill="#0d1f2a" stroke="#ff9500" stroke-width="2" filter="url(#glow)"/>
  <text x="1000" y="155" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#ff9500">PARALLEL</text>
  <text x="1000" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#ff9500">EXECUTION</text>
  <text x="1000" y="195" text-anchor="middle" font-family="SF Mono,monospace" font-size="9" fill="#5a8a6a">1.46x speedup</text>
  <line x1="950" y1="175" x2="710" y2="265" stroke="#ff9500" stroke-width="1.5" opacity="0.6" marker-end="url(#arrowhead)"/>

  <!-- Node 3: Heterogeneous Routing (bottom left) -->
  <circle cx="200" cy="400" r="50" fill="#0d1f2a" stroke="#76b900" stroke-width="2" filter="url(#glow)"/>
  <text x="200" y="395" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#76b900">HETEROGENEOUS</text>
  <text x="200" y="410" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#76b900">ROUTING</text>
  <text x="200" y="435" text-anchor="middle" font-family="SF Mono,monospace" font-size="9" fill="#5a8a6a">local+cloud</text>
  <line x1="250" y1="385" x2="490" y2="305" stroke="#76b900" stroke-width="1.5" opacity="0.6" marker-end="url(#arrowhead)"/>

  <!-- Node 4: Observability (bottom right) -->
  <circle cx="1000" cy="400" r="50" fill="#0d1f2a" stroke="#c060ff" stroke-width="2" filter="url(#glow)"/>
  <text x="1000" y="395" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#c060ff">OBSERVABILITY</text>
  <text x="1000" y="410" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#c060ff">+ TELEMETRY</text>
  <text x="1000" y="435" text-anchor="middle" font-family="SF Mono,monospace" font-size="9" fill="#5a8a6a">4/4 steps · 0 silent</text>
  <line x1="950" y1="385" x2="710" y2="305" stroke="#c060ff" stroke-width="1.5" opacity="0.6" marker-end="url(#arrowhead)"/>

  <!-- Node 5: Review Gates (bottom center) -->
  <circle cx="600" cy="510" r="50" fill="#0d1f2a" stroke="#ff5555" stroke-width="2" filter="url(#glow)"/>
  <text x="600" y="505" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#ff5555">TWO-STAGE</text>
  <text x="600" y="520" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#ff5555">REVIEW GATES</text>
  <text x="600" y="545" text-anchor="middle" font-family="SF Mono,monospace" font-size="9" fill="#5a8a6a">3 defects caught</text>
  <line x1="600" y1="460" x2="600" y2="355" stroke="#ff5555" stroke-width="1.5" opacity="0.6" marker-end="url(#arrowhead)"/>

  <!-- Mini bar chart: Serial vs Parallel -->
  <g transform="translate(40, 460)">
    <text x="0" y="0" font-family="SF Mono,monospace" font-size="10" fill="#5a8a6a">SERIAL vs PARALLEL (3 tasks)</text>
    <rect x="0" y="10" width="213" height="14" fill="#ff9500" opacity="0.7" rx="2"/>
    <text x="218" y="22" font-family="SF Mono,monospace" font-size="9" fill="#ff9500">53.13s serial</text>
    <rect x="0" y="30" width="145" height="14" fill="#00d4aa" opacity="0.7" rx="2"/>
    <text x="150" y="42" font-family="SF Mono,monospace" font-size="9" fill="#00d4aa">36.37s parallel</text>
  </g>

  <!-- Mini bar chart: Model times -->
  <g transform="translate(820, 460)">
    <text x="0" y="0" font-family="SF Mono,monospace" font-size="10" fill="#5a8a6a">MODEL LATENCY (same task)</text>
    <rect x="0" y="10" width="27" height="14" fill="#00d4aa" opacity="0.7" rx="2"/>
    <text x="32" y="22" font-family="SF Mono,monospace" font-size="9" fill="#00d4aa">2.26s DS-V4</text>
    <rect x="0" y="30" width="61" height="14" fill="#ff9500" opacity="0.7" rx="2"/>
    <text x="66" y="42" font-family="SF Mono,monospace" font-size="9" fill="#ff9500">5.10s Kimi</text>
    <rect x="0" y="50" width="80" height="14" fill="#76b900" opacity="0.7" rx="2"/>
    <text x="85" y="62" font-family="SF Mono,monospace" font-size="9" fill="#76b900">6.67s GLM</text>
  </g>

  <!-- Bottom stats bar -->
  <rect x="0" y="586" width="1200" height="38" fill="#0d1f2a" opacity="0.8"/>
  <g font-family="'SF Mono','Courier New',monospace" font-size="10" fill="#666">
    <text x="30" y="608">FRAMEWORK: IAMAO</text>
    <text x="250" y="608">TESTS: 5</text>
    <text x="370" y="608">MODELS: 3</text>
    <text x="500" y="608">SPEEDUP: 1.46x</text>
    <text x="670" y="608">DEFECTS CAUGHT: 3</text>
    <text x="870" y="608">SILENT FAILURES: 0/4</text>
    <text x="1050" y="608">TEAM FORGE</text>
  </g>
</svg>