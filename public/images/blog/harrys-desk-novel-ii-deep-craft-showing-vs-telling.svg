<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d1a2f;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00E5A0;stop-opacity:0.10"/>
      <stop offset="100%" style="stop-color:#00E5A0;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid-template" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#00E5A0" stroke-width="0.5" stroke-opacity="0.06"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid-template)"/>

  <!-- Central glow -->
  <circle cx="600" cy="280" r="240" fill="url(#glowGrad)"/>

  <!-- Showing motif: Open eye on the left side -->
  <g transform="translate(440, 280)" opacity="0.8">
    <!-- Eye almond shape -->
    <path d="M -60,0 C -60,-30 -30,-42 0,-42 C 30,-42 60,-30 60,0 C 60,30 30,42 0,42 C -30,42 -60,30 -60,0 Z"
          fill="none" stroke="#00E5A0" stroke-width="2.5"/>
    <!-- Iris -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="#00E5A0" stroke-width="2"/>
    <!-- Pupil -->
    <circle cx="0" cy="0" r="9" fill="#00E5A0" opacity="0.7"/>
    <!-- Catchlight -->
    <circle cx="-6" cy="-6" r="3" fill="#0a1628"/>
    <!-- Radiating lines suggesting vision/perception -->
    <line x1="-78" y1="-10" x2="-70" y2="-8" stroke="#00E5A0" stroke-width="1.5" opacity="0.5"/>
    <line x1="-78" y1="10" x2="-70" y2="8" stroke="#00E5A0" stroke-width="1.5" opacity="0.5"/>
    <line x1="78" y1="-10" x2="70" y2="-8" stroke="#00E5A0" stroke-width="1.5" opacity="0.5"/>
    <line x1="78" y1="10" x2="70" y2="8" stroke="#00E5A0" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Label under eye -->
  <text x="440" y="350" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#00E5A0" opacity="0.6" letter-spacing="2">SHOWING</text>

  <!-- Telling motif: Compressed text lines on the right side -->
  <g transform="translate(760, 280)" opacity="0.7">
    <!-- Compressed summary lines of varying length -->
    <rect x="-55" y="-32" width="100" height="5" rx="2" fill="#00E5A0" opacity="0.6"/>
    <rect x="-55" y="-20" width="85" height="5" rx="2" fill="#00E5A0" opacity="0.5"/>
    <rect x="-55" y="-8" width="95" height="5" rx="2" fill="#00E5A0" opacity="0.55"/>
    <rect x="-55" y="4" width="70" height="5" rx="2" fill="#00E5A0" opacity="0.45"/>
    <rect x="-55" y="16" width="90" height="5" rx="2" fill="#00E5A0" opacity="0.5"/>
    <rect x="-55" y="28" width="60" height="5" rx="2" fill="#00E5A0" opacity="0.4"/>
  </g>

  <!-- Label under text lines -->
  <text x="760" y="350" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#00E5A0" opacity="0.6" letter-spacing="2">TELLING</text>

  <!-- Rhythm waveform connecting them -->
  <g transform="translate(600, 280)" opacity="0.4">
    <!-- Alternating peaks (showing) and flats (telling) representing rhythm -->
    <path d="M -90,0 L -70,0 L -60,-25 L -50,0 L -30,0 L -20,-20 L -10,0 L 10,0 L 20,0 L 30,-28 L 40,0 L 50,0 L 60,-15 L 70,0 L 90,0"
          fill="none" stroke="#00E5A0" stroke-width="2"/>
  </g>

  <!-- Series mark -->
  <text x="600" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#00E5A0" opacity="0.6" letter-spacing="4">THE ALCHEMY OF LANGUAGE</text>

  <!-- Bottom title panel -->
  <rect x="0" y="430" width="1200" height="200" fill="#0a1628" opacity="0.8"/>
  <text x="600" y="490" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="600" fill="#ffffff">Novel II — Deep Craft: Showing vs Telling</text>
  <text x="600" y="530" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#00E5A0" opacity="0.7">The rhythm between dramatization and summary</text>

  <!-- SMF Works mark -->
  <text x="600" y="600" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#ffffff" opacity="0.35">
    Harry's Desk — The Alchemy of Language
  </text>
</svg>