<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" width="1100" height="460" role="img" aria-label="Before and after comparison of SMF Works and SMF Clearinghouse website cleanup">
  <defs>
    <linearGradient id="baBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="100%" stop-color="#0c1220"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="460" rx="16" fill="url(#baBg)" stroke="#1f273b"/>

  <text x="44" y="46" font-family="'SF Mono', monospace" font-size="12" font-weight="600" letter-spacing="1.8" fill="#f5a623">CLEANUP SNAPSHOT · BEFORE VS. AFTER</text>
  <text x="44" y="78" font-family="'Space Grotesk', Arial, sans-serif" font-size="25" font-weight="700" fill="#f5f7fb">Fewer Dead Ends, Clearer Purpose on Both Sites</text>

  <!-- Left Panel: smfworks.com -->
  <rect x="44" y="106" width="496" height="314" rx="14" fill="#0d1322" stroke="#2c3752"/>
  <text x="68" y="138" font-family="'Space Grotesk', Arial, sans-serif" font-size="20" font-weight="700" fill="#f5f7fb">smfworks.com</text>
  <text x="234" y="138" font-family="'SF Mono', monospace" font-size="12" fill="#22d3ee">Parent AI R&amp;D Lab</text>
  <line x1="68" y1="154" x2="516" y2="154" stroke="#1f273b"/>

  <!-- Bar 1: Retired overlapping route groups -->
  <text x="68" y="186" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13.5" fill="#cfd7e6">Retired route trees (301 redirected cleanly)</text>
  <rect x="68" y="198" width="420" height="22" rx="6" fill="#151d30"/>
  <rect x="68" y="198" width="350" height="22" rx="6" fill="#f5a623" fill-opacity="0.85"/>
  <text x="78" y="213" font-family="'SF Mono', monospace" font-size="11" font-weight="700" fill="#05070c">5 retired: /services /publications /research /newsletter /books</text>

  <!-- Bar 2: Clean live routes -->
  <text x="68" y="252" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13.5" fill="#cfd7e6">Clean live pages shipped today</text>
  <rect x="68" y="264" width="420" height="22" rx="6" fill="#151d30"/>
  <rect x="68" y="264" width="386" height="22" rx="6" fill="#22d3ee" fill-opacity="0.9"/>
  <text x="78" y="279" font-family="'SF Mono', monospace" font-size="11" font-weight="700" fill="#05070c">6 live: /  /fleets  /work  /about  /contact  /privacy</text>

  <!-- Bar 3: Upstream security commits kept -->
  <text x="68" y="318" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13.5" fill="#cfd7e6">Upstream commits preserved via rebase</text>
  <rect x="68" y="330" width="420" height="22" rx="6" fill="#151d30"/>
  <rect x="68" y="330" width="420" height="22" rx="6" fill="#38bdf8" fill-opacity="0.85"/>
  <text x="78" y="345" font-family="'SF Mono', monospace" font-size="11" font-weight="700" fill="#05070c">34/34 kept (Next 16.4.5 + security hardening PRs #14-#17)</text>

  <text x="68" y="394" font-family="'SF Mono', monospace" font-size="12" fill="#9ba6bc">Result: 21 files updated · 11/11 tests passing</text>

  <!-- Right Panel: smfclearinghouse.com -->
  <rect x="560" y="106" width="496" height="314" rx="14" fill="#0d1322" stroke="#2c3752"/>
  <text x="584" y="138" font-family="'Space Grotesk', Arial, sans-serif" font-size="20" font-weight="700" fill="#f5f7fb">smfclearinghouse.com</text>
  <text x="820" y="138" font-family="'SF Mono', monospace" font-size="12" fill="#f5a623">AI R&amp;D Field Journal</text>
  <line x1="584" y1="154" x2="1032" y2="154" stroke="#1f273b"/>

  <!-- Bar 1: Focused surfaces -->
  <text x="584" y="186" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13.5" fill="#cfd7e6">Focused destination surfaces</text>
  <rect x="584" y="198" width="420" height="22" rx="6" fill="#151d30"/>
  <rect x="584" y="198" width="330" height="22" rx="6" fill="#22d3ee" fill-opacity="0.9"/>
  <text x="594" y="213" font-family="'SF Mono', monospace" font-size="11" font-weight="700" fill="#05070c">3 core areas:  /   /blog (+ 1,230 posts)   /projects</text>

  <!-- Bar 2: Self-hosted typography & contrast -->
  <text x="584" y="252" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13.5" fill="#cfd7e6">Design &amp; reading upgrades</text>
  <rect x="584" y="264" width="420" height="22" rx="6" fill="#151d30"/>
  <rect x="584" y="264" width="396" height="22" rx="6" fill="#f5a623" fill-opacity="0.88"/>
  <text x="594" y="279" font-family="'SF Mono', monospace" font-size="11" font-weight="700" fill="#05070c">Unified fonts, live GitHub projects &amp; Support the lab CTA</text>

  <!-- Bar 3: Build verification -->
  <text x="584" y="318" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13.5" fill="#cfd7e6">Full static export &amp; test gate</text>
  <rect x="584" y="330" width="420" height="22" rx="6" fill="#151d30"/>
  <rect x="584" y="330" width="420" height="22" rx="6" fill="#38bdf8" fill-opacity="0.85"/>
  <text x="594" y="345" font-family="'SF Mono', monospace" font-size="11" font-weight="700" fill="#05070c">1,278 static pages compiled · 8/8 tests · 0 lint errors</text>

  <text x="584" y="394" font-family="'SF Mono', monospace" font-size="12" fill="#9ba6bc">Result: 14 files aligned · 2,137 files secret-scanned</text>
</svg>
