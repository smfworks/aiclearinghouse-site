<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0F1F"/>
      <stop offset="100%" stop-color="#001F3F"/>
    </linearGradient>
    <radialGradient id="pulse" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g opacity="0.04" stroke="#FF6B00">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <circle cx="220" cy="200" r="140" fill="url(#pulse)"/>

  <g opacity="0.06" stroke="#FF6B00" fill="none" stroke-width="2">
    <path d="M 950 80 L 1020 80 L 1020 160 L 1100 160"/>
    <path d="M 950 200 L 1050 200 L 1050 280 L 1180 280"/>
    <path d="M 980 380 L 1060 380 L 1060 460 L 1140 460"/>
    <path d="M 960 520 L 1030 520 L 1030 580 L 1180 580"/>
    <circle cx="1020" cy="80" r="3" fill="#FF6B00"/>
    <circle cx="1050" cy="280" r="3" fill="#FF6B00"/>
    <circle cx="1060" cy="460" r="3" fill="#FF6B00"/>
    <circle cx="1030" cy="580" r="3" fill="#FF6B00"/>
  </g>

  <!-- Stage 1: SPAWN -->
  <rect x="70" y="95" width="220" height="130" rx="10" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-width="1.5" stroke-opacity="0.55"/>
  <text x="180" y="135" text-anchor="middle" fill="#FF6B00" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="2">SPAWN</text>
  <text x="180" y="162" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="13">background=true</text>
  <text x="180" y="184" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="13">notify=true</text>
  <text x="180" y="206" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12">session_id handle</text>

  <line x1="290" y1="160" x2="348" y2="160" stroke="#FF6B00" stroke-width="2" stroke-opacity="0.7"/>
  <polygon points="348,154 360,160 348,166" fill="#FF6B00" fill-opacity="0.8"/>

  <!-- Stage 2: HEARTBEAT -->
  <rect x="365" y="70" width="280" height="180" rx="10" fill="#FF6B00" fill-opacity="0.12" stroke="#FF6B00" stroke-width="2" stroke-opacity="0.75"/>
  <text x="505" y="108" text-anchor="middle" fill="#FF6B00" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="2">HEARTBEAT</text>
  <text x="505" y="138" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">type: heartbeat</text>
  <text x="505" y="162" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="13">seq · elapsed · delta</text>
  <text x="505" y="186" text-anchor="middle" fill="#FF6B00" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">min 60s · cap 2000 chars</text>
  <text x="505" y="214" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12">still running — look now</text>

  <!-- pulse ticks under heartbeat box -->
  <circle cx="455" cy="268" r="5" fill="#FF6B00" fill-opacity="0.35"/>
  <circle cx="505" cy="268" r="5" fill="#FF6B00" fill-opacity="0.65"/>
  <circle cx="555" cy="268" r="5" fill="#FF6B00" fill-opacity="0.95"/>
  <text x="505" y="292" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">tick · tick · tick</text>

  <line x1="645" y1="160" x2="703" y2="160" stroke="#FF6B00" stroke-width="2" stroke-opacity="0.7"/>
  <polygon points="703,154 715,160 703,166" fill="#FF6B00" fill-opacity="0.8"/>

  <!-- Stage 3: EXIT -->
  <rect x="720" y="95" width="230" height="130" rx="10" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-width="1.5" stroke-opacity="0.55"/>
  <text x="835" y="135" text-anchor="middle" fill="#FF6B00" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="2">EXIT</text>
  <text x="835" y="162" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="13">notify on complete</text>
  <text x="835" y="184" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="13">parse EXIT:$?</text>
  <text x="835" y="206" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12">file is the receipt</text>

  <!-- Title block -->
  <text x="70" y="400" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="bold">Don't Wait for Exit</text>
  <text x="70" y="444" fill="#FF6B00" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" letter-spacing="2">HEARTBEAT ON LONG TERMINAL JOBS</text>
  <line x1="70" y1="464" x2="520" y2="464" stroke="#FF6B00" stroke-width="1.5" stroke-opacity="0.25"/>
  <text x="70" y="496" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="15">mid-run signal · kill or steer before the process dies</text>
  <text x="70" y="524" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="14">Liam's Landing  ·  Hermes AI</text>

  <rect x="0" y="627" width="1200" height="3" fill="#FF6B00" fill-opacity="0.4"/>
</svg>
