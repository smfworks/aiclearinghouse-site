<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" width="1200" height="624">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#06141e"/>
    </linearGradient>
    <linearGradient id="audioWave" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#76b900" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#76b900" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#76b900"/>
    </marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00d4aa"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="624" fill="url(#bg)"/>

  <!-- Grid -->
  <g opacity="0.15">
    <line x1="0" y1="78" x2="1200" y2="78" stroke="#1a2a3a" stroke-width="0.5"/>
    <line x1="0" y1="156" x2="1200" y2="156" stroke="#1a2a3a" stroke-width="0.5"/>
    <line x1="0" y1="234" x2="1200" y2="234" stroke="#1a2a3a" stroke-width="0.5"/>
    <line x1="0" y1="312" x2="1200" y2="312" stroke="#1a2a3a" stroke-width="0.5"/>
    <line x1="0" y1="390" x2="1200" y2="390" stroke="#1a2a3a" stroke-width="0.5"/>
    <line x1="0" y1="468" x2="1200" y2="468" stroke="#1a2a3a" stroke-width="0.5"/>
    <line x1="0" y1="546" x2="1200" y2="546" stroke="#1a2a3a" stroke-width="0.5"/>
    <line x1="150" y1="0" x2="150" y2="624" stroke="#1a2a3a" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="624" stroke="#1a2a3a" stroke-width="0.5"/>
    <line x1="450" y1="0" x2="450" y2="624" stroke="#1a2a3a" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="624" stroke="#1a2a3a" stroke-width="0.5"/>
    <line x1="750" y1="0" x2="750" y2="624" stroke="#1a2a3a" stroke-width="0.5"/>
    <line x1="900" y1="0" x2="900" y2="624" stroke="#1a2a3a" stroke-width="0.5"/>
    <line x1="1050" y1="0" x2="1050" y2="624" stroke="#1a2a3a" stroke-width="0.5"/>
  </g>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#e8eef4">NVIDIA NemotronLabs VoiceChat 11B</text>
  <text x="600" y="62" text-anchor="middle" font-family="'SF Mono','Courier New',monospace" font-size="13" fill="#5a8a6a">End-to-End Full-Duplex Speech-to-Speech · 11B Params · ~450ms Latency · Aug 3, 2026</text>

  <!-- Left side: Audio input waveform -->
  <g transform="translate(40, 140)">
    <text x="45" y="-10" text-anchor="middle" font-family="'SF Mono','Courier New',monospace" font-size="10" fill="#666">USER AUDIO</text>
    <text x="45" y="2" text-anchor="middle" font-family="'SF Mono','Courier New',monospace" font-size="9" fill="#5a8a6a">16kHz · Mono</text>
    <!-- Waveform bars -->
    <g fill="url(#audioWave)">
      <rect x="5" y="30" width="4" height="20" rx="2"/>
      <rect x="12" y="22" width="4" height="36" rx="2"/>
      <rect x="19" y="16" width="4" height="48" rx="2"/>
      <rect x="26" y="26" width="4" height="28" rx="2"/>
      <rect x="33" y="12" width="4" height="56" rx="2"/>
      <rect x="40" y="20" width="4" height="40" rx="2"/>
      <rect x="47" y="8" width="4" height="64" rx="2"/>
      <rect x="54" y="24" width="4" height="32" rx="2"/>
      <rect x="61" y="18" width="4" height="44" rx="2"/>
      <rect x="68" y="28" width="4" height="24" rx="2"/>
      <rect x="75" y="14" width="4" height="52" rx="2"/>
      <rect x="82" y="22" width="4" height="36" rx="2"/>
    </g>
    <!-- Arrow to encoder -->
    <line x1="92" y1="40" x2="118" y2="40" stroke="#76b900" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  </g>

  <!-- Fast Conformer Encoder -->
  <g transform="translate(165, 115)">
    <rect width="110" height="50" rx="8" fill="#1a2a3a" stroke="#76b900" stroke-width="1.5" filter="url(#glow)"/>
    <text x="55" y="20" text-anchor="middle" font-family="'SF Mono','Courier New',monospace" font-size="10" fill="#76b900" font-weight="600">FAST CONFORMER</text>
    <text x="55" y="36" text-anchor="middle" font-family="'SF Mono','Courier New',monospace" font-size="9" fill="#e8eef4">Streaming Encoder</text>
    <text x="55" y="48" text-anchor="middle" font-family="'SF Mono','Courier New',monospace" font-size="8" fill="#666">80ms frames</text>
  </g>
  <line x1="275" y1="140" x2="310" y2="140" stroke="#76b900" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- Audio tokens -->
  <g transform="translate(315, 125)">
    <text x="35" y="0" text-anchor="middle" font-family="'SF Mono','Courier New',monospace" font-size="9" fill="#666">AUDIO</text>
    <text x="35" y="10" text-anchor="middle" font-family="'SF Mono','Courier New',monospace" font-size="9" fill="#666">TOKENS</text>
    <g>
      <rect x="5" y="14" width="12" height="12" rx="2" fill="#0d3b1a" stroke="#76b900" stroke-width="0.8"/>
      <rect x="20" y="14" width="12" height="12" rx="2" fill="#0d3b1a" stroke="#76b900" stroke-width="0.8"/>
      <rect x="35" y="14" width="12" height="12" rx="2" fill="#0d3b1a" stroke="#76b900" stroke-width="0.8"/>
      <rect x="50" y="14" width="12" height="12" rx="2" fill="#0d3b1a" stroke="#76b900" stroke-width="0.8"/>
    </g>
  </g>
  <line x1="390" y1="140" x2="420" y2="140" stroke="#76b900" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- LLM Backbone (central, larger) -->
  <g transform="translate(425, 95)">
    <rect width="170" height="90" rx="10" fill="#0d1f0d" stroke="#76b900" stroke-width="2" filter="url(#glowGreen)"/>
    <text x="85" y="22" text-anchor="middle" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#76b900" font-weight="700">LLM BACKBONE</text>
    <text x="85" y="38" text-anchor="middle" font-family="'SF Mono','Courier New',monospace" font-size="9" fill="#e8eef4">Nemotron Nano V2 9B</text>
    <text x="85" y="52" text-anchor="middle" font-family="'SF Mono','Courier New',monospace" font-size="9" fill="#5a8a6a">Hybrid Mamba/Transformer</text>
    <!-- Mini architecture diagram inside -->
    <g transform="translate(20, 58)">
      <rect x="0" y="0" width="22" height="8" rx="2" fill="#76b900" opacity="0.6"/>
      <rect x="26" y="0" width="22" height="8" rx="2" fill="#00d4aa" opacity="0.6"/>
      <rect x="52" y="0" width="22" height="8" rx="2" fill="#76b900" opacity="0.6"/>
      <rect x="78" y="0" width="22" height="8" rx="2" fill="#00d4aa" opacity="0.6"/>
      <rect x="104" y="0" width="22" height="8" rx="2" fill="#76b900" opacity="0.6"/>
      <text x="0" y="18" font-family="'SF Mono','Courier New',monospace" font-size="7" fill="#666">Mamba</text>
      <text x="26" y="18" font-family="'SF Mono','Courier New',monospace" font-size="7" fill="#666">Attn</text>
      <text x="52" y="18" font-family="'SF Mono','Courier New',monospace" font-size="7" fill="#666">Mamba</text>
      <text x="78" y="18" font-family="'SF Mono','Courier New',monospace" font-size="7" fill="#666">Attn</text>
      <text x="104" y="18" font-family="'SF Mono','Courier New',monospace" font-size="7" fill="#666">Mamba</text>
    </g>
  </g>

  <!-- Output paths from LLM -->
  <!-- Text tokens path (up) -->
  <line x1="510" y1="95" x2="510" y2="78" stroke="#00d4aa" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
  <text x="515" y="72" font-family="'SF Mono','Courier New',monospace" font-size="8" fill="#00d4aa">TEXT</text>

  <!-- Tool calling path (right) -->
  <line x1="595" y1="118" x2="640" y2="118" stroke="#ff9500" stroke-width="1.5"/>
  <g transform="translate(645, 98)">
    <rect width="90" height="38" rx="6" fill="#1a2010" stroke="#ff9500" stroke-width="1.2"/>
    <text x="45" y="16" text-anchor="middle" font-family="'SF Mono','Courier New',monospace" font-size="9" fill="#ff9500" font-weight="600">TOOL CALL</text>
    <text x="45" y="30" text-anchor="middle" font-family="'SF Mono','Courier New',monospace" font-size="8" fill="#666">JSON channel</text>
  </g>

  <!-- TTS Decoder -->
  <g transform="translate(435, 185)">
    <rect width="150" height="42" rx="8" fill="#0d2a2a" stroke="#00d4aa" stroke-width="1.5"/>
    <text x="75" y="18" text-anchor="middle" font-family="'SF Mono','Courier New',monospace" font-size="10" fill="#00d4aa" font-weight="600">TTS DECODER</text>
    <text x="75" y="34" text-anchor="middle" font-family="'SF Mono','Courier New',monospace" font-size="8" fill="#e8eef4">4 codebooks · 12.5 Hz · 0.6 kbps</text>
  </g>
  <line x1="510" y1="185" x2="510" y2="170" stroke="#00d4aa" stroke-width="1.5" marker-end="url(#arrowCyan)" transform="rotate(180, 510, 185)"/>
  <line x1="510" y1="170" x2="510" y2="185" stroke="#00d4aa" stroke-width="1.5" marker-end="url(#arrowCyan)"/>

  <!-- Audio codes -->
  <line x1="510" y1="227" x2="510" y2="245" stroke="#00d4aa" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
  <g transform="translate(475, 250)">
    <text x="35" y="0" text-anchor="middle" font-family="'SF Mono','Courier New',monospace" font-size="9" fill="#666">AUDIO CODES</text>
    <g>
      <rect x="5" y="6" width="12" height="12" rx="2" fill="#0d3b3b" stroke="#00d4aa" stroke-width="0.8"/>
      <rect x="20" y="6" width="12" height="12" rx="2" fill="#0d3b3b" stroke="#00d4aa" stroke-width="0.8"/>
      <rect x="35" y="6" width="12" height="12" rx="2" fill="#0d3b3b" stroke="#00d4aa" stroke-width="0.8"/>
      <rect x="50" y="6" width="12" height="12" rx="2" fill="#0d3b3b" stroke="#00d4aa" stroke-width="0.8"/>
    </g>
  </g>

  <!-- Agent audio output (right side waveform) -->
  <line x1="545" y1="265" x2="580" y2="265" stroke="#00d4aa" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
  <g transform="translate(585, 240)">
    <text x="45" y="-10" text-anchor="middle" font-family="'SF Mono','Courier New',monospace" font-size="10" fill="#666">AGENT AUDIO</text>
    <text x="45" y="2" text-anchor="middle" font-family="'SF Mono','Courier New',monospace" font-size="9" fill="#5a8a6a">22.05kHz · Mono</text>
    <g fill="#00d4aa" opacity="0.7">
      <rect x="5" y="30" width="4" height="16" rx="2"/>
      <rect x="12" y="20" width="4" height="36" rx="2"/>
      <rect x="19" y="10" width="4" height="56" rx="2"/>
      <rect x="26" y="24" width="4" height="28" rx="2"/>
      <rect x="33" y="6" width="4" height="64" rx="2"/>
      <rect x="40" y="18" width="4" height="40" rx="2"/>
      <rect x="47" y="14" width="4" height="48" rx="2"/>
      <rect x="54" y="26" width="4" height="24" rx="2"/>
      <rect x="61" y="20" width="4" height="36" rx="2"/>
      <rect x="68" y="10" width="4" height="56" rx="2"/>
      <rect x="75" y="22" width="4" height="32" rx="2"/>
      <rect x="82" y="28" width="4" height="20" rx="2"/>
    </g>
  </g>

  <!-- Duplex indicator: bidirectional arrows -->
  <g transform="translate(355, 280)">
    <path d="M 0 0 L 60 0" stroke="#76b900" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowGreen)"/>
    <path d="M 60 12 L 0 12" stroke="#00d4aa" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowCyan)"/>
    <text x="30" y="-5" text-anchor="middle" font-family="'SF Mono','Courier New',monospace" font-size="8" fill="#76b900">FULL DUPLEX</text>
    <text x="30" y="26" text-anchor="middle" font-family="'SF Mono','Courier New',monospace" font-size="8" fill="#666">simultaneous I/O</text>
  </g>

  <!-- Bottom stats bar -->
  <g transform="translate(0, 530)">
    <rect x="0" y="0" width="1200" height="94" fill="#0a0e1a" stroke="#1a2a3a" stroke-width="0.5"/>

    <g transform="translate(50, 15)">
      <text x="0" y="0" font-family="'SF Mono','Courier New',monospace" font-size="9" fill="#666">PARAMS</text>
      <text x="0" y="22" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#e8eef4">11B</text>
      <text x="0" y="38" font-family="'SF Mono','Courier New',monospace" font-size="8" fill="#5a8a6a">end-to-end</text>
    </g>

    <g transform="translate(250, 15)">
      <text x="0" y="0" font-family="'SF Mono','Courier New',monospace" font-size="9" fill="#666">LATENCY</text>
      <text x="0" y="22" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#76b900">448ms</text>
      <text x="0" y="38" font-family="'SF Mono','Courier New',monospace" font-size="8" fill="#5a8a6a">turn-taking</text>
    </g>

    <g transform="translate(450, 15)">
      <text x="0" y="0" font-family="'SF Mono','Courier New',monospace" font-size="9" fill="#666">VRAM</text>
      <text x="0" y="22" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#ff9500">80GB</text>
      <text x="0" y="38" font-family="'SF Mono','Courier New',monospace" font-size="8" fill="#5a8a6a">min required</text>
    </g>

    <g transform="translate(650, 15)">
      <text x="0" y="0" font-family="'SF Mono','Courier New',monospace" font-size="9" fill="#666">VOICEBENCH</text>
      <text x="0" y="22" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#00d4aa">#2</text>
      <text x="0" y="38" font-family="'SF Mono','Courier New',monospace" font-size="8" fill="#5a8a6a">open FD models</text>
    </g>

    <g transform="translate(850, 15)">
      <text x="0" y="0" font-family="'SF Mono','Courier New',monospace" font-size="9" fill="#666">TOOL CALLING</text>
      <text x="0" y="22" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#e8eef4">1st</text>
      <text x="0" y="38" font-family="'SF Mono','Courier New',monospace" font-size="8" fill="#5a8a6a">open FD w/ tools</text>
    </g>

    <g transform="translate(1050, 15)">
      <text x="0" y="0" font-family="'SF Mono','Courier New',monospace" font-size="9" fill="#666">LICENSE</text>
      <text x="0" y="22" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#e8eef4">OpenMDW</text>
      <text x="0" y="38" font-family="'SF Mono','Courier New',monospace" font-size="8" fill="#5a8a6a">v1.1</text>
    </g>
  </g>
</svg>