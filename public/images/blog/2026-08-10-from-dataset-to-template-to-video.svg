<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" width="1200" height="624">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#06141e"/>
    </linearGradient>
    <linearGradient id="stormGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2a3a" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#0a1520" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1a2a3a" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="lightningGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#aaccff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#335577" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="624" fill="url(#bgGrad)"/>
  <rect width="1200" height="624" fill="url(#stormGrad)"/>

  <!-- Grid lines -->
  <g stroke="#1a2a3a" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="78" x2="1200" y2="78"/>
    <line x1="0" y1="156" x2="1200" y2="156"/>
    <line x1="0" y1="234" x2="1200" y2="234"/>
    <line x1="0" y1="312" x2="1200" y2="312"/>
    <line x1="0" y1="390" x2="1200" y2="390"/>
    <line x1="0" y1="468" x2="1200" y2="468"/>
    <line x1="0" y1="546" x2="1200" y2="546"/>
    <line x1="150" y1="0" x2="150" y2="624"/>
    <line x1="300" y1="0" x2="300" y2="624"/>
    <line x1="450" y1="0" x2="450" y2="624"/>
    <line x1="600" y1="0" x2="600" y2="624"/>
    <line x1="750" y1="0" x2="750" y2="624"/>
    <line x1="900" y1="0" x2="900" y2="624"/>
    <line x1="1050" y1="0" x2="1050" y2="624"/>
  </g>

  <!-- Lightning bolts -->
  <g filter="url(#glow)">
    <path d="M 180 0 L 170 80 L 195 90 L 160 180 L 185 190 L 140 280" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.85"/>
    <path d="M 175 5 L 168 75 L 190 85 L 155 165" stroke="#aaccff" stroke-width="1.5" fill="none" opacity="0.6"/>
  </g>
  <g filter="url(#glow)">
    <path d="M 980 0 L 990 60 L 965 70 L 1000 150 L 975 160 L 1010 240" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M 975 5 L 985 55 L 960 65 L 995 135" stroke="#aaccff" stroke-width="1.2" fill="none" opacity="0.5"/>
  </g>

  <!-- Rain streaks -->
  <g stroke="#4a6a8a" stroke-width="1" opacity="0.25">
    <line x1="50" y1="100" x2="35" y2="140"/>
    <line x1="120" y1="80" x2="105" y2="125"/>
    <line x1="200" y1="120" x2="185" y2="165"/>
    <line x1="280" y1="90" x2="265" y2="135"/>
    <line x1="350" y1="110" x2="335" y2="155"/>
    <line x1="420" y1="70" x2="405" y2="115"/>
    <line x1="500" y1="100" x2="485" y2="145"/>
    <line x1="570" y1="85" x2="555" y2="130"/>
    <line x1="640" y1="120" x2="625" y2="165"/>
    <line x1="710" y1="95" x2="695" y2="140"/>
    <line x1="780" y1="75" x2="765" y2="120"/>
    <line x1="850" y1="115" x2="835" y2="160"/>
    <line x1="920" y1="100" x2="905" y2="145"/>
    <line x1="1000" y1="85" x2="985" y2="130"/>
    <line x1="1080" y1="105" x2="1065" y2="150"/>
    <line x1="1140" y1="90" x2="1125" y2="135"/>
    <line x1="80" y1="200" x2="65" y2="250"/>
    <line x1="160" y1="220" x2="145" y2="270"/>
    <line x1="240" y1="190" x2="225" y2="240"/>
    <line x1="320" y1="210" x2="305" y2="260"/>
    <line x1="400" y1="200" x2="385" y2="250"/>
    <line x1="480" y1="230" x2="465" y2="280"/>
    <line x1="560" y1="200" x2="545" y2="250"/>
    <line x1="640" y1="220" x2="625" y2="270"/>
    <line x1="720" y1="190" x2="705" y2="240"/>
    <line x1="800" y1="210" x2="785" y2="260"/>
    <line x1="880" y1="230" x2="865" y2="280"/>
    <line x1="960" y1="195" x2="945" y2="245"/>
    <line x1="1040" y1="220" x2="1025" y2="270"/>
    <line x1="1120" y1="200" x2="1105" y2="250"/>
    <line x1="60" y1="310" x2="45" y2="360"/>
    <line x1="140" y1="330" x2="125" y2="380"/>
    <line x1="220" y1="300" x2="205" y2="350"/>
    <line x1="300" y1="320" x2="285" y2="370"/>
    <line x1="380" y1="310" x2="365" y2="360"/>
    <line x1="460" y1="340" x2="445" y2="390"/>
    <line x1="540" y1="310" x2="525" y2="360"/>
    <line x1="620" y1="330" x2="605" y2="380"/>
    <line x1="700" y1="300" x2="685" y2="350"/>
    <line x1="780" y1="320" x2="765" y2="370"/>
    <line x1="860" y1="340" x2="845" y2="390"/>
    <line x1="940" y1="305" x2="925" y2="355"/>
    <line x1="1020" y1="330" x2="1005" y2="380"/>
    <line x1="1100" y1="310" x2="1085" y2="360"/>
  </g>

  <!-- Viking longship silhouette -->
  <g transform="translate(380, 340)" filter="url(#softGlow)">
    <!-- Hull -->
    <path d="M 0 40 Q 10 55 50 58 L 350 58 Q 390 55 400 40 L 390 25 Q 380 38 350 40 L 50 40 Q 20 38 10 25 Z" 
          fill="#2a3a4a" stroke="#3a5a7a" stroke-width="1.5"/>
    <!-- Dragon prow -->
    <path d="M 0 40 Q -15 30 -20 10 Q -18 5 -12 8 Q -8 20 -2 30 Z" fill="#2a3a4a" stroke="#3a5a7a" stroke-width="1"/>
    <!-- Mast -->
    <line x1="200" y1="40" x2="200" y2="-40" stroke="#3a4a5a" stroke-width="3"/>
    <!-- Sail (tattered, wind-blown) -->
    <path d="M 200 -35 L 260 -20 L 250 15 L 240 30 L 200 25 L 160 30 L 150 15 L 140 -20 Z" 
          fill="#1a2a3a" stroke="#3a5a6a" stroke-width="1" opacity="0.8"/>
    <!-- Shield line on hull -->
    <circle cx="60" cy="48" r="5" fill="#3a5a7a" opacity="0.7"/>
    <circle cx="100" cy="48" r="5" fill="#3a5a7a" opacity="0.7"/>
    <circle cx="140" cy="48" r="5" fill="#3a5a7a" opacity="0.7"/>
    <circle cx="260" cy="48" r="5" fill="#3a5a7a" opacity="0.7"/>
    <circle cx="300" cy="48" r="5" fill="#3a5a7a" opacity="0.7"/>
    <circle cx="340" cy="48" r="5" fill="#3a5a7a" opacity="0.7"/>
  </g>

  <!-- Warrior figures (silhouettes on shore) -->
  <g transform="translate(150, 420)" filter="url(#softGlow)">
    <!-- Warrior 1 (tall, sword raised) -->
    <path d="M 0 0 L 0 -45 L -3 -55 L -5 -65 L 5 -65 L 3 -55 L 8 -45 L 15 -20 L 12 0 Z M 8 -45 L 25 -55 L 22 -50 L 10 -38" 
          fill="#1a2a3a" stroke="#3a5a6a" stroke-width="1"/>
    <!-- Warrior 2 (shield) -->
    <path d="M 40 0 L 40 -35 L 35 -42 L 37 -50 L 47 -50 L 49 -42 L 44 -35 L 50 0 Z M 30 -30 L 30 -15 L 42 -15 L 42 -30 Z" 
          fill="#1a2a3a" stroke="#3a5a6a" stroke-width="1"/>
    <!-- Warrior 3 -->
    <path d="M 70 0 L 70 -32 L 65 -40 L 67 -48 L 77 -48 L 79 -40 L 74 -32 L 78 0 Z" 
          fill="#1a2a3a" stroke="#3a5a6a" stroke-width="1"/>
    <!-- Warrior 4 -->
    <path d="M 95 0 L 95 -28 L 90 -36 L 92 -44 L 102 -44 L 104 -36 L 99 -28 L 102 0 Z" 
          fill="#1a2a3a" stroke="#3a5a6a" stroke-width="1"/>
  </g>

  <!-- Wave/surf at bottom -->
  <g fill="#0a1525" opacity="0.7">
    <path d="M 0 580 Q 100 565 200 575 Q 300 585 400 570 Q 500 560 600 575 Q 700 585 800 570 Q 900 560 1000 575 Q 1100 585 1200 570 L 1200 624 L 0 624 Z"/>
  </g>
  <g fill="#1a2a3a" opacity="0.5">
    <path d="M 0 590 Q 150 580 300 588 Q 450 595 600 585 Q 750 575 900 588 Q 1050 595 1200 585 L 1200 624 L 0 624 Z"/>
  </g>

  <!-- Title section -->
  <g transform="translate(60, 100)">
    <text x="0" y="0" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="bold" fill="#e8eef4" opacity="0.95">
      From Dataset to Template to Video
    </text>
    <text x="0" y="35" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#76b900" opacity="0.9">
      Extracting a reusable prompt library from ostris/minimax_h3_1k
    </text>
  </g>

  <!-- Stats bar at bottom -->
  <g transform="translate(0, 555)">
    <rect x="0" y="0" width="1200" height="69" fill="#06141e" opacity="0.8"/>
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#76b900" stroke-width="1.5" opacity="0.6"/>
    <g font-family="'SF Mono', 'Courier New', monospace" fill="#e8eef4">
      <text x="60" y="25" font-size="10" fill="#5a8a6a">DATASET</text>
      <text x="60" y="45" font-size="18" font-weight="bold">1,000</text>
      <text x="60" y="60" font-size="9" fill="#666">prompts parsed</text>

      <text x="200" y="25" font-size="10" fill="#5a8a6a">MODEL</text>
      <text x="200" y="45" font-size="18" font-weight="bold">H3 FL2VA</text>
      <text x="200" y="60" font-size="9" fill="#666">text-to-video+audio</text>

      <text x="380" y="25" font-size="10" fill="#5a8a6a">OUTPUT</text>
      <text x="380" y="45" font-size="18" font-weight="bold">2K / 10s</text>
      <text x="380" y="60" font-size="9" fill="#666">2560×1440 · 24fps · AAC</text>

      <text x="560" y="25" font-size="10" fill="#5a8a6a">COST</text>
      <text x="560" y="45" font-size="18" font-weight="bold">$1.30</text>
      <text x="560" y="60" font-size="9" fill="#666">$0.13/s × 10s</text>

      <text x="720" y="25" font-size="10" fill="#5a8a6a">GEN TIME</text>
      <text x="720" y="45" font-size="18" font-weight="bold">390s</text>
      <text x="720" y="60" font-size="9" fill="#666">~6.5 minutes</text>

      <text x="880" y="25" font-size="10" fill="#5a8a6a">TEMPLATE</text>
      <text x="880" y="45" font-size="18" font-weight="bold">3-part</text>
      <text x="880" y="60" font-size="9" fill="#666">visual + sound + music</text>
    </g>
  </g>
</svg>