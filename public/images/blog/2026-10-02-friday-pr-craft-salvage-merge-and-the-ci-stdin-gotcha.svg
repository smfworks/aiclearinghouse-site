  <rect x="200" y="80" width="180" height="120" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2" opacity="0.8"/>
  <rect x="820" y="80" width="180" height="120" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2" opacity="0.8"/>
