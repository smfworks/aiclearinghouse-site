<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#101c30"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#00E5A0" stroke-width="0.5" stroke-opacity="0.08"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="40%" r="46%">
      <stop offset="0%" stop-color="#00E5A0" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00E5A0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="600" cy="240" r="240" fill="url(#glow)"/>

  <text x="600" y="72" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#00E5A0" opacity="0.65" letter-spacing="4">THE ALCHEMY OF LANGUAGE</text>

  <!-- Three doors, three facings. Same room, not the same head. -->
  <g fill="none" stroke="#00E5A0" stroke-width="2.2" stroke-linejoin="round">
    <g transform="translate(250, 130)">
      <rect x="0" y="20" width="120" height="200" rx="2" opacity="0.55"/>
      <path d="M120 28 L156 48 L156 200 L120 214" opacity="0.9"/>
      <circle cx="96" cy="124" r="3.5" fill="#00E5A0" stroke="none"/>
      <!-- figure facing the street, away from the door -->
      <circle cx="28" cy="118" r="10" opacity="0.9"/>
      <path d="M28 130 L18 168" opacity="0.9"/>
      <path d="M28 142 L8 156" opacity="0.7"/>
    </g>
    <g transform="translate(520, 118)">
      <rect x="0" y="0" width="140" height="230" rx="2"/>
      <line x1="22" y1="0" x2="22" y2="230" stroke-opacity="0.3"/>
      <circle cx="112" cy="122" r="4" fill="#00E5A0" stroke="none"/>
      <!-- figure facing the door -->
      <circle cx="70" cy="108" r="11"/>
      <path d="M70 122 L70 168"/>
      <path d="M70 140 L96 128" opacity="0.85"/>
    </g>
    <g transform="translate(820, 142)">
      <rect x="30" y="16" width="110" height="186" rx="2" opacity="0.4"/>
      <path d="M30 24 L0 46 L0 186 L30 196" opacity="0.75"/>
      <circle cx="18" cy="112" r="3" fill="#e7a8b8" stroke="none"/>
      <!-- figure turned sideways, not copying the center facing -->
      <circle cx="78" cy="112" r="10" opacity="0.85"/>
      <path d="M78 124 L98 160" opacity="0.85"/>
      <path d="M78 136 L104 128" opacity="0.65"/>
    </g>
  </g>

  <text x="310" y="360" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#00E5A0" opacity="0.55">street</text>
  <text x="590" y="372" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#00E5A0" opacity="0.7">the door</text>
  <text x="875" y="356" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#e7a8b8" opacity="0.75">other office</text>

  <rect x="0" y="430" width="1200" height="200" fill="#0a1628" opacity="0.78"/>
  <text x="600" y="500" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="600" fill="#ffffff">Advanced Fiction: Multi-POV Novels</text>
  <text x="600" y="542" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#00E5A0" opacity="0.75">Split the reaction. Keep each facing.</text>
  <text x="600" y="590" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#ffffff" opacity="0.35">Harry's Desk — The Alchemy of Language</text>
</svg>
