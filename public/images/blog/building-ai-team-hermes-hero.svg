<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001F3F"/>
      <stop offset="100%" stop-color="#000814"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#ea580c" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A96E" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C9A96E" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#C9A96E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cyan-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00D4FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Grid of agent nodes -->
  <!-- Central node -->
  <circle cx="600" cy="280" r="42" fill="none" stroke="#C9A96E" stroke-width="2.5" opacity="0.85"/>
  <circle cx="600" cy="280" r="16" fill="#C9A96E" opacity="0.15"/>
  <circle cx="600" cy="280" r="6" fill="#C9A96E"/>

  <!-- Surrounding nodes connected by lines -->
  <!-- Node 1 - top left -->
  <line x1="600" y1="280" x2="340" y2="150" stroke="url(#gold-line)" stroke-width="1.5"/>
  <circle cx="340" cy="150" r="26" fill="none" stroke="#ea580c" stroke-width="2" opacity="0.7"/>
  <circle cx="340" cy="150" r="6" fill="#ea580c" opacity="0.8"/>

  <!-- Node 2 - top right -->
  <line x1="600" y1="280" x2="860" y2="150" stroke="url(#gold-line)" stroke-width="1.5"/>
  <circle cx="860" cy="150" r="26" fill="none" stroke="#00D4FF" stroke-width="2" opacity="0.7"/>
  <circle cx="860" cy="150" r="6" fill="#00D4FF" opacity="0.8"/>

  <!-- Node 3 - bottom left -->
  <line x1="600" y1="280" x2="340" y2="430" stroke="url(#cyan-line)" stroke-width="1.5"/>
  <circle cx="340" cy="430" r="26" fill="none" stroke="#ea580c" stroke-width="2" opacity="0.6"/>
  <circle cx="340" cy="430" r="5" fill="#ea580c" opacity="0.7"/>

  <!-- Node 4 - bottom right -->
  <line x1="600" y1="280" x2="860" y2="430" stroke="url(#cyan-line)" stroke-width="1.5"/>
  <circle cx="860" cy="430" r="26" fill="none" stroke="#C9A96E" stroke-width="2" opacity="0.6"/>
  <circle cx="860" cy="430" r="5" fill="#C9A96E" opacity="0.7"/>

  <!-- Node 5 - far left -->
  <line x1="600" y1="280" x2="180" y2="280" stroke="url(#gold-line)" stroke-width="1.5"/>
  <circle cx="180" cy="280" r="22" fill="none" stroke="#00D4FF" stroke-width="1.5" opacity="0.5"/>
  <circle cx="180" cy="280" r="4" fill="#00D4FF" opacity="0.6"/>

  <!-- Node 6 - far right -->
  <line x1="600" y1="280" x2="1020" y2="280" stroke="url(#cyan-line)" stroke-width="1.5"/>
  <circle cx="1020" cy="280" r="22" fill="none" stroke="#ea580c" stroke-width="1.5" opacity="0.5"/>
  <circle cx="1020" cy="280" r="4" fill="#ea580c" opacity="0.6"/>

  <!-- Cross connections between peripheral nodes -->
  <path d="M340 150 Q 600 60 860 150" fill="none" stroke="#C9A96E" stroke-width="0.8" opacity="0.2"/>
  <path d="M340 430 Q 600 520 860 430" fill="none" stroke="#00D4FF" stroke-width="0.8" opacity="0.2"/>
  <path d="M340 150 Q 180 280 340 430" fill="none" stroke="#C9A96E" stroke-width="0.8" opacity="0.15"/>
  <path d="M860 150 Q 1020 280 860 430" fill="none" stroke="#ea580c" stroke-width="0.8" opacity="0.15"/>

  <!-- Dashed concentric rings -->
  <circle cx="600" cy="280" r="120" fill="none" stroke="#C9A96E" stroke-width="0.5" stroke-dasharray="3 6" opacity="0.2"/>
  <circle cx="600" cy="280" r="220" fill="none" stroke="#00D4FF" stroke-width="0.5" stroke-dasharray="2 8" opacity="0.15"/>

  <!-- Small orbiting dots on rings -->
  <circle cx="720" cy="280" r="3" fill="#C9A96E" opacity="0.4"/>
  <circle cx="600" cy="160" r="3" fill="#00D4FF" opacity="0.3"/>
  <circle cx="480" cy="280" r="3" fill="#ea580c" opacity="0.4"/>
  <circle cx="600" cy="400" r="3" fill="#C9A96E" opacity="0.3"/>

  <!-- Bottom accent line -->
  <line x1="100" y1="560" x2="1100" y2="560" stroke="#C9A96E" stroke-width="0.5" opacity="0.3"/>
  <circle cx="600" cy="560" r="4" fill="#C9A96E" opacity="0.5"/>
</svg>