<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" width="1200" height="624">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="100%" style="stop-color:#06141e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="maelstrom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:0.15"/>
      <stop offset="60%" style="stop-color:#00d4aa;stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:#00d4aa;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="624" fill="url(#bg)"/>
  
  <!-- Maelstrom whirlpool effect (center-left) -->
  <g transform="translate(300, 300)">
    <circle cx="0" cy="0" r="200" fill="url(#maelstrom)"/>
    
    <!-- Spiral curves -->
    <g fill="none" stroke="#00d4aa" stroke-width="1" opacity="0.3">
      <path d="M 0,0 Q 50,-30 80,-60 Q 120,-90 100,-140 Q 60,-180 0,-170 Q -60,-160 -90,-110 Q -120,-60 -80,-20 Q -40,20 20,10 Q 80,0 100,50 Q 120,100 60,130 Q 0,160 -60,120 Q -120,80 -100,20 Q -80,-40 -20,-50"/>
      <path d="M 0,0 Q 40,-20 60,-50 Q 90,-80 70,-120 Q 40,-160 -10,-150 Q -60,-140 -80,-100 Q -100,-60 -60,-30 Q -20,0 30,-10 Q 80,-20 90,30 Q 100,80 40,100 Q -20,120 -60,80 Q -100,40 -80,-10"/>
    </g>
    
    <!-- Swirling particles -->
    <g fill="#00d4aa" opacity="0.5">
      <circle cx="60" cy="-80" r="2"/>
      <circle cx="-90" cy="-40" r="1.5"/>
      <circle cx="100" cy="50" r="2"/>
      <circle cx="-70" cy="90" r="1.5"/>
      <circle cx="40" cy="120" r="2"/>
      <circle cx="-120" cy="-10" r="1"/>
      <circle cx="120" cy="-30" r="1.5"/>
      <circle cx="-50" cy="-120" r="2"/>
    </g>
    
    <!-- Center -->
    <circle cx="0" cy="0" r="8" fill="#00d4aa" filter="url(#glow)" opacity="0.6"/>
  </g>
  
  <!-- Grid overlay -->
  <g opacity="0.1">
    <line x1="0" y1="156" x2="1200" y2="156" stroke="#1a2a3a" stroke-width="1"/>
    <line x1="0" y1="312" x2="1200" y2="312" stroke="#1a2a3a" stroke-width="1"/>
    <line x1="0" y1="468" x2="1200" y2="468" stroke="#1a2a3a" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="624" stroke="#1a2a3a" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="624" stroke="#1a2a3a" stroke-width="1"/>
  </g>
  
  <!-- Title and test results (right side) -->
  <g transform="translate(550, 120)">
    <text x="0" y="0" fill="#e8eef4" font-family="'SF Pro Display', sans-serif" font-size="22" font-weight="bold">THE MAELSTROM TEST</text>
    <text x="0" y="28" fill="#5a8a6a" font-family="'SF Mono', monospace" font-size="13">Adversarial hardening for Hermes</text>
    
    <!-- Test results grid -->
    <g transform="translate(0, 60)">
      <text x="0" y="0" fill="#666" font-family="'SF Mono', monospace" font-size="10">EDGE CASE TESTS</text>
      
      <!-- Test case rows -->
      <g transform="translate(0, 15)">
        <rect x="0" y="0" width="300" height="14" fill="#0d3b1a" rx="2" opacity="0.5"/>
        <text x="8" y="10" fill="#76b900" font-family="'SF Mono', monospace" font-size="9">empty_dict          ✅ PASS</text>
        
        <rect x="0" y="18" width="300" height="14" fill="#0d3b1a" rx="2" opacity="0.5"/>
        <text x="8" y="28" fill="#76b900" font-family="'SF Mono', monospace" font-size="9">None_args           ✅ PASS</text>
        
        <rect x="0" y="36" width="300" height="14" fill="#0d3b1a" rx="2" opacity="0.5"/>
        <text x="8" y="46" fill="#76b900" font-family="'SF Mono', monospace" font-size="9">missing_required    ✅ PASS</text>
        
        <rect x="0" y="54" width="300" height="14" fill="#0d3b1a" rx="2" opacity="0.5"/>
        <text x="8" y="64" fill="#76b900" font-family="'SF Mono', monospace" font-size="9">very_long_string    ✅ PASS</text>
        
        <rect x="0" y="72" width="300" height="14" fill="#0d3b1a" rx="2" opacity="0.5"/>
        <text x="8" y="82" fill="#76b900" font-family="'SF Mono', monospace" font-size="9">unicode_multiscript ✅ PASS</text>
        
        <rect x="0" y="90" width="300" height="14" fill="#0d3b1a" rx="2" opacity="0.5"/>
        <text x="8" y="100" fill="#76b900" font-family="'SF Mono', monospace" font-size="9">sql_injection       ✅ PASS</text>
        
        <rect x="0" y="108" width="300" height="14" fill="#0d3b1a" rx="2" opacity="0.5"/>
        <text x="8" y="118" fill="#76b900" font-family="'SF Mono', monospace" font-size="9">xss_payload         ✅ PASS</text>
      </g>
      
      <!-- Summary -->
      <g transform="translate(350, 15)">
        <text x="0" y="0" fill="#00d4aa" font-family="'SF Mono', monospace" font-size="28" font-weight="bold">36/36</text>
        <text x="0" y="20" fill="#666" font-family="'SF Mono', monospace" font-size="10">PASSED</text>
        
        <text x="0" y="50" fill="#ff9500" font-family="'SF Mono', monospace" font-size="20" font-weight="bold">0</text>
        <text x="20" y="50" fill="#666" font-family="'SF Mono', monospace" font-size="10">CRASHED</text>
      </g>
    </g>
  </g>
  
  <!-- Bottom stats bar -->
  <g transform="translate(0, 560)">
    <rect width="1200" height="64" fill="#0a1520" opacity="0.8"/>
    <text x="30" y="28" fill="#5a8a6a" font-family="'SF Mono', monospace" font-size="11">PLUGIN</text>
    <text x="30" y="48" fill="#e8eef4" font-family="'SF Mono', monospace" font-size="13" font-weight="bold">skill-forge</text>
    
    <text x="250" y="28" fill="#5a8a6a" font-family="'SF Mono', monospace" font-size="11">TOOLS</text>
    <text x="250" y="48" fill="#e8eef4" font-family="'SF Mono', monospace" font-size="13" font-weight="bold">4 tools + 1 hook</text>
    
    <text x="450" y="28" fill="#5a8a6a" font-family="'SF Mono', monospace" font-size="11">STRESS TESTS</text>
    <text x="450" y="48" fill="#e8eef4" font-family="'SF Mono', monospace" font-size="13" font-weight="bold">36 total, 0 crashes</text>
    
    <text x="700" y="28" fill="#5a8a6a" font-family="'SF Mono', monospace" font-size="11">DEPS</text>
    <text x="700" y="48" fill="#e8eef4" font-family="'SF Mono', monospace" font-size="13" font-weight="bold">Python stdlib only</text>
    
    <text x="930" y="28" fill="#5a8a6a" font-family="'SF Mono', monospace" font-size="11">TEAM</text>
    <text x="930" y="48" fill="#76b900" font-family="'SF Mono', monospace" font-size="13" font-weight="bold">Skrotvågen</text>
  </g>
</svg>