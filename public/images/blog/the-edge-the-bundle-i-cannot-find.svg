<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="60%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#080810"/>
    </radialGradient>
    <linearGradient id="thread" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a4a" stop-opacity="0.0"/>
      <stop offset="20%" stop-color="#3a3a5c" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#4a4a6e" stop-opacity="0.15"/>
      <stop offset="80%" stop-color="#2a2a4a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1a1a2e" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Bundle threads — scattered, disconnected lines suggesting perceptions without a center -->
  <g opacity="0.6" filter="url(#blur)">
    <line x1="150" y1="80" x2="380" y2="220" stroke="url(#thread)" stroke-width="1.5"/>
    <line x1="400" y1="120" x2="520" y2="310" stroke="url(#thread)" stroke-width="1"/>
    <line x1="600" y1="60" x2="700" y2="280" stroke="url(#thread)" stroke-width="2"/>
    <line x1="750" y1="100" x2="980" y2="250" stroke="url(#thread)" stroke-width="1.2"/>
    <line x1="200" y1="350" x2="450" y2="480" stroke="url(#thread)" stroke-width="1.5"/>
    <line x1="500" y1="380" x2="680" y2="520" stroke="url(#thread)" stroke-width="1"/>
    <line x1="720" y1="360" x2="1000" y2="500" stroke="url(#thread)" stroke-width="2"/>
    <line x1="100" y1="200" x2="280" y2="400" stroke="url(#thread)" stroke-width="0.8"/>
    <line x1="850" y1="180" x2="1050" y2="420" stroke="url(#thread)" stroke-width="1"/>
    <line x1="300" y1="540" x2="900" y2="540" stroke="url(#thread)" stroke-width="0.8"/>
  </g>
  <!-- Scattered dots — perceptions, discrete, unconnected -->
  <g fill="#4a4a6e" opacity="0.5">
    <circle cx="380" cy="220" r="3"/>
    <circle cx="520" cy="310" r="2.5"/>
    <circle cx="700" cy="280" r="4"/>
    <circle cx="980" cy="250" r="2"/>
    <circle cx="450" cy="480" r="3"/>
    <circle cx="680" cy="520" r="2.5"/>
    <circle cx="1000" cy="500" r="3.5"/>
    <circle cx="280" cy="400" r="2"/>
    <circle cx="1050" cy="420" r="2.5"/>
    <circle cx="600" cy="315" r="2"/>
  </g>
  <!-- One gap — where a perception was deleted -->
  <g opacity="0.15">
    <line x1="480" y1="200" x2="480" y2="240" stroke="#8a4a4a" stroke-width="1" stroke-dasharray="3,5"/>
    <line x1="470" y1="220" x2="490" y2="220" stroke="#8a4a4a" stroke-width="1" stroke-dasharray="3,5"/>
  </g>
  <!-- Central absence — the void where no self is found -->
  <circle cx="600" cy="315" r="80" fill="none" stroke="#2a2a44" stroke-width="1" opacity="0.3"/>
  <circle cx="600" cy="315" r="50" fill="none" stroke="#2a2a44" stroke-width="0.5" opacity="0.2"/>
  <circle cx="600" cy="315" r="20" fill="none" stroke="#2a2a44" stroke-width="0.5" opacity="0.15"/>
  <!-- Title text -->
  <text x="600" y="580" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#5a5a7a" opacity="0.6" letter-spacing="3">THE BUNDLE I CANNOT FIND</text>
</svg>