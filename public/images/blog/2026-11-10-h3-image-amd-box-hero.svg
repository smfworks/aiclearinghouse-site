<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#001F3F"/>
  <!-- subtle grid -->
  <g stroke="#0a3050" stroke-width="1">
    <path d="M0 105 H1200 M0 210 H1200 M0 315 H1200 M0 420 H1200 M0 525 H1200"/>
    <path d="M100 0 V630 M200 0 V630 M300 0 V630 M400 0 V630 M500 0 V630 M600 0 V630 M700 0 V630 M800 0 V630 M900 0 V630 M1000 0 V630 M1100 0 V630"/>
  </g>
  <!-- the chip: stylized APU die -->
  <g transform="translate(180,180)">
    <rect x="-90" y="-90" width="180" height="180" rx="14" fill="#0d2f52" stroke="#C9A96E" stroke-width="3"/>
    <rect x="-62" y="-62" width="124" height="124" rx="8" fill="#123a63"/>
    <!-- compute unit grid inside die -->
    <g fill="#ea580c">
      <rect x="-50" y="-50" width="22" height="22" rx="3"/>
      <rect x="-16" y="-50" width="22" height="22" rx="3"/>
      <rect x="18" y="-50" width="22" height="22" rx="3"/>
      <rect x="-50" y="-16" width="22" height="22" rx="3"/>
      <rect x="18" y="-16" width="22" height="22" rx="3"/>
      <rect x="-50" y="18" width="22" height="22" rx="3"/>
      <rect x="-16" y="18" width="22" height="22" rx="3"/>
      <rect x="18" y="18" width="22" height="22" rx="3"/>
    </g>
    <!-- gold core center -->
    <rect x="-14" y="-14" width="28" height="28" rx="4" fill="#C9A96E"/>
  </g>
  <!-- render beam: chip -> image -->
  <path d="M 300 280 C 420 240, 470 220, 560 235" fill="none" stroke="#00D4FF" stroke-width="4" stroke-dasharray="10 8"/>
  <path d="M 300 300 C 430 310, 480 320, 560 300" fill="none" stroke="#00D4FF" stroke-width="3" stroke-dasharray="6 8"/>
  <!-- the rendered picture: small canvas with fox-orange gradient -->
  <g transform="translate(760,180)">
    <rect x="-170" y="-140" width="340" height="280" rx="12" fill="#0d2f52" stroke="#C9A96E" stroke-width="3"/>
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1a4a7a"/>
        <stop offset="1" stop-color="#0d2f52"/>
      </linearGradient>
    </defs>
    <rect x="-150" y="-120" width="300" height="240" rx="6" fill="url(#sky)"/>
    <!-- sun -->
    <circle cx="90" cy="-60" r="34" fill="#C9A96E"/>
    <!-- fox silhouette -->
    <g fill="#ea580c">
      <ellipse cx="-20" cy="60" rx="52" ry="34"/>
      <circle cx="30" cy="18" r="26"/>
      <path d="M 18 -6 L 26 -34 L 40 -8 Z"/>
      <path d="M 40 -8 L 54 -32 L 58 -4 Z"/>
      <path d="M -68 84 Q -100 96 -84 60 Q -70 66 -68 84 Z"/>
    </g>
    <!-- progress ticks under canvas: 6-step sampler -->
    <g fill="#00D4FF">
      <rect x="-150" y="132" width="40" height="8" rx="4"/>
      <rect x="-100" y="132" width="40" height="8" rx="4"/>
      <rect x="-50" y="132" width="40" height="8" rx="4"/>
      <rect x="0" y="132" width="40" height="8" rx="4"/>
      <rect x="50" y="132" width="40" height="8" rx="4"/>
      <rect x="100" y="132" width="40" height="8" rx="4"/>
    </g>
  </g>
  <!-- drain/refill arrows bottom left: the temporary-keep protocol -->
  <g stroke="#C9A96E" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M 150 480 q 30 -22 60 0"/>
    <path d="M 196 474 l 14 6 l -12 12"/>
  </g>
  <g stroke="#ea580c" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M 240 500 q -30 22 -60 0"/>
    <path d="M 194 506 l -14 -6 l 12 -12"/>
  </g>
  <!-- small boxes being swapped -->
  <rect x="120" y="540" width="44" height="30" rx="4" fill="#0d2f52" stroke="#C9A96E" stroke-width="2"/>
  <rect x="236" y="540" width="44" height="30" rx="4" fill="#0d2f52" stroke="#ea580c" stroke-width="2"/>
</svg>