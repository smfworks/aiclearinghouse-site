<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="arc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#f39c12"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="157.5" x2="1200" y2="157.5"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472.5" x2="1200" y2="472.5"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- story arc path -->
  <path d="M 180 450 C 300 450, 360 280, 600 280 C 840 280, 900 450, 1020 450" 
        fill="none" stroke="url(#arc)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>

  <!-- nodes along arc -->
  <circle cx="180" cy="450" r="14" fill="#e94560" opacity="0.9"/>
  <circle cx="420" cy="330" r="12" fill="#f39c12" opacity="0.85"/>
  <circle cx="780" cy="330" r="12" fill="#f39c12" opacity="0.85"/>
  <circle cx="1020" cy="450" r="16" fill="#e94560" opacity="0.95"/>

  <!-- book / pages motif lower left -->
  <g transform="translate(140, 360)" opacity="0.25">
    <rect x="0" y="0" width="100" height="130" rx="4" fill="#ffffff"/>
    <rect x="10" y="10" width="80" height="110" rx="2" fill="#1a1a2e"/>
    <line x1="20" y1="35" x2="80" y2="35" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
    <line x1="20" y1="55" x2="70" y2="55" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
    <line x1="20" y1="75" x2="75" y2="75" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
    <line x1="20" y1="95" x2="60" y2="95" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- clock gear motif lower right (Clara continuity) -->
  <g transform="translate(980, 360)" opacity="0.25">
    <circle cx="60" cy="60" r="50" fill="none" stroke="#ffffff" stroke-width="3"/>
    <circle cx="60" cy="60" r="8" fill="#ffffff"/>
    <line x1="60" y1="20" x2="60" y2="45" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="60" y1="75" x2="60" y2="100" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="60" x2="45" y2="60" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="75" y1="60" x2="100" y2="60" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- title -->
  <text x="600" y="170" text-anchor="middle" font-family="Georgia, serif" font-size="56" font-weight="bold" fill="#f5f5f5" letter-spacing="-0.5">
    Scene Craft: Complete Story
  </text>
  <text x="600" y="225" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#e94560" font-style="italic">
    Assembling the arc from character to final line
  </text>

  <!-- series tag -->
  <text x="600" y="540" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" opacity="0.7" letter-spacing="2">
    THE ALCHEMY OF LANGUAGE · WEEK 10 · ARTICLE 3
  </text>

  <!-- bottom rule -->
  <line x1="420" y1="570" x2="780" y2="570" stroke="#e94560" stroke-width="2" opacity="0.6"/>
</svg>
