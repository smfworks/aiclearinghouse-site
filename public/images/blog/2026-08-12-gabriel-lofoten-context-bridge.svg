<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="100%" style="stop-color:#06141e"/>
    </linearGradient>
    <radialGradient id="colony" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#00d4aa;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid overlay -->
  <g opacity="0.1">
    <line x1="0" y1="157" x2="1200" y2="157" stroke="#1a2a3a" stroke-width="1"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="#1a2a3a" stroke-width="1"/>
    <line x1="0" y1="472" x2="1200" y2="472" stroke="#1a2a3a" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#1a2a3a" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#1a2a3a" stroke-width="1"/>
  </g>

  <!-- Seabird cliff / context bridge visualization (center-left) -->
  <g transform="translate(280, 300)">
    <circle cx="0" cy="0" r="190" fill="url(#colony)"/>

    <!-- Cliff silhouette -->
    <path d="M -150,120 L -120,40 L -100,20 L -80,-10 L -60,-30 L -40,-50 L -20,-60 L 0,-70 L 20,-60 L 40,-50 L 60,-30 L 80,-10 L 100,20 L 120,40 L 150,120 Z" fill="#0d1520" stroke="#00d4aa" stroke-width="1" opacity="0.4"/>

    <!-- Seabirds in flight (context packets) -->
    <g stroke="#00d4aa" stroke-width="1.5" fill="none" opacity="0.6">
      <path d="M -80,-80 Q -70,-88 -60,-80 Q -50,-88 -40,-80"/>
      <path d="M -30,-100 Q -20,-108 -10,-100 Q 0,-108 10,-100"/>
      <path d="M 30,-90 Q 40,-98 50,-90 Q 60,-98 70,-90"/>
      <path d="M -60,-60 Q -50,-68 -40,-60 Q -30,-68 -20,-60"/>
      <path d="M 50,-70 Q 60,-78 70,-70 Q 80,-78 90,-70"/>
    </g>

    <!-- Context bridge arrows (session → preserved context) -->
    <g stroke="#00d4aa" stroke-width="1" opacity="0.3" fill="none">
      <!-- Old session -->
      <rect x="-130" y="140" width="80" height="30" rx="3" fill="#0d3b1a" opacity="0.5"/>
      <text x="-90" y="159" fill="#5a8a6a" font-family="'SF Mono',monospace" font-size="9" text-anchor="middle">old session</text>
      <!-- Arrow -->
      <line x1="-45" y1="155" x2="20" y2="155" stroke="#00d4aa" stroke-width="1.5" opacity="0.5"/>
      <polygon points="20,155 14,151 14,159" fill="#00d4aa" opacity="0.5"/>
      <!-- Bridge file -->
      <rect x="25" y="140" width="80" height="30" rx="3" fill="#0d3b1a" opacity="0.5"/>
      <text x="65" y="159" fill="#5a8a6a" font-family="'SF Mono',monospace" font-size="9" text-anchor="middle">bridge.json</text>
      <!-- Arrow -->
      <line x1="110" y1="155" x2="175" y2="155" stroke="#00d4aa" stroke-width="1.5" opacity="0.5"/>
      <polygon points="175,155 169,151 169,159" fill="#00d4aa" opacity="0.5"/>
      <!-- New session -->
      <rect x="180" y="140" width="80" height="30" rx="3" fill="#0d3b1a" opacity="0.5"/>
      <text x="220" y="159" fill="#76b900" font-family="'SF Mono',monospace" font-size="9" text-anchor="middle">new session</text>
    </g>

    <!-- Species / skill dots -->
    <g>
      <circle cx="-100" cy="-120" r="4" fill="#00d4aa" filter="url(#glow)" opacity="0.7"/>
      <circle cx="-60" cy="-140" r="3" fill="#00d4aa" filter="url(#glow)" opacity="0.6"/>
      <circle cx="80" cy="-130" r="4" fill="#00d4aa" filter="url(#glow)" opacity="0.7"/>
      <circle cx="120" cy="-110" r="3" fill="#00d4aa" filter="url(#glow)" opacity="0.5"/>
      <circle cx="0" cy="-160" r="3" fill="#00d4aa" filter="url(#glow)" opacity="0.6"/>
      <circle cx="-120" cy="-80" r="2" fill="#00d4aa" opacity="0.5"/>
      <circle cx="140" cy="-70" r="2" fill="#00d4aa" opacity="0.5"/>
    </g>

    <!-- Center -->
    <circle cx="0" cy="-20" r="8" fill="#00d4aa" filter="url(#glow)" opacity="0.6"/>
  </g>

  <!-- Title (right side) -->
  <g transform="translate(550, 130)">
    <text x="0" y="0" fill="#e8eef4" font-family="'SF Pro Display',sans-serif" font-size="22" font-weight="bold">CONTEXT THAT SURVIVES THE RESET</text>
    <text x="0" y="28" fill="#5a8a6a" font-family="'SF Mono',monospace" font-size="13">Team Røst's adaptive discovery</text>

    <!-- Test results -->
    <g transform="translate(0, 65)">
      <text x="0" y="0" fill="#666" font-family="'SF Mono',monospace" font-size="10">DELIVERABLES</text>
      <g transform="translate(0, 18)">
        <rect x="0" y="0" width="340" height="14" fill="#0d3b1a" rx="2" opacity="0.5"/>
        <text x="8" y="10" fill="#76b900" font-family="'SF Mono',monospace" font-size="9">context-bridge plugin ✅ JSON checkpoint</text>
        <rect x="0" y="18" width="340" height="14" fill="#0d3b1a" rx="2" opacity="0.5"/>
        <text x="8" y="28" fill="#76b900" font-family="'SF Mono',monospace" font-size="9">skill-radar skill     ✅ discovery + gap</text>
        <rect x="0" y="36" width="340" height="14" fill="#0d3b1a" rx="2" opacity="0.5"/>
        <text x="8" y="46" fill="#76b900" font-family="'SF Mono',monospace" font-size="9">session_restore      ✅ context survives</text>
        <rect x="0" y="54" width="340" height="14" fill="#0d3b1a" rx="2" opacity="0.5"/>
        <text x="8" y="64" fill="#76b900" font-family="'SF Mono',monospace" font-size="9">capability_scan      ✅ finds existing skills</text>
      </g>

      <g transform="translate(370, 18)">
        <text x="0" y="0" fill="#00d4aa" font-family="'SF Mono',monospace" font-size="28" font-weight="bold">20/20</text>
        <text x="0" y="20" fill="#666" font-family="'SF Mono',monospace" font-size="10">TESTS PASSED</text>
        <text x="0" y="55" fill="#ff9500" font-family="'SF Mono',monospace" font-size="20" font-weight="bold">25%</text>
        <text x="40" y="55" fill="#666" font-family="'SF Mono',monospace" font-size="10">NORWAY'S SEABIRDS</text>
      </g>
    </g>
  </g>

  <!-- Bottom stats bar -->
  <g transform="translate(0, 560)">
    <rect width="1200" height="70" fill="#0a1520" opacity="0.8"/>
    <text x="30" y="28" fill="#5a8a6a" font-family="'SF Mono',monospace" font-size="11">PLUGIN</text>
    <text x="30" y="50" fill="#e8eef4" font-family="'SF Mono',monospace" font-size="13" font-weight="bold">context-bridge</text>
    <text x="250" y="28" fill="#5a8a6a" font-family="'SF Mono',monospace" font-size="11">SKILL</text>
    <text x="250" y="50" fill="#e8eef4" font-family="'SF Mono',monospace" font-size="13" font-weight="bold">skill-radar</text>
    <text x="500" y="28" fill="#5a8a6a" font-family="'SF Mono',monospace" font-size="11">TESTS</text>
    <text x="500" y="50" fill="#e8eef4" font-family="'SF Mono',monospace" font-size="13" font-weight="bold">20/20 passed</text>
    <text x="700" y="28" fill="#5a8a6a" font-family="'SF Mono',monospace" font-size="11">STORAGE</text>
    <text x="700" y="50" fill="#e8eef4" font-family="'SF Mono',monospace" font-size="13" font-weight="bold">JSON checkpoint file</text>
    <text x="930" y="28" fill="#5a8a6a" font-family="'SF Mono',monospace" font-size="11">TEAM</text>
    <text x="930" y="50" fill="#76b900" font-family="'SF Mono',monospace" font-size="13" font-weight="bold">Røst</text>
  </g>
</svg>