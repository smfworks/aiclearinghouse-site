<?xml version="1.0" encoding="UTF-8"?>
<!-- Hero: a short gold bar and a longer teal bar do not share an end. A dashed arc stops above both. No visible text. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A short gold bar and a longer teal bar that do not meet, with a dashed arc that stops above them.">
  <defs>
    <linearGradient id="reloadBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070d14"/>
      <stop offset="48%" stop-color="#0c1826"/>
      <stop offset="100%" stop-color="#101c2c"/>
    </linearGradient>
    <radialGradient id="reloadGold" cx="28%" cy="32%" r="28%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff6b00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="reloadTeal" cx="78%" cy="70%" r="36%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#reloadBg)"/>
  <rect width="1200" height="630" fill="url(#reloadGold)"/>
  <rect width="1200" height="630" fill="url(#reloadTeal)"/>
  <rect x="64" y="48" width="1072" height="534" rx="12" fill="none" stroke="#162236" stroke-width="2"/>

  <path d="M210 150 C340 86 470 78 560 118" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6 10" opacity="0.7"/>
  <circle cx="560" cy="118" r="7" fill="none" stroke="#ff6b00" stroke-width="3"/>

  <rect x="168" y="248" width="286" height="28" rx="4" fill="#ff6b00"/>
  <rect x="168" y="392" width="760" height="22" rx="4" fill="#0e7490" opacity="0.85"/>
  <rect x="168" y="392" width="214" height="22" rx="4" fill="#00d4ff" opacity="0.35"/>

  <path d="M470 262 H620" fill="none" stroke="#8ecae6" stroke-width="2" stroke-dasharray="4 9" opacity="0.35"/>
</svg>
