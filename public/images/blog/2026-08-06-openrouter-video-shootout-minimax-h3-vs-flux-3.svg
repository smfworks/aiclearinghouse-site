<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" width="1200" height="624">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#06141e"/>
    </linearGradient>
    <linearGradient id="minimaxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#008866"/>
    </linearGradient>
    <linearGradient id="fluxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#CC4400"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <rect width="1200" height="624" fill="url(#bgGrad)"/>
  
  <!-- Grid -->
  <g opacity="0.1">
    <line x1="0" y1="156" x2="1200" y2="156" stroke="#1a2a3a"/>
    <line x1="0" y1="312" x2="1200" y2="312" stroke="#1a2a3a"/>
    <line x1="0" y1="468" x2="1200" y2="468" stroke="#1a2a3a"/>
    <line x1="400" y1="0" x2="400" y2="624" stroke="#1a2a3a"/>
    <line x1="800" y1="0" x2="800" y2="624" stroke="#1a2a3a"/>
  </g>
  
  <!-- VS divider -->
  <line x1="600" y1="60" x2="600" y2="460" stroke="#333" stroke-width="2" stroke-dasharray="8,4"/>
  <circle cx="600" cy="220" r="35" fill="#0a0e1a" stroke="#555" stroke-width="2"/>
  <text x="600" y="228" text-anchor="middle" fill="#888" font-family="'SF Pro Display', sans-serif" font-size="22" font-weight="bold">VS</text>
  
  <!-- Left: MiniMax H3 -->
  <g transform="translate(80, 60)">
    <text x="0" y="25" fill="#00D4AA" font-family="'SF Pro Display', sans-serif" font-size="28" font-weight="700">MiniMax H3</text>
    <text x="0" y="50" fill="#888" font-family="'SF Mono', monospace" font-size="13">minimax/hailuo-3</text>
    
    <!-- Stats -->
    <g transform="translate(0, 80)">
      <text x="0" y="0" fill="#666" font-family="'SF Mono', monospace" font-size="11">RESOLUTION</text>
      <text x="0" y="22" fill="#e8eef4" font-family="'SF Mono', monospace" font-size="20" font-weight="bold">2560×1440</text>
      <text x="0" y="40" fill="#00D4AA" font-family="'SF Mono', monospace" font-size="12">2K</text>
    </g>
    <g transform="translate(0, 140)">
      <text x="0" y="0" fill="#666" font-family="'SF Mono', monospace" font-size="11">PRICE/SEC</text>
      <text x="0" y="22" fill="#e8eef4" font-family="'SF Mono', monospace" font-size="20" font-weight="bold">$0.13</text>
    </g>
    <g transform="translate(0, 200)">
      <text x="0" y="0" fill="#666" font-family="'SF Mono', monospace" font-size="11">AVG GEN TIME</text>
      <text x="0" y="22" fill="#e8eef4" font-family="'SF Mono', monospace" font-size="20" font-weight="bold">217.7s</text>
    </g>
    <g transform="translate(0, 260)">
      <text x="0" y="0" fill="#666" font-family="'SF Mono', monospace" font-size="11">MODERATION</text>
      <text x="0" y="22" fill="#00D4AA" font-family="'SF Mono', monospace" font-size="20" font-weight="bold">None</text>
      <text x="0" y="40" fill="#888" font-family="'SF Mono', monospace" font-size="12">No content blocks</text>
    </g>
    <g transform="translate(0, 320)">
      <text x="0" y="0" fill="#666" font-family="'SF Mono', monospace" font-size="11">6/6 SUCCESS</text>
      <rect x="0" y="10" width="240" height="12" rx="6" fill="#1a2a3a"/>
      <rect x="0" y="10" width="240" height="12" rx="6" fill="url(#minimaxGrad)" opacity="0.8"/>
      <text x="0" y="40" fill="#00D4AA" font-family="'SF Mono', monospace" font-size="14" font-weight="bold">100%</text>
    </g>
  </g>
  
  <!-- Right: FLUX 3 -->
  <g transform="translate(680, 60)">
    <text x="0" y="25" fill="#FF6B35" font-family="'SF Pro Display', sans-serif" font-size="28" font-weight="700">FLUX 3 Video</text>
    <text x="0" y="50" fill="#888" font-family="'SF Mono', monospace" font-size="13">black-forest-labs/flux-3-video</text>
    
    <g transform="translate(0, 80)">
      <text x="0" y="0" fill="#666" font-family="'SF Mono', monospace" font-size="11">RESOLUTION</text>
      <text x="0" y="22" fill="#e8eef4" font-family="'SF Mono', monospace" font-size="20" font-weight="bold">1280×704</text>
      <text x="0" y="40" fill="#FF6B35" font-family="'SF Mono', monospace" font-size="12">720p</text>
    </g>
    <g transform="translate(0, 140)">
      <text x="0" y="0" fill="#666" font-family="'SF Mono', monospace" font-size="11">PRICE/SEC</text>
      <text x="0" y="22" fill="#e8eef4" font-family="'SF Mono', monospace" font-size="20" font-weight="bold">$0.17</text>
    </g>
    <g transform="translate(0, 200)">
      <text x="0" y="0" fill="#666" font-family="'SF Mono', monospace" font-size="11">AVG GEN TIME</text>
      <text x="0" y="22" fill="#e8eef4" font-family="'SF Mono', monospace" font-size="20" font-weight="bold">96.4s</text>
      <text x="0" y="40" fill="#FF6B35" font-family="'SF Mono', monospace" font-size="12">2.3× faster</text>
    </g>
    <g transform="translate(0, 260)">
      <text x="0" y="0" fill="#666" font-family="'SF Mono', monospace" font-size="11">MODERATION</text>
      <text x="0" y="22" fill="#FF6B35" font-family="'SF Mono', monospace" font-size="20" font-weight="bold">Strict</text>
      <text x="0" y="40" fill="#888" font-family="'SF Mono', monospace" font-size="12">Blocks violence</text>
    </g>
    <g transform="translate(0, 320)">
      <text x="0" y="0" fill="#666" font-family="'SF Mono', monospace" font-size="11">6/6 SUCCESS</text>
      <rect x="0" y="10" width="240" height="12" rx="6" fill="#1a2a3a"/>
      <rect x="0" y="10" width="240" height="12" rx="6" fill="url(#fluxGrad)" opacity="0.8"/>
      <text x="0" y="40" fill="#FF6B35" font-family="'SF Mono', monospace" font-size="14" font-weight="bold">100%</text>
    </g>
  </g>
  
  <!-- Title -->
  <text x="600" y="470" text-anchor="middle" fill="#e8eef4" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700">MiniMax H3 vs FLUX 3 Video: Same Prompts, Side by Side</text>
  <text x="600" y="495" text-anchor="middle" fill="#888" font-family="'SF Mono', 'Courier New', monospace" font-size="13">6 Prompts · 12 Videos · OpenRouter API · 5s Duration · 16:9</text>
  
  <!-- Stats bar -->
  <g transform="translate(0, 520)">
    <rect x="0" y="0" width="1200" height="104" fill="#0a0e1a" opacity="0.8"/>
    <g transform="translate(80, 15)">
      <text x="0" y="16" fill="#666" font-family="'SF Mono', monospace" font-size="10">PROMPTS</text>
      <text x="0" y="36" fill="#e8eef4" font-family="'SF Mono', monospace" font-size="16" font-weight="bold">6</text>
      <text x="0" y="52" fill="#888" font-family="'SF Mono', monospace" font-size="10">Categories</text>
    </g>
    <g transform="translate(250, 15)">
      <text x="0" y="16" fill="#666" font-family="'SF Mono', monospace" font-size="10">VIDEOS GENERATED</text>
      <text x="0" y="36" fill="#e8eef4" font-family="'SF Mono', monospace" font-size="16" font-weight="bold">12/12</text>
      <text x="0" y="52" fill="#888" font-family="'SF Mono', monospace" font-size="10">Zero failures</text>
    </g>
    <g transform="translate(450, 15)">
      <text x="0" y="16" fill="#666" font-family="'SF Mono', monospace" font-size="10">TOTAL COST</text>
      <text x="0" y="36" fill="#e8eef4" font-family="'SF Mono', monospace" font-size="16" font-weight="bold">$9.27</text>
      <text x="0" y="52" fill="#888" font-family="'SF Mono', monospace" font-size="10">OpenRouter credits</text>
    </g>
    <g transform="translate(650, 15)">
      <text x="0" y="16" fill="#666" font-family="'SF Mono', monospace" font-size="10">SPEED WINNER</text>
      <text x="0" y="36" fill="#FF6B35" font-family="'SF Mono', monospace" font-size="16" font-weight="bold">FLUX 3</text>
      <text x="0" y="52" fill="#888" font-family="'SF Mono', monospace" font-size="10">2.3× faster avg</text>
    </g>
    <g transform="translate(850, 15)">
      <text x="0" y="16" fill="#666" font-family="'SF Mono', monospace" font-size="10">RESOLUTION WINNER</text>
      <text x="0" y="36" fill="#00D4AA" font-family="'SF Mono', monospace" font-size="16" font-weight="bold">MiniMax H3</text>
      <text x="0" y="52" fill="#888" font-family="'SF Mono', monospace" font-size="10">2K vs 720p</text>
    </g>
    <g transform="translate(1050, 15)">
      <text x="0" y="16" fill="#666" font-family="'SF Mono', monospace" font-size="10">TEXT RENDER</text>
      <text x="0" y="36" fill="#00D4AA" font-family="'SF Mono', monospace" font-size="16" font-weight="bold">10/10</text>
      <text x="0" y="52" fill="#888" font-family="'SF Mono', monospace" font-size="10">Both models</text>
    </g>
  </g>
</svg>