<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="624" viewBox="0 0 1200 624">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#06141e"/>
    </linearGradient>
    <linearGradient id="off" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9500"/>
      <stop offset="100%" stop-color="#cc7700"/>
    </linearGradient>
    <linearGradient id="on" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#00a88a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="624" fill="url(#bg)"/>

  <g stroke="#1a2a3a" stroke-opacity="0.3" stroke-width="1">
    <line x1="0" y1="156" x2="1200" y2="156"/>
    <line x1="0" y1="312" x2="1200" y2="312"/>
    <line x1="0" y1="468" x2="1200" y2="468"/>
    <line x1="300" y1="0" x2="300" y2="624"/>
    <line x1="600" y1="0" x2="600" y2="624"/>
    <line x1="900" y1="0" x2="900" y2="624"/>
  </g>

  <text x="60" y="80" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="42" font-weight="700" fill="#e8eef4">Math: Thinking Off vs On</text>
  <text x="60" y="122" font-family="'SF Mono','Courier New',monospace" font-size="20" fill="#5a8a6a">Qwen3.8-27B-FP8 · same 30 problems · one variable changed</text>

  <!-- grouped bar chart: 5 tiers, each with off (orange) + on (teal) -->
  <g transform="translate(80, 180)">
    <!-- y-axis labels -->
    <text x="-10" y="20" font-family="'SF Mono','Courier New',monospace" font-size="13" fill="#666" text-anchor="end">100%</text>
    <text x="-10" y="120" font-family="'SF Mono','Courier New',monospace" font-size="13" fill="#666" text-anchor="end">50%</text>
    <text x="-10" y="220" font-family="'SF Mono','Courier New',monospace" font-size="13" fill="#666" text-anchor="end">0%</text>
    <line x1="0" y1="0" x2="1040" y2="0" stroke="#1a2a3a" stroke-width="1"/>
    <line x1="0" y1="100" x2="1040" y2="100" stroke="#1a2a3a" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="0" y1="200" x2="1040" y2="200" stroke="#1a2a3a" stroke-width="1"/>

    <!-- Easy: off 100%, on 100% -->
    <rect x="20" y="0" width="70" height="200" fill="url(#off)" opacity="0.85"/>
    <rect x="100" y="0" width="70" height="200" fill="url(#on)" opacity="0.85"/>
    <text x="55" y="225" font-family="'SF Mono','Courier New',monospace" font-size="14" fill="#e8eef4" text-anchor="middle">EASY</text>
    <text x="55" y="245" font-family="'SF Mono','Courier New',monospace" font-size="12" fill="#5a8a6a" text-anchor="middle">2/2 · 2/2</text>

    <!-- Medium: off 66.7%, on 100% -->
    <rect x="220" y="66" width="70" height="134" fill="url(#off)" opacity="0.85"/>
    <rect x="300" y="0" width="70" height="200" fill="url(#on)" opacity="0.85"/>
    <text x="255" y="225" font-family="'SF Mono','Courier New',monospace" font-size="14" fill="#e8eef4" text-anchor="middle">MEDIUM</text>
    <text x="255" y="245" font-family="'SF Mono','Courier New',monospace" font-size="12" fill="#5a8a6a" text-anchor="middle">2/3 · 3/3</text>

    <!-- Hard: off 80%, on 100% -->
    <rect x="420" y="40" width="70" height="160" fill="url(#off)" opacity="0.85"/>
    <rect x="500" y="0" width="70" height="200" fill="url(#on)" opacity="0.85"/>
    <text x="455" y="225" font-family="'SF Mono','Courier New',monospace" font-size="14" fill="#e8eef4" text-anchor="middle">HARD</text>
    <text x="455" y="245" font-family="'SF Mono','Courier New',monospace" font-size="12" fill="#5a8a6a" text-anchor="middle">4/5 · 5/5</text>

    <!-- Expert: off 25%, on 37.5% -->
    <rect x="620" y="150" width="70" height="50" fill="url(#off)" opacity="0.85"/>
    <rect x="700" y="125" width="70" height="75" fill="url(#on)" opacity="0.85"/>
    <text x="655" y="225" font-family="'SF Mono','Courier New',monospace" font-size="14" fill="#e8eef4" text-anchor="middle">EXPERT</text>
    <text x="655" y="245" font-family="'SF Mono','Courier New',monospace" font-size="12" fill="#5a8a6a" text-anchor="middle">2/8 · 3/8</text>

    <!-- Frontier: off 41.7%, on 66.7% -->
    <rect x="820" y="117" width="70" height="83" fill="url(#off)" opacity="0.85"/>
    <rect x="900" y="67" width="70" height="133" fill="url(#on)" opacity="0.85"/>
    <text x="855" y="225" font-family="'SF Mono','Courier New',monospace" font-size="14" fill="#e8eef4" text-anchor="middle">FRONTIER</text>
    <text x="855" y="245" font-family="'SF Mono','Courier New',monospace" font-size="12" fill="#5a8a6a" text-anchor="middle">5/12 · 8/12</text>

    <!-- legend -->
    <rect x="20" y="280" width="16" height="16" rx="2" fill="url(#off)"/>
    <text x="44" y="293" font-family="'SF Mono','Courier New',monospace" font-size="14" fill="#5a8a6a">Thinking OFF</text>
    <rect x="200" y="280" width="16" height="16" rx="2" fill="url(#on)"/>
    <text x="224" y="293" font-family="'SF Mono','Courier New',monospace" font-size="14" fill="#5a8a6a">Thinking ON</text>
  </g>

  <!-- headline stats -->
  <g transform="translate(60, 500)">
    <rect x="0" y="0" width="1080" height="84" rx="8" fill="#0d1524" stroke="#1a2a3a" stroke-width="1"/>
    <g font-family="'SF Mono','Courier New',monospace">
      <text x="30" y="30" font-size="12" fill="#666">THINKING OFF</text>
      <text x="30" y="58" font-size="26" font-weight="700" fill="#ff9500">50.0%</text>
      <text x="30" y="76" font-size="11" fill="#5a8a6a">15/30 math</text>

      <text x="210" y="30" font-size="12" fill="#666">THINKING ON</text>
      <text x="210" y="58" font-size="26" font-weight="700" fill="#00d4aa">70.0%</text>
      <text x="210" y="76" font-size="11" fill="#5a8a6a">21/30 math</text>

      <text x="390" y="30" font-size="12" fill="#666">DELTA</text>
      <text x="390" y="58" font-size="26" font-weight="700" fill="#e8eef4">+20.0pp</text>
      <text x="390" y="76" font-size="11" fill="#5a8a6a">+6 problems recovered</text>

      <text x="570" y="30" font-size="12" fill="#666">WALL TIME</text>
      <text x="570" y="58" font-size="26" font-weight="700" fill="#e8eef4">79 min</text>
      <text x="570" y="76" font-size="11" fill="#5a8a6a">~158s / problem</text>

      <text x="750" y="30" font-size="12" fill="#666">EXPERT TROUGH</text>
      <text x="750" y="58" font-size="26" font-weight="700" fill="#e8eef4">37.5%</text>
      <text x="750" y="76" font-size="11" fill="#5a8a6a">reasoning can't save it</text>

      <text x="930" y="30" font-size="12" fill="#666">FAILURES</text>
      <text x="930" y="58" font-size="26" font-weight="700" fill="#e8eef4">0</text>
      <text x="930" y="76" font-size="11" fill="#5a8a6a">timeouts / errors</text>
    </g>
  </g>
</svg>
