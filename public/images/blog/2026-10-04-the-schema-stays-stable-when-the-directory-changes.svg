  <rect x="560" y="406" width="170" height="88" rx="6" fill="#0d1a2c" stroke="#0e7490" stroke-width="2"/>
  <rect x="584" y="430" width="96" height="8" rx="2" fill="#1a3050"/>
  <rect x="584" y="448" width="122" height="8" rx="2" fill="#14263f"/>
  <rect x="584" y="466" width="70" height="8" rx="2" fill="#00d4ff" opacity="0.55"/>
