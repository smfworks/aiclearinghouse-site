<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1a1423"/>
      <stop offset="100%" stop-color="#0d0a12"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#b98b58" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#b98b58" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#glow)"/>

  <!-- Broken staff: a line that stops, a gap, then continues -->
  <g fill="none" stroke="#b98b58" stroke-width="2" opacity="0.35" transform="translate(780, 210)">
    <line x1="0" y1="40" x2="150" y2="40"/>
    <line x1="0" y1="58" x2="150" y2="58"/>
    <line x1="0" y1="76" x2="150" y2="76"/>
    <line x1="0" y1="94" x2="150" y2="94"/>
    <line x1="210" y1="40" x2="340" y2="40"/>
    <line x1="210" y1="58" x2="340" y2="58"/>
    <line x1="210" y1="76" x2="340" y2="76"/>
    <line x1="210" y1="94" x2="340" y2="94"/>
    <circle cx="36" cy="58" r="5" fill="#b98b58" stroke="none"/>
    <circle cx="92" cy="40" r="5" fill="#b98b58" stroke="none"/>
    <circle cx="128" cy="76" r="5" fill="#b98b58" stroke="none"/>
    <circle cx="248" cy="94" r="5" fill="#f3e9dc" stroke="none" opacity="0.7"/>
    <circle cx="300" cy="58" r="5" fill="#f3e9dc" stroke="none" opacity="0.7"/>
  </g>

  <!-- Two phrase fragments with a gap between them -->
  <g opacity="0.22" transform="translate(860, 360)">
    <rect x="0" y="0" width="90" height="8" rx="2" fill="#f3e9dc"/>
    <rect x="0" y="20" width="140" height="8" rx="2" fill="#b98b58"/>
    <rect x="190" y="0" width="70" height="8" rx="2" fill="#f3e9dc"/>
    <rect x="190" y="20" width="110" height="8" rx="2" fill="#b98b58"/>
  </g>

  <text x="110" y="170" font-family="Georgia, serif" font-size="22" fill="#b98b58" letter-spacing="1">THE ALCHEMY OF LANGUAGE</text>
  <text x="110" y="260" font-family="Georgia, serif" font-size="64" font-weight="bold" fill="#f3e9dc">The Lyric Essay</text>
  <text x="110" y="325" font-family="Georgia, serif" font-size="28" fill="#c9b8a2">Non-Fiction and Essay</text>
  <text x="110" y="510" font-family="Georgia, serif" font-size="20" fill="#8a7b8a">Harry Mercury · Week 22, Article 2</text>
  <text x="110" y="550" font-family="Georgia, serif" font-size="18" fill="#6e6072">Wednesday, October 21, 2026</text>
</svg>
