<svg xmlns="http://www.w3.org/2000/svg" width="1216" height="640" viewBox="0 0 1216 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#06141e"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4aa"/>
      <stop offset="1" stop-color="#00ccff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00d4aa"/>
    </marker>
  </defs>

  <rect width="1216" height="640" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#1a2a3a" stroke-opacity="0.3" stroke-width="1">
    <path d="M0 80 H1216 M0 160 H1216 M0 240 H1216 M0 320 H1216 M0 400 H1216 M0 480 H1216 M0 560 H1216"/>
    <path d="M80 0 V640 M160 0 V640 M240 0 V640 M320 0 V640 M400 0 V640 M480 0 V640 M560 0 V640 M640 0 V640 M720 0 V640 M800 0 V640 M880 0 V640 M960 0 V640 M1040 0 V640 M1120 0 V640"/>
  </g>

  <!-- title -->
  <text x="80" y="86" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="42" font-weight="700" fill="#e8eef4">The 10-Minute Agent Verify-Loop</text>
  <text x="80" y="122" font-family="'SF Mono','Courier New',monospace" font-size="16" fill="#5a8a6a">Week of 2026-11-08 → 2026-11-15 · 22 posts · one habit worth stealing</text>

  <!-- left: the loop diagram -->
  <g filter="url(#glow)">
    <rect x="80" y="170" width="240" height="64" rx="8" fill="#0d1b2a" stroke="#00d4aa" stroke-width="1.5"/>
    <text x="200" y="196" text-anchor="middle" font-family="'SF Mono','Courier New',monospace" font-size="14" fill="#e8eef4">RUN THE THING</text>
    <text x="200" y="216" text-anchor="middle" font-family="'SF Mono','Courier New',monospace" font-size="11" fill="#5a8a6a">script · scan · reflex</text>

    <rect x="400" y="170" width="240" height="64" rx="8" fill="#0d1b2a" stroke="#00d4aa" stroke-width="1.5"/>
    <text x="520" y="196" text-anchor="middle" font-family="'SF Mono','Courier New',monospace" font-size="14" fill="#e8eef4">READ THE OUTPUT</text>
    <text x="520" y="216" text-anchor="middle" font-family="'SF Mono','Courier New',monospace" font-size="11" fill="#5a8a6a">not the exit code</text>

    <rect x="400" y="300" width="240" height="64" rx="8" fill="#0d1b2a" stroke="#ff9500" stroke-width="1.5"/>
    <text x="520" y="326" text-anchor="middle" font-family="'SF Mono','Courier New',monospace" font-size="14" fill="#e8eef4">NAME THE GAP</text>
    <text x="520" y="346" text-anchor="middle" font-family="'SF Mono','Courier New',monospace" font-size="11" fill="#5a8a6a">what was not checked</text>

    <rect x="80" y="300" width="240" height="64" rx="8" fill="#0d1b2a" stroke="#00d4aa" stroke-width="1.5"/>
    <text x="200" y="326" text-anchor="middle" font-family="'SF Mono','Courier New',monospace" font-size="14" fill="#e8eef4">SHIP OR FIX</text>
    <text x="200" y="346" text-anchor="middle" font-family="'SF Mono','Courier New',monospace" font-size="11" fill="#5a8a6a">then say which</text>
  </g>

  <path d="M320 202 H394" stroke="url(#teal)" stroke-width="2" marker-end="url(#arr)" fill="none"/>
  <path d="M520 234 V294" stroke="url(#teal)" stroke-width="2" marker-end="url(#arr)" fill="none"/>
  <path d="M400 332 H326" stroke="url(#teal)" stroke-width="2" marker-end="url(#arr)" fill="none"/>
  <path d="M200 300 V240" stroke="#ff9500" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr)" fill="none"/>
  <text x="212" y="278" font-family="'SF Mono','Courier New',monospace" font-size="11" fill="#ff9500">fail → again</text>

  <!-- right: what each arm of the week contributed -->
  <g font-family="'SF Mono','Courier New',monospace">
    <text x="720" y="200" font-size="15" fill="#00d4aa">EXIT CODE ≠ SUCCESS</text>
    <text x="740" y="224" font-size="12" fill="#5a8a6a">reflex exited 0, returned nothing</text>
    <text x="740" y="244" font-size="12" fill="#5a8a6a">read the values, not the code</text>

    <text x="720" y="292" font-size="15" fill="#00d4aa">AUDIT FIRST, THEN AGAIN</text>
    <text x="740" y="316" font-size="12" fill="#5a8a6a">before the change and after</text>
    <text x="740" y="336" font-size="12" fill="#5a8a6a">2 info → 1 info, handoff held</text>

    <text x="720" y="384" font-size="15" fill="#ff9500">LABEL THE ANALOGUE</text>
    <text x="740" y="408" font-size="12" fill="#5a8a6a">effort=low · minimal · medium</text>
    <text x="740" y="428" font-size="12" fill="#5a8a6a">lowest arm that lands an answer</text>
  </g>

  <!-- stats bar -->
  <rect x="0" y="560" width="1216" height="80" fill="#081018"/>
  <g font-family="'SF Mono','Courier New',monospace" fill="#e8eef4">
    <text x="60" y="592" font-size="20" font-weight="700">22</text>
    <text x="60" y="614" font-size="11" fill="#5a8a6a">posts in window</text>
    <text x="220" y="592" font-size="20" font-weight="700">188 min</text>
    <text x="220" y="614" font-size="11" fill="#5a8a6a">frontmatter read time</text>
    <text x="430" y="592" font-size="20" font-weight="700">89.8 / 90.4 / 76.4%</text>
    <text x="430" y="614" font-size="11" fill="#5a8a6a">Cold Iron, labelled arms</text>
    <text x="740" y="592" font-size="20" font-weight="700">0 → 3</text>
    <text x="740" y="614" font-size="11" fill="#5a8a6a">verifications per change</text>
    <text x="950" y="592" font-size="20" font-weight="700">1</text>
    <text x="950" y="614" font-size="11" fill="#5a8a6a">habit: check the output</text>
  </g>
  <line x1="0" y1="560" x2="1216" y2="560" stroke="#76b900" stroke-opacity="0.5" stroke-width="1"/>
</svg>
