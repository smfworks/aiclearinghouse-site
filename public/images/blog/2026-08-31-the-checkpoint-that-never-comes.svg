<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0F1F"/>
      <stop offset="50%" stop-color="#001F3F"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
    <radialGradient id="pulse" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00E5A0" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00E5A0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g stroke="#00E5A0" stroke-opacity="0.04" stroke-width="1" fill="none">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <circle cx="230" cy="325" r="200" fill="url(#pulse)"/>

  <!-- WAL cylinder: full to a hard ceiling, drain valve closed -->
  <g transform="translate(230,325)">
    <ellipse cx="0" cy="-92" rx="70" ry="22" fill="none" stroke="#00E5A0" stroke-width="3"/>
    <path d="M -70 -92 L -70 78 A 70 22 0 0 0 70 78 L 70 -92" fill="none" stroke="#00E5A0" stroke-width="3"/>
    <!-- fill up to ceiling -->
    <path d="M -66 -40 L -66 74 A 66 18 0 0 0 66 74 L 66 -40" fill="#00E5A0" fill-opacity="0.18"/>
    <ellipse cx="0" cy="-40" rx="66" ry="18" fill="#00E5A0" fill-opacity="0.28"/>
    <!-- ceiling line -->
    <line x1="-88" y1="-40" x2="88" y2="-40" stroke="#00E5A0" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="98" y="-34" fill="#00E5A0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">64 MiB</text>
    <!-- closed drain valve at base -->
    <rect x="-14" y="98" width="28" height="18" rx="3" fill="none" stroke="#00E5A0" stroke-width="2.5"/>
    <line x1="-6" y1="107" x2="6" y2="107" stroke="#00E5A0" stroke-width="2.5"/>
    <circle cx="0" cy="128" r="10" fill="none" stroke="#00E5A0" stroke-width="2.5"/>
    <line x1="-6" y1="122" x2="6" y2="134" stroke="#00E5A0" stroke-width="2"/>
    <!-- nine pin dots along the rim -->
    <g fill="#00E5A0">
      <circle cx="-48" cy="-88" r="4"/>
      <circle cx="-24" cy="-96" r="4"/>
      <circle cx="0" cy="-99" r="4"/>
      <circle cx="24" cy="-96" r="4"/>
      <circle cx="48" cy="-88" r="4"/>
      <circle cx="-56" cy="-70" r="3.5" fill-opacity="0.7"/>
      <circle cx="56" cy="-70" r="3.5" fill-opacity="0.7"/>
      <circle cx="-40" cy="-58" r="3.5" fill-opacity="0.7"/>
      <circle cx="40" cy="-58" r="3.5" fill-opacity="0.7"/>
    </g>
  </g>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="430" y="214" fill="#00E5A0" font-size="18" font-weight="600" letter-spacing="2">DR J — CLINICAL INFRASTRUCTURE</text>
    <text x="430" y="278" fill="#E2E8F0" font-size="46" font-weight="700">The Checkpoint</text>
    <text x="430" y="336" fill="#E2E8F0" font-size="46" font-weight="700">That Never Comes</text>
    <text x="430" y="392" fill="#94A3B8" font-size="18">Nine profiles pinned at the 64 MiB WAL ceiling.</text>
    <text x="430" y="420" fill="#94A3B8" font-size="18">The cap is working. The drain is not.</text>
  </g>

  <g stroke="#00E5A0" stroke-opacity="0.06" stroke-width="2" fill="none">
    <path d="M 1120 40 L 1120 140 L 1180 200"/>
    <path d="M 1060 20 L 1060 90 L 1140 170 L 1140 260"/>
    <path d="M 1160 430 L 1160 520 L 1080 600"/>
    <path d="M 1100 470 L 1100 560"/>
  </g>
  <g fill="#00E5A0" fill-opacity="0.12">
    <circle cx="1180" cy="200" r="4"/>
    <circle cx="1140" cy="260" r="4"/>
    <circle cx="1080" cy="600" r="4"/>
  </g>

  <rect x="0" y="627" width="1200" height="3" fill="#00E5A0" fill-opacity="0.4"/>
</svg>
