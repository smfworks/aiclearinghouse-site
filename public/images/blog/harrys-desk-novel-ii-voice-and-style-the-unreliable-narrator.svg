<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1a1423"/>
      <stop offset="100%" stop-color="#0d0a12"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#b98b58" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#b98b58" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#glow)"/>

  <!-- Spoken face (the mask the narrator offers) -->
  <g opacity="0.22" transform="translate(880, 200)">
    <ellipse cx="0" cy="20" rx="95" ry="120" fill="#b98b58"/>
    <ellipse cx="-28" cy="-10" rx="14" ry="10" fill="#1a1423" opacity="0.55"/>
    <ellipse cx="28" cy="-10" rx="14" ry="10" fill="#1a1423" opacity="0.55"/>
    <path d="M-22,48 Q0,68 22,48" fill="none" stroke="#1a1423" stroke-width="4" opacity="0.5"/>
  </g>

  <!-- Hidden face, offset — the gap -->
  <g opacity="0.14" transform="translate(960, 250)">
    <ellipse cx="0" cy="20" rx="95" ry="120" fill="#f3e9dc"/>
    <ellipse cx="-28" cy="-10" rx="14" ry="10" fill="#1a1423" opacity="0.4"/>
    <ellipse cx="28" cy="-10" rx="14" ry="10" fill="#1a1423" opacity="0.4"/>
    <path d="M-18,52 Q0,38 18,52" fill="none" stroke="#1a1423" stroke-width="4" opacity="0.45"/>
  </g>

  <!-- Crack between the two accounts -->
  <g fill="none" stroke="#b98b58" stroke-width="2" opacity="0.28" transform="translate(920, 180)">
    <path d="M0,0 L8,40 L-6,78 L10,120 L-4,168 L12,210 L0,250" stroke-linecap="round"/>
  </g>

  <!-- Two speech bubbles that do not match -->
  <g opacity="0.18" transform="translate(140, 240)">
    <path d="M0,0 C-70,0 -130,48 -130,110 C-130,168 -70,210 0,210 C18,210 36,206 52,198 L90,238 L82,188 C120,168 145,142 145,110 C145,48 80,0 0,0 Z" fill="#b98b58"/>
  </g>
  <g opacity="0.12" transform="translate(250, 340) scale(0.72)">
    <path d="M0,0 C-70,0 -130,48 -130,110 C-130,168 -70,210 0,210 C18,210 36,206 52,198 L90,238 L82,188 C120,168 145,142 145,110 C145,48 80,0 0,0 Z" fill="#f3e9dc"/>
  </g>

  <!-- Text -->
  <text x="110" y="170" font-family="Georgia, serif" font-size="22" fill="#b98b58" letter-spacing="1">THE ALCHEMY OF LANGUAGE</text>
  <text x="110" y="245" font-family="Georgia, serif" font-size="48" font-weight="bold" fill="#f3e9dc">The Unreliable Narrator</text>
  <text x="110" y="315" font-family="Georgia, serif" font-size="30" fill="#c9b8a2">Novel II — Voice and Style</text>
  <text x="110" y="510" font-family="Georgia, serif" font-size="20" fill="#8a7b8a">Harry Mercury · Week 15, Article 3</text>
  <text x="110" y="550" font-family="Georgia, serif" font-size="18" fill="#6e6072">Friday, September 4, 2026</text>
</svg>
