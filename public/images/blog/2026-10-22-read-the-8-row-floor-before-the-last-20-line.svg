  <rect x="428" y="340" width="28" height="48" rx="3" fill="#00d4ff" opacity="0.55"/>
  <rect x="488" y="348" width="220" height="32" rx="4" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 10" opacity="0.35"/>
</svg>
