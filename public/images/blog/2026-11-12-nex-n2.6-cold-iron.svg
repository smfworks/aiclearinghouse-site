    <text x="470" y="380">reasoning 27/30</text><rect x="680" y="366" width="180" height="16" rx="4" fill="#122030"/><rect x="680" y="366" width="162" height="16" rx="4" fill="#00d4aa"/>
    <text x="60" y="420">instruction 28/30</text><rect x="250" y="406" width="180" height="16" rx="4" fill="#122030"/><rect x="250" y="406" width="168" height="16" rx="4" fill="#76b900"/>
    <text x="470" y="420">coding 11/30</text><rect x="680" y="406" width="180" height="16" rx="4" fill="#122030"/><rect x="680" y="406" width="66" height="16" rx="4" fill="#ff9500"/>
    <text x="60" y="460">prose 25/30</text><rect x="250" y="446" width="180" height="16" rx="4" fill="#122030"/><rect x="250" y="446" width="150" height="16" rx="4" fill="#00d4aa"/>
    <text x="470" y="460">writing 5/5 - tools 2/2</text><rect x="680" y="446" width="180" height="16" rx="4" fill="#122030"/><rect x="680" y="446" width="180" height="16" rx="4" fill="#76b900"/>
  </g>

  <!-- stats bar -->
  <rect x="0" y="524" width="1200" height="100" fill="#050a10" opacity="0.85"/>
  <g font-family="'SF Mono',Courier,monospace" fill="#5a8a6a" font-size="12">
    <text x="60" y="555">RANK (OLYMPIC)</text><text x="60" y="585" font-size="22" fill="#e8eef4">#24</text>
    <text x="290" y="555">WALL CLOCK</text><text x="290" y="585" font-size="22" fill="#e8eef4">49.8 min</text>
    <text x="520" y="555">COST (157 ROWS)</text><text x="520" y="585" font-size="22" fill="#e8eef4">$0.129</text>
    <text x="750" y="555">SYNTAX ERRORS</text><text x="750" y="585" font-size="22" fill="#ff9500">14</text>
    <text x="960" y="555">REASONING TOKENS</text><text x="960" y="585" font-size="22" fill="#e8eef4">301,794</text>
