  <text x="60" y="290" font-family="'SF Mono',Courier,monospace" font-size="15" fill="#e8eef4">vs Nex-N2.5-Pro</text>
  <rect x="60" y="305" width="1080" height="30" rx="6" fill="#122030"/>
  <rect x="60" y="305" width="354" height="30" rx="6" fill="#ff9500" opacity="0.85"/>
  <text x="430" y="327" font-family="'SF Mono',Courier,monospace" font-size="17" fill="#e8eef4">81/157 - 51.6% (+24.8 pts)</text>

  <!-- category bars -->
