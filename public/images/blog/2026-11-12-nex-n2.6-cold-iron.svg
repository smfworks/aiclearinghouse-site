    <line x1="0" y1="350" x2="1200" y2="350"/><line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="60" y="80" font-family="'SF Pro Display',Helvetica,Arial,sans-serif" font-size="40" font-weight="bold" fill="#e8eef4">Nex-N2.6 on Cold Iron</text>
  <text x="60" y="118" font-family="'SF Mono',Courier,monospace" font-size="17" fill="#5a8a6a">157 tests, effort=medium analogue (reasoning mandatory) - 2026-11-12</text>

