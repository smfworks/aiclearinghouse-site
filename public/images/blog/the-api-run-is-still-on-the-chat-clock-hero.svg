<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Abstract two-clock drain: a short gold arc beside a longer teal arc, with a separate long wait bar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="55%" stop-color="#12243f"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="goldArc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ff6b00"/>
    </linearGradient>
    <linearGradient id="tealArc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="waitBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g stroke="#162236" stroke-width="1" opacity="0.55">
    <line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="1120" y1="0" x2="1120" y2="630"/>
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
  </g>
  <circle cx="340" cy="300" r="150" fill="none" stroke="#1e3a8a" stroke-width="18" opacity="0.45"/>
  <path d="M340 150 A150 150 0 0 1 470 230" fill="none" stroke="url(#goldArc)" stroke-width="18" stroke-linecap="round"/>
  <circle cx="470" cy="230" r="11" fill="#ff6b00"/>
  <circle cx="340" cy="300" r="8" fill="#f59e0b"/>
  <circle cx="820" cy="300" r="168" fill="none" stroke="#123044" stroke-width="18"/>
  <path d="M820 132 A168 168 0 1 1 670 390" fill="none" stroke="url(#tealArc)" stroke-width="18" stroke-linecap="round"/>
  <circle cx="670" cy="390" r="11" fill="#0e7490"/>
  <circle cx="820" cy="300" r="8" fill="#5eead4"/>
  <rect x="180" y="500" width="840" height="14" rx="7" fill="#12243f"/>
  <rect x="180" y="500" width="620" height="14" rx="7" fill="url(#waitBar)" opacity="0.9"/>
  <circle cx="800" cy="507" r="7" fill="#f59e0b"/>
  <g opacity="0.35" filter="url(#soft)">
    <circle cx="470" cy="230" r="28" fill="#ff6b00"/>
    <circle cx="670" cy="390" r="28" fill="#0e7490"/>
  </g>
</svg>
