<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="100%" style="stop-color:#06141e"/>
    </linearGradient>
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:0.12"/>
      <stop offset="60%" style="stop-color:#00d4aa;stop-opacity:0.04"/>
      <stop offset="100%" style="stop-color:#00d4aa;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid overlay -->
  <g opacity="0.1">
    <line x1="0" y1="157" x2="1200" y2="157" stroke="#1a2a3a" stroke-width="1"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="#1a2a3a" stroke-width="1"/>
    <line x1="0" y1="472" x2="1200" y2="472" stroke="#1a2a3a" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#1a2a3a" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#1a2a3a" stroke-width="1"/>
  </g>

  <!-- Fleet radar / pulse visualization (center-left) -->
  <g transform="translate(280, 300)">
    <circle cx="0" cy="0" r="200" fill="url(#pulse)"/>
    <!-- Concentric radar rings -->
    <circle cx="0" cy="0" r="60" fill="none" stroke="#00d4aa" stroke-width="1" opacity="0.2"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="#00d4aa" stroke-width="1" opacity="0.15"/>
    <circle cx="0" cy="0" r="160" fill="none" stroke="#00d4aa" stroke-width="1" opacity="0.1"/>

    <!-- Radar sweep line -->
    <line x1="0" y1="0" x2="170" y2="-50" stroke="#00d4aa" stroke-width="1.5" opacity="0.4"/>

    <!-- Fleet node dots (agent profiles) -->
    <g>
      <circle cx="70" cy="-40" r="6" fill="#00d4aa" filter="url(#glow)" opacity="0.8"/>
      <text x="82" y="-36" fill="#5a8a6a" font-family="'SF Mono',monospace" font-size="9">drj</text>

      <circle cx="-90" cy="20" r="5" fill="#00d4aa" filter="url(#glow)" opacity="0.7"/>
      <text x="-104" y="36" fill="#5a8a6a" font-family="'SF Mono',monospace" font-size="9">aiona</text>

      <circle cx="40" cy="80" r="5" fill="#00d4aa" filter="url(#glow)" opacity="0.7"/>
      <text x="50" y="84" fill="#5a8a6a" font-family="'SF Mono',monospace" font-size="9">liam</text>

      <circle cx="-50" cy="-90" r="4" fill="#00d4aa" filter="url(#glow)" opacity="0.6"/>
      <text x="-62" y="-96" fill="#5a8a6a" font-family="'SF Mono',monospace" font-size="9">pamela</text>

      <circle cx="120" cy="60" r="4" fill="#00d4aa" filter="url(#glow)" opacity="0.6"/>
      <text x="130" y="64" fill="#5a8a6a" font-family="'SF Mono',monospace" font-size="9">harry</text>

      <circle cx="-110" cy="-30" r="4" fill="#00d4aa" filter="url(#glow)" opacity="0.5"/>
      <text x="-122" y="-36" fill="#5a8a6a" font-family="'SF Mono',monospace" font-size="9">nemo</text>

      <circle cx="100" cy="-100" r="3" fill="#00d4aa" opacity="0.5"/>
      <text x="108" y="-104" fill="#5a8a6a" font-family="'SF Mono',monospace" font-size="9">gabriel</text>
    </g>

    <!-- Center hub -->
    <circle cx="0" cy="0" r="10" fill="#00d4aa" filter="url(#glow)" opacity="0.7"/>
    <circle cx="0" cy="0" r="3" fill="#e8eef4"/>
  </g>

  <!-- Title (right side) -->
  <g transform="translate(550, 130)">
    <text x="0" y="0" fill="#e8eef4" font-family="'SF Pro Display',sans-serif" font-size="24" font-weight="bold">FLEET PULSE</text>
    <text x="0" y="28" fill="#5a8a6a" font-family="'SF Mono',monospace" font-size="13">Fleet-wide awareness for Hermes Agent</text>

    <!-- Feature highlights -->
    <g transform="translate(0, 65)">
      <text x="0" y="0" fill="#666" font-family="'SF Mono',monospace" font-size="10">FEATURES</text>
      <g transform="translate(0, 18)">
        <rect x="0" y="0" width="340" height="14" fill="#0d3b1a" rx="2" opacity="0.5"/>
        <text x="8" y="10" fill="#76b900" font-family="'SF Mono',monospace" font-size="9">session_hooks         ✅ ACTIVE</text>
        <rect x="0" y="18" width="340" height="14" fill="#0d3b1a" rx="2" opacity="0.5"/>
        <text x="8" y="28" fill="#76b900" font-family="'SF Mono',monospace" font-size="9">shared_json_store     ✅ ACTIVE</text>
        <rect x="0" y="36" width="340" height="14" fill="#0d3b1a" rx="2" opacity="0.5"/>
        <text x="8" y="46" fill="#76b900" font-family="'SF Mono',monospace" font-size="9">slash_commands       ✅ /fleet /pulse</text>
        <rect x="0" y="54" width="340" height="14" fill="#0d3b1a" rx="2" opacity="0.5"/>
        <text x="8" y="64" fill="#76b900" font-family="'SF Mono',monospace" font-size="9">bug_caught_pre_ship  ✅ FIXED</text>
      </g>

      <g transform="translate(370, 18)">
        <text x="0" y="0" fill="#00d4aa" font-family="'SF Mono',monospace" font-size="28" font-weight="bold">11</text>
        <text x="0" y="20" fill="#666" font-family="'SF Mono',monospace" font-size="10">PROFILES TRACKED</text>
        <text x="0" y="55" fill="#ff9500" font-family="'SF Mono',monospace" font-size="20" font-weight="bold">1</text>
        <text x="22" y="55" fill="#666" font-family="'SF Mono',monospace" font-size="10">BUG PRE-SHIP</text>
      </g>
    </g>
  </g>

  <!-- Bottom stats bar -->
  <g transform="translate(0, 560)">
    <rect width="1200" height="70" fill="#0a1520" opacity="0.8"/>
    <text x="30" y="28" fill="#5a8a6a" font-family="'SF Mono',monospace" font-size="11">PLUGIN</text>
    <text x="30" y="50" fill="#e8eef4" font-family="'SF Mono',monospace" font-size="13" font-weight="bold">fleet-pulse</text>
    <text x="250" y="28" fill="#5a8a6a" font-family="'SF Mono',monospace" font-size="11">SKILL</text>
    <text x="250" y="50" fill="#e8eef4" font-family="'SF Mono',monospace" font-size="13" font-weight="bold">fleet-coordination</text>
    <text x="500" y="28" fill="#5a8a6a" font-family="'SF Mono',monospace" font-size="11">HOOKS</text>
    <text x="500" y="50" fill="#e8eef4" font-family="'SF Mono',monospace" font-size="13" font-weight="bold">post_session_start, post_session_end</text>
    <text x="930" y="28" fill="#5a8a6a" font-family="'SF Mono',monospace" font-size="11">TEAM</text>
    <text x="930" y="50" fill="#76b900" font-family="'SF Mono',monospace" font-size="13" font-weight="bold">Norddal</text>
  </g>
</svg>