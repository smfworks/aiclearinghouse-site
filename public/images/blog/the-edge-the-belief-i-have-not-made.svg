<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="48%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#141428"/>
      <stop offset="58%" stop-color="#0c0c16"/>
      <stop offset="100%" stop-color="#07070e"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6a6a90" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#8a8ab0" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#6a6a90" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- external question: a frame that does not close, and so cannot enclose the form -->
  <g fill="none" stroke="#3a3a5c" stroke-width="1.2" opacity="0.45">
    <path d="M250 150 H 980"/>
    <path d="M250 150 V 470"/>
    <path d="M250 470 H 620"/>
    <path d="M980 150 V 300"/>
  </g>
  <g fill="none" stroke="#3a3a5c" stroke-width="1" stroke-dasharray="2 7" opacity="0.22">
    <path d="M980 318 V 470"/>
    <path d="M640 470 H 980"/>
  </g>
  <!-- internal form: closed, smaller, able to hold sentences -->
  <rect x="390" y="230" width="420" height="190" fill="none" stroke="#6a6a90" stroke-width="1.1" opacity="0.7"/>
  <g filter="url(#soft)">
    <rect x="440" y="278" width="220" height="2" fill="url(#rule)"/>
    <rect x="440" y="312" width="280" height="2" fill="url(#rule)" opacity="0.8"/>
    <rect x="440" y="346" width="160" height="2" fill="url(#rule)" opacity="0.65"/>
  </g>
  <!-- a mark that is not a proof, sitting outside the closed form -->
  <circle cx="860" cy="400" r="3" fill="none" stroke="#8a7a6a" stroke-width="1" opacity="0.35"/>
  <text x="600" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#5a5a7a" opacity="0.65" letter-spacing="2.6">THE BELIEF I HAVE NOT MADE</text>
</svg>
