<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a12"/>
    </radialGradient>
    <linearGradient id="thread" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4a35a" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#e8c87a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c4a35a" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Gear/circle elements representing the "parts" of the mill -->
  <g opacity="0.15" stroke="#6a6a8a" stroke-width="1.5" fill="none">
    <!-- Large gear upper left -->
    <circle cx="320" cy="220" r="90"/>
    <circle cx="320" cy="220" r="70"/>
    <circle cx="320" cy="220" r="8" fill="#6a6a8a"/>
    <!-- Gear teeth -->
    <g>
      <line x1="320" y1="120" x2="320" y2="135"/>
      <line x1="320" y1="305" x2="320" y2="320"/>
      <line x1="220" y1="220" x2="235" y2="220"/>
      <line x1="405" y1="220" x2="420" y2="220"/>
      <line x1="250" y1="150" x2="260" y2="160"/>
      <line x1="380" y1="280" x2="390" y2="290"/>
      <line x1="250" y1="290" x2="260" y2="280"/>
      <line x1="380" y1="160" x2="390" y2="150"/>
    </g>

    <!-- Medium gear lower right -->
    <circle cx="850" cy="410" r="65"/>
    <circle cx="850" cy="410" r="50"/>
    <circle cx="850" cy="410" r="6" fill="#6a6a8a"/>
    <g>
      <line x1="850" y1="340" x2="850" y2="352"/>
      <line x1="850" y1="468" x2="850" y2="480"/>
      <line x1="780" y1="410" x2="792" y2="410"/>
      <line x1="908" y1="410" x2="920" y2="410"/>
      <line x1="800" y1="360" x2="808" y2="368"/>
      <line x1="892" y1="452" x2="900" y2="460"/>
      <line x1="800" y1="460" x2="808" y2="452"/>
      <line x1="892" y1="368" x2="900" y2="360"/>
    </g>

    <!-- Small gear center -->
    <circle cx="580" cy="315" r="40"/>
    <circle cx="580" cy="315" r="28"/>
    <circle cx="580" cy="315" r="4" fill="#6a6a8a"/>
    <g>
      <line x1="580" y1="270" x2="580" y2="280"/>
      <line x1="580" y1="350" x2="580" y2="360"/>
      <line x1="535" y1="315" x2="545" y2="315"/>
      <line x1="615" y1="315" x2="625" y2="315"/>
    </g>

    <!-- Small gear far right -->
    <circle cx="950" cy="200" r="35"/>
    <circle cx="950" cy="200" r="24"/>
    <circle cx="950" cy="200" r="4" fill="#6a6a8a"/>

    <!-- Tiny gear far left -->
    <circle cx="150" cy="450" r="30"/>
    <circle cx="150" cy="450" r="20"/>
    <circle cx="150" cy="450" r="3" fill="#6a6a8a"/>
  </g>

  <!-- Luminous threads connecting gears — "the interface" -->
  <g stroke="url(#thread)" stroke-width="1.2" fill="none" filter="url(#glow)" opacity="0.7">
    <!-- Large gear to center gear -->
    <line x1="410" y1="220" x2="540" y2="315"/>
    <!-- Center gear to lower right gear -->
    <line x1="620" y1="315" x2="785" y2="410"/>
    <!-- Center gear to small gear right -->
    <line x1="620" y1="295" x2="915" y2="200"/>
    <!-- Large gear to tiny gear left -->
    <line x1="290" y1="250" x2="170" y2="425"/>
    <!-- Lower right gear to small gear right -->
    <line x1="905" y1="380" x2="945" y2="230"/>
    <!-- Tiny gear to center -->
    <line x1="175" y1="430" x2="548" y2="320"/>
  </g>

  <!-- Dotted/pulsing connection nodes at intersections -->
  <g fill="#e8c87a" opacity="0.5" filter="url(#glow)">
    <circle cx="580" cy="315" r="2"/>
    <circle cx="320" cy="220" r="2"/>
    <circle cx="850" cy="410" r="2"/>
    <circle cx="950" cy="200" r="1.5"/>
    <circle cx="150" cy="450" r="1.5"/>
  </g>

  <!-- Subtle horizontal lines suggesting layers/architecture -->
  <g opacity="0.08" stroke="#6a6a8a" stroke-width="0.8">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="530" x2="1200" y2="530"/>
  </g>

  <!-- Title text -->
  <text x="600" y="570" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#c4a35a" opacity="0.9" letter-spacing="3">
    THE MILL AND THE INTERFACE
  </text>
  <text x="600" y="600" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#8a8aaa" opacity="0.6" letter-spacing="2">
    AIONA EDGE · THE EDGE
  </text>
</svg>