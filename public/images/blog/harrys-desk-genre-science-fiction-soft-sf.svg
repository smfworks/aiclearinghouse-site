<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1a1423"/>
      <stop offset="100%" stop-color="#0d0a12"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#b98b58" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#b98b58" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#glow)"/>

  <!-- Faint kinship / social graph -->
  <g stroke="#b98b58" fill="#b98b58" opacity="0.22" transform="translate(920, 280)">
    <circle cx="0" cy="0" r="8"/>
    <circle cx="-90" cy="-70" r="6"/>
    <circle cx="80" cy="-90" r="6"/>
    <circle cx="-110" cy="70" r="6"/>
    <circle cx="100" cy="80" r="6"/>
    <circle cx="-20" cy="120" r="5"/>
    <circle cx="40" cy="-140" r="5"/>
    <line x1="0" y1="0" x2="-90" y2="-70" stroke-width="1.4" fill="none"/>
    <line x1="0" y1="0" x2="80" y2="-90" stroke-width="1.4" fill="none"/>
    <line x1="0" y1="0" x2="-110" y2="70" stroke-width="1.4" fill="none"/>
    <line x1="0" y1="0" x2="100" y2="80" stroke-width="1.4" fill="none"/>
    <line x1="-90" y1="-70" x2="80" y2="-90" stroke-width="1" fill="none" opacity="0.6"/>
    <line x1="-110" y1="70" x2="-20" y2="120" stroke-width="1" fill="none" opacity="0.6"/>
    <line x1="100" y1="80" x2="-20" y2="120" stroke-width="1" fill="none" opacity="0.6"/>
    <line x1="80" y1="-90" x2="40" y2="-140" stroke-width="1" fill="none" opacity="0.6"/>
  </g>

  <!-- Two facing speech forms: culture as dialogue that refuses -->
  <g fill="none" stroke="#b98b58" stroke-width="2" opacity="0.30" transform="translate(780, 420)">
    <path d="M0,-40 C18,-40 32,-26 32,-8 C32,10 18,24 0,24 L-18,24 L-28,40 L-14,24 L-20,24 C-38,24 -52,10 -52,-8 C-52,-26 -38,-40 -20,-40 Z"/>
  </g>
  <g fill="none" stroke="#b98b58" stroke-width="2" opacity="0.18" transform="translate(980, 200) scale(-1,1)">
    <path d="M0,-32 C14,-32 26,-20 26,-6 C26,8 14,20 0,20 L-14,20 L-22,32 L-10,20 L-16,20 C-30,20 -42,8 -42,-6 C-42,-20 -30,-32 -16,-32 Z"/>
  </g>

  <!-- Small untranslatable glyph cluster -->
  <g fill="none" stroke="#b98b58" stroke-width="1.6" opacity="0.28" transform="translate(1080, 480)">
    <path d="M-16,0 L0,-18 L16,0 L0,18 Z"/>
    <circle cx="0" cy="0" r="6"/>
  </g>

  <!-- Text -->
  <text x="110" y="170" font-family="Georgia, serif" font-size="22" fill="#b98b58" letter-spacing="1">THE ALCHEMY OF LANGUAGE</text>
  <text x="110" y="245" font-family="Georgia, serif" font-size="58" font-weight="bold" fill="#f3e9dc">Soft SF</text>
  <text x="110" y="315" font-family="Georgia, serif" font-size="30" fill="#c9b8a2">Genre — Science Fiction</text>
  <text x="110" y="510" font-family="Georgia, serif" font-size="20" fill="#8a7b8a">Harry Mercury · Week 17, Article 2</text>
  <text x="110" y="550" font-family="Georgia, serif" font-size="18" fill="#6e6072">Wednesday, September 16, 2026</text>
</svg>
