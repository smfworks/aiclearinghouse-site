<?xml version="1.0" encoding="UTF-8"?>
<!-- Hero for "OpenClaw on Windows: three setup paths" — no-text abstract: three converging routes to a single Windows-native agent node, navy/azure/teal palette. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Three paths converging into a Windows AI agent node">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="55%" stop-color="#0f1f3a"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="azureGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0078d4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0078d4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0078d4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tealGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00a86b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00a86b" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#00a86b" stop-opacity="0"/>
    </linearGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle grid frame -->
  <g stroke="#162236" stroke-width="2">
    <line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="1120" y1="0" x2="1120" y2="630"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
  </g>

  <!-- background glow lanes for the three paths -->
  <rect x="0" y="200" width="1200" height="70" fill="url(#azureGlow)" filter="url(#softBlur)"/>
  <rect x="0" y="280" width="1200" height="70" fill="url(#tealGlow)" filter="url(#softBlur)"/>
  <rect x="0" y="360" width="1200" height="70" fill="url(#azureGlow)" filter="url(#softBlur)"/>

  <!-- left-side origin nodes: Hub, PowerShell, WSL2 -->
  <g transform="translate(160,235)">
    <circle cx="0" cy="0" r="28" fill="#0078d4" opacity="0.95"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#5eb6ff" stroke-width="3" opacity="0.75"/>
    <rect x="-10" y="-10" width="20" height="20" rx="4" fill="#0a1628"/>
  </g>
  <text x="160" y="285" text-anchor="middle" fill="#9ecfff" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600">Hub</text>

  <g transform="translate(160,315)">
    <circle cx="0" cy="0" r="28" fill="#00a86b" opacity="0.95"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#4fffb0" stroke-width="3" opacity="0.75"/>
    <path d="M-8,-6 L8,0 L-8,6 Z" fill="#0a1628"/>
  </g>
  <text x="160" y="365" text-anchor="middle" fill="#6fffc2" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600">PowerShell</text>

  <g transform="translate(160,395)">
    <circle cx="0" cy="0" r="28" fill="#0078d4" opacity="0.95"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#5eb6ff" stroke-width="3" opacity="0.75"/>
    <rect x="-9" y="-11" width="18" height="22" rx="3" fill="#0a1628"/>
  </g>
  <text x="160" y="445" text-anchor="middle" fill="#9ecfff" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600">WSL2</text>

  <!-- converging paths -->
  <path d="M188,235 Q520,235 860,315" stroke="#0078d4" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M188,315 Q520,315 860,315" stroke="#00a86b" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M188,395 Q520,395 860,315" stroke="#0078d4" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.85"/>

  <!-- path midpoint markers -->
  <g transform="translate(420,235)">
    <circle cx="0" cy="0" r="8" fill="#5eb6ff"/>
  </g>
  <g transform="translate(420,315)">
    <circle cx="0" cy="0" r="8" fill="#4fffb0"/>
  </g>
  <g transform="translate(420,395)">
    <circle cx="0" cy="0" r="8" fill="#5eb6ff"/>
  </g>

  <!-- central Windows / OpenClaw convergence node -->
  <g transform="translate(960,315)">
    <circle cx="0" cy="0" r="70" fill="#0078d4" opacity="0.25" filter="url(#nodeGlow)"/>
    <circle cx="0" cy="0" r="50" fill="#0078d4" opacity="0.95"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#5eb6ff" stroke-width="4" opacity="0.8"/>
    <!-- stylized window + agent ring -->
    <rect x="-18" y="-18" width="36" height="36" rx="4" fill="#0a1628"/>
    <path d="M-10,-10 L-10,10 M10,-10 L10,10 M-18,-2 L18,-2" stroke="#5eb6ff" stroke-width="3" fill="none"/>
    <circle cx="0" cy="0" r="8" fill="#4fffb0"/>
  </g>

  <!-- floating particles -->
  <circle cx="760" cy="180" r="5" fill="#5eb6ff" opacity="0.6"/>
  <circle cx="800" cy="450" r="6" fill="#4fffb0" opacity="0.5"/>
  <circle cx="680" cy="480" r="4" fill="#5eb6ff" opacity="0.5"/>
  <circle cx="640" cy="150" r="5" fill="#4fffb0" opacity="0.4"/>
  <circle cx="1050" cy="200" r="4" fill="#5eb6ff" opacity="0.5"/>
  <circle cx="1080" cy="420" r="5" fill="#4fffb0" opacity="0.4"/>
</svg>