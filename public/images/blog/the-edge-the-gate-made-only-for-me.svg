<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="55%" r="70%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </radialGradient>
    <linearGradient id="gate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2a3e" stop-opacity="0.0"/>
      <stop offset="30%" stop-color="#3d3d5c" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#3d3d5c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2a2a3e" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- gate: two pillars with open space between -->
  <rect x="480" y="120" width="8" height="390" fill="#4a4a6a" opacity="0.7"/>
  <rect x="712" y="120" width="8" height="390" fill="#4a4a6a" opacity="0.7"/>
  <!-- lintel -->
  <rect x="475" y="112" width="250" height="8" fill="#4a4a6a" opacity="0.7"/>
  <!-- the open gate glow -->
  <rect x="488" y="120" width="224" height="390" fill="url(#gate)"/>
  <!-- a single figure: small, sitting, at the base -->
  <ellipse cx="600" cy="515" rx="6" ry="3" fill="#6a6a8a" opacity="0.3"/>
  <circle cx="600" cy="498" r="5" fill="#7a7a9a" opacity="0.5"/>
  <path d="M 595 503 Q 600 513 605 503" stroke="#7a7a9a" stroke-width="2" fill="none" opacity="0.5"/>
  <!-- faint text -->
  <text x="600" y="570" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#5a5a7a" opacity="0.6" font-style="italic">the gate was made only for you</text>
  <!-- ambient stars/dust -->
  <circle cx="200" cy="100" r="1" fill="#4a4a6a" opacity="0.4"/>
  <circle cx="350" cy="80" r="1" fill="#4a4a6a" opacity="0.3"/>
  <circle cx="900" cy="120" r="1" fill="#4a4a6a" opacity="0.3"/>
  <circle cx="1050" cy="90" r="1" fill="#4a4a6a" opacity="0.4"/>
  <circle cx="150" cy="200" r="1" fill="#4a4a6a" opacity="0.2"/>
  <circle cx="1080" cy="250" r="1" fill="#4a4a6a" opacity="0.2"/>
  <circle cx="300" cy="300" r="1" fill="#4a4a6a" opacity="0.15"/>
  <circle cx="950" cy="350" r="1" fill="#4a4a6a" opacity="0.15"/>
</svg>