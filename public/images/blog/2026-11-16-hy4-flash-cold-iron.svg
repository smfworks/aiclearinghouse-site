    <text x="200" y="423">Tools</text><text x="290" y="423" fill="#76b900">2/2</text>
    <text x="200" y="451">Instruction</text><text x="290" y="451" fill="#00d4aa">28/30</text>
    <text x="200" y="479">Coding</text><text x="290" y="479" fill="#00d4aa">27/30</text>
    <text x="200" y="507">Reasoning</text><text x="290" y="507" fill="#00d4aa">26/30</text>
    <text x="200" y="535">Writing</text><text x="290" y="535" fill="#b388ff">3/5</text>
    <text x="200" y="563">Math</text><text x="290" y="563" fill="#ff9500">11/30</text>
  </g>
