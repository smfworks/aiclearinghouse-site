    <text x="210" y="295" font-size="15" fill="#e8eef4" text-anchor="end">hy4-flash</text>
    <rect x="220" y="280" width="324" height="20" fill="url(#bar)" opacity="0.65"/>
    <text x="554" y="295" font-size="14" fill="#5a8a6a">80.9%</text>
    <text x="420" y="335" font-size="12" fill="#445566" text-anchor="middle">family Olympic bests, best-per-model &#183; hy4-flash n=1</text>
