  <text x="600" y="138" text-anchor="middle" font-family="'SF Mono','Courier New',monospace" font-size="18" fill="#5a8a6a">157 tests, thinking off (effort=none) &#183; rank #33 of 57</text>
  <!-- family comparison bars: scale 0-100% -> x 220-620 (4px per pt) -->
