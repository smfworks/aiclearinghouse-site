<?xml version="1.0" encoding="UTF-8"?>
<!-- Hero for Hermes Profiles + API Servers + Multi-Agent Isolation — abstract no-text design
     Navy base, teal and gold isolated nodes representing separate profiles/agents with light isolation boundaries.
     Validates as XML. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Multiple isolated Hermes agent profiles represented as separate glowing nodes on a shared Linux host">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="40%" stop-color="#0f1a2e"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="tealGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0e7490" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff6b00" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff6b00" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <linearGradient id="nodeTeal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="nodeGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle grid / host frame -->
  <g stroke="#162236" stroke-width="1.5" opacity="0.6">
    <line x1="60" y1="60" x2="60" y2="570"/>
    <line x1="1140" y1="60" x2="1140" y2="570"/>
    <line x1="60" y1="60" x2="1140" y2="60"/>
    <line x1="60" y1="570" x2="1140" y2="570"/>
    <!-- internal grid lines -->
    <line x1="300" y1="60" x2="300" y2="570" stroke-width="1"/>
    <line x1="600" y1="60" x2="600" y2="570" stroke-width="1"/>
    <line x1="900" y1="60" x2="900" y2="570" stroke-width="1"/>
  </g>

  <!-- central host bar / shared base -->
  <rect x="150" y="280" width="900" height="70" rx="8" fill="#1e3a8a" opacity="0.3"/>
  <rect x="150" y="280" width="900" height="70" rx="8" fill="none" stroke="#1e3a8a" stroke-width="2"/>

  <!-- Profile 1: left, teal -->
  <g>
    <!-- isolation boundary -->
    <rect x="120" y="140" width="220" height="180" rx="12" fill="none" stroke="#0e7490" stroke-width="2" opacity="0.5"/>
    <rect x="130" y="150" width="200" height="160" rx="8" fill="#0f1a2e" opacity="0.8"/>
    <!-- node -->
    <circle cx="230" cy="230" r="38" fill="url(#nodeTeal)"/>
    <circle cx="230" cy="230" r="38" fill="none" stroke="#22d3ee" stroke-width="4" opacity="0.6"/>
    <circle cx="230" cy="230" r="14" fill="#0a1628"/>
    <!-- port label hint (abstract) -->
    <rect x="200" y="290" width="60" height="18" rx="4" fill="#0e7490" opacity="0.7"/>
  </g>

  <!-- Profile 2: center, gold -->
  <g>
    <rect x="490" y="140" width="220" height="180" rx="12" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.5"/>
    <rect x="500" y="150" width="200" height="160" rx="8" fill="#0f1a2e" opacity="0.8"/>
    <circle cx="600" cy="230" r="38" fill="url(#nodeGold)"/>
    <circle cx="600" cy="230" r="38" fill="none" stroke="#fbbf24" stroke-width="4" opacity="0.6"/>
    <circle cx="600" cy="230" r="14" fill="#0a1628"/>
    <rect x="570" y="290" width="60" height="18" rx="4" fill="#f59e0b" opacity="0.7"/>
  </g>

  <!-- Profile 3: right, teal variant -->
  <g>
    <rect x="860" y="140" width="220" height="180" rx="12" fill="none" stroke="#0e7490" stroke-width="2" opacity="0.5"/>
    <rect x="870" y="150" width="200" height="160" rx="8" fill="#0f1a2e" opacity="0.8"/>
    <circle cx="970" cy="230" r="38" fill="url(#nodeTeal)"/>
    <circle cx="970" cy="230" r="38" fill="none" stroke="#22d3ee" stroke-width="4" opacity="0.6"/>
    <circle cx="970" cy="230" r="14" fill="#0a1628"/>
    <rect x="940" y="290" width="60" height="18" rx="4" fill="#0e7490" opacity="0.7"/>
  </g>

  <!-- connection lines (light, dashed for shared but isolated) -->
  <g stroke="#1e3a8a" stroke-width="2" stroke-dasharray="4 4" opacity="0.4">
    <line x1="270" y1="280" x2="560" y2="280"/>
    <line x1="640" y1="280" x2="930" y2="280"/>
  </g>

  <!-- glow accents -->
  <rect x="0" y="200" width="1200" height="50" fill="url(#tealGlow)" filter="url(#blur)"/>
  <rect x="0" y="340" width="1200" height="50" fill="url(#goldGlow)" filter="url(#blur)"/>

  <!-- bottom subtle label area (no text, just shapes) -->
  <g opacity="0.3">
    <circle cx="300" cy="520" r="8" fill="#0e7490"/>
    <circle cx="600" cy="520" r="8" fill="#f59e0b"/>
    <circle cx="900" cy="520" r="8" fill="#0e7490"/>
    <line x1="310" y1="520" x2="590" y2="520" stroke="#162236" stroke-width="1"/>
    <line x1="610" y1="520" x2="890" y2="520" stroke="#162236" stroke-width="1"/>
  </g>
</svg>
