  <text x="120" y="220" fill="#8b949e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="32">Same brief · three models · one blind rubric</text>
  <!-- bars representing scores 19 / 24 / 14 out of 25 -->
  <text x="120" y="360" fill="#c9d1d9" font-family="ui-monospace, monospace" font-size="28">RED</text>
  <rect x="280" y="330" width="1064" height="48" rx="12" fill="url(#barR)" opacity="0.9"/>
