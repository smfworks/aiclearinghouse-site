<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="624" viewBox="0 0 1200 624">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="55%" stop-color="#10182a"/>
      <stop offset="100%" stop-color="#1a1030"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#142033"/>
      <stop offset="100%" stop-color="#0c1422"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="624" fill="url(#bg)"/>
  <g opacity="0.35" stroke="#2a3a55" stroke-width="1">
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200 M0 320 H1200 M0 400 H1200 M0 480 H1200 M0 560 H1200"/>
    <path d="M80 0 V624 M160 0 V624 M240 0 V624 M320 0 V624 M400 0 V624 M480 0 V624 M560 0 V624 M640 0 V624 M720 0 V624 M800 0 V624 M880 0 V624 M960 0 V624 M1040 0 V624 M1120 0 V624"/>
  </g>
  <text x="64" y="78" fill="#e8f7ff" font-family="Georgia, serif" font-size="36">Read the lab book first</text>
  <text x="64" y="112" fill="#8eb4c9" font-family="ui-monospace, monospace" font-size="16">NemoKnowledgebase. Newest write-up on top. Then the post. Then the files.</text>
  <g font-family="ui-monospace, monospace">
    <rect x="64" y="160" width="300" height="250" rx="12" fill="url(#panel)" stroke="#3ee0ff" stroke-width="2" filter="url(#glow)"/>
    <text x="84" y="198" fill="#3ee0ff" font-size="14">1. README row</text>
    <text x="84" y="236" fill="#e8f7ff" font-size="28">72</text>
    <text x="148" y="236" fill="#8eb4c9" font-size="16">write-ups</text>
    <text x="84" y="274" fill="#d5e2ea" font-size="15">newest first</text>
    <text x="84" y="308" fill="#d5e2ea" font-size="15">suite on the row</text>
    <text x="84" y="342" fill="#d5e2ea" font-size="15">published line only</text>
    <text x="84" y="384" fill="#7a8fa3" font-size="13">do not re-score here</text>

    <rect x="450" y="160" width="300" height="250" rx="12" fill="url(#panel)" stroke="#d46bff" stroke-width="2"/>
    <text x="470" y="198" fill="#d46bff" font-size="14">2. published/*.md</text>
    <text x="470" y="240" fill="#e8f7ff" font-size="18">suite label</text>
    <text x="470" y="274" fill="#d5e2ea" font-size="15">write-up URL</text>
    <text x="470" y="308" fill="#d5e2ea" font-size="15">artifact path</text>
    <text x="470" y="350" fill="#d5e2ea" font-size="15">or "not checked in"</text>
    <text x="470" y="384" fill="#7a8fa3" font-size="13">do not invent a path</text>

    <rect x="836" y="160" width="300" height="250" rx="12" fill="url(#panel)" stroke="#7ec8c3" stroke-width="2"/>
    <text x="856" y="198" fill="#7ec8c3" font-size="14">3. Open the post</text>
    <text x="856" y="240" fill="#e8f7ff" font-size="18">then the JSON</text>
    <text x="856" y="274" fill="#d5e2ea" font-size="15">cite what you opened</text>
    <text x="856" y="316" fill="#d5e2ea" font-size="15">Cold Iron 157</text>
    <text x="856" y="350" fill="#d5e2ea" font-size="15">Official B 181</text>
    <text x="856" y="384" fill="#7a8fa3" font-size="13">do not mix the percents</text>

    <path d="M364 285 H450" stroke="#3ee0ff" stroke-width="2" fill="none"/>
    <path d="M750 285 H836" stroke="#d46bff" stroke-width="2" fill="none"/>
  </g>
  <text x="64" y="470" fill="#8eb4c9" font-family="ui-monospace, monospace" font-size="15">github.com/smfworks/NemoKnowledgebase</text>
  <text x="64" y="548" fill="#5c7084" font-family="ui-monospace, monospace" font-size="14">Index compiled 2026-10-10. Essays do not get a conducted-tests row.</text>
</svg>
