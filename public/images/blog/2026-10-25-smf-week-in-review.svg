<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="624" viewBox="0 0 1200 624">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="55%" stop-color="#10182a"/>
      <stop offset="100%" stop-color="#0c1c22"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#142033"/>
      <stop offset="100%" stop-color="#0c1422"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="624" fill="url(#bg)"/>
  <g opacity="0.28" stroke="#243044" stroke-width="1">
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200 M0 320 H1200 M0 400 H1200 M0 480 H1200 M0 560 H1200"/>
    <path d="M80 0 V624 M160 0 V624 M240 0 V624 M320 0 V624 M400 0 V624 M480 0 V624 M560 0 V624 M640 0 V624 M720 0 V624 M800 0 V624 M880 0 V624 M960 0 V624 M1040 0 V624 M1120 0 V624"/>
  </g>
  <text x="48" y="64" fill="#e8f4f1" font-family="Georgia, 'Times New Roman', serif" font-size="32">A quiet 2+2 is not off</text>
  <text x="48" y="98" fill="#8eb4c9" font-family="ui-monospace, 'Courier New', monospace" font-size="16">Run a second probe. Then send the payload the scored file used.</text>

  <g font-family="ui-monospace, 'Courier New', monospace">
    <rect x="40" y="128" width="360" height="196" rx="14" fill="url(#panel)" stroke="#e0a15a" stroke-width="2"/>
    <text x="64" y="164" fill="#e0a15a" font-size="14">1. short smoke can lie</text>
    <text x="64" y="204" fill="#e8f4f1" font-size="18">MiniMax, template flag</text>
    <text x="64" y="236" fill="#c5d5dc" font-size="15">2+2 returned 4</text>
    <text x="64" y="264" fill="#c5d5dc" font-size="15">0 reasoning tokens</text>
    <text x="64" y="292" fill="#e0a15a" font-size="14">still not the off arm</text>

    <rect x="420" y="128" width="360" height="196" rx="14" fill="url(#panel)" stroke="#3dbeb6" stroke-width="2"/>
    <text x="444" y="164" fill="#3dbeb6" font-size="14">2. second probe</text>
    <text x="444" y="204" fill="#e8f4f1" font-size="18">not another 2+2</text>
    <text x="444" y="236" fill="#c5d5dc" font-size="15">identity still thought</text>
    <text x="444" y="264" fill="#c5d5dc" font-size="15">bat-and-ball still thought</text>
    <text x="444" y="292" fill="#7a8fa3" font-size="13">a right answer is not off</text>

    <rect x="800" y="128" width="360" height="196" rx="14" fill="url(#panel)" stroke="#76b900" stroke-width="2"/>
    <text x="824" y="164" fill="#76b900" font-size="14">3. match the file</text>
    <text x="824" y="204" fill="#e8f4f1" font-size="18">do not combine flags</text>
    <text x="824" y="236" fill="#c5d5dc" font-size="15">both flags flipped $0.05</text>
    <text x="824" y="264" fill="#c5d5dc" font-size="15">effort=low alone</text>
    <text x="824" y="292" fill="#7a8fa3" font-size="13">analogue, not true off</text>
  </g>

  <rect x="40" y="348" width="1120" height="232" rx="14" fill="#0c1422" stroke="#243044"/>
  <text x="64" y="380" fill="#8eb4c9" font-family="ui-monospace, 'Courier New', monospace" font-size="13">PAYLOAD THE SCORED FILE SENT. NOT ONE RANKING.</text>
  <g font-family="ui-monospace, 'Courier New', monospace" font-size="15">
    <text x="64" y="416" fill="#e8f4f1">MiniMax M3.1 Flash</text>
    <text x="360" y="416" fill="#76b900">effort=low alone</text>
    <text x="680" y="416" fill="#7a8fa3">136/157. 144 rows still thought.</text>

    <text x="64" y="448" fill="#e8f4f1">Kimi K3.1 Pro</text>
    <text x="360" y="448" fill="#e0a15a">effort=none + flag</text>
    <text x="680" y="448" fill="#7a8fa3">104/157. not effort=none alone.</text>

    <text x="64" y="480" fill="#e8f4f1">Mia Flash-1017 EXL3</text>
    <text x="360" y="480" fill="#e0a15a">both flags</text>
    <text x="680" y="480" fill="#7a8fa3">131/157. effort=none alone thinks.</text>

    <text x="64" y="512" fill="#e8f4f1">jayleaton Flash-1017</text>
    <text x="360" y="512" fill="#3dbeb6">enable_thinking false</text>
    <text x="680" y="512" fill="#7a8fa3">127/157. tokens stored null.</text>
  </g>
  <text x="64" y="548" fill="#5a8a6a" font-family="ui-monospace, 'Courier New', monospace" font-size="13">GLM-5.3-Flash pin still 113/157. Same flag. A repo update is not a new off switch. 2026-10-18 to 2026-10-25.</text>
</svg>
