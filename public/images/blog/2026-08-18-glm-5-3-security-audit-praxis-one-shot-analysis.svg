<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <rect width="1920" height="1080" fill="#001F3F"/>
  
  <!-- Shield motif (center) -->
  <g opacity="0.15" transform="translate(960, 540)">
    <path d="M 0,-120 L 100,-80 L 100,40 Q 100,100 0,140 Q -100,100 -100,40 L -100,-80 Z" fill="none" stroke="#ea580c" stroke-width="3" opacity="0.5"/>
    <path d="M 0,-90 L 75,-60 L 75,30 Q 75,75 0,105 Q -75,75 -75,30 L -75,-60 Z" fill="none" stroke="#00D4FF" stroke-width="2" opacity="0.3"/>
  </g>
  
  <!-- Severity bars (left side) -->
  <g opacity="0.6">
    <rect x="200" y="300" width="180" height="12" rx="6" fill="#cc0000" opacity="0.7"/>
    <rect x="200" y="324" width="140" height="12" rx="6" fill="#ea580c" opacity="0.6"/>
    <rect x="200" y="348" width="200" height="12" rx="6" fill="#f59e0b" opacity="0.5"/>
    <rect x="200" y="372" width="120" height="12" rx="6" fill="#00D4FF" opacity="0.4"/>
    <rect x="200" y="396" width="80" height="12" rx="6" fill="#666" opacity="0.3"/>
  </g>
  
  <!-- Heatmap grid (right side) -->
  <g opacity="0.4" transform="translate(1300, 300)">
    <rect x="0" y="0" width="60" height="60" fill="#cc0000" opacity="0.3"/>
    <rect x="65" y="0" width="60" height="60" fill="#ea580c" opacity="0.2"/>
    <rect x="130" y="0" width="60" height="60" fill="#f59e0b" opacity="0.15"/>
    <rect x="195" y="0" width="60" height="60" fill="#001F3F" opacity="0.1"/>
    
    <rect x="0" y="65" width="60" height="60" fill="#ea580c" opacity="0.25"/>
    <rect x="65" y="65" width="60" height="60" fill="#f59e0b" opacity="0.2"/>
    <rect x="130" y="65" width="60" height="60" fill="#00D4FF" opacity="0.15"/>
    <rect x="195" y="65" width="60" height="60" fill="#666" opacity="0.1"/>
    
    <rect x="0" y="130" width="60" height="60" fill="#f59e0b" opacity="0.2"/>
    <rect x="65" y="130" width="60" height="60" fill="#00D4FF" opacity="0.15"/>
    <rect x="130" y="130" width="60" height="60" fill="#001F3F" opacity="0.08"/>
    <rect x="195" y="130" width="60" height="60" fill="#001F3F" opacity="0.05"/>
    
    <rect x="0" y="195" width="60" height="60" fill="#00D4FF" opacity="0.1"/>
    <rect x="65" y="195" width="60" height="60" fill="#001F3F" opacity="0.05"/>
    <rect x="130" y="195" width="60" height="60" fill="#001F3F" opacity="0.03"/>
    <rect x="195" y="195" width="60" height="60" fill="#001F3F" opacity="0.02"/>
  </g>
  
  <!-- Risk score indicator (bottom) -->
  <g opacity="0.3" transform="translate(960, 880)">
    <line x1="-200" y1="0" x2="200" y2="0" stroke="#666" stroke-width="1" opacity="0.3"/>
    <circle cx="72" cy="0" r="8" fill="#ea580c" opacity="0.6"/>
    <text x="72" y="-15" text-anchor="middle" fill="#ea580c" font-family="monospace" font-size="14" opacity="0.5">72</text>
  </g>
  
  <!-- Code diff accent (top right) -->
  <g opacity="0.2" transform="translate(1600, 200)">
    <rect x="0" y="0" width="200" height="3" fill="#cc0000"/>
    <rect x="0" y="8" width="160" height="3" fill="#cc0000"/>
    <rect x="0" y="20" width="180" height="3" fill="#00D4FF" opacity="0.6"/>
    <rect x="0" y="28" width="120" height="3" fill="#00D4FF" opacity="0.6"/>
  </g>
  
  <!-- Starfield dots -->
  <g opacity="0.2">
    <circle cx="100" cy="100" r="1" fill="#00D4FF"/>
    <circle cx="1800" cy="120" r="1" fill="#C9A96E"/>
    <circle cx="200" cy="950" r="1" fill="#ea580c"/>
    <circle cx="1700" cy="950" r="1" fill="#00D4FF"/>
  </g>
</svg>