<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>New Omarchy plugins by month</title>
<style>
  :root { --fg: var(--foreground, #e8f6ff); --muted: var(--muted-foreground, #8fa3c0); --accent: var(--accent, #39e1ff); --border: var(--border, #22314f); }
  html,body { margin:0; padding:0; background:transparent; color:var(--fg); font-family:inherit; }
  .wrap { padding:12px 8px; }
  h3 { margin:0 0 4px; font-size:15px; font-weight:600; }
  p.sub { margin:0 0 12px; font-size:12.5px; color:var(--muted); }
  .chartbox { position:relative; height:320px; }
  .foot { margin-top:10px; font-size:11.5px; color:var(--muted); }
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="wrap">
  <h3>New plugins listed on the Omarchy marketplace, by month</h3>
  <p class="sub">Plugins added to the community registry (sources in registry.json). November is a partial month (through Nov 19).</p>
  <div class="chartbox"><canvas id="c"></canvas></div>
  <p class="foot">Source: omacom/omarchy-plugin-marketplace registry.json, fetched Nov 19, 2026. 6,762 plugins total.</p>
</div>
<script>
const ctx = document.getElementById('c');
new Chart(ctx, {
  type: 'bar',
  data: {
    labels: ['Jul 2026', 'Aug 2026', 'Sep 2026', 'Oct 2026', 'Nov 1–19'],
    datasets: [{
      label: 'New plugins',
      data: [16, 1944, 2476, 1697, 629],
      backgroundColor: 'rgba(57, 225, 255, 0.55)',
      borderColor: 'rgba(57, 225, 255, 0.95)',
      borderWidth: 1.5,
      borderRadius: 6
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: { callbacks: { label: c => c.parsed.y.toLocaleString() + ' plugins' } }
    },
    scales: {
      x: { grid: { color: 'rgba(34,49,79,0.4)' }, ticks: { color: '#8fa3c0' } },
      y: { grid: { color: 'rgba(34,49,79,0.4)' }, ticks: { color: '#8fa3c0', callback: v => v >= 1000 ? (v/1000) + 'k' : v } }
    }
  }
});
</script>
</body>
</html>
