<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="624" viewBox="0 0 1200 624">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#06141e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="linear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#00a88a"/>
    </linearGradient>
    <linearGradient id="full" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#76b900"/>
      <stop offset="100%" stop-color="#5a8a00"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="624" fill="url(#bg)"/>

  <!-- grid -->
  <g stroke="#1a2a3a" stroke-opacity="0.3" stroke-width="1">
    <line x1="0" y1="156" x2="1200" y2="156"/>
    <line x1="0" y1="312" x2="1200" y2="312"/>
    <line x1="0" y1="468" x2="1200" y2="468"/>
    <line x1="300" y1="0" x2="300" y2="624"/>
    <line x1="600" y1="0" x2="600" y2="624"/>
    <line x1="900" y1="0" x2="900" y2="624"/>
  </g>

  <!-- title -->
  <text x="60" y="80" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="44" font-weight="700" fill="#e8eef4">Qwen3.8-27B on DGX Spark</text>
  <text x="60" y="122" font-family="'SF Mono','Courier New',monospace" font-size="20" fill="#5a8a6a">Hybrid Gated DeltaNet VLM · FP8 · SGLang · 262K context</text>

