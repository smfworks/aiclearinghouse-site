<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" width="1200" height="624">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#06141e"/>
    </linearGradient>
    <linearGradient id="grokBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#76b900"/>
      <stop offset="100%" stop-color="#5a8e00"/>
    </linearGradient>
    <linearGradient id="kimiBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#00a08a"/>
    </linearGradient>
    <linearGradient id="qwenBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a9eff"/>
      <stop offset="100%" stop-color="#3a7acc"/>
    </linearGradient>
    <linearGradient id="dsBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a5cff"/>
      <stop offset="100%" stop-color="#5a3acc"/>
    </linearGradient>
    <linearGradient id="otherBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a5060"/>
      <stop offset="100%" stop-color="#2a3a4a"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2a3a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0a1a2a" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="624" fill="url(#bgGrad)"/>

  <!-- Subtle grid -->
  <g opacity="0.15">
    <line x1="0" y1="156" x2="1200" y2="156" stroke="#1a2a3a" stroke-width="1"/>
    <line x1="0" y1="312" x2="1200" y2="312" stroke="#1a2a3a" stroke-width="1"/>
    <line x1="0" y1="468" x2="1200" y2="468" stroke="#1a2a3a" stroke-width="1"/>
  </g>

  <!-- Title -->
  <text x="40" y="42" fill="#e8eef4" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="bold">Eight Cloud Models, One Winner</text>
  <text x="40" y="64" fill="#5a8a6a" font-family="'SF Mono','Courier New',monospace" font-size="13">SMF-Bench Official A · 157 tests · strict_v01 · thinking off · Aug 10-11 2026</text>

  <!-- Leaderboard bars (left side) -->
  <g font-family="'SF Mono','Courier New',monospace" font-size="11">

    <!-- Grok 4.5 - 96.8% -->
    <text x="40" y="100" fill="#e8eef4" font-size="12" font-weight="bold">Grok 4.5</text>
    <rect x="40" y="106" width="700" height="22" rx="3" fill="#1a2a3a"/>
    <rect x="40" y="106" width="678" height="22" rx="3" fill="url(#grokBar)" filter="url(#softGlow)"/>
    <text x="725" y="122" fill="#76b900" font-size="13" font-weight="bold">96.8%</text>
    <text x="810" y="122" fill="#666" font-size="10">152/157</text>

    <!-- Kimi K3 - 89.2% -->
    <text x="40" y="140" fill="#e8eef4" font-size="12">Kimi K3</text>
    <rect x="40" y="146" width="700" height="22" rx="3" fill="#1a2a3a"/>
    <rect x="40" y="146" width="624" height="22" rx="3" fill="url(#kimiBar)"/>
    <text x="671" y="162" fill="#00d4aa" font-size="13" font-weight="bold">89.2%</text>
    <text x="730" y="162" fill="#666" font-size="10">140/157 · 1T params</text>

    <!-- Qwen 3.5 397B - 87.9% -->
    <text x="40" y="180" fill="#e8eef4" font-size="12">Qwen 3.5 397B</text>
    <rect x="40" y="186" width="700" height="22" rx="3" fill="#1a2a3a"/>
    <rect x="40" y="186" width="615" height="22" rx="3" fill="url(#qwenBar)"/>
    <text x="662" y="202" fill="#4a9eff" font-size="13" font-weight="bold">87.9%</text>
    <text x="720" y="202" fill="#666" font-size="10">138/157</text>

    <!-- DeepSeek V4 Pro - 81.5% -->
    <text x="40" y="220" fill="#e8eef4" font-size="12">DeepSeek V4 Pro</text>
    <rect x="40" y="226" width="700" height="22" rx="3" fill="#1a2a3a"/>
    <rect x="40" y="226" width="571" height="22" rx="3" fill="url(#dsBar)"/>
    <text x="618" y="242" fill="#7a5cff" font-size="13" font-weight="bold">81.5%</text>
    <text x="675" y="242" fill="#666" font-size="10">128/157</text>

    <!-- Qwen3.8-Max - 79.6% -->
    <text x="40" y="260" fill="#999" font-size="12">Qwen3.8-Max</text>
    <rect x="40" y="266" width="700" height="22" rx="3" fill="#1a2a3a"/>
    <rect x="40" y="266" width="557" height="22" rx="3" fill="url(#otherBar)"/>
    <text x="604" y="282" fill="#888" font-size="13">79.6%</text>
    <text x="655" y="282" fill="#555" font-size="10">125/157</text>

    <!-- GLM-5.2 - 77.1% -->
    <text x="40" y="300" fill="#999" font-size="12">GLM-5.2</text>
    <rect x="40" y="306" width="700" height="22" rx="3" fill="#1a2a3a"/>
    <rect x="40" y="306" width="540" height="22" rx="3" fill="url(#otherBar)"/>
    <text x="587" y="322" fill="#888" font-size="13">77.1%</text>
    <text x="638" y="322" fill="#555" font-size="10">121/157</text>

    <!-- Mistral Large 3 - 66.2% -->
    <text x="40" y="340" fill="#777" font-size="12">Mistral Large 3</text>
    <rect x="40" y="346" width="700" height="22" rx="3" fill="#1a2a3a"/>
    <rect x="40" y="346" width="463" height="22" rx="3" fill="url(#otherBar)"/>
    <text x="510" y="362" fill="#777" font-size="13">66.2%</text>
    <text x="560" y="362" fill="#555" font-size="10">104/157</text>

    <!-- Nemotron 3 Ultra - 65.6% -->
    <text x="40" y="380" fill="#777" font-size="12">Nemotron 3 Ultra</text>
    <rect x="40" y="386" width="700" height="22" rx="3" fill="#1a2a3a"/>
    <rect x="40" y="386" width="459" height="22" rx="3" fill="url(#otherBar)"/>
    <text x="506" y="402" fill="#777" font-size="13">65.6%</text>
    <text x="555" y="402" fill="#555" font-size="10">103/157</text>
  </g>

  <!-- Divider line -->
  <line x1="800" y1="90" x2="800" y2="560" stroke="#1a2a3a" stroke-width="1"/>

  <!-- Right side: Hybrid Architecture -->
  <text x="820" y="100" fill="#e8eef4" font-family="'SF Pro Display',Arial,sans-serif" font-size="16" font-weight="bold">Hybrid Architecture</text>
  <text x="820" y="120" fill="#5a8a6a" font-family="'SF Mono',monospace" font-size="11">Cloud primary + Local fallback</text>

  <!-- Cloud node -->
  <rect x="830" y="140" width="320" height="70" rx="8" fill="#0a1a2a" stroke="#76b900" stroke-width="1.5" opacity="0.9"/>
  <text x="850" y="162" fill="#76b900" font-family="'SF Mono',monospace" font-size="13" font-weight="bold">☁ Cloud Primary</text>
  <text x="850" y="180" fill="#e8eef4" font-family="'SF Mono',monospace" font-size="11">Grok 4.5 · 96.8%</text>
  <text x="850" y="196" fill="#888" font-family="'SF Mono',monospace" font-size="10">OpenRouter API · 42.6s mean</text>

  <!-- Arrow down -->
  <path d="M 990 215 L 990 245" stroke="#00d4aa" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  <text x="1000" y="235" fill="#5a8a6a" font-family="'SF Mono',monospace" font-size="9">fallback</text>

  <!-- DGX Spark node 1 -->
  <rect x="830" y="255" width="150" height="80" rx="8" fill="url(#sparkGrad)" stroke="#00d4aa" stroke-width="1.5"/>
  <text x="850" y="277" fill="#00d4aa" font-family="'SF Mono',monospace" font-size="11" font-weight="bold">DGX Spark 1</text>
  <text x="850" y="293" fill="#aaa" font-family="'SF Mono',monospace" font-size="9">GB10 · 128GB UMA</text>
  <text x="850" y="307" fill="#e8eef4" font-family="'SF Mono',monospace" font-size="10">Laguna S 2.1</text>
  <text x="850" y="320" fill="#888" font-family="'SF Mono',monospace" font-size="9">NVFP4 · vLLM</text>

  <!-- DGX Spark node 2 -->
  <rect x="1000" y="255" width="150" height="80" rx="8" fill="url(#sparkGrad)" stroke="#00d4aa" stroke-width="1.5"/>
  <text x="1020" y="277" fill="#00d4aa" font-family="'SF Mono',monospace" font-size="11" font-weight="bold">DGX Spark 2</text>
  <text x="1020" y="293" fill="#aaa" font-family="'SF Mono',monospace" font-size="9">GB10 · 128GB UMA</text>
  <text x="1020" y="307" fill="#e8eef4" font-family="'SF Mono',monospace" font-size="10">Qwen3.6-35B</text>
  <text x="1020" y="320" fill="#888" font-family="'SF Mono',monospace" font-size="9">NVFP4 · vLLM</text>

  <!-- Connection line between sparks -->
  <line x1="980" y1="295" x2="1000" y2="295" stroke="#00d4aa" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- Agent layer -->
  <rect x="830" y="355" width="320" height="50" rx="8" fill="#0a1a2a" stroke="#4a9eff" stroke-width="1" opacity="0.8"/>
  <text x="850" y="377" fill="#4a9eff" font-family="'SF Mono',monospace" font-size="11" font-weight="bold">Agent Orchestration</text>
  <text x="850" y="393" fill="#888" font-family="'SF Mono',monospace" font-size="10">Hermes · OpenClaw · Routing + failover</text>

  <!-- Arrows from sparks to agent layer -->
  <path d="M 905 340 L 905 355" stroke="#00d4aa" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M 1075 340 L 1075 355" stroke="#00d4aa" stroke-width="1" fill="none" opacity="0.6"/>
  <!-- Arrow from cloud to agent -->
  <path d="M 990 215 L 990 215" stroke="none" fill="none"/>

  <!-- Stats bar at bottom -->
  <rect x="0" y="440" width="1200" height="80" fill="#06141e" opacity="0.6"/>
  <g font-family="'SF Mono','Courier New',monospace">
    <text x="40" y="465" fill="#666" font-size="9">MODELS TESTED</text>
    <text x="40" y="485" fill="#e8eef4" font-size="24" font-weight="bold">8</text>
    <text x="40" y="505" fill="#5a8a6a" font-size="9">cloud + local</text>

    <text x="200" y="465" fill="#666" font-size="9">TESTS PER MODEL</text>
    <text x="200" y="485" fill="#e8eef4" font-size="24" font-weight="bold">157</text>
    <text x="200" y="505" fill="#5a8a6a" font-size="9">7 suites</text>

    <text x="380" y="465" fill="#666" font-size="9">GROK CODING</text>
    <text x="380" y="485" fill="#76b900" font-size="24" font-weight="bold">100%</text>
    <text x="380" y="505" fill="#5a8a6a" font-size="9">0 syntax errors</text>

    <text x="560" y="465" fill="#666" font-size="9">FRONTIER TIER</text>
    <text x="560" y="485" fill="#76b900" font-size="24" font-weight="bold">100%</text>
    <text x="560" y="505" fill="#5a8a6a" font-size="9">Grok only</text>

    <text x="740" y="465" fill="#666" font-size="9">KIMI K3 DEBUT</text>
    <text x="740" y="485" fill="#00d4aa" font-size="24" font-weight="bold">89.2%</text>
    <text x="740" y="505" fill="#5a8a6a" font-size="9">#2 overall</text>

    <text x="920" y="465" fill="#666" font-size="9">HYBRID CONFIG</text>
    <text x="920" y="485" fill="#4a9eff" font-size="24" font-weight="bold">2×Spark</text>
    <text x="920" y="505" fill="#5a8a6a" font-size="9">local fallback</text>
  </g>

  <!-- Bottom label -->
  <text x="40" y="555" fill="#333" font-family="'SF Mono',monospace" font-size="10">SMF Works · smf-bench v0.1.1 · Official A strict_v01</text>
  <text x="960" y="555" fill="#333" font-family="'SF Mono',monospace" font-size="10" text-anchor="end">smfclearinghouse.com</text>
</svg>