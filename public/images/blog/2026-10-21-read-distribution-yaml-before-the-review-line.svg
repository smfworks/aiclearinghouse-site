<?xml version="1.0" encoding="UTF-8"?>
<!-- Hero: the review bar always finishes. The loader bar stops when a small file sits in the gap. No visible text. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A review bar that always finishes, and a loader bar that stops when a small file sits in the gap.">
  <defs>
    <linearGradient id="revBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070d14"/>
      <stop offset="55%" stop-color="#101820"/>
      <stop offset="100%" stop-color="#14110c"/>
    </linearGradient>
    <radialGradient id="revTeal" cx="18%" cy="18%" r="34%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="revGold" cx="86%" cy="78%" r="28%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff6b00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#revBg)"/>
  <rect width="1200" height="630" fill="url(#revTeal)"/>
  <rect width="1200" height="630" fill="url(#revGold)"/>
  <rect x="56" y="48" width="1088" height="534" rx="14" fill="none" stroke="#162236" stroke-width="2"/>

  <!-- Review line. It always reaches the right edge. -->
  <rect x="120" y="168" width="960" height="22" rx="2" fill="#f59e0b" opacity="0.88"/>
  <rect x="120" y="168" width="36" height="22" fill="#ff6b00"/>

  <!-- Loader. It stops. A small file occupies the gap. -->
  <rect x="120" y="292" width="620" height="22" rx="2" fill="#00d4ff" opacity="0.75"/>
  <rect x="120" y="292" width="28" height="22" fill="#0e7490"/>
  <rect x="780" y="268" width="88" height="70" rx="6" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <rect x="796" y="286" width="56" height="8" rx="2" fill="#f59e0b" opacity="0.55"/>
  <rect x="796" y="304" width="40" height="8" rx="2" fill="#00d4ff" opacity="0.35"/>

  <!-- The page's ellipsis bar. It does not meet either line above. -->
  <rect x="120" y="448" width="420" height="10" rx="2" fill="#f59e0b" opacity="0.22"/>
  <rect x="560" y="444" width="14" height="18" rx="2" fill="#ff6b00" opacity="0.35"/>
  <rect x="592" y="448" width="180" height="10" rx="2" fill="#00d4ff" opacity="0.18"/>
</svg>
