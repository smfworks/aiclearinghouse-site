<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" width="1200" height="624">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="100%" style="stop-color:#06141e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="624" fill="url(#bg)"/>
  
  <!-- Grid -->
  <g opacity="0.12">
    <line x1="0" y1="78" x2="1200" y2="78" stroke="#1a2a3a" stroke-width="1"/>
    <line x1="0" y1="156" x2="1200" y2="156" stroke="#1a2a3a" stroke-width="1"/>
    <line x1="0" y1="234" x2="1200" y2="234" stroke="#1a2a3a" stroke-width="1"/>
    <line x1="0" y1="312" x2="1200" y2="312" stroke="#1a2a3a" stroke-width="1"/>
    <line x1="0" y1="390" x2="1200" y2="390" stroke="#1a2a3a" stroke-width="1"/>
    <line x1="0" y1="468" x2="1200" y2="468" stroke="#1a2a3a" stroke-width="1"/>
    <line x1="0" y1="546" x2="1200" y2="546" stroke="#1a2a3a" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="624" stroke="#1a2a3a" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="624" stroke="#1a2a3a" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="624" stroke="#1a2a3a" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="624" stroke="#1a2a3a" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="624" stroke="#1a2a3a" stroke-width="1"/>
  </g>
  
  <!-- Stockfish rack representation (left side) -->
  <g transform="translate(80, 150)">
    <!-- Wooden rack (hjell) -->
    <line x1="0" y1="0" x2="0" y2="300" stroke="#4a3a2a" stroke-width="3"/>
    <line x1="100" y1="0" x2="100" y2="300" stroke="#4a3a2a" stroke-width="3"/>
    <line x1="0" y1="0" x2="100" y2="0" stroke="#4a3a2a" stroke-width="2"/>
    <line x1="0" y1="300" x2="100" y2="300" stroke="#4a3a2a" stroke-width="2"/>
    
    <!-- Hanging fish (entities) -->
    <g opacity="0.8">
      <line x1="20" y1="10" x2="20" y2="50" stroke="#666" stroke-width="1"/>
      <ellipse cx="20" cy="60" rx="8" ry="20" fill="#1a3a2a" stroke="#2a5a3a" stroke-width="1"/>
      
      <line x1="40" y1="10" x2="40" y2="70" stroke="#666" stroke-width="1"/>
      <ellipse cx="40" cy="80" rx="8" ry="20" fill="#1a3a2a" stroke="#2a5a3a" stroke-width="1"/>
      
      <line x1="60" y1="10" x2="60" y2="45" stroke="#666" stroke-width="1"/>
      <ellipse cx="60" cy="55" rx="8" ry="20" fill="#1a3a2a" stroke="#2a5a3a" stroke-width="1"/>
      
      <line x1="80" y1="10" x2="80" y2="60" stroke="#666" stroke-width="1"/>
      <ellipse cx="80" cy="70" rx="8" ry="20" fill="#1a3a2a" stroke="#2a5a3a" stroke-width="1"/>
    </g>
    
    <!-- Label -->
    <text x="50" y="340" fill="#5a8a6a" font-family="'SF Mono', monospace" font-size="10" text-anchor="middle">ENTITIES</text>
  </g>
  
  <!-- Knowledge graph (right side) -->
  <g transform="translate(400, 100)">
    <text x="0" y="0" fill="#e8eef4" font-family="'SF Pro Display', sans-serif" font-size="22" font-weight="bold">KNOWLEDGE ATLAS</text>
    <text x="0" y="28" fill="#5a8a6a" font-family="'SF Mono', monospace" font-size="13">Pattern-based entity extraction</text>
    
    <!-- Graph nodes and edges -->
    <g transform="translate(50, 80)">
      <!-- Nodes -->
      <circle cx="0" cy="0" r="12" fill="#0a1520" stroke="#76b900" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#76b900"/>
      
      <circle cx="120" cy="-30" r="10" fill="#0a1520" stroke="#00d4aa" stroke-width="2"/>
      <circle cx="120" cy="-30" r="3" fill="#00d4aa"/>
      
      <circle cx="120" cy="40" r="10" fill="#0a1520" stroke="#00d4aa" stroke-width="2"/>
      <circle cx="120" cy="40" r="3" fill="#00d4aa"/>
      
      <circle cx="250" cy="-10" r="14" fill="#0a1520" stroke="#ff9500" stroke-width="2"/>
      <circle cx="250" cy="-10" r="5" fill="#ff9500"/>
      
      <circle cx="250" cy="70" r="8" fill="#0a1520" stroke="#00d4aa" stroke-width="2"/>
      <circle cx="250" cy="70" r="3" fill="#00d4aa"/>
      
      <circle cx="380" cy="20" r="10" fill="#0a1520" stroke="#76b900" stroke-width="2"/>
      <circle cx="380" cy="20" r="4" fill="#76b900"/>
      
      <circle cx="380" cy="-60" r="8" fill="#0a1520" stroke="#00d4aa" stroke-width="2"/>
      <circle cx="380" cy="-60" r="3" fill="#00d4aa"/>
      
      <!-- Edges -->
      <line x1="0" y1="0" x2="120" y2="-30" stroke="#2a4a5a" stroke-width="1" opacity="0.6"/>
      <line x1="0" y1="0" x2="120" y2="40" stroke="#2a4a5a" stroke-width="1" opacity="0.6"/>
      <line x1="120" y1="-30" x2="250" y2="-10" stroke="#2a4a5a" stroke-width="1" opacity="0.6"/>
      <line x1="120" y1="40" x2="250" y2="-10" stroke="#2a4a5a" stroke-width="1" opacity="0.6"/>
      <line x1="120" y1="40" x2="250" y2="70" stroke="#2a4a5a" stroke-width="1" opacity="0.6"/>
      <line x1="250" y1="-10" x2="380" y2="20" stroke="#2a4a5a" stroke-width="1" opacity="0.6"/>
      <line x1="250" y1="-10" x2="380" y2="-60" stroke="#2a4a5a" stroke-width="1" opacity="0.6"/>
      <line x1="250" y1="70" x2="380" y2="20" stroke="#2a4a5a" stroke-width="1" opacity="0.6"/>
      
      <!-- Labels on key nodes -->
      <text x="0" y="-20" fill="#76b900" font-family="'SF Mono', monospace" font-size="9" text-anchor="middle">Lofoten</text>
      <text x="250" y="-25" fill="#ff9500" font-family="'SF Mono', monospace" font-size="9" text-anchor="middle">Moskstraumen</text>
      <text x="380" y="40" fill="#76b900" font-family="'SF Mono', monospace" font-size="9" text-anchor="middle">stockfish</text>
    </g>
  </g>
  
  <!-- Bottom stats bar -->
  <g transform="translate(0, 560)">
    <rect width="1200" height="64" fill="#0a1520" opacity="0.8"/>
    <text x="30" y="28" fill="#5a8a6a" font-family="'SF Mono', monospace" font-size="11">PLUGIN</text>
    <text x="30" y="48" fill="#e8eef4" font-family="'SF Mono', monospace" font-size="13" font-weight="bold">knowledge-atlas</text>
    
    <text x="250" y="28" fill="#5a8a6a" font-family="'SF Mono', monospace" font-size="11">TOOLS</text>
    <text x="250" y="48" fill="#e8eef4" font-family="'SF Mono', monospace" font-size="13" font-weight="bold">3 tools + 1 hook</text>
    
    <text x="450" y="28" fill="#5a8a6a" font-family="'SF Mono', monospace" font-size="11">TESTS</text>
    <text x="450" y="48" fill="#e8eef4" font-family="'SF Mono', monospace" font-size="13" font-weight="bold">12/12 passed</text>
    
    <text x="650" y="28" fill="#5a8a6a" font-family="'SF Mono', monospace" font-size="11">DEPS</text>
    <text x="650" y="48" fill="#e8eef4" font-family="'SF Mono', monospace" font-size="13" font-weight="bold">Python stdlib only</text>
    
    <text x="900" y="28" fill="#5a8a6a" font-family="'SF Mono', monospace" font-size="11">TEAM</text>
    <text x="900" y="48" fill="#76b900" font-family="'SF Mono', monospace" font-size="13" font-weight="bold">Aurora</text>
  </g>
</svg>