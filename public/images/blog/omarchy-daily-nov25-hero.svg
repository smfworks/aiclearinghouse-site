<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="A speedometer needle sweeping from red to cyan over a bar labelled session.slice, beside a stream of plugin boxes; Omarchy bar below. The Omarchy daily for November 25: responsiveness day.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="60%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#101a30"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39e1ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#39e1ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#39e1ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#39e1ff" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#39e1ff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#39e1ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- faint grid -->
  <g stroke="#16233c" stroke-width="1" opacity="0.5">
    <line x1="0" y1="150" x2="1600" y2="150"/><line x1="0" y1="300" x2="1600" y2="300"/>
    <line x1="0" y1="450" x2="1600" y2="450"/><line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="900"/><line x1="500" y1="0" x2="500" y2="900"/>
    <line x1="800" y1="0" x2="800" y2="900"/><line x1="1100" y1="0" x2="1100" y2="900"/>
    <line x1="1400" y1="0" x2="1400" y2="900"/>
  </g>

  <!-- gauge: wake-up latency -->
  <g transform="translate(500,330)">
    <path d="M -170 60 A 180 180 0 0 1 170 60" fill="none" stroke="#22314f" stroke-width="26" stroke-linecap="round"/>
    <path d="M -170 60 A 180 180 0 0 1 150 88" fill="none" stroke="#f87171" stroke-width="26" stroke-linecap="round" opacity="0.85"/>
    <line x1="0" y1="40" x2="120" y2="-90" stroke="#39e1ff" stroke-width="10" stroke-linecap="round"/>
    <circle cx="0" cy="40" r="14" fill="#39e1ff"/>
    <text x="0" y="150" font-family="monospace" font-size="20" fill="#8fa3c0" text-anchor="middle">session.slice wake-up</text>
    <text x="0" y="182" font-family="monospace" font-size="26" fill="#39e1ff" text-anchor="middle">275 ms → 1.7 ms</text>
  </g>

  <!-- plugin stream -->
  <g transform="translate(1060,300)">
    <rect x="-20" y="-90" width="120" height="46" rx="8" fill="#0d1526" stroke="#39e1ff" stroke-width="2"/>
    <rect x="30" y="-30" width="120" height="46" rx="8" fill="#0d1526" stroke="#39e1ff" stroke-width="2"/>
    <rect x="-10" y="30" width="130" height="46" rx="8" fill="#0d1526" stroke="#39e1ff" stroke-width="2"/>
    <rect x="60" y="90" width="120" height="46" rx="8" fill="#0d1526" stroke="#39e1ff" stroke-width="2"/>
    <text x="40" y="-61" font-family="monospace" font-size="15" fill="#8fa3c0">catch</text>
    <text x="90" y="-1" font-family="monospace" font-size="15" fill="#8fa3c0">lumen</text>
    <text x="50" y="59" font-family="monospace" font-size="15" fill="#8fa3c0">omawheel</text>
    <text x="120" y="119" font-family="monospace" font-size="15" fill="#8fa3c0">quicky</text>
    <text x="85" y="182" font-family="monospace" font-size="20" fill="#39e1ff" text-anchor="middle">82 plugins listed yesterday</text>
  </g>

  <!-- title -->
  <text x="800" y="120" font-family="monospace" font-size="30" fill="#e8f6ff" text-anchor="middle" letter-spacing="2">OMARCHY DAILY — NOV 25</text>
  <text x="800" y="162" font-family="monospace" font-size="20" fill="#8fa3c0" text-anchor="middle">the responsiveness day</text>
  <rect x="500" y="196" width="600" height="3" fill="url(#accent)"/>

  <!-- omarchy bar -->
  <g transform="translate(0,820)">
    <rect x="0" y="0" width="1600" height="80" fill="#0a0f1a"/>
    <rect x="0" y="0" width="1600" height="2" fill="url(#accent)"/>
    <text x="40" y="48" font-family="monospace" font-size="22" fill="#39e1ff">O</text>
    <text x="90" y="48" font-family="monospace" font-size="16" fill="#8fa3c0">workspaces</text>
    <text x="1560" y="48" font-family="monospace" font-size="16" fill="#8fa3c0" text-anchor="end">780M · 8845HS · stable</text>
  </g>
</svg>
