<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0b">
<title>Nocturne — Generative Atelier</title>
<style>
:root{
  --bg:#0a0a0b; --ink:#e9e6df; --dim:rgba(233,230,223,.48); --faint:rgba(233,230,223,.3);
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.13); --accent:#d9a55a; --rec:#e5484d;
  --panel:rgba(13,13,15,.82);
  --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,"Liberation Mono",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
body{font-family:var(--mono);font-size:12px;-webkit-font-smoothing:antialiased}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
#gl.orbiting{cursor:grabbing}

/* ---------- overlays ---------- */
.ui{position:fixed;z-index:6;transition:opacity .45s ease}
body.ui-off .ui{opacity:0!important;pointer-events:none!important}
#veil{position:fixed;inset:0;background:var(--bg);z-index:20;pointer-events:none;opacity:1;transition:opacity 1.1s ease}

/* brand */
.brand{top:24px;left:28px;pointer-events:none}
.mark{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:400;font-size:31px;letter-spacing:.02em;color:#f4f1ea;line-height:1}
.sub{margin-top:8px;font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim)}
.sub em{font-style:normal;color:var(--accent)}
body.booting .mark{opacity:0;transform:translateY(6px);animation:markIn 1s .35s ease forwards}
body.booting .sub{opacity:0;animation:subIn 1s .7s ease forwards}
@keyframes markIn{to{opacity:1;transform:none}}
@keyframes subIn{to{opacity:1}}

/* rec indicator */
#rec{top:26px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:8px;
  background:var(--panel);border:1px solid var(--line);padding:7px 13px;backdrop-filter:blur(10px);
  font-size:10px;letter-spacing:.18em}
#rec.on{display:flex}
.rdot{width:7px;height:7px;border-radius:50%;background:var(--rec);animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}

/* footer hints */
#foot{bottom:20px;left:28px;font-size:9px;letter-spacing:.14em;color:var(--faint);pointer-events:none;text-transform:uppercase}
#foot b{color:var(--dim);font-weight:400}

/* status */
#stat{position:fixed;bottom:20px;right:336px;font-size:9px;letter-spacing:.16em;color:var(--faint);pointer-events:none;text-transform:uppercase;font-variant-numeric:tabular-nums}
body.ui-off #stat{opacity:0}

/* ---------- control panel ---------- */
.panel{top:18px;right:18px;bottom:18px;width:300px;display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.pscroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
.pscroll::-webkit-scrollbar{width:6px}
.pscroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12)}
.sec{padding:15px 18px 17px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:none}
.sec-label{font-size:8.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--faint);margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline}
.sec-label i{font-style:normal;color:rgba(217,165,90,.55);letter-spacing:.1em}

/* modes */
.mode{display:flex;align-items:center;gap:11px;padding:6px 0;cursor:pointer;color:var(--dim);transition:color .2s}
.mode:hover{color:var(--ink)}
.mode .bar{width:14px;height:1px;background:transparent;transition:background .25s;flex:none}
.mode .idx{font-size:9px;letter-spacing:.12em;width:16px;flex:none}
.mode .nm{font-size:11.5px;letter-spacing:.08em}
.mode.on{color:#f4f1ea}
.mode.on .bar{background:var(--accent)}
.mode.on .idx{color:var(--accent)}

/* params */
.param{padding:8px 0 9px;cursor:pointer;position:relative;opacity:0;animation:rise .45s ease forwards}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.param .ph{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.pn{font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;transition:color .2s}
.pv{font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.05em}
.param.sel .pn{color:var(--accent)}
.param.sel .pv{color:var(--ink)}
.param.sel::before{content:"";position:absolute;left:-18px;top:9px;bottom:10px;width:2px;background:var(--accent)}
.sl{position:relative;height:16px;cursor:ew-resize}
.tr{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:rgba(255,255,255,.12)}
.fl{position:absolute;left:0;top:50%;height:2px;margin-top:-1px;background:var(--accent)}
.th{position:absolute;top:50%;width:8px;height:8px;border:1px solid var(--ink);background:var(--bg);
  transform:translate(-50%,-50%) rotate(45deg);transition:border-color .2s}
.param.sel .th{border-color:var(--accent)}
.sl input{position:absolute;inset:-4px 0;width:100%;opacity:0;cursor:ew-resize;margin:0}

/* palettes */
.pals{display:flex;gap:7px}
.pal{flex:1;height:26px;display:flex;gap:2px;padding:3px;background:none;border:1px solid var(--line2);cursor:pointer;transition:border-color .2s}
.pal:hover{border-color:rgba(255,255,255,.35)}
.pal.on{border-color:var(--accent)}
.pal i{flex:1;display:block}

/* actions */
.acts{display:flex;gap:5px}
.abtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 0 7px;
  background:none;border:1px solid var(--line2);color:var(--dim);cursor:pointer;
  font-family:var(--mono);font-size:7.5px;letter-spacing:.18em;transition:all .2s}
.abtn:hover{border-color:var(--accent);color:var(--ink)}
.abtn.hot{border-color:var(--rec);color:var(--rec)}
.abtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* panel footer */
.pfoot{display:flex;justify-content:space-between;padding:10px 18px;border-top:1px solid var(--line);
  font-size:9px;letter-spacing:.14em;color:var(--faint);text-transform:uppercase;font-variant-numeric:tabular-nums}

/* toast */
#toast{position:fixed;left:50%;bottom:38px;transform:translate(-50%,10px);opacity:0;z-index:30;
  background:var(--panel);border:1px solid var(--line2);backdrop-filter:blur(10px);
  padding:9px 16px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);
  transition:all .3s ease;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:700px){
  .panel{left:12px;right:12px;top:auto;bottom:12px;width:auto;max-height:44vh}
  #foot{display:none}
  #stat{right:16px;bottom:auto;top:24px}
  .brand{top:18px;left:18px}
  .mark{font-size:24px}
}
</style>
</head>
<body class="booting">

<canvas id="gl"></canvas>
<div id="veil"></div>

<div class="ui brand">
  <div class="mark">Nocturne</div>
  <div class="sub">Generative Atelier&ensp;·&ensp;<em id="modeTag">01 — Particle Drift</em></div>
</div>

<div class="ui" id="rec"><span class="rdot"></span><span id="recTxt">REC 0.0 s</span></div>

<div class="ui panel" id="panel">
  <div class="pscroll">
    <div class="sec">
      <div class="sec-label">Mode</div>
      <div id="modes"></div>
    </div>
    <div class="sec">
      <div class="sec-label">Parameters<i>←→ ↑↓</i></div>
      <div id="params"></div>
    </div>
    <div class="sec">
      <div class="sec-label">Palette</div>
      <div class="pals" id="pals"></div>
    </div>
    <div class="sec">
      <div class="sec-label">Actions</div>
      <div class="acts" id="acts"></div>
    </div>
  </div>
  <div class="pfoot"><span id="fps">— fps</span><span id="pcount">—</span></div>
</div>

<div class="ui" id="foot"><b>1–4</b> mode &nbsp;·&nbsp; <b>←→</b> param &nbsp;·&nbsp; <b>↑↓</b> value &nbsp;·&nbsp; <b>space</b> pause &nbsp;·&nbsp; <b>r</b> shuffle &nbsp;·&nbsp; <b>s</b> frame &nbsp;·&nbsp; <b>v</b> loop &nbsp;·&nbsp; <b>p</b> palette &nbsp;·&nbsp; <b>h</b> hide &nbsp;·&nbsp; <b>f</b> full</div>
<div class="ui" id="stat"></div>
<div id="toast"></div>

<script>
'use strict';
/* ============================================================
   NOCTURNE — a generative atelier
   Fully offline, no dependencies.
   Renderers: WebGL2 GPGPU (float targets) with a graceful,
   full-featured Canvas 2D fallback. Never shows an error —
   there is always something beautiful on screen.
   ============================================================ */

const $ = s => document.querySelector(s);
const canvas = $('#gl');
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>v<a?a:v>b?b:v;
const mix=(a,b,t)=>a+(b-a)*t;

/* ---------- toast ---------- */
let toastT=null;
function toast(msg){
  const el=$('#toast'); el.textContent=msg; el.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),1900);
}

/* ---------- shared state ---------- */
const MODES=['Particle Drift','Flow Field','Reactive Form','Ink Fluid'];
const PARAM_DEFS=[
  {k:'speed',name:'Velocity'},
  {k:'scale',name:'Scale'},
  {k:'chaos',name:'Chaos'},
  {k:'pers', name:'Persistence'},
];
const PV={speed:.45,scale:.5,chaos:.5,pers:.62};
let modeIdx=0, palIdx=0, paused=false, tGlobal=0;

const PALETTES=[
  {name:'Ember',    c:[[0.02,0.01,0.02],[0.50,0.08,0.07],[0.94,0.38,0.12],[1.00,0.88,0.60]]},
  {name:'Lagoon',   c:[[0.00,0.03,0.05],[0.00,0.32,0.36],[0.10,0.72,0.68],[0.82,1.00,0.90]]},
  {name:'Solar',    c:[[0.03,0.00,0.02],[0.46,0.32,0.05],[0.95,0.72,0.18],[1.00,0.97,0.83]]},
  {name:'Orchid',   c:[[0.03,0.00,0.03],[0.42,0.06,0.28],[0.88,0.28,0.48],[1.00,0.82,0.78]]},
  {name:'Aphelion', c:[[0.01,0.01,0.02],[0.14,0.16,0.24],[0.55,0.62,0.72],[0.96,0.97,1.00]]},
];

/* pointer (CSS px + NDC), shared by both renderers */
const P={x:0,y:0,nx:0,ny:0,down:false,has:false};

/* ============================================================
   CAPABILITY PROBE — done on a scratch canvas so the display
   canvas can still fall back to a 2D context if WebGL2 float
   render targets are unavailable.
   ============================================================ */
function glFloatCapable(){
  try{
    const c=document.createElement('canvas');
    const g=c.getContext('webgl2',{antialias:false,alpha:false,depth:false,stencil:false});
    if(!g) return null;
    const test=(i,f,t)=>{
      const tx=g.createTexture(); g.bindTexture(g.TEXTURE_2D,tx);
      g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MIN_FILTER,g.NEAREST);
      g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MAG_FILTER,g.NEAREST);
      g.texImage2D(g.TEXTURE_2D,0,i,4,4,0,f,t,null);
      const fb=g.createFramebuffer(); g.bindFramebuffer(g.FRAMEBUFFER,fb);
      g.framebufferTexture2D(g.FRAMEBUFFER,g.COLOR_ATTACHMENT0,g.TEXTURE_2D,tx,0);
      const ok=g.checkFramebufferStatus(g.FRAMEBUFFER)===g.FRAMEBUFFER_COMPLETE;
      g.bindFramebuffer(g.FRAMEBUFFER,null);
      return ok;
    };
    const extF=g.getExtension('EXT_color_buffer_float');
    if(extF && test(g.RGBA16F,g.RGBA,g.FLOAT)) return {i:g.RGBA16F,linear:true};
    if(g.getExtension('EXT_color_buffer_half_float') && test(g.RGBA16F,g.RGBA,g.FLOAT)) return {i:g.RGBA16F,linear:true};
    if(extF && test(g.RGBA32F,g.RGBA,g.FLOAT)) return {i:g.RGBA32F,linear:false};
    return null;
  }catch(e){ return null; }
}

/* ---------- tiny matrix math (GL path) ---------- */
function mPersp(o,fovy,asp,n,f){const t=1/Math.tan(fovy/2);o.fill(0);o[0]=t/asp;o[5]=t;o[10]=(f+n)/(n-f);o[11]=-1;o[14]=2*f*n/(n-f);}
function mLookAt(o,e,c,u){
  let zx=e[0]-c[0],zy=e[1]-c[1],zz=e[2]-c[2],l=Math.hypot(zx,zy,zz)||1;zx/=l;zy/=l;zz/=l;
  let xx=u[1]*zz-u[2]*zy,xy=u[2]*zx-u[0]*zz,xz=u[0]*zy-u[1]*zx;l=Math.hypot(xx,xy,xz)||1;xx/=l;xy/=l;xz/=l;
  const yx=zy*xz-zz*xy,yy=zz*xx-zx*xz,yz=zx*xy-zy*xx;
  o[0]=xx;o[1]=yx;o[2]=zx;o[3]=0;o[4]=xy;o[5]=yy;o[6]=zy;o[7]=0;o[8]=xz;o[9]=yz;o[10]=zz;o[11]=0;
  o[12]=-(xx*e[0]+xy*e[1]+xz*e[2]);o[13]=-(yx*e[0]+yy*e[1]+yz*e[2]);o[14]=-(zx*e[0]+zy*e[1]+zz*e[2]);o[15]=1;
}
function mMul(o,a,b){const r=new Float32Array(16);for(let c=0;c<4;c++)for(let w=0;w<4;w++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+w]*b[c*4+k];r[c*4+w]=s;}o.set(r);}
const cross3=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm3=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l];};

/* ============================================================
   WEBGL 2 RENDERER — GPGPU particles + reactive mesh
   ============================================================ */
function createGLRenderer(fmtInfo){
  const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,depth:false,stencil:false,preserveDrawingBuffer:false});
  if(!gl) return null;
  gl.getExtension('EXT_color_buffer_float')||gl.getExtension('EXT_color_buffer_half_float');
  gl.disable(gl.DEPTH_TEST);
  gl.enable(gl.BLEND);

  const FMT={i:fmtInfo.i,f:gl.RGBA,t:gl.FLOAT};

  /* ---------- shader plumbing ---------- */
  function compile(type,src){
    const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s),src);
    return s;
  }
  function makeProgram(vs,fs){
    const p=gl.createProgram();
    gl.attachShader(p,compile(gl.VERTEX_SHADER,vs));
    gl.attachShader(p,compile(gl.FRAGMENT_SHADER,fs));
    gl.linkProgram(p);
    if(!gl.getProgramParameter(p,gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
    return {p,_u:{}};
  }
  const uni=(pr,n)=>{ if(!(n in pr._u)) pr._u[n]=gl.getUniformLocation(pr.p,n); return pr._u[n]; };
  const u1f=(p,n,v)=>gl.uniform1f(uni(p,n),v);
  const u2f=(p,n,a,b)=>gl.uniform2f(uni(p,n),a,b);
  const u3f=(p,n,a,b,c)=>gl.uniform3f(uni(p,n),a,b,c);
  const u1i=(p,n,v)=>gl.uniform1i(uni(p,n),v);
  const uM4=(p,n,m)=>gl.uniformMatrix4fv(uni(p,n),false,m);
  const u4f=(p,n,a,b,c,d)=>gl.uniform4f(uni(p,n),a,b,c,d);
  function tex(p,n,t,u){gl.activeTexture(gl.TEXTURE0+u);gl.bindTexture(gl.TEXTURE_2D,t);gl.uniform1i(uni(p,n),u);}

  /* ---------- GLSL library ---------- */
  const H=`#version 300 es\nprecision highp float;\nprecision highp sampler2D;\n`;
  const QUAD_VS=H+`in vec2 aPos; out vec2 vUv;
void main(){ vUv=aPos*0.5+0.5; gl_Position=vec4(aPos,0.0,1.0); }`;

  const NOISE=`
vec3 mod289(vec3 x){return x - floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x - floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g;
  vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy;
  vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0;
  vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}`;

  const PAL=`
uniform vec3 uP0; uniform vec3 uP1; uniform vec3 uP2; uniform vec3 uP3;
vec3 pal(float x){
  x=clamp(x,0.0,1.0)*3.0;
  vec3 c=mix(uP0,uP1,clamp(x,0.0,1.0));
  c=mix(c,uP2,clamp(x-1.0,0.0,1.0));
  c=mix(c,uP3,clamp(x-2.0,0.0,1.0));
  return c;
}`;

  /* particle update — velocity & position in two passes */
  const UPDATE_FS=H+NOISE+`
uniform sampler2D uPosT; uniform sampler2D uVelT;
uniform float uDt,uTime,uSpd,uScl,uCho;
uniform vec3 uMouse;
uniform int uMode,uOut;
out vec4 o;
vec3 hash32(vec2 p){
  vec3 p3=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973));
  p3+=dot(p3,p3.yxz+33.33);
  return fract((p3.xxy+p3.yzz)*p3.zyx);
}
vec3 curlN(vec3 p){
  float e=0.11;
  float x=snoise(p+vec3(0.,e,0.))-snoise(p-vec3(0.,e,0.))-snoise(p+vec3(0.,0.,e))+snoise(p-vec3(0.,0.,e));
  float y=snoise(p+vec3(0.,0.,e))-snoise(p-vec3(0.,0.,e))-snoise(p+vec3(e,0.,0.))+snoise(p-vec3(e,0.,0.));
  float z=snoise(p+vec3(e,0.,0.))-snoise(p-vec3(e,0.,0.))-snoise(p+vec3(0.,e,0.))+snoise(p-vec3(0.,e,0.));
  return normalize(vec3(x,y,z)+1e-4);
}
void main(){
  ivec2 tc=ivec2(gl_FragCoord.xy);
  vec4 P=texelFetch(uPosT,tc,0);
  vec4 V=texelFetch(uVelT,tc,0);
  vec3 p=P.xyz, v=V.xyz;
  float life=P.w;
  float dt=uDt*uSpd;
  vec3 np=p, nv=v;
  float nlife=life;
  bool reb=false;

  if(uMode==0){                     /* drift — curl noise on a shell */
    vec3 c=curlN(p*uScl+vec3(0.,uTime*.10,uTime*.07));
    nv=v*0.965+c*dt*1.5;
    float r=length(p);
    nv-=normalize(p+1e-5)*(r-1.7)*dt*1.1;
    nlife+=dt*.11+.0007;
    if(r>3.4) reb=true;
  } else if(uMode==1){              /* flow — 2D directional field */
    float n=snoise(vec3(p.xy*uScl*1.6,uTime*.11));
    float ang=n*(2.5+uCho*5.5)+uTime*.04;
    vec3 f=vec3(cos(ang),sin(ang),0.);
    nv=mix(v,f,clamp(dt*2.6,0.,1.));
    np=p+nv*dt*1.15;
    if(abs(np.x)>2.4||abs(np.y)>2.4) reb=true;
    nlife+=dt*.16+.001;
  } else if(uMode==3){              /* ink — mouse vortex + swirl */
    vec2 m=uMouse.xy;
    vec2 d=m-p.xy; float r=length(d)+.06;
    vec2 dir=d/r, tg=vec2(-dir.y,dir.x);
    float g=uMouse.z*2.4/(.25+r*r);
    nv.xy+=(dir*.45+tg*(1.1+uCho*1.6))*g*dt*6.;
    vec3 cn=curlN(vec3(p.xy*uScl*.9,uTime*.12));
    nv.xy+=cn.xy*dt*.8;
    nv*=1.-clamp(dt*1.8,0.,.25);
    np=p+nv*dt;
    nlife+=dt*.07+.0005;
    if(dot(np.xy,np.xy)>6.8) reb=true;
  }

  if(nlife>=1.) reb=true;
  if(reb){
    vec3 h=hash32(gl_FragCoord.xy*.017+fract(uTime*.731)*7.3);
    if(uMode==0)      np=normalize(h*2.-1.+.001)*1.7;
    else if(uMode==1) np=vec3(h.xy*4.4-2.2,0.);
    else              np=uMouse.z>.5?vec3(uMouse.xy+(h.xy-.5)*.3,0.):vec3((h.xy-.5)*3.6,0.);
    nv=vec3(0.);
    nlife=0.;
  }
  if(uOut==0) o=vec4(nv,V.w);
  else        o=vec4(np,nlife);
}`;

  /* point sprites */
  const PTS_VS=H+`
uniform sampler2D uPosT; uniform sampler2D uVelT;
uniform mat4 uVP; uniform float uSize;
out float vMix; out float vA;
void main(){
  ivec2 tc=ivec2(gl_VertexID & 255, gl_VertexID >> 8);
  vec4 P=texelFetch(uPosT,tc,0);
  vec4 V=texelFetch(uVelT,tc,0);
  gl_Position=uVP*vec4(P.xyz,1.0);
  float sp=length(V.xyz);
  gl_PointSize=uSize*(0.6+sp*0.6);
  vMix=clamp(sp*0.5+P.w*0.45+V.w*0.12,0.0,1.0);
  vA=smoothstep(0.0,0.07,P.w)*smoothstep(1.0,0.72,P.w)*smoothstep(2.6,1.2,length(P.xyz));
}`;
  const PTS_FS=H+PAL+`
in float vMix; in float vA; out vec4 o;
void main(){
  vec2 d=gl_PointCoord-0.5;
  float m=smoothstep(0.5,0.05,length(d));
  o=vec4(pal(vMix)*m*vA,1.0);
}`;

  /* reactive form mesh */
  const MESH_VS=H+NOISE+`
in vec3 aPos;
uniform mat4 uVP;
uniform float uTime,uScl,uCho;
out vec3 vNrm; out vec3 vPos; out float vD;
void main(){
  float t=uTime*0.35;
  float n1=snoise(aPos*uScl+t);
  float n2=snoise(aPos*(uScl*2.3)-t*0.6);
  float d=n1*0.7+n2*0.3*uCho;
  vec3 pos=aPos*(1.0+d*0.55);
  vNrm=normalize(aPos); vD=d;
  vec4 wp=vec4(pos,1.0);
  vPos=wp.xyz;
  gl_Position=uVP*wp;
}`;
  const MESH_FS=H+PAL+`
uniform vec3 uEye; uniform float uTime;
in vec3 vNrm; in vec3 vPos; in float vD; out vec4 o;
void main(){
  vec3 V=normalize(uEye-vPos);
  vec3 N=normalize(vNrm);
  float fres=pow(1.0-abs(dot(N,V)),2.2);
  float band=0.5+0.5*sin(vD*8.0+uTime*1.2);
  vec3 c=pal(clamp(0.28+vD*0.5+band*0.22,0.0,1.0));
  o=vec4(c*(fres*1.05+0.035)+vec3(band*0.04),1.0);
}`;

  /* solid quad (trail fade) */
  const SOLID_FS=H+`uniform vec4 uCol; out vec4 o; void main(){ o=uCol; }`;

  /* final blit — tonemap + vignette + grain */
  const BLIT_FS=H+`
uniform sampler2D uTex; uniform vec2 uRes; uniform float uTime;
in vec2 vUv; out vec4 o;
void main(){
  vec3 c=texture(uTex,vUv).rgb;
  c=vec3(1.0)-exp(-c*1.7);
  vec2 q=vUv-0.5;
  c*=1.0-dot(q,q)*0.85;
  float g=fract(sin(dot(vUv*uRes+uTime,vec2(12.9898,78.233)))*43758.5453);
  c+=(g-0.5)*0.016;
  o=vec4(c,1.0);
}`;

  const upd = makeProgram(QUAD_VS,UPDATE_FS);
  const pts = makeProgram(PTS_VS,PTS_FS);
  const mesh= makeProgram(MESH_VS,MESH_FS);
  const solid=makeProgram(QUAD_VS,SOLID_FS);
  const blit= makeProgram(QUAD_VS,BLIT_FS);

  /* ---------- VAOs ---------- */
  const quadVAO=gl.createVertexArray();
  gl.bindVertexArray(quadVAO);
  { const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0); }
  const ptsVAO=gl.createVertexArray();

  function icosphere(order){
    const t=(1+Math.sqrt(5))/2;
    const raw=[[-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],[0,-1,t],[0,1,t],[0,-1,-t],[0,1,-t],[t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]];
    const verts=raw.map(norm3);
    let faces=[[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],
               [3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
    for(let s=0;s<order;s++){
      const cache=new Map(), nf=[];
      const mid=(a,b)=>{const k=Math.min(a,b)+'_'+Math.max(a,b);
        if(cache.has(k))return cache.get(k);
        verts.push(norm3([(verts[a][0]+verts[b][0])/2,(verts[a][1]+verts[b][1])/2,(verts[a][2]+verts[b][2])/2]));
        cache.set(k,verts.length-1); return verts.length-1;};
      for(const [a,b,c] of faces){const ab=mid(a,b),bc=mid(b,c),ca=mid(c,a);
        nf.push([a,ab,ca],[b,bc,ab],[c,ca,bc],[ab,bc,ca]);}
      faces=nf;
    }
    const pos=new Float32Array(verts.length*3);
    verts.forEach((v,i)=>pos.set(v,i*3));
    const idx=new Uint16Array(faces.length*3);
    faces.forEach((f,i)=>idx.set(f,i*3));
    return {pos,idx,n:idx.length};
  }
  const geo=icosphere(4);
  const geoVAO=gl.createVertexArray();
  gl.bindVertexArray(geoVAO);
  { const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b);
    gl.bufferData(gl.ARRAY_BUFFER,geo.pos,gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);
    const e=gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,e);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,geo.idx,gl.STATIC_DRAW); }
  gl.bindVertexArray(null);

  /* ---------- FBOs ---------- */
  function createFBO(w,h,fi,filter){
    const t=gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D,t);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,filter);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,filter);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D,0,fi.i,w,h,0,fi.f,fi.t,null);
    const f=gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER,f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
    gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
    return {tex:t,fbo:f,w,h};
  }
  function createDouble(w,h,fi){
    const _=[createFBO(w,h,fi,gl.NEAREST),createFBO(w,h,fi,gl.NEAREST)];
    return {_,w,h,
      get read(){return this._[0];}, get write(){return this._[1];},
      swap(){const t=this._[0];this._[0]=this._[1];this._[1]=t;}};
  }
  function killFBO(f){ if(!f)return; gl.deleteTexture(f.tex); gl.deleteFramebuffer(f.fbo); }

  /* ---------- particle state ---------- */
  const PSIDE=256, PMAX=PSIDE*PSIDE;
  const pPos=createDouble(PSIDE,PSIDE,FMT);
  const pVel=createDouble(PSIDE,PSIDE,FMT);
  function seedParticles(){
    const pos=new Float32Array(PMAX*4), vel=new Float32Array(PMAX*4);
    for(let i=0;i<PMAX;i++){
      if(modeIdx===0){
        const v=norm3([Math.random()*2-1,Math.random()*2-1,Math.random()*2-1]);
        pos[i*4]=v[0]*1.7; pos[i*4+1]=v[1]*1.7; pos[i*4+2]=v[2]*1.7;
      }else{
        pos[i*4]=(Math.random()*2-1)*2.1; pos[i*4+1]=(Math.random()*2-1)*2.1; pos[i*4+2]=0;
      }
      pos[i*4+3]=Math.random();
      vel[i*4]=vel[i*4+1]=vel[i*4+2]=0;
      vel[i*4+3]=Math.random();
    }
    for(const f of [pPos.read,pPos.write,pVel.read,pVel.write]){
      gl.bindTexture(gl.TEXTURE_2D,f.tex);
      gl.texImage2D(gl.TEXTURE_2D,0,FMT.i,PSIDE,PSIDE,0,FMT.f,FMT.t,
        (f===pPos.read||f===pPos.write)?pos:vel);
    }
  }
  seedParticles();

  /* ---------- trail buffer / resize ---------- */
  let trail=null, CW=0, CH=0;
  const trailFilter = fmtInfo.linear ? gl.LINEAR : gl.NEAREST;
  function resize(){
    const dpr=Math.min(window.devicePixelRatio||1,1.75);
    const w=Math.max(2,Math.round(canvas.clientWidth*dpr));
    const h=Math.max(2,Math.round(canvas.clientHeight*dpr));
    if(w===CW&&h===CH) return;
    CW=w; CH=h; canvas.width=w; canvas.height=h;
    killFBO(trail);
    trail=createFBO(w,h,FMT,trailFilter);
  }
  resize();

  /* ---------- camera ---------- */
  let yaw=0.35, pitch=0.30, dist=4.6, dragging=false;
  const view=new Float32Array(16), proj=new Float32Array(16), vp=new Float32Array(16);
  let eye=[0,0,4.6];
  function updateCam(){
    const cp=Math.cos(pitch), sp=Math.sin(pitch);
    eye=[dist*cp*Math.sin(yaw), dist*sp, dist*cp*Math.cos(yaw)];
    mLookAt(view,eye,[0,0,0],[0,1,0]);
    mPersp(proj,50*Math.PI/180,CW/CH,0.1,40);
    mMul(vp,proj,view);
  }
  function mouseWorld(nx,ny){
    const f=norm3([-eye[0],-eye[1],-eye[2]]);
    const r=norm3(cross3(f,[0,1,0]));
    const u=cross3(r,f);
    const tanH=Math.tan(25*Math.PI/180), asp=CW/CH;
    const D=norm3([
      f[0]+r[0]*nx*tanH*asp+u[0]*ny*tanH,
      f[1]+r[1]*nx*tanH*asp+u[1]*ny*tanH,
      f[2]+r[2]*nx*tanH*asp+u[2]*ny*tanH]);
    const t=Math.abs(D[2])<1e-5?60:-eye[2]/D[2];
    return [eye[0]+D[0]*t, eye[1]+D[1]*t];
  }

  function setPaletteUniforms(pr){
    const c=PALETTES[palIdx].c;
    u3f(pr,'uP0',c[0][0],c[0][1],c[0][2]);
    u3f(pr,'uP1',c[1][0],c[1][1],c[1][2]);
    u3f(pr,'uP2',c[2][0],c[2][1],c[2][2]);
    u3f(pr,'uP3',c[3][0],c[3][1],c[3][2]);
  }
  function clearTrail(){
    gl.bindFramebuffer(gl.FRAMEBUFFER,trail.fbo);
    gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  }

  let emT=Math.random()*100;
  function emitterWorld(dt){
    emT+=dt*0.5;
    if(P.down&&P.has) return {w:mouseWorld(P.nx,P.ny),s:1};
    const ex=Math.sin(emT*0.7)*0.55, ey=Math.sin(emT*0.53+1.3)*0.5;
    return {w:mouseWorld(ex,ey),s:0.5};
  }

  function step(dt,t){
    if(modeIdx===2){                       /* mesh just auto-orbits */
      if(!dragging) yaw+=dt*(0.06+PV.speed*0.16);
      return;
    }
    const em=emitterWorld(dt);
    gl.viewport(0,0,PSIDE,PSIDE);
    gl.disable(gl.BLEND);
    gl.useProgram(upd.p);
    gl.bindVertexArray(quadVAO);
    tex(upd,'uPosT',pPos.read.tex,0);
    tex(upd,'uVelT',pVel.read.tex,1);
    u1f(upd,'uDt',dt); u1f(upd,'uTime',t);
    u1f(upd,'uSpd',0.25+PV.speed*1.75);
    u1f(upd,'uScl',0.35+PV.scale*1.9);
    u1f(upd,'uCho',PV.chaos);
    u1f(upd,'uMouse',0,0,0);
    gl.uniform3f(uni(upd,'uMouse'),em.w[0],em.w[1],em.s);
    u1i(upd,'uMode',modeIdx);
    /* velocity pass */
    u1i(upd,'uOut',0);
    gl.bindFramebuffer(gl.FRAMEBUFFER,pVel.write.fbo);
    gl.drawArrays(gl.TRIANGLES,0,3);
    pVel.swap();
    /* position pass */
    tex(upd,'uVelT',pVel.read.tex,1);
    u1i(upd,'uOut',1);
    gl.bindFramebuffer(gl.FRAMEBUFFER,pPos.write.fbo);
    gl.drawArrays(gl.TRIANGLES,0,3);
    pPos.swap();
  }

  function render(dt,t){
    updateCam();
    if(dt>0){
      gl.bindFramebuffer(gl.FRAMEBUFFER,trail.fbo);
      gl.viewport(0,0,CW,CH);
      /* fade toward black — persistence */
      const rate=mix(3.0,0.05,PV.pers);
      const a=1-Math.exp(-rate*dt);
      gl.useProgram(solid.p);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
      u4f(solid,'uCol',0,0,0,a);
      gl.bindVertexArray(quadVAO);
      gl.drawArrays(gl.TRIANGLES,0,3);
      /* accumulate */
      gl.blendFunc(gl.ONE,gl.ONE);
      if(modeIdx!==2){
        gl.useProgram(pts.p);
        tex(pts,'uPosT',pPos.read.tex,0);
        tex(pts,'uVelT',pVel.read.tex,1);
        uM4(pts,'uVP',vp);
        u1f(pts,'uSize',(modeIdx===3?3.4:2.4)*Math.max(0.6,CH/1100));
        setPaletteUniforms(pts);
        gl.bindVertexArray(ptsVAO);
        gl.drawArrays(gl.POINTS,0,PMAX);
      }else{
        gl.useProgram(mesh.p);
        uM4(mesh,'uVP',vp);
        u1f(mesh,'uTime',t);
        u1f(mesh,'uScl',0.8+PV.scale*2.4);
        u1f(mesh,'uCho',PV.chaos);
        u3f(mesh,'uEye',eye[0],eye[1],eye[2]);
        setPaletteUniforms(mesh);
        gl.bindVertexArray(geoVAO);
        gl.drawElements(gl.TRIANGLES,geo.n,gl.UNSIGNED_SHORT,0);
      }
    }
    /* blit to screen */
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
    gl.viewport(0,0,CW,CH);
    gl.disable(gl.BLEND);
    gl.useProgram(blit.p);
    tex(blit,'uTex',trail.tex,0);
    u2f(blit,'uRes',CW,CH);
    u1f(blit,'uTime',t);
    gl.bindVertexArray(quadVAO);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }

  function setMode(i){
    modeIdx=i;
    if(i===3){ yaw=0; pitch=0.12; dist=4.4; }
    else if(i===1){ yaw=0.55; pitch=0.45; }
    else { yaw=0.35; pitch=0.30; }
    seedParticles();
    clearTrail();
  }

  return {
    name:'WEBGL2 · FLOAT',
    resize, step, render, setMode,
    setPalette(){ clearTrail(); },
    shuffle(){ seedParticles(); clearTrail(); },
    orbit(on,dyaw,dpitch){ dragging=on; yaw-=dyaw; pitch=clamp(pitch+dpitch,-1.25,1.25); },
    zoom(d){ dist=clamp(dist*(1+d),2.8,8.5); },
    count(){ return modeIdx===2 ? ((geo.n/3)|0)+' tris' : PMAX+' pts'; },
    canOrbit(){ return modeIdx!==2 || true; },
    interactMode(){ return modeIdx===3 ? 'inject' : 'orbit'; },
    seedParticles
  };
}

/* ============================================================
   CANVAS 2D FALLBACK — full 4-mode neon renderer
   glow sprites, additive trails, HSL cycling, mouse interaction
   ============================================================ */
function create2DRenderer(){
  const ctx=canvas.getContext('2d',{alpha:false});
  if(!ctx) return null;
  const dpr=Math.min(window.devicePixelRatio||1,1.5);
  let W=0,H=0;

  /* rgb(0..1) -> [h,s,l] */
  function rgb2hsl(r,g,b){
    const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;
    if(mx===mn) return [0,0,l];
    const d=mx-mn, s=l>0.5?d/(2-mx-mn):d/(mx+mn);
    let h;
    if(mx===r) h=((g-b)/d+(g<b?6:0));
    else if(mx===g) h=(b-r)/d+2;
    else h=(r-g)/d+4;
    return [h*60,s,l];
  }
  function palBG(){ const c=PALETTES[palIdx].c[0];
    return `rgb(${(c[0]*255)|0},${(c[1]*255)|0},${(c[2]*255)|0})`; }

  /* glow sprite ring, rebuilt on palette change */
  const SPRN=24, SS=48, SPR=[];
  function buildSprites(){
    SPR.length=0;
    const cols=PALETTES[palIdx].c.slice(1);
    const hs=cols.map(c=>rgb2hsl(c[0],c[1],c[2]));
    for(let i=0;i<SPRN;i++){
      const t=i/(SPRN-1)*2, seg=t<1?0:1, f=Math.min(1,t-seg);
      const a=hs[seg], b=hs[seg+1];
      let dh=b[0]-a[0]; if(dh>180)dh-=360; if(dh<-180)dh+=360;
      const h=((a[0]+dh*f)+360)%360;
      const s=clamp(lerp(a[1],b[1],f)*100,35,100);
      const l=clamp(lerp(a[2],b[2],f)*100,30,80);
      const c=document.createElement('canvas'); c.width=c.height=SS;
      const g=c.getContext('2d');
      const gr=g.createRadialGradient(SS/2,SS/2,0,SS/2,SS/2,SS/2);
      gr.addColorStop(0,`hsla(${h},${s|0}%,${Math.min(94,l+34)|0}%,1)`);
      gr.addColorStop(0.22,`hsla(${h},${s|0}%,${(l+8)|0}%,0.55)`);
      gr.addColorStop(1,`hsla(${h},${s|0}%,${l|0}%,0)`);
      g.fillStyle=gr; g.fillRect(0,0,SS,SS);
      SPR.push(c);
    }
  }

  /* particle pools */
  let N2=0;
  let px,py,vx,vy,phe,plf,th,rd;
  function alloc(){
    N2=Math.round(clamp(W*H/1100,700,1800));
    px=new Float32Array(N2); py=new Float32Array(N2);
    vx=new Float32Array(N2); vy=new Float32Array(N2);
    phe=new Float32Array(N2); plf=new Float32Array(N2);
    th=new Float32Array(N2); rd=new Float32Array(N2);
    initMode();
  }
  function initMode(){
    for(let i=0;i<N2;i++){
      phe[i]=Math.random(); plf[i]=Math.random();
      th[i]=Math.random()*Math.PI*2;
      rd[i]=Math.random();
      vx[i]=vy[i]=0;
      px[i]=Math.random()*W; py[i]=Math.random()*H;
    }
    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=1;
    ctx.fillStyle=palBG();
    ctx.fillRect(0,0,W,H);
  }

  /* cheap layered-trig flow angle */
  function flow(x,y,t,scl,cho){
    const k=0.0026*(0.5+scl*1.4);
    return (Math.sin(x*k+t*0.7)*Math.cos(y*k*1.3-t*0.4)
          + Math.sin((x*0.6+y)*k*0.8+t*0.3)*1.7)*(1.6+cho*3.0);
  }
  function sprite(i){ return SPR[clamp((i*(SPRN-1))|0,0,SPRN-1)]; }
  function glow(x,y,i,sz,al){
    ctx.globalAlpha=al;
    ctx.drawImage(sprite(i),x-sz/2,y-sz/2,sz,sz);
  }
  function fade(dt){
    const rate=mix(3.0,0.05,PV.pers);
    const a=1-Math.exp(-rate*dt);
    if(a<=0.002) return;
    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=1;
    ctx.fillStyle=`rgba(5,6,10,${a.toFixed(4)})`;
    ctx.fillRect(0,0,W,H);
  }

  let pulse=0, emT=Math.random()*100;

  /* — mode 0 · particle drift — */
  function stepDrift(dt,t){
    const cx=W/2, cy=H/2, R=Math.min(W,H)*0.42;
    const spd=(0.1+PV.speed*0.9);
    for(let i=0;i<N2;i++){
      th[i]+=dt*spd*(0.35+0.85/(rd[i]*1.6+0.45));
      const r=R*(0.14+rd[i]*0.86)+Math.sin(t*0.8+i*1.7)*(4+PV.chaos*14);
      let x=cx+Math.cos(th[i])*r;
      let y=cy+Math.sin(th[i])*r*0.88;
      if(P.has){
        const dx=x-P.x, dy=y-P.y, d2=dx*dx+dy*dy, RR=150;
        if(d2<RR*RR&&d2>1){
          const d=Math.sqrt(d2), f=(1-d/RR)*46;
          x+=dx/d*f; y+=dy/d*f;
        }
      }
      px[i]=x; py[i]=y;
    }
  }
  function drawDrift(dt,t){
    fade(dt);
    ctx.globalCompositeOperation='lighter';
    /* core orb */
    const cx=W/2, cy=H/2, cr=Math.min(W,H)*(0.10+0.02*Math.sin(t*0.6));
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,cr*2.4);
    const c1=PALETTES[palIdx].c[2], c3=PALETTES[palIdx].c[3];
    g.addColorStop(0,`rgba(${(c3[0]*255)|0},${(c3[1]*255)|0},${(c3[2]*255)|0},0.5)`);
    g.addColorStop(0.4,`rgba(${(c1[0]*255)|0},${(c1[1]*255)|0},${(c1[2]*255)|0},0.14)`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.globalAlpha=1; ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(cx,cy,cr*2.4,0,6.2832); ctx.fill();
    for(let i=0;i<N2;i++){
      const hue=(phe[i]*0.6+t*0.02)%1;
      const sz=8+rd[i]*22;
      glow(px[i],py[i],hue,sz,0.35+0.4*Math.sin(t*1.3+i)*0.5+0.2);
    }
    ctx.globalAlpha=1;
  }

  /* — mode 1 · flow field — */
  function stepFlow(dt,t){
    const spd=(40+PV.speed*260);
    for(let i=0;i<N2;i++){
      const a=flow(px[i],py[i],t,PV.scale,PV.chaos);
      vx[i]=lerp(vx[i],Math.cos(a)*spd,0.12);
      vy[i]=lerp(vy[i],Math.sin(a)*spd,0.12);
      if(P.has){
        const dx=px[i]-P.x, dy=py[i]-P.y, d2=dx*dx+dy*dy, RR=170;
        if(d2<RR*RR&&d2>1){
          const d=Math.sqrt(d2), f=(1-d/RR)*(P.down?520:190)*dt;
          vx[i]+=-dy/d*f*8; vy[i]+=dx/d*f*8;
        }
      }
      const nx=px[i]+vx[i]*dt, ny=py[i]+vy[i]*dt;
      ctx&&0; /* noop */
      px[i]=nx; py[i]=ny;
      if(px[i]<0)px[i]+=W; if(px[i]>W)px[i]-=W;
      if(py[i]<0)py[i]+=H; if(py[i]>H)py[i]-=H;
      plf[i]-=dt*0.05;
      if(plf[i]<=0){ plf[i]=1; px[i]=Math.random()*W; py[i]=Math.random()*H; }
    }
  }
  let flowPrev=null;
  function drawFlow(dt,t){
    /* segments need previous positions: draw inside step order — store prev in vx pass */
    fade(dt);
    ctx.globalCompositeOperation='lighter';
    ctx.lineWidth=1.2;
    for(let i=0;i<N2;i++){
      const a=flow(px[i],py[i],t,PV.scale,PV.chaos);
      const spd=Math.hypot(vx[i],vy[i]);
      const hue=((a*0.1+0.5+t*0.02)%1+1)%1;
      const s=sprite(hue);
      /* streak */
      const L=clamp(spd*0.045,2,26);
      const st=Math.hypot(vx[i],vy[i])||1;
      ctx.strokeStyle=`hsla(${(hue*360)|0},85%,64%,0.5)`;
      ctx.beginPath();
      ctx.moveTo(px[i]-vx[i]/st*L,py[i]-vy[i]/st*L);
      ctx.lineTo(px[i],py[i]);
      ctx.stroke();
      glow(px[i],py[i],hue,6+spd*0.03,0.5);
    }
    ctx.globalAlpha=1;
  }

  /* — mode 2 · reactive form — */
  function drawForm(dt,t){
    fade(dt);
    if(dt>0){
      pulse=Math.max(0,pulse-dt*1.6);
      if(P.down&&P.has) pulse=Math.min(1,pulse+dt*4);
    }
    const cx=W/2, cy=H/2;
    const md=P.has?Math.hypot(P.x-cx,P.y-cy)/(Math.min(W,H)*0.5):1;
    const amp=(0.22+PV.chaos*0.55)*(0.75+md*0.5)+pulse*0.5;
    const base=Math.min(W,H)*(0.24+0.03*Math.sin(t*0.4));
    const rotT=t*(0.15+PV.speed*0.8);
    ctx.globalCompositeOperation='lighter';
    const layers=4;
    for(let l=0;l<layers;l++){
      const sc=1-l*0.13;
      const ph=l*0.55+Math.sin(t*0.23+l)*0.7;
      const hue=((t*0.03+l*0.09)%1+1)%1;
      const hh=(hue*360)|0;
      ctx.strokeStyle=`hsla(${hh},82%,64%,${0.42-l*0.06})`;
      ctx.lineWidth=1.4;
      ctx.shadowBlur=18+PV.pers*16;
      ctx.shadowColor=`hsla(${hh},90%,60%,0.8)`;
      ctx.beginPath();
      const steps=110;
      for(let s2=0;s2<=steps;s2++){
        const a2=s2/steps*Math.PI*2;
        const r=base*sc*(1+amp*(
          0.35*Math.sin(3*a2+ph+rotT)
          +0.22*Math.sin(5*a2-ph*1.3-rotT*0.7)
          +0.13*Math.sin(8*a2+ph*2.0+rotT*1.6)));
        const x=cx+Math.cos(a2)*r, y=cy+Math.sin(a2)*r;
        s2?ctx.lineTo(x,y):ctx.moveTo(x,y);
      }
      ctx.closePath(); ctx.stroke();
    }
    ctx.shadowBlur=0;
    /* orbiting sparks */
    for(let s2=0;s2<26;s2++){
      const a2=s2/26*Math.PI*2+rotT*0.5;
      const r=base*(1+amp*0.35*Math.sin(3*a2+rotT));
      glow(cx+Math.cos(a2)*r,cy+Math.sin(a2)*r,(s2/26+t*0.03)%1,10+pulse*22,0.7);
    }
    ctx.globalAlpha=1;
  }

  /* — mode 3 · ink fluid — */
  function stepInk(dt,t){
    emT+=dt*0.55;
    let ex,ey;
    if(P.down&&P.has){ ex=P.x; ey=P.y; }
    else { ex=W/2+Math.sin(emT*0.7)*W*0.3; ey=H/2+Math.sin(emT*0.53+1.7)*H*0.28; }
    const rate=P.down?26:9;
    const hue0=(t*0.045)%1;
    for(let k=0;k<rate;k++){
      if(Math.random()>dt*60) continue;
      /* find a dead slot */
      for(let tries=0,j=(Math.random()*N2)|0;tries<40;tries++,j=(j+1)%N2){
        if(plf[j]<=0){
          const a=Math.random()*Math.PI*2, sp=(30+Math.random()*90)*(0.5+PV.chaos);
          px[j]=ex+(Math.random()-0.5)*14; py[j]=ey+(Math.random()-0.5)*14;
          vx[j]=Math.cos(a)*sp; vy[j]=Math.sin(a)*sp;
          phe[j]=(hue0+Math.random()*0.14)%1; plf[j]=1;
          break;
        }
      }
    }
    const drag=Math.pow(0.94,dt*60);
    for(let i=0;i<N2;i++){
      if(plf[i]<=0) continue;
      const a=flow(px[i],py[i],t,PV.scale,PV.chaos*0.7)*0.35;
      const c=Math.cos(a)*dt*2.2, s=Math.sin(a)*dt*2.2;
      const nvx=vx[i]*c-vy[i]*s, nvy=vx[i]*s+vy[i]*c;
      vx[i]=nvx*drag; vy[i]=nvy*drag;
      px[i]+=vx[i]*dt; py[i]+=vy[i]*dt;
      plf[i]-=dt*(0.22+0.5*(1-PV.pers*0.5));
    }
  }
  function drawInk(dt,t){
    fade(dt);
    ctx.globalCompositeOperation='lighter';
    for(let i=0;i<N2;i++){
      if(plf[i]<=0) continue;
      const life=plf[i];
      const hue=(phe[i]+ (1-life)*0.25)%1;
      glow(px[i],py[i],hue,12+(1-life)*34,0.25+life*0.65);
    }
    ctx.globalAlpha=1;
  }

  function resize(){
    const w=Math.round(canvas.clientWidth), h=Math.round(canvas.clientHeight);
    if(w===W&&h===H&&N2) return;
    W=w; H=h;
    canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    alloc();
  }

  buildSprites();
  resize();

  function render(dt,t){
    if(dt<=0) return;               /* paused — hold the frame */
    switch(modeIdx){
      case 0: stepDrift(dt,t); drawDrift(dt,t); break;
      case 1: stepFlow(dt,t);  drawFlow(dt,t);  break;
      case 2: drawForm(dt,t);  break;
      case 3: stepInk(dt,t);   drawInk(dt,t);   break;
    }
  }
  function setMode(i){ modeIdx=i; initMode(); }

  return {
    name:'CANVAS 2D · FALLBACK',
    resize, render,
    step(){},
    setMode,
    setPalette(){ buildSprites(); initMode(); },
    shuffle(){ initMode(); },
    orbit(){}, zoom(){},
    count(){ return N2+' pts'; },
    interactMode(){ return 'paint'; },
    seedParticles(){}
  };
}

/* ============================================================
   BOOT — always pick a working renderer, never an error
   ============================================================ */
const cap=glFloatCapable();
let R=null;
try{ R = cap ? createGLRenderer() : null; }catch(e){ console.warn('GL renderer failed:',e); R=null; }
if(!R){
  try{ R = create2DRenderer(); }catch(e){ console.warn('2D renderer failed:',e); }
}
if(R){
  R.setPalette();
  R.setMode(modeIdx);
}

/* ---------- pointer ---------- */
let lastPX=0,lastPY=0;
function setPointer(e){
  const r=canvas.getBoundingClientRect();
  P.x=e.clientX-r.left; P.y=e.clientY-r.top;
  P.nx=(P.x/r.width)*2-1; P.ny=1-(P.y/r.height)*2;
  P.has=true;
}
canvas.addEventListener('pointerdown',e=>{
  setPointer(e); P.down=true; lastPX=e.clientX; lastPY=e.clientY;
  try{canvas.setPointerCapture(e.pointerId);}catch(_){}
});
canvas.addEventListener('pointermove',e=>{
  setPointer(e);
  if(P.down&&R&&R.interactMode()==='orbit'){
    canvas.classList.add('orbiting');
    R.orbit(true,(e.clientX-lastPX)*0.005,(e.clientY-lastPY)*0.005);
  }
  lastPX=e.clientX; lastPY=e.clientY;
});
const endP=()=>{ P.down=false; canvas.classList.remove('orbiting'); if(R)R.orbit(false,0,0); };
canvas.addEventListener('pointerup',endP);
canvas.addEventListener('pointercancel',endP);
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  if(R) R.zoom(e.deltaY*0.001);
},{passive:false});

/* ---------- UI: modes ---------- */
const modesEl=$('#modes');
MODES.forEach((nm,i)=>{
  const d=document.createElement('div');
  d.className='mode'+(i===modeIdx?' on':'');
  d.innerHTML=`<span class="bar"></span><span class="idx">0${i+1}</span><span class="nm">${nm}</span>`;
  d.addEventListener('click',()=>setMode(i));
  modesEl.appendChild(d);
});
function setMode(i){
  modeIdx=i;
  [...modesEl.children].forEach((c,j)=>c.classList.toggle('on',j===i));
  $('#modeTag').textContent=`0${i+1} — ${MODES[i]}`;
  if(R) R.setMode(i);
}

/* ---------- UI: params ---------- */
const paramsEl=$('#params');
let selParam=0;
const paramRows=[];
PARAM_DEFS.forEach((p,i)=>{
  const d=document.createElement('div');
  d.className='param'+(i===0?' sel':'');
  d.style.animationDelay=(i*0.06)+'s';
  d.innerHTML=`<div class="ph"><span class="pn">${p.name}</span><span class="pv"></span></div>
    <div class="sl"><div class="tr"></div><div class="fl"></div><div class="th"></div>
    <input type="range" min="0" max="1" step="0.01" value="${PV[p.k]}"></div>`;
  const pv=d.querySelector('.pv'), fl=d.querySelector('.fl'), th=d.querySelector('.th'), inp=d.querySelector('input');
  function sync(){
    pv.textContent=PValStr(PV[p.k]);
    fl.style.width=(PV[p.k]*100)+'%';
    th.style.left=(PV[p.k]*100)+'%';
    inp.value=PV[p.k];
  }
  function set(v){ PV[p.k]=clamp(v,0,1); sync(); }
  inp.addEventListener('input',()=>set(parseFloat(inp.value)));
  d.addEventListener('click',e=>{ if(e.target!==inp){ selParam=i; refreshSel(); } });
  sync();
  paramRows.push({set,sync});
  paramsEl.appendChild(d);
});
function PValStr(v){ return (v*(v<0.1||v>0.94?100:100)).toFixed(0).padStart(2,'0'); }
function refreshSel(){
  [...paramsEl.children].forEach((c,j)=>c.classList.toggle('sel',j===selParam));
}
function nudgeParam(d){
  const k=PARAM_DEFS[selParam].k;
  PV[k]=clamp(PV[k]+d,0,1);
  paramRows[selParam].sync();
}

/* ---------- UI: palettes ---------- */
const palsEl=$('#pals');
PALETTES.forEach((p,i)=>{
  const b=document.createElement('button');
  b.className='pal'+(i===palIdx?' on':'');
  b.title=p.name;
  p.c.forEach(c=>{
    const s=document.createElement('i');
    s.style.background=`rgb(${(c[0]*255)|0},${(c[1]*255)|0},${(c[2]*255)|0})`;
    b.appendChild(s);
  });
  b.addEventListener('click',()=>setPalette(i));
  palsEl.appendChild(b);
});
function setPalette(i){
  palIdx=i;
  [...palsEl.children].forEach((c,j)=>c.classList.toggle('on',j===i));
  if(R) R.setPalette();
  toast(PALETTES[i].name.toUpperCase());
}

/* ---------- UI: actions ---------- */
const actsEl=$('#acts');
function abtn(label,svgPath,title,fn){
  const b=document.createElement('button');
  b.className='abtn'; b.title=title;
  b.innerHTML=`<svg viewBox="0 0 16 16">${svgPath}</svg><span>${label}</span>`;
  b.addEventListener('click',fn);
  actsEl.appendChild(b);
  return b;
}
abtn('SHUFFLE','<path d="M2 4.5h3l6 7h3M11 11.5l-2-2m2 2-2 2M2 11.5h3l1.5-1.75M11 4.5h3m0 0-2-2m2 2-2 2"/>','Shuffle composition (R)',shuffle);
abtn('FRAME','<rect x="2" y="4.5" width="12" height="8" rx="1"/><circle cx="8" cy="8.5" r="2"/><path d="M5.5 4.5 6.8 2.5h2.4l1.3 2"/>','Export PNG frame (S)',snap);
const loopBtn=abtn('LOOP','<circle cx="8" cy="8" r="2.6"/><path d="M8 1.8a6.2 6.2 0 1 1-6.2 6.2"/>','Record 6s loop (V)',toggleLoop);

function shuffle(){
  PV.speed=Math.random(); PV.scale=Math.random();
  PV.chaos=Math.random(); PV.pers=0.35+Math.random()*0.6;
  paramRows.forEach(r=>r.sync());
  setPalette((Math.random()*PALETTES.length)|0);
  if(R) R.shuffle();
  toast('RESHUFFLED');
}

function snap(){
  if(!R) return;
  R.render(1/60,tGlobal);          /* fresh frame in-buffer */
  canvas.toBlob(b=>{
    if(!b){ toast('EXPORT FAILED'); return; }
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b);
    a.download=`nocturne-${Date.now()}.png`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast('FRAME SAVED');
  },'image/png');
}

/* ---------- loop recording (works for both renderers) ---------- */
let rec=null, recStart=0;
function toggleLoop(){
  if(rec){ rec.mr.stop(); return; }
  if(!('MediaRecorder' in window)||!canvas.captureStream){
    toast('RECORD UNSUPPORTED'); return;
  }
  const mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm']
    .find(m=>MediaRecorder.isTypeSupported(m));
  if(!mime){ toast('RECORD UNSUPPORTED'); return; }
  const stream=canvas.captureStream(60);
  const mr=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:12_000_000});
  const chunks=[];
  mr.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
  mr.onstop=()=>{
    clearTimeout(rec.t);
    $('#rec').classList.remove('on'); loopBtn.classList.remove('hot');
    rec=null;
    const b=new Blob(chunks,{type:'video/webm'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b);
    a.download=`nocturne-loop-${Date.now()}.webm`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast('LOOP SAVED');
  };
  mr.start();
  rec={mr,t:setTimeout(()=>mr.state!=='inactive'&&mr.stop(),6000)};
  recStart=performance.now();
  $('#rec').classList.add('on'); loopBtn.classList.add('hot');
  toast('RECORDING 6 S');
}

/* ---------- keyboard ---------- */
window.addEventListener('keydown',e=>{
  if(e.repeat&&e.key===' ') return;
  switch(e.key){
    case '1': case '2': case '3': case '4': setMode(+e.key-1); break;
    case 'ArrowLeft':  e.preventDefault(); selParam=(selParam+PARAM_DEFS.length-1)%PARAM_DEFS.length; refreshSel(); break;
    case 'ArrowRight': e.preventDefault(); selParam=(selParam+1)%PARAM_DEFS.length; refreshSel(); break;
    case 'ArrowUp':    e.preventDefault(); nudgeParam(+0.02); break;
    case 'ArrowDown':  e.preventDefault(); nudgeParam(-0.02); break;
    case ' ':          e.preventDefault(); paused=!paused; toast(paused?'PAUSED':'RESUMED'); break;
    case 'r': case 'R': shuffle(); break;
    case 's': case 'S': snap(); break;
    case 'v': case 'V': toggleLoop(); break;
    case 'p': case 'P': setPalette((palIdx+1)%PALETTES.length); break;
    case 'h': case 'H': document.body.classList.toggle('ui-off'); break;
    case 'f': case 'F':
      if(document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();
      break;
  }
});

/* ---------- resize ---------- */
window.addEventListener('resize',()=>{ if(R) R.resize(); });

/* ---------- main loop ---------- */
let last=performance.now(), fpsAcc=0, fpsN=0, fpsShown=0, fpsT=0, veiled=true;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min((now-last)/1000,0.05); last=now;
  if(!R) return;
  if(!paused){ tGlobal+=dt; R.step(dt,tGlobal); R.render(dt,tGlobal); }
  else R.render(0,tGlobal);
  if(veiled){ veiled=false; requestAnimationFrame(()=>{ $('#veil').style.opacity='0'; }); }
  /* stats */
  fpsAcc+=dt; fpsN++; fpsT+=dt;
  if(fpsT>0.5){ fpsShown=Math.round(fpsN/fpsAcc); fpsAcc=0; fpsN=0; fpsT=0;
    $('#fps').textContent=fpsShown+' fps';
    $('#pcount').textContent=R.count()+' · '+R.name.split(' ·')[0];
    $('#stat').textContent=`MODE 0${modeIdx+1} · ${fpsShown} FPS · ${R.name}`;
  }
  if(rec) $('#recTxt').textContent=`REC ${((now-recStart)/1000).toFixed(1)} s`;
}
requestAnimationFrame(frame);
</script>
</body>
</html>
