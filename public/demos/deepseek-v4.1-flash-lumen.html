<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LUMEN — where light learns to breathe</title>
<style>
  :root{ --ink:#eaf2ff; }
  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    width:100%; height:100%;
    overflow:hidden;
    background:
      radial-gradient(1300px 900px at 50% 44%, #1b1044 0%, #0b0a20 45%, #04040a 100%);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    overscroll-behavior:none;
  }

  canvas{
    position:fixed; inset:0;
    width:100%; height:100%;
    display:block;
  }
  #gl{ z-index:0; }
  #fx{ z-index:1; }

  /* ---------- Typography ---------- */
  .stage{
    position:fixed; inset:0; z-index:2;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center;
    padding:6vmin;
    pointer-events:none;
  }

  .title-wrap{
    filter:
      drop-shadow(0 0 28px rgba(150,190,255,.42))
      drop-shadow(0 0 80px rgba(190,120,255,.26));
  }

  .title{
    font-weight:200;
    font-size:clamp(2.5rem, 15vw, 10.5rem);
    line-height:1;
    letter-spacing:.34em;
    text-indent:.34em;
    text-transform:uppercase;
    background:linear-gradient(176deg,
      #ffffff 0%,
      #e2ecff 32%,
      #a9c2ff 62%,
      #e6aaff 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:titleIn 2.6s cubic-bezier(.16,1,.3,1) .35s both;
    will-change:letter-spacing, opacity, filter;
  }

  @keyframes titleIn{
    0%   { opacity:0; letter-spacing:1.15em; text-indent:1.15em; filter:blur(20px); }
    55%  { opacity:1; }
    100% { opacity:1; letter-spacing:.34em;  text-indent:.34em;  filter:blur(0px); }
  }

  .rule{
    width:0;
    height:1px;
    margin:clamp(18px,3.2vmin,34px) 0 0;
    background:linear-gradient(90deg,
      transparent,
      rgba(170,205,255,.55) 20%,
      rgba(220,180,255,.75) 50%,
      rgba(170,205,255,.55) 80%,
      transparent);
    animation:ruleIn 2.2s cubic-bezier(.16,1,.3,1) 1.35s both;
  }
  @keyframes ruleIn{
    0%   { width:0;    opacity:0; }
    100% { width:min(52vw, 460px); opacity:1; }
  }

  .sub{
    margin-top:clamp(14px,2.4vmin,26px);
    font-size:clamp(.58rem, 1.55vw, .92rem);
    font-weight:300;
    letter-spacing:.55em;
    text-indent:.55em;
    text-transform:uppercase;
    color:rgba(198,218,255,.52);
    white-space:nowrap;
    animation:subIn 2.4s cubic-bezier(.16,1,.3,1) 1.55s both;
  }
  @keyframes subIn{
    0%   { opacity:0; letter-spacing:1.5em; text-indent:1.5em; transform:translateY(10px); }
    100% { opacity:1; letter-spacing:.55em; text-indent:.55em; transform:translateY(0); }
  }

  .hint{
    position:fixed;
    left:50%; bottom:clamp(20px,5vmin,48px);
    transform:translateX(-50%);
    z-index:3;
    font-size:.58rem;
    font-weight:300;
    letter-spacing:.46em;
    text-indent:.46em;
    text-transform:uppercase;
    color:rgba(190,215,255,.36);
    white-space:nowrap;
    pointer-events:none;
    animation:hintIn 2.4s ease 2.9s both, hintPulse 5.5s ease-in-out 5s infinite;
  }
  @keyframes hintIn{
    0%   { opacity:0; transform:translate(-50%, 10px); }
    100% { opacity:1; transform:translate(-50%, 0); }
  }
  @keyframes hintPulse{
    0%,100% { opacity:.30; }
    50%     { opacity:.62; }
  }

  @media (max-width: 520px){
    .title{ letter-spacing:.22em; }
    @keyframes titleIn{
      0%   { opacity:0; letter-spacing:.85em; text-indent:.85em; filter:blur(18px); }
      55%  { opacity:1; }
      100% { opacity:1; letter-spacing:.22em; text-indent:.22em; filter:blur(0px); }
    }
    .sub{ letter-spacing:.4em; }
  }

  @media (prefers-reduced-motion: reduce){
    .title, .sub, .rule, .hint{ animation-duration:.01ms !important; animation-delay:0s !important; }
  }
</style>
</head>
<body>

<canvas id="gl"></canvas>
<canvas id="fx"></canvas>

<div class="stage">
  <div class="title-wrap">
    <h1 class="title">Lumen</h1>
  </div>
  <div class="rule"></div>
  <p class="sub">where light learns to breathe</p>
</div>

<div class="hint">move &nbsp;·&nbsp; click</div>

<script>
(function () {
  'use strict';

  /* =========================================================
     1.  WEBGL  ·  DOMAIN-WARPED AURORA NEBULA
     ========================================================= */

  const glCanvas = document.getElementById('gl');
  let gl = null;

  try {
    gl = glCanvas.getContext('webgl', {
      alpha: false, antialias: false, depth: false, stencil: false,
      powerPreference: 'high-performance'
    }) || glCanvas.getContext('experimental-webgl');
  } catch (e) { gl = null; }

  const VERT = `
    attribute vec2 a_pos;
    void main(){ gl_Position = vec4(a_pos, 0.0, 1.0); }
  `;

  const FRAG = `
    precision highp float;

    uniform vec2  u_res;
    uniform float u_time;
    uniform vec2  u_mouse;

    float hash21(vec2 p){
      p = fract(p * vec2(123.34, 456.21));
      p += dot(p, p + 45.32);
      return fract(p.x * p.y);
    }

    float noise(vec2 p){
      vec2 i = floor(p);
      vec2 f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      float a = hash21(i);
      float b = hash21(i + vec2(1.0, 0.0));
      float c = hash21(i + vec2(0.0, 1.0));
      float d = hash21(i + vec2(1.0, 1.0));
      return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
    }

    float fbm(vec2 p){
      float v = 0.0;
      float a = 0.5;
      mat2 m = mat2(0.80, 0.60, -0.60, 0.80);
      for(int i = 0; i < 5; i++){
        v += a * noise(p);
        p = m * p * 2.03;
        a *= 0.5;
      }
      return v;
    }

    void main(){
      vec2 uv  = (gl_FragCoord.xy - 0.5 * u_res) / min(u_res.x, u_res.y);
      vec2 mo  = (u_mouse - 0.5 * u_res) / min(u_res.x, u_res.y);
      float t  = u_time * 0.055;

      /* --- gentle parallax toward the cursor --- */
      vec2 p = uv * 1.55 + mo * 0.25;

      /* --- double domain warp --- */
      vec2 q = vec2(
        fbm(p + vec2(0.0, t * 1.10)),
        fbm(p + vec2(5.2, 1.3) + vec2(t * 0.80, -t * 0.60))
      );
      vec2 r = vec2(
        fbm(p + 2.1 * q + vec2(1.7, 9.2) + vec2(t * 0.90, 0.0)),
        fbm(p + 2.1 * q + vec2(8.3, 2.8) + vec2(0.0, -t * 0.70))
      );
      float f     = fbm(p + 2.6 * r);
      float shape = f * 1.18 - 0.06;

      float dc = length(uv);

      /* --- deep space base --- */
      vec3 col = vec3(0.010, 0.012, 0.036);
      col += vec3(0.030, 0.018, 0.080) * exp(-dc * 1.30);

      /* --- aurora layer 1 : blue → violet --- */
      float g1 = smoothstep(0.12, 0.86, shape);
      vec3 cA = mix(vec3(0.08, 0.48, 1.00),
                    vec3(0.72, 0.18, 1.00),
                    clamp(r.y * 1.35, 0.0, 1.0));
      col += cA * pow(g1, 1.45) * 0.60;

      /* --- aurora layer 2 : teal → magenta --- */
      float g2 = smoothstep(0.44, 1.02, shape);
      vec3 cB = mix(vec3(0.18, 0.95, 0.92),
                    vec3(1.00, 0.42, 0.86),
                    clamp(q.x * 1.40, 0.0, 1.0));
      col += cB * pow(g2, 1.80) * 0.58;

      /* --- bright core filaments --- */
      float g3 = smoothstep(0.74, 1.18, shape);
      col += vec3(1.00, 0.96, 1.00) * pow(g3, 2.10) * 0.85;

      /* --- central bloom --- */
      float core = exp(-dot(uv, uv) * 3.20);
      col += vec3(0.22, 0.38, 0.85) * core * 0.30;

      /* --- cursor light --- */
      float md = length(uv - mo);
      col += vec3(0.35, 0.55, 1.00) * exp(-md * 5.5) * 0.10;

      /* --- starfield (parallax-locked) --- */
      vec2 sp = gl_FragCoord.xy + mo * 160.0;
      float sh   = hash21(floor(sp * 0.5));
      float star = smoothstep(0.9972, 1.0, sh);
      float tw   = 0.50 + 0.50 * sin(u_time * 1.7 + sh * 240.0);
      col += vec3(0.86, 0.92, 1.00) * star * tw * 1.15;

      /* --- vignette --- */
      float vig = 1.0 - smoothstep(0.30, 1.50, dc);
      col *= 0.28 + 0.72 * vig;

      /* --- filmic rolloff --- */
      col = 1.0 - exp(-col * 1.30);

      /* --- grain --- */
      float g = hash21(gl_FragCoord.xy + fract(u_time) * 431.0);
      col += (g - 0.5) * 0.030;

      gl_FragColor = vec4(col, 1.0);
    }
  `;

  let glReady = false;
  let uRes = null, uTime = null, uMouse = null;
  let glW = 1, glH = 1;

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.warn(gl.getShaderInfoLog(s));
      gl.deleteShader(s);
      return null;
    }
    return s;
  }

  if (gl) {
    const vs = compile(gl.VERTEX_SHADER, VERT);
    const fs = compile(gl.FRAGMENT_SHADER, FRAG);

    if (vs && fs) {
      const prog = gl.createProgram();
      gl.attachShader(prog, vs);
      gl.attachShader(prog, fs);
      gl.linkProgram(prog);

      if (gl.getProgramParameter(prog, gl.LINK_STATUS)) {
        gl.useProgram(prog);

        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(
          gl.ARRAY_BUFFER,
          new Float32Array([-1, -1, 3, -1, -1, 3]),
          gl.STATIC_DRAW
        );

        const loc = gl.getAttribLocation(prog, 'a_pos');
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

        uRes   = gl.getUniformLocation(prog, 'u_res');
        uTime  = gl.getUniformLocation(prog, 'u_time');
        uMouse = gl.getUniformLocation(prog, 'u_mouse');

        gl.disable(gl.DEPTH_TEST);
        gl.disable(gl.BLEND);

        glReady = true;
      }
    }
  }

  function resizeGL() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    let s  = 0.78;
    let pw = w * dpr * s;
    let ph = h * dpr * s;

    const MAX_PIX = 1500000;
    if (pw * ph > MAX_PIX) {
      const k = Math.sqrt(MAX_PIX / (pw * ph));
      pw *= k;
      ph *= k;
    }

    glW = Math.max(1, Math.round(pw));
    glH = Math.max(1, Math.round(ph));

    if (glCanvas.width !== glW || glCanvas.height !== glH) {
      glCanvas.width  = glW;
      glCanvas.height = glH;
      if (glReady) gl.viewport(0, 0, glW, glH);
    }
  }

  /* =========================================================
     2.  CANVAS 2D  ·  DRIFTING LIGHT MOTES + RIPPLES
     ========================================================= */

  const fx    = document.getElementById('fx');
  const fxCtx = fx.getContext('2d');

  let FW = 0, FH = 0, FDPR = 1;

  const SPRITE_SIZE = 96;
  const COLORS = [
    [150, 235, 255],
    [190, 175, 255],
    [255, 165, 225],
    [170, 205, 255],
    [255, 250, 255]
  ];

  function makeSprite(rgb, size) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const g = c.getContext('2d');
    const [r, gg, b] = rgb;
    const grd = g.createRadialGradient(
      size / 2, size / 2, 0,
      size / 2, size / 2, size / 2
    );
    grd.addColorStop(0.00, `rgba(${r},${gg},${b},1.00)`);
    grd.addColorStop(0.12, `rgba(${r},${gg},${b},0.62)`);
    grd.addColorStop(0.32, `rgba(${r},${gg},${b},0.20)`);
    grd.addColorStop(0.62, `rgba(${r},${gg},${b},0.055)`);
    grd.addColorStop(1.00, `rgba(${r},${gg},${b},0.00)`);
    g.fillStyle = grd;
    g.fillRect(0, 0, size, size);
    return c;
  }

  const sprites = COLORS.map(c => makeSprite(c, SPRITE_SIZE));

  const motes   = [];
  const ripples = [];

  class Mote {
    constructor(seedRandom) {
      this.sprite = sprites[(Math.random() * sprites.length) | 0];
      this.boost  = 0;
      this.reset(seedRandom);
    }
    reset(seedRandom) {
      this.x = Math.random() * FW;
      this.y = seedRandom
        ? Math.random() * FH
        : FH + 40 + Math.random() * 120;

      this.r  = 3 + Math.pow(Math.random(), 2.2) * 30;
      this.vy = -(6 + Math.random() * 26);
      this.vx = (Math.random() - 0.5) * 7;

      const sizeFade = 1 - Math.min(0.6, this.r / 62);
      this.alpha = (0.05 + Math.random() * 0.28) * sizeFade;

      this.phase     = Math.random() * Math.PI * 2;
      this.sway      = 0.25 + Math.random() * 0.9;
      this.swaySpeed = 0.25 + Math.random() * 0.8;
    }
    update(dt) {
      this.phase += dt * this.swaySpeed;

      this.x += (this.vx + Math.sin(this.phase) * this.sway * 12) * dt;
      this.y += this.vy * dt;

      /* cursor repulsion */
      const dx = this.x - mx;
      const dy = this.y - my;
      const d2 = dx * dx + dy * dy;
      const R  = 170;

      if (d2 < R * R && d2 > 1) {
        const d = Math.sqrt(d2);
        const f = 1 - d / R;
        const k = f * f * 260 * dt;
        this.x += (dx / d) * k;
        this.y += (dy / d) * k;
      }

      /* ripple push */
      for (let i = 0; i < ripples.length; i++) {
        const rp = ripples[i];
        const rx = this.x - rp.x;
        const ry = this.y - rp.y;
        const rd = Math.sqrt(rx * rx + ry * ry);
        if (rd < 0.01) continue;
        const band = Math.abs(rd - rp.r);
        if (band < 90) {
          const f = (1 - band / 90) * rp.life;
          const k = f * 70 * dt;
          this.x += (rx / rd) * k;
          this.y += (ry / rd) * k;
        }
      }

      /* decay boost */
      if (this.boost > 0.001) {
        this.boost *= Math.exp(-dt * 2.2);
      } else {
        this.boost = 0;
      }

      /* recycle */
      if (this.y < -70 || this.x < -90 || this.x > FW + 90) {
        this.reset(false);
      }
    }
    draw(ctx) {
      const fadeTop = this.y / (FH * 0.22);
      const fadeBot = (FH - this.y) / (FH * 0.10);
      const fade = Math.min(1, fadeTop, fadeBot);
      if (fade <= 0.001) return;

      ctx.globalAlpha = Math.min(1, (this.alpha + this.boost)) * fade;
      ctx.drawImage(
        this.sprite,
        this.x - this.r,
        this.y - this.r,
        this.r * 2,
        this.r * 2
      );
    }
  }

  class Ripple {
    constructor(x, y) {
      this.x = x;
      this.y = y;
      this.r = 0;
      this.max = Math.max(FW, FH) * 0.8;
      this.life = 1;
      this.hue = 185 + Math.random() * 70;
    }
    update(dt) {
      this.r += 500 * dt;
      this.life = Math.max(0, 1 - this.r / this.max);
      return this.life > 0.012;
    }
    draw(ctx) {
      ctx.strokeStyle = `hsla(${this.hue}, 100%, 78%, 1)`;

      ctx.globalAlpha = this.life * 0.26;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      ctx.stroke();

      ctx.globalAlpha = this.life * 0.12;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r * 0.72, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function resizeFX() {
    FDPR = Math.min(window.devicePixelRatio || 1, 2);
    FW = window.innerWidth;
    FH = window.innerHeight;

    fx.width  = Math.round(FW * FDPR);
    fx.height = Math.round(FH * FDPR);
    fxCtx.setTransform(FDPR, 0, 0, FDPR, 0, 0);

    const target = Math.round(
      Math.min(190, Math.max(50, (FW * FH) / 11000))
    );
    while (motes.length < target) motes.push(new Mote(true));
    while (motes.length > target) motes.pop();
  }

  /* =========================================================
     3.  POINTER
     ========================================================= */

  let mx = window.innerWidth / 2,  my = window.innerHeight / 2;
  let tmx = mx, tmy = my;

  function setPointer(x, y) {
    tmx = x;
    tmy = y;
  }

  window.addEventListener('mousemove', e => setPointer(e.clientX, e.clientY), { passive: true });
  window.addEventListener('touchmove', e => {
    if (e.touches[0]) setPointer(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  window.addEventListener('pointerdown', e => {
    setPointer(e.clientX, e.clientY);

    const rp = new Ripple(e.clientX, e.clientY);
    ripples.push(rp);
    if (ripples.length > 6) ripples.shift();

    for (let i = 0; i < motes.length; i++) {
      const m = motes[i];
      const dx = m.x - e.clientX;
      const dy = m.y - e.clientY;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < 280) {
        const f = 1 - d / 280;
        m.boost = Math.min(0.55, m.boost + 0.30 * f * f);
      }
    }
  }, { passive: true });

  /* =========================================================
     4.  RESIZE
     ========================================================= */

  function onResize() {
    resizeGL();
    resizeFX();
  }

  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', () => setTimeout(onResize, 120));

  /* =========================================================
     5.  MAIN LOOP
     ========================================================= */

  let lastT   = performance.now() / 1000;
  let elapsed = 0;

  function frame(nowMs) {
    const now = nowMs / 1000;
    let dt = now - lastT;
    lastT = now;

    if (dt > 0.05) dt = 0.05;
    if (dt < 0)    dt = 0;

    elapsed += dt;

    /* smooth cursor */
    mx += (tmx - mx) * Math.min(1, dt * 5.5);
    my += (tmy - my) * Math.min(1, dt * 5.5);

    /* ---- WebGL aurora ---- */
    if (glReady) {
      gl.uniform2f(uRes, glW, glH);
      gl.uniform1f(uTime, elapsed);
      gl.uniform2f(
        uMouse,
        (mx / FW) * glW,
        (1 - my / FH) * glH
      );
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    /* ---- Canvas 2D motes ---- */
    fxCtx.clearRect(0, 0, FW, FH);
    fxCtx.globalCompositeOperation = 'lighter';

    for (let i = ripples.length - 1; i >= 0; i--) {
      if (!ripples[i].update(dt)) ripples.splice(i, 1);
    }
    for (let i = 0; i < ripples.length; i++) {
      ripples[i].draw(fxCtx);
    }

    for (let i = 0; i < motes.length; i++) {
      motes[i].update(dt);
      motes[i].draw(fxCtx);
    }

    fxCtx.globalAlpha = 1;
    fxCtx.globalCompositeOperation = 'source-over';

    requestAnimationFrame(frame);
  }

  /* =========================================================
     6.  BOOT
     ========================================================= */

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) lastT = performance.now() / 1000;
  });

  onResize();
  requestAnimationFrame(frame);

})();
</script>
</body>
</html>
